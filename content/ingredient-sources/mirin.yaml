sources:
  # 本味醂原料（蒸糯米、米麴、燒酎或酒精）、糖化熟成 40~60 天、酒精約 14%；味醂風調味料酒精不到 1%；発酵調味料（みりんタイプ）酒精約 10%、鹽分約 1.5%。日本業界團體。
  - title: 全國味淋協會：本みりんの知識
    url: https://www.honmirin.org/knowledge/
  # 成分轉化液糖、水、酒精、食鹽、糯米；開封前陰涼通風、開封後冷藏；3 年；醃漬肉類海鮮、中式沾醬。未寫酒精濃度。只代表該產品。
  - title: 萬家香：味醂
    url: https://www.wanjashan.com.tw/product_detail.php?P_ID=20150609025
  # 成分果糖、水、糯米、米麴、糖、釀造酢、鹽等，未列酒精，但頁面形容富含甘甜及酒味；不含防腐劑、開封後冷藏；3 年；去腥、照燒、增添光澤。只代表該產品。
  - title: 工研：味醂 500ml
    url: https://kongyen.com.tw/product/18791/
  # 品名「味醂調味料」，成分麥芽糖醬、甘蔗液糖、水、糯米、米麴、鹽，未列酒精；開封後冷藏；3 年；照燒、壽喜燒、滷製、沾醬。只代表該產品。
  - title: 十全：味醂調味料
    url: https://shih-chuan.com.tw/zh/products/product/mirin-500ML
