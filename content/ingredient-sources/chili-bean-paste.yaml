  # 成分紅辣椒、黃豆、鹽、糖、蠶豆、香油、麵粉等；過敏原大豆、芝麻、小麥，「本產品含有蠶豆，蠶豆症患者請勿食用」；未開封 3 年、開封後請冷藏；醬爆、紅燒、拌麵。只代表該產品。
  - title: 明德食品：辣豆瓣醬 460g
    url: https://www.mingteh.com.tw/products/broad-bean-paste-with-chili
  # 成分黃豆、辣椒、麻油等，無蠶豆、含防腐劑；過敏原黃豆、芝麻；開封後冷藏；二年；火鍋沾醬。只代表該產品。
  - title: 十全：富山麻油辣豆瓣
    url: https://shih-chuan.com.tw/zh/products/product/fushan-sesame-oil-spicy-bean-paste-640g
  # 辣椒醬類開封後冷藏。香港公共機構，未點名豆瓣醬。
  - title: 香港消費者委員會：調味品發霉？變味？不可不知的儲存方法
    url: https://www.consumer.org.hk/tc/article/526-condiment-storage/526_condiment_storage
