sources:
  # 包裝食用鹽品加碘與未加碘的品名、醒語及總碘含量標示規定；2017 年 7 月 1 日起依製造日期實施。
  - title: 衛生福利部：包裝食用鹽品加不加碘清楚標
    url: https://www.mohw.gov.tw/cp-16-9718-1.html
  # 台鹽說明特級與高級碘鹽都是可食用細鹽，特級另加海水濃縮礦物質液；高級碘鹽包裝標示烹調、醃漬及洗滌蔬果用。限台鹽產品。
  - title: 台灣事實查核中心：台鹽特級碘鹽與高級碘鹽查核
    url: https://tfc-taiwan.org.tw/articles/11167
  # 未加碘產品實際醒語「碘為必需營養素，本產品未加碘」的例子；只代表台鹽無碘鹽。
  - title: 台鹽線上購：無碘鹽
    url: https://www.taiyen.tw/products/23
  # 鹽、糖等乾燥調味品放密封器皿、陰涼處防潮。香港公共機構，非臺灣來源。
  - title: 香港消費者委員會：調味品發霉？變味？不可不知的儲存方法
    url: https://www.consumer.org.hk/tc/article/526-condiment-storage/526_condiment_storage
