  # 臺南、雲林、彰化合計約 99%（民國 109 年統計）、將軍區居首；冬季作物，主要產期 11 月至翌年 4 月，冷藏調節可全年供應。
  - title: 農業部食農教育資訊整合平臺：胡蘿蔔產地與產期
    url: https://fae.moa.gov.tw/map/food_item.php?id=100&type=AS03
  # 挑選與保存圖卡：表皮、橫紋、根鬚、蒂頭；整根冷藏 1 至 2 週、切開 3 至 4 天、汆燙後冷凍 2 至 4 個月；怕濕氣、葉子可入菜。頁面註明轉引自由時報。
  - title: 農業部食農教育資訊整合平臺：胡蘿蔔挑選保存
    url: https://fae.moa.gov.tw/map/food_item.php?id=100&type=AS06
  # 刷洗後不必削皮；打汁、濃湯、整根煮後同燉、切絲炒熟當餡料。頁面的註01 出處標示有誤（液晶顯示器文章），只採用正文。
