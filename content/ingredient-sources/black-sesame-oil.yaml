sources:
  # 高溫焙炒壓榨的深色胡麻油（黑麻油）色濃有光澤，適合煎、炒、煮與食品加工。未限定原料為黑芝麻。
  - title: 農業部農業知識入口網：胡麻加工用途
    url: https://kmweb.moa.gov.tw/subject/subject.php?id=41283
  # 元福優級麻油（品名「麻油」，又稱黑麻油、胡麻油）以黑芝麻為原料；避開日照與高溫潮濕，開封後栓緊放陰涼處、不需冰；保存 2 年；麻油雞、三杯雞、油飯、麻油麵線。「冷壓」說法不採用；只代表該產品。
  - title: 元福麻油：優級麻油
    url: http://www.tw-food.com/oil-black-sesameoil-gifted.html
  # 東和黑芝麻油成分 100% 黑芝麻、標示含芝麻、放陰涼處、保存 2 年。「冷壓」說法不採用；只代表該產品。
  - title: 東和製油：黑芝麻油
    url: https://www.dongheoil.com/products/black-sesame-oil
  # 芝麻列為須標示的過敏原。
  - title: 衛生福利部食品藥物管理署：食品過敏原標示說明
    url: https://www.fda.gov.tw/tc/newsContent.aspx?cid=4&id=t622859
