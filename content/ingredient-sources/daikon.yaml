sources:
  # 產季圖卡標示 10 月至翌年 3 月；各產地品種與產季（原文作「臺北淡水」，條目寫成新北市淡水；「高雄大寮、美濃」同列 10 至 12 月）。產量圖前五名雲林、彰化、嘉義、高雄、臺南（未標年度）。頁名為「蘿蔔」，內容指白蘿蔔。
  - title: 農業部食農教育資訊整合平臺：蘿蔔產地與產期
    url: https://fae.moa.gov.tw/map/food_item.php?id=133&type=AS03
  # 挑選圖卡（外觀、觸感）、裂痕與花心說明；常溫陰涼通風、冷藏切葉帶泥包報紙、切口包保鮮膜。沒有保存天數。
  - title: 農業部食農教育資訊整合平臺：蘿蔔挑選保存
    url: https://fae.moa.gov.tw/map/food_item.php?id=133&type=AS06
  # 葉、上、中、下段與皮的用途（中段適合煮湯、炒食）；食譜例子中的去皮切塊與雞湯，延伸食譜的蘿蔔糕、櫻蝦蘿蔔羹、虱目魚蘿蔔湯。
  - title: 農業部食農教育資訊整合平臺：蘿蔔料理加工
    url: https://fae.moa.gov.tw/map/food_item.php?id=133&type=AS07
