  # 知名產地；彰化雲林 12 月進入產季、高雄 1 月底至 3 月初、屏東 3 至 4 月盛產；12 月至翌年 4 月最鮮甜（產季圖卡標為「最佳賞味期」）；屏東冷藏後 7 至 8 月仍可買到、8 至 11 月仰賴進口。
