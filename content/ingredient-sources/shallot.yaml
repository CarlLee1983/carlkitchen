sources:
  # 鱗莖泡冰水 15 分鐘減少流淚；網袋吊掛於陰涼通風乾燥處；炒菜、拌飯拌麵、滷肉及滷肉飯上的紅蔥頭酥；臺南嘉義雲林 107 至 109 年合計 99.7%、臺南產量 88%；農曆年後由南往北採收、清明前收完（農曆照原文）。
  - title: 農業部食農教育資訊整合平臺：紅蔥頭在地特色
    url: https://fae.moa.gov.tw/map/food_item.php?id=408&type=AS02
  # 臺南為主要產地，栽培以七股、安南、北門、學甲為主，雲林、嘉義次之（本頁只列面積與噸數，不給百分比）；安南種 2 至 3 月收成，月份僅為安南種舉例。
  - title: 農業部食農教育資訊整合平臺：紅蔥頭產地與產期
    url: https://fae.moa.gov.tw/map/food_item.php?id=408&type=AS03
  # 去頭尾、擦乾、切薄片；油蔥酥分次下鍋、炸至金黃瀝油，火候寫熱油後轉小火；植物油須密封並儘早食用。不取用油量比例。頁末「吃法」清單（飯粥配料、苦瓜雞湯、煮魚、豆麴炒菜）疑似由破布子頁誤貼，不採用。
  - title: 農業部食農教育資訊整合平臺：紅蔥頭料理加工
    url: https://fae.moa.gov.tw/map/food_item.php?id=408&type=AS07
  # 挑選三項（外皮、飽滿、未發芽）；網袋吊掛保持乾燥約 1 至 3 個月；去皮切片冷凍 1 個月內用完；切片中小火炸至金黃，連蔥油放涼裝罐冷藏或冷凍。
  - title: 農業部食農教育資訊整合平臺：國產農漁畜產品教材－紅蔥頭
    url: https://fae.moa.gov.tw/files/topics/3008/A02_2.pdf
  # 乾燥紅蔥頭為臺灣菜爆香佐料；9 至 11 月種、翌年 1 至 2 月採收，與食農產地頁口徑不同，只寫入 scope。
  - title: 農業部農糧署南區分署：紅蔥頭
    url: https://srb.afa.gov.tw/index.php?code=list&flag=detail&ids=3371&article_id=21617
