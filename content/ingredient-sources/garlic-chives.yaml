sources:
  # 韭菜、韭菜花、韭黃的區別；炒韭菜、韭菜盒子、蒼蠅頭等料理例子。
  - title: 農業部食農教育資訊整合平臺：認識韭菜
    url: https://fae.moa.gov.tw/map/food_item.php?id=149&type=AS01
  # 彰化埔鹽、桃園大溪、花蓮吉安產區與風味差異；韭菜花產區與 8–10 月產季；全年生產；最佳賞味期農曆二月（圖卡），照原文不換算。
  - title: 農業部食農教育資訊整合平臺：韭菜產地與產期
    url: https://fae.moa.gov.tw/map/food_item.php?id=149&type=AS03
  # 韭菜、韭黃、韭菜花挑選圖卡；牛皮紙包覆、葉片朝上直立冷藏約 7 天；包裝材質比較。
  - title: 農業部食農教育資訊整合平臺：韭菜挑選保存
    url: https://fae.moa.gov.tw/map/food_item.php?id=149&type=AS06
  # 去腐葉與根部、流動水沖洗、切段；韭菜捲餅、炒魚片等食譜例子。
  - title: 農業部食農教育資訊整合平臺：韭菜料理加工
    url: https://fae.moa.gov.tw/map/food_item.php?id=149&type=AS07
