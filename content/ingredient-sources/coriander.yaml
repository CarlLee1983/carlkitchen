  # 挑選（翠綠、無損傷病蟲害、梗未斷，發黃腐爛不食用）；不先煮過需仔細清洗；切碎使氣味加速消散；泡水冷藏每 2 至 3 天換水可放 2 至 3 週或分裝冷凍；打成醬料；彰化北斗為主、雲林臺南新北宜蘭少量；中秋後到清明前盛產、農曆過年前後品質最好。不採用頁面的「解毒」等療效說法。
  - title: 農業部農業兒童網：香菜
    url: https://kids.moa.gov.tw/theme_data.php?theme=kids_school&sub_theme=food&type=A01&id=348
  # 香菜火鍋用途；主要種植區彰化二林、溪州與雲林西螺，與兒童網鄉鎮不同，只寫入 scope。
  - title: 農業部食農教育資訊整合平臺：冬天就是要吃火鍋系列－香菜火鍋篇
