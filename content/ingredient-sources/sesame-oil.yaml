  # 元福小磨香油以白芝麻水洗煉製、等級差在原料等級；用於涼拌、沾醬、煮湯提香與炒菜；說明市售香油可能只標示芝麻油與另一植物油脂（調和香油）。頁面未寫保存方式；只代表該產品。
  - title: 元福麻油：小磨香油
    url: https://www.tw-food.com/oil-white-sesameoil.html
  # 低溫（約 160~180℃）焙炒壓榨的淡色胡麻油具傳統香油特色。
  - title: 農業部農業知識入口網：胡麻加工用途
    url: https://kmweb.moa.gov.tw/subject/subject.php?id=41283
  # 食用油放陰涼乾燥處、買小瓶裝約 2 個月內用完，反覆冷藏取出易凝結水滴。香港公共機構，未點名香油。
  - title: 香港消費者委員會：調味品發霉？變味？不可不知的儲存方法
    url: https://www.consumer.org.hk/tc/article/526-condiment-storage/526_condiment_storage
  # 芝麻列為須標示的過敏原。
  - title: 衛生福利部食品藥物管理署：食品過敏原標示說明
    url: https://www.fda.gov.tw/tc/newsContent.aspx?cid=4&id=t622859
