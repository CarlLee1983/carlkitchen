sources:
  # 白骨與紅骨風味相近；香氣比打拋葉、甜羅勒濃；用於鹹酥雞、三杯雞，可新鮮使用或曬乾成乾燥香料。
  - title: 農業部食農教育資訊整合平臺：羅勒家族
    url: https://fae.moa.gov.tw/theme_data.php?theme=topics&sub_theme=knowledge&id=1835
  # 農試所技術服務組回覆：變黑是香氣成分氧化褐變；耐低溫程度依品種而異，15℃ 以上低溫包裝貯藏的建議只針對國內常見青梗品種；葉片擦乾。
  - title: 農業部農業試驗所常見問答：九層塔變黑原因與冷藏溫度
    url: https://www.tari.gov.tw/faq/index-1.asp?Parser=27%2C5%2C30%2C%2C%2C%2C8005%2C87%2C%2C%2C%2C%2C%2C%2C%2C5
  # 只採用臺中區農業改良場專家回覆：12℃ 以下發生冷害；冷凍需先殺菁；凍傷後風味口感變差但可食用。不採用同頁網友回覆。
  - title: 農業部農業知識入口網：九層塔可以冷凍嗎？
    url: https://kmweb.moa.gov.tw/knowledge_view.php?id=15817
  # 利刀推切、不亂剁以免變黑；做青醬前汆燙約 30 秒再以冷開水冷卻，只當做醬時的處理例子。
  - title: 農業部食農教育資訊整合平臺：九層塔青醬
    url: https://fae.moa.gov.tw/theme_data.php?theme=topics&sub_theme=recipe&id=4774
  # 挑選（新鮮、葉面完整、不折損發黑、水分飽滿不枯萎）；全年可種植生產；主要產地屏東、彰化、雲林。
  - title: 臺中市政府豐原農產品股份有限公司：九層塔
    url: https://www.fyfv.taichung.gov.tw/1938539/post
