sources:
  # 四季豆是菜豆嫩莢、莢長 15–20 公分，與市場俗稱菜豆的豇豆不同；可汆燙涼拌、乾煸快炒。
  - title: 農業部食農教育資訊整合平臺：認識四季豆(菜豆)
    url: https://fae.moa.gov.tw/map/food_item.php?id=119&type=AS01
  # 高屏平地 10 月至翌年 2 月、中部平地秋作與春作播種月份、南投山區 6–9 月主要產期；產季圖卡寫「全年」，採頁面文字。
  - title: 農業部食農教育資訊整合平臺：四季豆(菜豆)產地與產期
    url: https://fae.moa.gov.tw/map/food_item.php?id=119&type=AS03
  # 挑選圖卡（挺直、約 15 公分、光滑嫩綠、緊實有彈性、清香）；保存圖卡（冷藏 7–10 天、20°C 以下常溫 2–5 天、鹽水汆燙瀝乾後冷凍）；小黑點成因。
  - title: 農業部食農教育資訊整合平臺：四季豆(菜豆)挑選保存
    url: https://fae.moa.gov.tw/map/food_item.php?id=119&type=AS06
  # 撕除筋絲的方法；不可生食，汆燙或炒至熟透；客家創意地瓜飯：四季豆燙熟切小段、爆香拌炒後拌入飯。
  - title: 農業部食農教育資訊整合平臺：四季豆(菜豆)料理加工
    url: https://fae.moa.gov.tw/map/food_item.php?id=119&type=AS07
