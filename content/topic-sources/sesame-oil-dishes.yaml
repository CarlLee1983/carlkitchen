      - https://shop.sgfa.org.tw/article_view.php?new_sn=7574
  # 三段的指定配料、煮麵與調汁分開、瀝水再拌、雞或大骨高湯，僅對應本站sesame-oil-vermicelli/recipe.yaml。
  # 下列農會來源只支持薑麻油可先處理再接主材料的做法背景，不冒稱包含本站麵線配方。
  # 不採本站舊文「溫補」等功效，沒有移植來源外的煮麵分鐘、三點水口訣或完成口感保證。
  - heading: 想吃主食，麵線另煮再拌
