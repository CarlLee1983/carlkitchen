# 2026-10-28 逐頁讀取官方全文。每日專題既有自主選題、來源核查與直接發布授權適用。
# 民俗辭典為記錄，不把其神學敘述當可驗證事實；不指定統一供品/日期/儀軌，無起源或地域普遍性推論。
# 乾米粉、乾香菇、玉米醬為編輯菜單建議，不稱傳統必備供品。沒有聲稱作者試作或個人經驗。
# 食安數值以食藥署2025-08-18維護Q&A為準：調製食品室溫2h；室溫>32°C為1h；熟食/易腐及原料建議<=5°C。
# 祭拜前運送/等候亦計入未妥善保溫保冷時間，是落實放置時間上限的保守安排，無重置時鐘或復熱救回主張。
# 彰化2026普渡稿0–7°C未用作熟食冷藏建議；本文採食藥署更具體的<=5°C。沒有引用其通用復熱為補救。
# 彰化歷史頁無可見發布日期，僅引用人口/冰箱容量/採買量；不採其罐頭氧化與添加物等概括說法。
# main b89075c7082c3f2e22b65e19b3ff33c3f07b68f0核對3道菜皆draft:false。
# taiwanese-fried-rice-noodles確有乾米粉/乾香菇/肉絲/蝦米/高麗菜/紅蘿蔔/芹菜；corn-chowder為玉米醬非玉米粒；mushroom-minced-pork-rice為乾香菇/豬絞肉/白飯。
# 料理段只導引現有配方，不新增配比、保存天數或教學步驟。分送保留標示與未泡發分配為編輯安排。
