      - https://www.mohw.gov.tw/cp-3159-24314-1.html
  # 7天、每人每日3L飲用水、免煮/需煮及平日口味；菜單分流是編輯建議，不新增燃料或飲水處理操作。
  - heading: 備用餐要能在當下吃得到
    urls:
      - https://prepare.mnd.gov.tw/emergency-supplies/household-supplies
      - https://www.ey.gov.tw/ofs/15881103EFD02C4/db501bab-c6d8-4985-9f9c-6afdcf37391a
  # 第一段少開門，記錄起點是落實時數指引的編輯建議。圖closed-fridge關門/記錄工具，鐘面不當成安全界線。
  # 第二段門關閉冷藏4h，第三段指定食物達40°F以上超2h，不靠試吃。
  - heading: 停電時關好冰箱，記下開始時間
    urls:
      - https://www.mohw.gov.tw/cp-3159-24314-1.html
      - https://www.foodsafety.gov/food-safety-charts/food-safety-during-power-outage
      - https://www.cdc.gov/food-safety/foods/keep-food-safe-after-emergency.html
  # 分品項表：完整未切蔬果不同於切過/熟食；冷凍肉仍有冰晶或40°F以下可再凍但品質可能改變，冰淇淋例外。
  # 泡水食品依臺灣官方棄置；罐頭鏽蝕/裂損/變形不用。沒有寫煮沸能救回失溫食物。
