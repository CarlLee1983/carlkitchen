# 2026-10-27 逐頁讀取官方全文；依每日專題自主選題／來源查核授權。
# 原候選「根莖、蛋與乾貨撐幾天」沒有通用依據，改為正常料理與無冷藏備用餐分流。
# FoodSafety.gov 的 40°F 僅約為4°C（精確4.44°C）；保留原華氏門檻，不混入臺灣一般冷藏7°C規範。
# 4h指停電且門關閉的冷藏估計；2h指指定易腐食品暴露於40°F或以上，兩者非同一起算點。
# 冷凍處置只舉肉類；冰淇淋為例外，沒有寫全部冰晶食品皆可再冷凍。
# 全民安全指引至少7天；食安辦2025-11-27文的3日份不採。3L採前者「飲用水」定義，不含全家洗滌用水。
# 食譜內容核對本次main 038a423c，cabbage-rice、egg-fried-rice均draft:false；沒有新增料理步驟或期限。
# USDA原頁研究工具403未繞過；FoodSafety.gov完整官方表可讀。未混用另兩份FDA頁面2h/4h表述。
