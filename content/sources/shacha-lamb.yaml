notes:
  - 2026-10-11 依站主要求整理公開用量措辭，僅調整備註，不變更既有定量、材料、步驟或來源。食用油原備註「來源未提供炒鍋用量」改為「適量，炒料用」。調味與操作用料的「適量」不代表來源新增定量；原有缺量或容量不明的事實保留於此。
  - 2026-10-11 修正前次用量措辭在公開頁重複顯示的問題：炒鍋用食用油無 amount，既有用量欄會顯示「適量」，因此 note 由「適量，炒料用」改為「炒料用」。另一筆醃肉用食用油 7.5 ml 與「約 1/2 大匙，醃肉用」備註完全保留。材料、定量、步驟、圖片及核准來源不變；此修正不補上原來源未提供的用量。
