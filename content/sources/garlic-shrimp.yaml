notes:
  - 2026-10-11 依站主要求整理公開用量措辭，僅調整備註，不變更既有定量、材料、步驟或來源。青蔥原備註「來源標示適量，切成蔥花」改為「適量，切成蔥花」。水原備註「電鍋用，來源未標杯量」改為「電鍋用，杯的容量待確認」。香油原備註「來源標示適量，起鍋後淋上」改為「適量，起鍋後淋上」。調味與操作用料的「適量」不代表來源新增定量；原有缺量或容量不明的事實保留於此。
  - 2026-10-11 修正前次用量措辭在公開頁重複顯示的問題：無 amount 時既有用量欄會顯示「適量」，因此只從 note 移除重複的「適量」，保留其他用途與不確定性。青蔥的備註「適量，切成蔥花」改為「切成蔥花」。香油的備註「適量，起鍋後淋上」改為「起鍋後淋上」。材料、定量、步驟、圖片及核准來源不變；此修正不補上原來源未提供的用量。
