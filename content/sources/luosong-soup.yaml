notes:
  - 2026-10-11 依站主要求整理公開用量措辭，僅調整備註，不變更既有定量、材料、步驟或來源。雞高湯原備註「燉煮用；來源未列用量」改為「適量，燉煮用」。調味與操作用料的「適量」不代表來源新增定量；原有缺量或容量不明的事實保留於此。
  - 2026-10-11 修正前次用量措辭在公開頁重複顯示的問題：無 amount 時既有用量欄會顯示「適量」，因此只從 note 移除重複的「適量」，保留其他用途與不確定性。迷迭香的備註「適量；來源也可用義大利香料」改為「來源也可用義大利香料」。雞高湯的備註「適量，燉煮用」改為「燉煮用」。材料、定量、步驟、圖片及核准來源不變；此修正不補上原來源未提供的用量。
