notes:
  - 2026-10-11 依站主要求整理公開用量措辭，僅調整備註，不變更既有定量、材料、步驟或來源。粉絲原備註「來源未提供每份重量」移除。蒜末原備註「來源標示適量」改為「適量」。薑末原備註「來源標示適量」改為「適量」。辣豆瓣醬原備註「來源未註明匙的規格」改為「匙的容量待確認」。醬油原備註「來源未註明匙的規格」改為「匙的容量待確認」。米酒原備註「來源未註明匙的規格」改為「匙的容量待確認」。胡椒粉原備註「來源標示適量」改為「適量」。食用油原備註「來源未提供用量，炒絞肉用」改為「適量，炒絞肉用」。調味與操作用料的「適量」不代表來源新增定量；原有缺量或容量不明的事實保留於此。
  - 2026-10-11 修正前次用量措辭在公開頁重複顯示的問題：無 amount 時既有用量欄會顯示「適量」，因此只從 note 移除重複的「適量」，保留其他用途與不確定性。蒜末的備註「適量」移除。薑末的備註「適量」移除。胡椒粉的備註「適量」移除。食用油的備註「適量，炒絞肉用」改為「炒絞肉用」。材料、定量、步驟、圖片及核准來源不變；此修正不補上原來源未提供的用量。
