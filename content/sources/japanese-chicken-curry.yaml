notes:
  - 僅採用此單一來源的材料、用量、順序與時間；已讀完整頁面及 Recipe 結構化資料，文字另行重述，不使用來源圖片。
  - 份數 4 人份與總時間 30 分鐘均沿用來源。來源步驟列中火約 10 分鐘與加蓋 5 分鐘，未另行推估時間。
  - 雞胸肉 1 塊、咖哩塊 2 磚依來源保留，不推算克數。洋蔥、紅蘿蔔與馬鈴薯各半個；蒜頭 3 粒以 3 瓣呈現。
  - 咖哩粉維持來源 3 湯匙，以大匙顯示；未提供重量，不另做非直接換算。水約 500 ml 出自第 4 步。
  - 來源第 3 步寫過油略炒，但材料表未列油種或油量；食用油以一般名稱補入調味組，用量未知並在公開材料備註揭露。未自行填入毫升或克數。
  - 2026-10-10 站主接受雞胸肉與咖哩塊不猜重量、油量未載明的整理方式。此接受不代表圖片落差已核准或草稿已通過發布檢查。
  - 咖哩塊可以逐塊加入、加得越多越稠，均來自來源的小撇步；未把調整稠度改寫成固定新增用量。
  - 肉類名稱沿用來源的雞胸肉，無自行更換部位。切丁與蒜頭切末都有來源依據，未自行補尺寸。
  - 熟度資訊缺口：來源以雞肉轉白作為先盛出的訊號，未給中心溫度、切丁尺寸或初炒分鐘數；保留後續加蓋 5 分鐘的步驟，不把轉白寫成已確認安全熟透。若要補可靠的熟度判斷，須先核准補充來源，此版未自行加入。
  - 非湯料理與配菜候選為提議；本配方不含白飯，雞胸肉與三種蔬菜共同構成主體，故提議蛋白質與蔬菜標記皆為真。
  - 來源留言提及咖哩粉品牌，公開材料維持一般名稱咖哩粉。無新增別名或建議部位。
  - 愛料理的全站改作限制依 ADR 0009 處理；只取事實且不照抄表達。這份完整頁面未見此菜頁另列禁止轉載或改作聲明。
  - 2026-10-10 站主核准 hero、step-2、step-5 各修一次。舊圖歷次生成次數仍未知，本次各呼叫內建生圖工具一次，未重試，也未把歷史次數重置。原圖、提示詞與逐張紀錄保留供審查。
  - 五張目前 WebP 均為 1536×1024。檔案大小分別為 hero 117440、ingredients 109170、step-1 147690、step-2 87300、step-5 138240 bytes，皆小於 300 KB。三張修圖的原始結果、轉檔結果與 240×160、96×64 縮圖均已目視檢查。
  - 材料圖與 step-1 未更動。材料圖可見一塊雞胸肉、半顆洋蔥、半根紅蘿蔔、半顆馬鈴薯、三瓣蒜頭、兩磚咖哩塊，以及分裝的咖哩粉、水與食用油。圖中無刻度，不能據此核定調味料重量或液體體積。
  - hero 與 step-5 的大片洋蔥已改為小丁，雞胸肉、紅蘿蔔與馬鈴薯也呈切丁外形，與 step-1 的備料結果對照一致。食材大小與熟後形狀仍屬插畫近似，不能據此推定切丁公分數或重量。
  - step-2 已改成雞胸肉丁盛在素色瓷碗裡的暫放狀態，表面呈白色，未加配菜、咖哩醬或溫度計。轉白只沿用來源的中途盛出訊號，圖片不代表已確認安全熟透；仍須按原做法放回咖哩續煮。
  - 構圖記錄：hero 盤緣完整，主體寬約占畫面 76%，橢圓主體面積約占半幅；整合者按規格的約六成主體面積判讀後接受，未宣稱精確縮至六成寬。兩種 3 比 2 縮圖仍能辨認盤形與料理。step-5 沿用原炒鍋，鍋柄完整但接近右側邊緣，檢視的縮圖沒有裁切。
