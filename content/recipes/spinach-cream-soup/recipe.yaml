title: 菠菜濃湯
summary: 雞胸肉抓醃炒嫩，菠菜與洋蔥、蒜末炒軟後加入青醬與高湯攪打成細滑翡翠綠湯，再融合白醬與雞肉溫火煮滾。奶香濃郁、色澤翠綠、口感綿密柔滑。
servings: 3
category: 湯
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 20
tags: [西式濃湯, 蔬菜, 雞肉]
aliases: [翡翠菠菜濃湯, 法式菠菜湯]
ingredients:
  - { name: 菠菜, amount: { value: 300, unit: g }, note: 洗淨切成小段 }
  - { name: 雞胸肉, amount: { value: 150, unit: g }, note: 去皮切成薄片 }
  - { name: 高湯, amount: { value: 500, unit: ml }, note: 蔬菜高湯或清雞高湯 }
  - { name: 白醬, amount: { value: 100, unit: g }, note: 賦予香濃滑順奶香 }
  - {
      name: 市售青醬,
      amount: { value: 20, unit: g },
      note: 約 1 大匙，增添羅勒香氣,
      group: 調味,
    }
  - {
      name: 洋蔥,
      amount: { value: 10, unit: g },
      note: 切成細碎末,
      group: 調味,
    }
  - {
      name: 大蒜,
      amount: { value: 10, unit: g },
      note: 約 2 瓣，切成蒜末,
      group: 調味,
    }
  - {
      name: 蒜酥,
      amount: { value: 5, unit: g },
      note: 盛盤撒於表面提香,
      group: 調味,
    }
  - {
      name: 蛋白,
      amount: { value: 15, unit: g },
      note: 約半顆，醃肉使肉質滑嫩,
      group: 調味,
    }
  - {
      name: 太白粉,
      amount: { value: 5, unit: g },
      note: 約 1 茶匙，醃肉用,
      group: 調味,
    }
  - {
      name: 鹽,
      amount: { value: 3, unit: g },
      note: 約 1/2 茶匙，分次醃肉與調味,
      group: 調味,
    }
  - {
      name: 白胡椒粉,
      amount: { value: 1, unit: g },
      note: 約 1/4 茶匙，分次醃肉與調味,
      group: 調味,
    }
  - {
      name: 橄欖油,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，炒料用,
      group: 調味,
    }
steps:
  - text: 雞胸肉去皮切成薄片，加入少許鹽、白胡椒粉、蛋白與太白粉抓醃均勻；熱鍋加入少許橄欖油，下雞肉片快速炒至表面變白斷生，隨即盛起備用。
  - text: 菠菜徹底洗淨切段；洋蔥去皮切成細丁，大蒜去皮切成碎末備用。
  - text: 原鍋補入適量橄欖油，以中小火煸炒洋蔥碎與蒜末至飄出香味，接著倒入菠菜段翻炒至葉片軟化塌陷。
    image:
      src: ./step-3.webp
      alt: 平底鍋中蒜末與洋蔥末炒出香味，鮮綠菠菜段入鍋翻炒至變軟塌陷
  - text: 將炒軟的菠菜盛入調理機中，倒入市售青醬與高湯，啟動高速攪打至質地細緻濃稠、呈滑順翡翠綠色。
    image:
      src: ./step-4.webp
      alt: 高速調理機調理杯中翠綠的菠菜與高湯、青醬充分攪打，呈現如絲絨般柔滑的濃綠湯汁
  - text: 將攪打好的菠菜湯倒回湯鍋中，拌入白醬與炒熟的雞肉片，加入剩餘鹽與白胡椒粉調味，以微火慢煮至微滾融合，熄火盛碗後撒上蒜酥即可。
hero:
