  alt: 現代淺灰瓷湯碗中盛著絲滑翠綠的菠菜濃湯，綴以白嫩雞胸肉片、輕柔鮮奶油花與金黃香脆蒜酥
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 木砧板上整齊排著鮮綠菠菜束、去皮雞胸肉片、切碎洋蔥與蒜末，周圍小碗分裝青醬、白醬、高湯、蒜酥、鹽與白胡椒
tip: 菠菜先經油脂炒軟再攪打，能釋放脂溶性營養並保持亮麗翠綠；加入少許青醬能提昇香草層次，白醬則賦予濃湯絲滑溫潤的奶香。
