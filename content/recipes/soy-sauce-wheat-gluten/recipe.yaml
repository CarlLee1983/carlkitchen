title: 醬炒麵腸
summary: 依核准食譜指南製作之經典家常醬炒麵腸，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: "麵腸斜切煸至金黃微焦再以醬油冰糖炒香，蛋豆主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 麵腸, amount: { value: 100, unit: g }, note: 原料標示 300公克 }
  - { name: 九層塔, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 辣椒, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 薑, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 葵花籽油, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 醬油, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 素蠔油, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
  - { name: 甜麵醬, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
  - { name: 細砂糖, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
  - { name: 素烏醋, amount: { value: 100, unit: g }, note: 原料標示 少許 }
steps:
  - text: "薑、辣椒洗淨切絲；九層塔取嫩葉，洗淨切末；麵腸洗淨，撕成片狀，備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的醬炒麵腸主要材料
  - text: "熱油鍋至油溫約160℃，放入作法1麵腸片油炸至微焦，撈出瀝油，備用。"
  - text: "另取一鍋倒入葵花籽油，爆香作法1辣椒絲、薑絲，放入作法2麵腸片和所有調味料拌炒至入味。"
  - text: "起鍋前放入作法1九層塔末快速拌勻即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味醬炒麵腸
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之醬炒麵腸各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
