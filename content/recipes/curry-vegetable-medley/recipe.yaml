title: 咖哩蔬什錦
summary: 馬鈴薯、紅蘿蔔與洋蔥用咖哩粉和雞高湯煮軟，最後加入青花椰菜。
servings: 2
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 馬鈴薯、紅蘿蔔、青花椰菜與洋蔥切塊煮成咖哩蔬菜，雞高湯只作湯底。
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 30
tags: [蔬菜, 咖哩]
ingredients:
  - { name: 馬鈴薯, amount: { value: 1, unit: 顆 } }
  - { name: 紅蘿蔔, amount: { value: 50, unit: g } }
  - { name: 青花椰菜, amount: { value: 100, unit: g } }
  - { name: 洋蔥, amount: { value: 0.5, unit: 顆 } }
  - { name: 蒜末, note: 來源用量記為「1/小匙」，數值缺字待核, group: 調味 }
  - {
      name: 沙拉油,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙,
      group: 調味,
    }
  - { name: 雞高湯, amount: { value: 300, unit: ml }, group: 調味 }
  - {
      name: 太白粉水,
      amount: { value: 5, unit: ml },
      note: 約 1 小匙,
      group: 調味,
    }
  - { name: 咖哩粉, amount: { value: 2, unit: 小匙 }, group: 調味 }
  - { name: 鹽, amount: { value: 0.5, unit: 小匙 }, group: 調味 }
  - { name: 細砂糖, amount: { value: 0.5, unit: 小匙 }, group: 調味 }
steps:
  - text: 馬鈴薯和紅蘿蔔去皮洗淨，切成菱形塊；青花椰菜去掉表面粗纖維後切小塊，洋蔥去皮切丁。
    image:
      src: ./step-1.webp
      alt: 砧板上分開擺著切成菱形的馬鈴薯與紅蘿蔔、小朵青花椰菜和洋蔥丁，旁邊有菜刀
  - text: 鍋中加入沙拉油，放入蒜末炒香，再放馬鈴薯、紅蘿蔔和洋蔥炒香。
    image:
      src: ./step-2.webp
      alt: 鋼製炒鍋裡的馬鈴薯塊、紅蘿蔔塊、洋蔥丁與蒜末正在炒香
  - text: 加咖哩粉略炒，倒入雞高湯，加入鹽和細砂糖拌勻，以小火煮到蔬菜軟化。
    image:
      src: ./step-3.webp
      alt: 淺鋼鍋裡的馬鈴薯、紅蘿蔔與洋蔥在淺黃色咖哩湯汁中小火煮著
  - text: 放入青花椰菜煮約 1 分鐘，起鍋前加入太白粉水勾芡。
    image:
      src: ./step-4.webp
      alt: 淺鋼鍋裡的馬鈴薯、紅蘿蔔、洋蔥與青花椰菜拌著略稠的咖哩醬汁
hero:
  src: ./hero.webp
  alt: 素色陶碗裡的馬鈴薯、紅蘿蔔、青花椰菜與洋蔥拌著淺黃色咖哩醬汁
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 一顆馬鈴薯、一段紅蘿蔔、幾朵青花椰菜、半顆洋蔥與一小撮蒜末，旁邊分裝沙拉油、雞高湯、太白粉水、咖哩粉、鹽與細砂糖
