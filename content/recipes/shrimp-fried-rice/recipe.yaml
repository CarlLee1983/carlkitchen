steps:
  - text: 蝦仁洗淨挑除腸泥，加入米酒與太白粉抓勻醃漬 10 分鐘，放入滾水中微燙 10 秒即刻撈起瀝乾備用。
    image:
      src: ./step-1.webp
      alt: 蝦仁洗淨挑除腸泥，加入米酒與太白粉抓勻醃漬 10 分鐘，放入滾水中微燙 10 秒即刻撈起瀝乾備用。
  - text: 熱鍋倒入適量油，倒入打散的蛋液快速攪炒至半凝固散發蛋香，盛出備用。
  - text: 原鍋補少許油爆香蒜末與洋蔥末，倒入白飯以鍋鏟壓散，大火翻炒至米粒分明跳動。
    image:
      src: ./step-3.webp
      alt: 原鍋補少許油爆香蒜末與洋蔥末，倒入白飯以鍋鏟壓散，大火翻炒至米粒分明跳動。
  - text: 放入燙過的蝦仁、炒蛋與蔥末，加入鹽、胡椒粉、糖調味，沿鍋邊淋入醬油大火快翻數秒，均勻入味即可盛盤。
