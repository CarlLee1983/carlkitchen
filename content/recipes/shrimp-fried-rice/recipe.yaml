title: 蝦仁炒飯
summary: 鮮脆蝦仁抓醃過水保持彈牙，熱鍋炒香金黃雞蛋，加入蒜末、洋蔥末與粒粒分明隔夜白飯大火快翻，倒入蝦仁與蔥末，撒入鹽、胡椒粉與醬油鑊氣嗆香，金黃油亮、鮮香四溢。
servings: 2
category: 主食
dishKinds: []
classificationReason: 白飯兩碗與蝦仁、炒蛋合炒成一餐，沿用主食類且不分配非湯主角與組餐菜位。
