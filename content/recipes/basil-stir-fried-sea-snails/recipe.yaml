title: 塔香螺肉
summary: 依核准食譜指南製作之經典家常塔香螺肉，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: "螺肉以九層塔與沙茶大火熱炒，海鮮主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 鳳螺肉, amount: { value: 100, unit: g }, note: 原料標示 240公克 }
  - { name: 薑, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 蒜仁, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 紅辣椒, amount: { value: 100, unit: g }, note: 原料標示 30公克 }
  - { name: 九層塔, amount: { value: 100, unit: g }, note: 原料標示 20公克 }
  - { name: 油膏醬, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 香油, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
steps:
  - text: "鳳螺肉放入滾水中汆燙約30秒後，撈起沖涼備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的塔香螺肉主要材料
  - text: "薑洗淨切絲；蒜仁和紅辣椒洗淨切碎末；九層塔挑去粗莖洗淨瀝乾，備用。"
  - text: "熱鍋，加入1大匙沙拉油（材料外），小火爆香薑絲、蒜仁末和紅辣椒末後，放入作法1的鳳螺肉和油膏醬、米酒，以中火持續翻炒至水份略收乾，再附入九層塔和香油略翻炒即可盛盤。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味塔香螺肉
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之塔香螺肉各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
