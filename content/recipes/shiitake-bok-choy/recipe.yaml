title: 香菇炒青江菜
summary: 鮮香菇與青江菜一起拌炒，以醬油膏調味。加少量水煮到菜葉軟化，是一道帶蒜香的家常配菜。
servings: 2
category: 非湯料理
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 10
tags: [家常菜]
ingredients:
  - { name: 青江菜, amount: { value: 250, unit: g }, note: 洗淨切成適當大小 }
  - { name: 鮮香菇, amount: { value: 8, unit: 朵 }, note: 對切 }
  - { name: 大蒜, amount: { value: 2, unit: 瓣 }, note: 小瓣，拍破 }
  - {
      name: 食用油,
      amount: { value: 5, unit: ml },
      note: 約 1 茶匙,
      group: 調味,
    }
  - {
      name: 醬油膏,
      amount: { value: 22.5, unit: ml },
      note: 約 1.5 湯匙,
      group: 調味,
    }
  - { name: 黑胡椒粉, note: 適量, group: 調味 }
  - { name: 水, amount: { value: 30, unit: ml }, note: 約 2 湯匙, group: 調味 }
steps:
  - text: 洗淨青江菜並切成適當大小，鮮香菇對切，大蒜拍破備用。
    image:
      {
        src: ./step-1.webp,
        alt: 木砧板上有切好的青江菜、對切的鮮香菇與拍破的大蒜，旁邊放著菜刀,
      }
  - text: 燒熱炒鍋，倒入食用油，加入大蒜炒出香氣。
  - text: 先炒香鮮香菇，再把青江菜加入鍋中拌炒均勻。
    image:
      {
        src: ./step-3.webp,
        alt: 炒鍋裡的鮮香菇塊與青江菜混合拌炒，夾著拍破的大蒜,
      }
  - text: 拌入醬油膏和黑胡椒粉，再倒入水，煮到青江菜軟化後盛出。
    image:
      { src: ./step-4.webp, alt: 炒鍋裡的青江菜已軟化，與鮮香菇裹著褐色醬汁 }
hero:
  src: ./hero.webp
  alt: 素色瓷盤盛著青江菜與對切鮮香菇，表面裹著褐色醬汁，夾著蒜瓣
ingredientsPhoto:
  src: ./ingredients.webp
