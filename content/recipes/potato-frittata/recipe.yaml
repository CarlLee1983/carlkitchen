tip: 馬鈴薯切絲後先在鍋中炒熟再拌入蛋液，烘煎時蛋才不會焦而馬鈴薯仍夾生；全程使用最小火慢烘，底面金黃定型後再翻面，烘蛋厚實飽滿不碎裂。
