tags: [家常菜, 烘蛋, 馬鈴薯, 蛋料理]
aliases: [馬鈴薯煎蛋, 西式馬鈴薯烘蛋]
ingredients:
  - name: 馬鈴薯
    amount:
      value: 250
      unit: g
    note: 去皮切細絲泡水
  - name: 雞蛋
    amount:
      value: 3
      unit: 顆
    note: 打散成蛋液
  - name: 洋蔥
    amount:
      value: 50
      unit: g
    note: 切細絲
  - name: 培根
    amount:
      value: 2
      unit: 片
    note: 切小丁增香
  - name: 奶油
    amount:
      value: 20
      unit: g
    note: 烘蛋增香
  - name: 鹽
    amount:
      value: 3
      unit: g
    note: 約半茶匙
    group: 調味
