title: 家常馬鈴薯烘蛋
summary: 馬鈴薯去皮切細絲入鍋炒透，洋蔥絲與培根丁小火煸出香氣，倒入打勻的新鮮蛋液混合均勻，入平底鍋慢火烘煎至底面焦黃微脆，翻面略烘至蛋體厚實金黃膨起，蛋香濃醇、薯絲綿密鬆軟。
servings: 3
category: 非湯料理
dishKinds: [vegetable, egg-bean]
classificationReason: 以馬鈴薯為主要蔬菜主角，搭配雞蛋慢火烘製成厚烘蛋，屬於蔬菜與蛋豆類料理。
