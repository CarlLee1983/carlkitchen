steps:
  - text: 馬鈴薯去皮切細絲泡水洗去多餘澱粉瀝乾；洋蔥切絲；培根切小丁；雞蛋打入大碗加少許鹽與黑胡椒粉打散備用。
    image:
      src: ./step-1.webp
      alt: 馬鈴薯去皮切細絲泡水洗去多餘澱粉瀝乾；洋蔥切絲；培根切小丁；雞蛋打入大碗加少許鹽與黑胡椒粉打散備用。
  - text: 熱平底鍋融化一半奶油，放入培根丁、洋蔥絲煸炒至香軟，加入馬鈴薯絲中火翻炒 2 分鐘至薯絲半透明變軟，盛出稍微降溫。
  - text: 將炒好的馬鈴薯培根料倒入蛋液中充分攪拌均勻；平底鍋融化剩餘奶油轉小火，倒入混合好的蛋液抹平鍋面。
    image:
      src: ./step-3.webp
      alt: 將炒好的馬鈴薯培根料倒入蛋液中充分攪拌均勻；平底鍋融化剩餘奶油轉小火，倒入混合好的蛋液抹平鍋面。
  - text: 以極小火慢烘約 4 至 5 分鐘至底面金黃定型，翻面續烘約 2 分鐘至熟透微膨，盛盤切塊即可享用。
hero:
