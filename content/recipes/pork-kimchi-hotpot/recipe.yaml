title: 泡菜豬肉鍋
summary: 豬五花肉汆燙後和泡菜、大醬拌炒，再加入高湯、豆腐與蔬菜煮成一鍋。
servings: 3
category: 湯
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 30
tags: [家常菜]
ingredients:
  - { name: 豬五花肉, amount: { value: 200, unit: g }, note: 三層肉 }
  - { name: 泡菜, amount: { value: 200, unit: g }, note: 連同少許泡菜汁 }
  - { name: 洋蔥, amount: { value: 0.5, unit: 顆 }, note: 切片 }
  - { name: 香菇, amount: { value: 1, unit: 朵 }, note: 切片 }
  - { name: 豆腐, amount: { value: 0.5, unit: 盒 }, note: 切片 }
  - { name: 紅辣椒, amount: { value: 1, unit: 條 }, note: 切片 }
  - { name: 綠辣椒, amount: { value: 1, unit: 條 }, note: 切片 }
  - { name: 青蔥, amount: { value: 1, unit: 支 }, note: 切蔥花 }
  - { name: 水, amount: { value: 200, unit: ml }, note: 汆燙用, group: 調味 }
  - {
      name: 鹽,
      amount: { value: 1.67, unit: ml },
      note: 約三分之一茶匙，汆燙用,
      group: 調味,
    }
  - {
      name: 米酒,
      amount: { value: 30, unit: ml },
      note: 約 2 湯匙，汆燙與拌料各用一半,
      group: 調味,
    }
  - {
      name: 韓式大醬,
      amount: { value: 7.5, unit: ml },
      note: 約半湯匙,
      group: 調味,
    }
  - {
      name: 蒜泥,
      amount: { value: 15, unit: ml },
      note: 約 1 湯匙,
      group: 調味,
    }
  - { name: 高湯, amount: { value: 600, unit: ml }, group: 調味 }
  - {
      name: 辣椒粉,
      amount: { value: 15, unit: ml },
      note: 約 1 湯匙,
      group: 調味,
    }
  - {
      name: 蝦露,
      amount: { value: 2.5, unit: ml },
      note: 約半茶匙,
      group: 調味,
    }
steps:
  - text: 湯鍋加入水、鹽和一半米酒，放入豬五花肉汆燙。撈起放涼，切成片。
    image:
      src: ./step-1.webp
      alt: 汆燙過的豬五花肉片放在瀝水籃和木砧板上，砧板旁有菜刀
  - text: 洋蔥、香菇、豆腐、紅辣椒和綠辣椒切片；青蔥切成蔥花。
    image:
      src: ./step-2.webp
      alt: 木砧板上分開放著洋蔥片、香菇片、豆腐片、紅綠辣椒片和青蔥花
  - text: 將韓式大醬、泡菜、蒜泥、豬五花肉和剩下的米酒放進碗裡拌勻。
    image:
      src: ./step-3.webp
      alt: 白色瓷碗裡拌有豬五花肉片、泡菜、蒜泥和韓式大醬
  - text: 熱鍋倒入拌好的材料，炒到豬肉香氣散出，再倒入高湯。
    image:
      src: ./step-4.webp
      alt: 雙耳湯鍋裡的豬五花肉片和泡菜浸在紅色湯汁中，中央可見蒜泥與韓式大醬
  - text: 高湯煮滾後，放入洋蔥、香菇、豆腐、紅辣椒和綠辣椒，續煮約 3 分鐘。
    image:
      src: ./step-5.webp
      alt: 雙耳湯鍋裡的紅色泡菜湯正煮著豬五花肉片、豆腐、洋蔥、香菇與紅綠辣椒片
  - text: 加入辣椒粉和蝦露，以大火煮開後關火，撒上青蔥。
    image:
      src: ./step-6.webp
      alt: 雙耳湯鍋中盛著泡菜豬肉鍋，紅色湯面上有豬五花肉片、豆腐、香菇、洋蔥、紅綠辣椒和青蔥花
tip: 偏酸的泡菜適合這道鍋物；高湯可依來源以鯷魚、昆布和洗米水熬製。
hero:
  src: ./hero.webp
  alt: 敞口雙耳湯鍋中盛著紅色泡菜豬肉鍋，可見豬五花肉片、泡菜、豆腐、香菇、紅綠辣椒和青蔥
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 豬五花肉片、泡菜、半顆洋蔥、一朵香菇、半盒豆腐、紅綠辣椒及一支青蔥，旁邊分裝著調味料和高湯
