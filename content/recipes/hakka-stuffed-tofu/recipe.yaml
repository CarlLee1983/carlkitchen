title: 客家釀豆腐
summary: 依核准食譜指南製作之經典家常客家釀豆腐，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [egg-bean, meat]
classificationReason: "板豆腐中鑲入調味絞肉煎燜，蛋豆與肉類雙主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 35
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 板豆腐, amount: { value: 100, unit: g }, note: 原料標示 2塊 }
  - { name: 太白粉, amount: { value: 100, unit: g }, note: 原料標示 1/2杯 }
  - { name: 蔥末, amount: { value: 100, unit: g }, note: 原料標示 1支 }
  - { name: 餡料：香油, amount: { value: 100, unit: g }, note: 原料標示 1茶匙 }
  - { name: 絞肉, amount: { value: 100, unit: g }, note: 原料標示 1/2斤 }
  - { name: 香菇, amount: { value: 100, unit: g }, note: 原料標示 2朵 }
  - { name: 蔥, amount: { value: 100, unit: g }, note: 原料標示 1支 }
  - { name: 薑, amount: { value: 100, unit: g }, note: 原料標示 2片 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 1茶匙 }
  - { name: 胡椒粉, amount: { value: 100, unit: g }, note: 原料標示 1茶匙 }
