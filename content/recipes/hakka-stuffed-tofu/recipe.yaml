steps:
  - text: "將所有餡料拌勻；全部調味料調勻備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的客家釀豆腐主要材料
  - text: "板豆腐洗淨後，切成4×7cm的塊狀，用湯匙在中間挖洞（約2㎝深，勿深及底層），在凹洞內抹上一層太白粉（加強黏性），將作法1拌好的餡料填入（最好讓餡料能鼓起來較為好看），再抹上一層太白粉（炸好後會呈現較光滑色澤），最後放入150℃油鍋中炸約2分鐘至表面呈金黃色，取出瀝油備用。"
  - text: "另起油鍋爆香蔥花後，倒入作法1調勻的調味料煮開，再放入作法2豆腐，用中火煮約3分鐘即可起鍋。"
