title: 番茄炒蛋
summary: 蛋先炒到半凝固盛起，番茄加糖和水燜出湯汁後再拌回炒蛋。蛋軟嫩、湯汁偏多，適合配飯。
servings: 3
category: 非湯料理
draft: false
mealCandidate: true
vegetable: true
protein: true
timeMinutes: 15
tags: [家常菜]
aliases: [蕃茄炒蛋]
ingredients:
  - {
      name: 番茄,
      amount: { value: 300, unit: g },
      note: 牛番茄約 2 顆，保留外皮,
    }
  - { name: 雞蛋, amount: { value: 4, unit: 顆 } }
  - { name: 青蔥, amount: { value: 20, unit: g }, note: 約 2 支，切成蔥粒 }
  - {
      name: 食用油,
      amount: { value: 15, unit: ml },
      note: 炒番茄前另補少許,
      group: 調味,
    }
  - {
      name: 鹽,
      amount: { value: 1.5, unit: g },
      note: 約 1/4 茶匙，蛋液與番茄各用一半,
      group: 調味,
    }
  - { name: 糖, amount: { value: 6, unit: g }, note: 約 1/2 湯匙, group: 調味 }
  - { name: 水, amount: { value: 75, unit: ml }, group: 調味 }
steps:
  - text: 番茄去蒂，連皮切成滾刀塊；青蔥切成蔥粒。
    image:
      src: ./step-1.webp
      alt: 砧板上一堆連皮切好的番茄滾刀塊，旁邊一小堆青綠的蔥粒和一把菜刀
  - text: 雞蛋打進大碗，加一半的鹽，攪打到蛋白蛋黃完全混合、顏色均勻。
    image:
      src: ./step-2.webp
      alt: 白色瓷碗中盛著攪打均勻的淡黃色蛋液，表面有幾個小氣泡
  - text: 炒鍋燒熱後倒入食用油，油熱下蛋液。蛋液略為凝固、表面還帶點濕潤就盛起，炒久會變老。
    image:
      src: ./step-3.webp
      alt: 炒鍋中大塊、半凝固的嫩黃炒蛋，表面還帶著濕潤光澤，旁邊放著鍋鏟
  - text: 原鍋補少許油，下蔥粒炒出香味，再放番茄塊翻炒，炒到番茄開始出水。
    image:
      src: ./step-4.webp
      alt: 炒鍋中翻炒中的番茄塊，混著綠色蔥粒，鍋底滲出一點紅色湯汁
  - text: 加入水、剩下的鹽和糖，蓋上鍋蓋煮 3 分鐘，讓番茄味煮進湯汁。
  - text: 倒回炒蛋，翻拌到蛋均勻沾上湯汁就起鍋。
    image:
      src: ./step-6.webp
      alt: 炒鍋中拌勻的番茄塊與嫩黃炒蛋，鍋底留著一層紅色湯汁
hero:
  src: ./hero.webp
  alt: 白色圓瓷盤中盛著番茄炒蛋，嫩黃炒蛋與紅色番茄塊帶著湯汁、撒有蔥粒
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 兩顆番茄、四顆雞蛋、兩支青蔥，以及分裝在小碟與小瓶中的鹽、糖、食用油和一小杯水
tip: 想讓番茄口感更軟，可先在尾端劃十字，放入滾水汆燙 30 秒、泡冷水去皮後再切塊。
