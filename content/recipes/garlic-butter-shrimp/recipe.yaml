tip: 草蝦背部切開能使熱度更快進入蝦肉且能緊緊鎖住蒜味奶油醬汁；奶油分兩次下鍋，先煎出蝦殼焦香，後放蒜末與奶油，蒜粒金黃而不焦黑。
