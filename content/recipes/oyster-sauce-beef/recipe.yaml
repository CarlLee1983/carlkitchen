title: 蠔油炒牛肉
summary: 依核准食譜指南製作之經典家常蠔油炒牛肉，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: "牛肉片醃漬軟嫩佐蠔油蔥薑大火熱炒，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 牛肉片, amount: { value: 200.0, unit: g }, note: 原料標示 200公克 }
  - { name: 洋蔥, amount: { value: 1.0, unit: g }, note: 原料標示 1/3顆 }
  - { name: 青椒, amount: { value: 1.0, unit: g }, note: 原料標示 1/2顆 }
  - { name: 紅蘿蔔, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 辣椒, amount: { value: 1.0, unit: g }, note: 原料標示 1條 }
  - { name: 蒜, amount: { value: 2.0, unit: g }, note: 原料標示 2粒 }
  - { name: 薑, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: A.蠔油, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 水, amount: { value: 300.0, unit: g }, note: 原料標示 300㏄ }
  - { name: 糖, amount: { value: 1.0, unit: g }, note: 原料標示 1/2小匙 }
  - { name: 雞粉, amount: { value: 1.0, unit: g }, note: 原料標示 1/2小匙 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: B.醬油, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 太白粉水, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 香油, amount: { value: 100, unit: g }, note: 原料標示 少許 }
steps:
  - text: "牛肉用醃漬料抓勻醃漬約30分鐘，過油撈起備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之蠔油炒牛肉主要材料
  - text: "洋蔥、青椒、紅蘿蔔、辣椒、薑皆洗淨後切片；蒜切末備用。"
  - text: "熱一油鍋，倒1大匙油爆香蒜末、洋蔥片，加入調味料A拌勻。"
  - text: "煮開後先放入青椒片、紅蘿蔔片，待湯續滾至開後再加入醬油、作法1的牛肉片拌炒後，加入太白粉水勾芡。"
  - text: "作法4起鍋前淋上香油拌勻，後盛於白飯盤上即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味蠔油炒牛肉
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之蠔油炒牛肉各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
