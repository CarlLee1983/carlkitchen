title: 蝦仁炒蛋
summary: 蝦仁先汆燙，再拌入加了香油與蔥花的蛋液，快速翻炒成鬆軟蛋塊。
servings: 4
category: 非湯料理
dishKinds: [seafood, egg-bean]
classificationReason: 蝦仁 340 g 拌入八顆雞蛋炒成鬆軟蛋塊，蝦仁與炒蛋共同構成成品。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 45
tags:
  - 家常菜
ingredients:
  - name: 蝦仁
    amount:
      value: 340
      unit: g
    note: 已去殼、去腸泥
  - name: 雞蛋
    amount:
      value: 8
      unit: 顆
    note: 大顆，烹煮前先取出回溫
  - name: 青蔥
    amount:
      value: 2
      unit: 支
    note: 切成蔥花，留少許起鍋後使用
  - name: 水
    amount:
      value: 720
      unit: ml
    note: 汆燙用；原量約 3 杯，以每杯約 240 ml 換算
    group: 調味
  - name: 鹽
    amount:
      value: 2.5
      unit: ml
    note: 1/2 茶匙
    group: 調味
  - name: 白胡椒粉
    amount:
      value: 0.625
      unit: ml
    note: 1/8 茶匙
    group: 調味
  - name: 香油
    amount:
      value: 5
      unit: ml
    note: 1 茶匙
    group: 調味
  - name: 芥花油
    amount:
      value: 60
      unit: ml
    note: 原量 1/4 杯，以每杯約 240 ml 換算
    group: 調味
steps:
  - text: 提前取出雞蛋回溫，清洗蝦仁。青蔥切成蔥花並留少許；打散雞蛋，拌入鹽、白胡椒粉、香油與其餘青蔥。
    image:
      src: ./step-1.webp
      alt: 素色瓷碗裡是混有蔥花的黃色蛋液，旁邊分放灰色生蝦仁和預留蔥花，木砧板上放著菜刀
  - text: 把水煮滾，放蝦仁汆燙至表面轉粉紅，撈出沖洗、瀝水，再趁溫熱拌入蛋液。
    image:
      src: ./step-2.webp
      alt: 素色瓷碗中的黃色蛋液混有蔥花和粉紅色蝦仁，旁邊是不鏽鋼瀝水籃
  - text: 用大火把炒鍋加熱到快冒煙，倒入芥花油並轉動鍋子，讓油鋪滿鍋面。
  - text: 倒入混合蝦仁的蛋液，輕柔而快速地翻折，避免將蛋炒到焦褐。
    image:
      src: ./step-4.webp
      alt: 深灰色炒鍋裡的黃色蛋液開始凝成蛋塊，混有粉紅色蝦仁與蔥花，一把木鏟伸入鍋中
  - text: 炒至蛋看起來熟了即可盛盤，撒上預留青蔥，避免過熟。
    image:
      src: ./step-5.webp
      alt: 深灰色炒鍋裡盛著凝固的黃色蛋塊、粉紅白色蝦仁與綠色蔥花
tip: 雞蛋先取出回溫，炒鍋與油加熱後快速翻折蛋液；蛋看起來熟了就盛盤，避免過熟。
