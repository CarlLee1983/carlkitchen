title: 鹹蛋蒸肉餅
summary: 依核准食譜指南製作之經典家常鹹蛋蒸肉餅，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: "調味豬絞肉鑲入鹹蛋黃蒸熟多汁鹹香，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 25
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 豬絞肉, amount: { value: 300.0, unit: g }, note: 原料標示 300公克 }
  - { name: 鹹蛋, amount: { value: 2.0, unit: g }, note: 原料標示 2顆 }
  - { name: 蒜末, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 蔥末, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 蔥花, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 蠔油, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 米酒, amount: { value: 2.0, unit: g }, note: 原料標示 2大匙 }
  - { name: 糖, amount: { value: 1.0, unit: g }, note: 原料標示 1/4小匙 }
  - { name: 雞粉, amount: { value: 1.0, unit: g }, note: 原料標示 1/4小匙 }
steps:
  - text: "鹹蛋去殼後，留一顆蛋黃不切，其餘的蛋白跟蛋黃切碎備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之鹹蛋蒸肉餅主要材料
  - text: "將豬絞肉、作法1的鹹蛋碎、蒜末、蔥末及所有調味料混合拌勻備用。"
  - text: "將作法2的肉餡填入碗中，再將作法1保留的完整蛋黃放置上面，放入蒸籠內蒸約15分鐘後，取出撒上蔥花或香菜即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味鹹蛋蒸肉餅
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之鹹蛋蒸肉餅各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
