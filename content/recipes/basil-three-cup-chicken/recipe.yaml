title: 塔香三杯雞
summary: 依核准食譜指南製作之經典家常塔香三杯雞，風味道地鮮明。
servings: 4
category: 非湯料理
dishKinds: [meat]
classificationReason: "雞肉以三杯醬汁燜煮收汁灑滿九層塔，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 30
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 棒棒腿, amount: { value: 100, unit: g }, note: 原料標示 2隻 }
  - { name: 薑, amount: { value: 100, unit: g }, note: 原料標示 50公克 }
  - { name: 蒜仁, amount: { value: 100, unit: g }, note: 原料標示 20公克 }
  - { name: 九層塔, amount: { value: 100, unit: g }, note: 原料標示 15公克 }
  - { name: 辣椒, amount: { value: 100, unit: g }, note: 原料標示 1/4條 }
  - { name: 醬油膏, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 2茶匙 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 3大匙 }
steps:
  - text: "薑去皮切片；蒜仁削去兩邊尖端；辣椒去籽切片；九層塔摘去老梗、洗淨，備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的塔香三杯雞主要材料
  - text: "棒棒腿剁塊，洗去血水，備用。"
  - text: "熱鍋，加入2大匙沙拉油，放入蒜仁、薑片以小火炸至金黃，再加入作法2的雞腿塊以中火煎至兩面略焦黃。"
  - text: "於作法3的鍋中加入所有調味料，用中火炒約2分鐘後，轉小火、蓋上鍋蓋，燜煮約5分鐘（中途須開蓋翻炒二次），起鍋前再加入九層塔、辣椒片，以大火炒至九層塔軟即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味塔香三杯雞
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之塔香三杯雞各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
