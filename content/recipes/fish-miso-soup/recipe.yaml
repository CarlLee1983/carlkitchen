tip: 味噌千萬不可在高溫沸水中久煮，以免天然酵母香氣揮發變酸苦；將魚肉與豆腐煮熟後熄微火，透過濾網在湯中輕輕攪散融化味噌，最能保留味噌香醇豆香。
