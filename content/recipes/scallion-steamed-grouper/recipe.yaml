tip: 蒸魚務必水大滾後再入蒸鍋，全程大火鎖住魚肉水分；蒸好後倒除盤底多餘腥水，鋪上細蔥絲後澆淋滾燙熱油，才能瞬間激發出極致甘香的清蔥香氣。
