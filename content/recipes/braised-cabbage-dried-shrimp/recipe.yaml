steps:
  - text: 大白菜洗淨切成大片；蝦米與乾香菇分別以清水泡軟，香菇切成細絲備用。
    image:
      src: ./step-1.webp
      alt: 大白菜洗淨切成大片；蝦米與乾香菇分別以清水泡軟，香菇切成細絲備用。
  - text: 熱鍋倒入適量油，放入蝦米與香菇絲以中火爆香至香氣四溢。
  - text: 倒入大白菜大火翻炒均勻，注入高湯煮沸，轉中小火煨煮至白菜軟爛入味。
    image:
      src: ./step-3.webp
      alt: 倒入大白菜大火翻炒均勻，注入高湯煮沸，轉中小火煨煮至白菜軟爛入味。
  - text: 加入鹽調味，淋入太白粉水勾薄芡，起鍋前均勻淋上香油即可盛盤。
