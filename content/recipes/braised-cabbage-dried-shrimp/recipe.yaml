title: 開陽白菜
summary: 金黃蝦米與乾香菇絲入鍋爆香，投入清脆鮮甜大白菜慢火煨煮至軟透吸飽高湯，調入鹽巴與香油勾薄芡，湯汁清甜濃鮮、白菜軟嫩順口，經典江浙家常名菜。
servings: 4
category: 非湯料理
draft: false
mealCandidate: true
