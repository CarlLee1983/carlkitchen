title: 日式咖哩雞
summary: 雞胸肉與洋蔥、紅蘿蔔、馬鈴薯一起煮，最後用咖哩塊和咖哩粉收成濃稠醬汁。
servings: 4
category: 非湯料理
draft: true
mealCandidate: true
vegetable: true
protein: true
timeMinutes: 30
tags: [雞肉, 咖哩, 馬鈴薯]
ingredients:
  - { name: 雞胸肉, amount: { value: 1, unit: 塊 }, note: 來源未提供重量，切丁 }
  - { name: 洋蔥, amount: { value: 0.5, unit: 顆 }, note: 切丁 }
  - { name: 紅蘿蔔, amount: { value: 0.5, unit: 根 }, note: 切丁 }
  - { name: 馬鈴薯, amount: { value: 0.5, unit: 顆 }, note: 切丁 }
  - { name: 蒜頭, amount: { value: 3, unit: 瓣 }, note: 切末 }
  - {
      name: 咖哩塊,
      amount: { value: 2, unit: 磚 },
      note: 來源未提供每磚重量,
      group: 調味,
    }
  - { name: 咖哩粉, amount: { value: 3, unit: 大匙 }, group: 調味 }
  - {
      name: 水,
      amount: { value: 500, unit: ml },
      note: 來源標示約 500 ml,
      group: 調味,
    }
  - { name: 食用油, note: 來源未提供用量，炒料用, group: 調味 }
steps:
  - text: 雞胸肉、洋蔥、紅蘿蔔和馬鈴薯切丁，蒜頭切末。
    image:
      src: ./step-1.webp
      alt: 木砧板上分開放著雞胸肉丁、洋蔥丁、紅蘿蔔丁、馬鈴薯丁與蒜末
  - text: 鍋中加熱食用油，炒雞胸肉至變白後盛起。
    image:
      src: ./step-2.webp
      alt: 炒鍋裡的雞胸肉丁已由粉紅色轉為白色
  - text: 原鍋炒洋蔥和蒜頭，至洋蔥呈半透明，再加入紅蘿蔔與馬鈴薯略炒。
  - text: 倒入約 500 ml 水，以中火煮約 10 分鐘。
  - text: 加入掰開的咖哩塊與咖哩粉，攪拌至融開，放回雞胸肉。蓋上鍋蓋煮約 5 分鐘，至咖哩變稠。
    image:
      src: ./step-5.webp
      alt: 炒鍋裡的雞胸肉丁、洋蔥、紅蘿蔔與馬鈴薯裹著濃稠的咖哩醬
hero:
  src: ./hero.webp
  alt: 米白色深陶盤盛著咖哩雞胸肉丁、馬鈴薯、紅蘿蔔與洋蔥，表面覆著濃稠醬汁
ingredientsPhoto:
  src: ./ingredients.webp
