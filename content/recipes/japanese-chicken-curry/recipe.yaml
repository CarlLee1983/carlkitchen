title: 日式咖哩雞
summary: 雞胸肉搭配洋蔥、紅蘿蔔與馬鈴薯，加咖哩塊和咖哩粉煮成濃稠醬汁。
servings: 4
category: 非湯料理
dishKinds: [vegetable, meat]
classificationReason: 雞胸肉與紅蘿蔔、馬鈴薯都切丁，根莖先煮熟再與雞丁合燴，肉丁與根莖丁共同構成咖哩本體。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 30
tags: [雞肉, 咖哩, 馬鈴薯]
ingredients:
  - { name: 雞胸肉, amount: { value: 1, unit: 塊 }, note: 來源未提供重量，切丁 }
  - { name: 洋蔥, amount: { value: 0.5, unit: 顆 }, note: 切丁 }
  - { name: 紅蘿蔔, amount: { value: 0.5, unit: 根 }, note: 切丁 }
  - { name: 馬鈴薯, amount: { value: 0.5, unit: 顆 }, note: 切丁 }
  - { name: 蒜頭, amount: { value: 3, unit: 瓣 }, note: 切末 }
  - {
      name: 咖哩塊,
      amount: { value: 2, unit: 磚 },
      note: 來源未提供每磚重量,
      group: 調味,
    }
  - {
      name: 咖哩粉,
      amount: { value: 3, unit: 大匙 },
      note: 來源以湯匙計量，未提供重量,
      group: 調味,
    }
  - {
      name: 水,
      amount: { value: 500, unit: ml },
      note: 來源標示約 500 ml,
      group: 調味,
    }
  - { name: 食用油, note: 來源未提供用量，炒料用, group: 調味 }
steps:
  - text: 把洋蔥、紅蘿蔔、馬鈴薯與雞胸肉切成丁，蒜頭另切成末。
    image:
      src: ./step-1.webp
      alt: 木砧板上分開堆著生雞胸肉丁、洋蔥丁、紅蘿蔔丁、馬鈴薯丁與蒜頭末，旁邊放著菜刀
  - text: 熱炒雞胸肉，等肉塊轉白後先盛出。
    image:
      src: ./step-2.webp
      alt: 表面轉白的雞胸肉丁已盛在米白色瓷碗裡
  - text: 留用原鍋，先炒洋蔥、蒜頭至洋蔥半透明，再加紅蘿蔔與馬鈴薯，用食用油略炒。
  - text: 倒入約 500 ml 的水，中火續煮約 10 分鐘。
  - text: 把咖哩塊掰開，和咖哩粉放進鍋裡溶開，再放回雞胸肉。蓋鍋煮 5 分鐘，煮到醬汁濃稠。
    image:
      src: ./step-5.webp
      alt: 炒鍋裡的雞胸肉丁、紅蘿蔔丁、馬鈴薯丁與洋蔥丁裹著濃稠咖哩醬
tip: 想調整稠度時，可將咖哩塊分次加入；用量越多，醬汁越稠。
hero:
  src: ./hero.webp
  alt: 米白色深盤裡的雞胸肉丁、馬鈴薯丁、紅蘿蔔丁與洋蔥丁覆著濃稠咖哩醬
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 一塊雞胸肉、半顆洋蔥、半根紅蘿蔔、半顆馬鈴薯、三瓣蒜頭，旁邊分裝兩磚咖哩塊、咖哩粉、水與食用油
