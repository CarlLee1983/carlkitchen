title: 苦瓜炒鹹蛋
summary: 依核准食譜指南製作之經典家常苦瓜炒鹹蛋，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [vegetable]
classificationReason: "薄片苦瓜汆燙後與鹹蛋黃碎末大火翻炒均勻，蔬菜主角。"
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 15
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 苦瓜, amount: { value: 1.0, unit: g }, note: 原料標示 1條 }
  - { name: 鹹蛋, amount: { value: 1.0, unit: g }, note: 原料標示 1顆 }
  - { name: 紅辣椒片, amount: { value: 1.0, unit: g }, note: 原料標示 1支 }
  - { name: 蒜末, amount: { value: 2.0, unit: g }, note: 原料標示 2顆 }
  - { name: 沙拉油, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 水, amount: { value: 100.0, unit: g }, note: 原料標示 100㏄ }
  - { name: 米酒, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 少許 }
steps:
  - text: "苦瓜洗淨瀝乾，縱切剖開去籽，切成1公分的小塊狀，放入滾沸水中汆燙至稍稍變軟，撈起瀝乾備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之苦瓜炒鹹蛋主要材料
  - text: "鹹蛋去殼，將蛋白（不要捏的過碎）、蛋黃捏碎備用。"
  - text: "熱鍋，加入適量沙拉油後，放入蒜末爆香，加入紅辣椒片、作法1的苦瓜塊、作法2的鹹蛋碎末和調味料拌炒均勻即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味苦瓜炒鹹蛋
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之苦瓜炒鹹蛋各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
