steps:
  - text: 板豆腐洗淨切成均勻厚方塊，以廚房紙巾擦乾表面水分；九層塔洗淨瀝乾備用。
    image:
      src: ./step-1.webp
      alt: 板豆腐洗淨切成均勻厚方塊，以廚房紙巾擦乾表面水分；九層塔洗淨瀝乾備用。
  - text: 熱油鍋至 180 度，放入板豆腐塊炸至外皮金黃酥脆硬挺，撈起瀝乾油分。
    image:
      src: ./step-2.webp
      alt: 熱油鍋至 180 度，放入板豆腐塊炸至外皮金黃酥脆硬挺，撈起瀝乾油分。
  - text: 原鍋擦淨倒入麻油，放入薑片與蒜頭以小火煸香至表面微焦黃捲曲，再放入辣椒片翻炒。
  - text: 放入炸好的板豆腐塊，加入醬油、醬油膏、糖與米酒，大火收汁翻炒至醬汁濃稠緊裹豆腐，最後放入九層塔炒至飄香即可起鍋盛盤。
