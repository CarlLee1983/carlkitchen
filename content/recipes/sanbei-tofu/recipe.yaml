title: 三杯豆腐
summary: 扎實板豆腐切塊油炸至表面金黃焦脆，以黑麻油煸香薑片與整粒蒜頭，放入炸豆腐塊與辣椒片，淋入醬油、醬油膏、糖與米酒大火收汁裹滿濃醬，起鍋撒入鮮綠九層塔翻炒，外酥內嫩、醬香撲鼻。
