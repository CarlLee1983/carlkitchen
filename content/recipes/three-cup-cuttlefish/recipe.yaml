steps:
  - text: 中卷洗淨去除內臟軟骨，切成約 1.5 公分寬的圈狀；老薑切片；辣椒切斜片；九層塔洗淨摘葉備用。
    image:
      src: ./step-1.webp
      alt: 中卷洗淨去除內臟軟骨，切成約 1.5 公分寬的圈狀；老薑切片；辣椒切斜片；九層塔洗淨摘葉備用。
  - text: 熱炒鍋倒入胡麻油，以小火將蒜仁煎至金黃微焦，再放入薑片煸炒至邊緣捲曲飄香。
  - text: 轉大火放入中卷圈、辣椒片，淋入醬油膏、白砂糖與米酒，大火翻炒慢燒至濃稠醬汁緊緊裹附中卷表面。
    image:
      src: ./step-3.webp
      alt: 轉大火放入中卷圈、辣椒片，淋入醬油膏、白砂糖與米酒，大火翻炒慢燒至濃稠醬汁緊緊裹附中卷表面。
  - text: 起鍋前沿鍋邊淋入烏醋嗆香，撒入九層塔葉大火翻拌兩下即可熄火盛盤。
