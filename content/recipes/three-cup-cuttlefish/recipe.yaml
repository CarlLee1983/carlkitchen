title: 三杯中卷
summary: 中卷切圈大火汆燙定型，黑麻油煸透老薑片與整粒金黃蒜仁，投入中卷圈、紅辣椒與醬油膏、米酒、白砂糖慢火收汁，起鍋淋上烏醋與鮮綠九層塔大火翻勻，鹹香濃烈、鮮脆彈牙。
