steps:
  - text: 米血糕切成約 1 公分厚塊或厚片狀；紅辣椒切片；香菜洗淨切長段備用。
    image:
      src: ./step-1.webp
      alt: 米血糕切成約 1 公分厚塊或厚片狀；紅辣椒切片；香菜洗淨切長段備用。
  - text: 熱平底鍋倒入少許油，放入米血糕塊以中小火雙面煎煎各約 2 分鐘至外皮微軟微香後盛出。
  - text: 原鍋補少許油放入辣椒片炒香，加入沙茶醬、醬油、糖與水煮滾成濃郁沙茶醬汁，倒回米血糕轉小火蓋鍋蓋煨煮約 3 分鐘至米血糕充分吸汁軟Q。
    image:
      src: ./step-3.webp
      alt: 原鍋補少許油放入辣椒片炒香，加入沙茶醬、醬油、糖與水煮滾成濃郁沙茶醬汁，倒回米血糕轉小火蓋鍋蓋煨煮約
  - text: 開蓋大火收濃湯汁，熄火撒入香菜段與花生粉快速翻拌均勻即可盛盤趁熱享用。
