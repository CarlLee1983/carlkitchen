title: 沙茶炒米血糕
summary: 傳統米血糕切厚長條先煎軟定型，熱鍋爆香紅辣椒片與少許蒜碎，倒入經典香濃沙茶醬、醬油與清水小火燜煨至米血糕吸飽醬汁軟Q入味，起鍋前投入新鮮香菜段與花生粉快速翻勻，鹹香濃郁、Q彈有嚼勁、道地熱炒風味。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: 以米血糕為主要肉類主角，搭配沙茶醬慢火煨炒，屬於肉類家常熱炒料理。
