title: 紅糟炒海瓜子
summary: 依核准食譜指南製作之經典家常紅糟炒海瓜子，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: "紅糟醬汁快炒海瓜子，海鮮主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 海瓜子, amount: { value: 100, unit: g }, note: 原料標示 400公克 }
  - { name: 蔥絲, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 薑絲, amount: { value: 100, unit: g }, note: 原料標示 15公克 }
  - { name: 蒜末, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 辣椒片, amount: { value: 100, unit: g }, note: 原料標示 15公克 }
  - { name: 紅糟醬, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 九層塔, amount: { value: 100, unit: g }, note: 原料標示 30公克 }
  - { name: 醬油, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 雞粉, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 1/2小匙 }
steps:
  - text: "海瓜子泡水吐沙，再洗淨備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的紅糟炒海瓜子主要材料
  - text: "熱鍋，加入2大匙沙拉油，再放入蔥絲、薑絲、蒜末、辣椒片爆香，續加入紅糟醬炒香。" 
  - text: "於作法2的鍋中續加入作法1的海瓜子，炒至微開後加入所有調味料，接著放入九層塔快速拌炒均勻，至入味即可。" 
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味紅糟炒海瓜子
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之紅糟炒海瓜子各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
