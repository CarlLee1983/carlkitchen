title: 蔥燒豆腐
summary: 依核准食譜指南製作之經典家常蔥燒豆腐，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: "板豆腐煎至金黃後與青蔥段同燒入味，蛋豆主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 黑豆腐, amount: { value: 2.0, unit: g }, note: 原料標示 2塊 }
  - { name: 香菇, amount: { value: 3.0, unit: g }, note: 原料標示 3朵 }
  - { name: 紅蘿蔔, amount: { value: 20.0, unit: g }, note: 原料標示 20公克 }
  - { name: 青蔥, amount: { value: 3.0, unit: g }, note: 原料標示 3支 }
  - { name: 沙拉油, amount: { value: 2.0, unit: g }, note: 原料標示 2大匙 }
  - { name: 高湯, amount: { value: 150.0, unit: g }, note: 原料標示 150㏄ }
  - { name: 醬油, amount: { value: 3.0, unit: g }, note: 原料標示 3大匙 }
  - { name: 冰糖, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 米酒, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 香油, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
steps:
  - text: "黑豆腐切塊，放入熱油鍋中以中火炸至定型，撈出瀝油備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之蔥燒豆腐主要材料
  - text: "香菇以冷水泡軟後，切片；紅蘿蔔切片；青蔥切段備用。。"
  - text: "取一鍋，熱鍋後放入2大匙沙拉油燒熱，先放入作法2的蔥白爆香，接著放入作法的香菇片與紅蘿蔔片炒香後,加入高湯及醬油、冰糖和米酒拌勻。"
  - text: "於作法3的鍋中放入作法1的黑豆腐塊，以小火煮約5分鐘，再放入蔥尾煮一下立即熄火，最後淋上香油即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味蔥燒豆腐
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之蔥燒豆腐各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
