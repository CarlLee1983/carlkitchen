title: 四川擔擔麵
summary: 手工細麵條滾水煮至筋道彈牙，小白菜輕燙翠綠，碗底調入香濃芝麻醬、鎮江香醋、紅油辣椒與花椒粉，淋上細麵拌勻，撒上花生碎與蔥花，麻辣鮮香、濃醇開胃。
servings: 2
category: 主食
dishKinds: []
classificationReason: 主食不設料理主角與配餐角色，以煮麵條拌入芝麻醬、辣油與花生蔥花為獨立主餐。
