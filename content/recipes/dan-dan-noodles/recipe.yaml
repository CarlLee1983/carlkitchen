steps:
  - text: 芝麻醬倒入大碗中，加入少許溫水慢慢化開調成滑順糊狀，再加入鎮江醋、醬油、辣椒油、花椒粉與糖充分調勻成擔擔麵底醬。
    image:
      src: ./step-1.webp
      alt: 芝麻醬倒入大碗中，加入少許溫水慢慢化開調成滑順糊狀，再加入鎮江醋、醬油、辣椒油、花椒粉與糖充分調勻成
  - text: 煮一鍋滾水，放入細麵條以中小火煮約 1 分半鐘至熟透帶有咬勁，撈出瀝乾水分放入麵碗中。
    image:
      src: ./step-2.webp
      alt: 煮一鍋滾水，放入細麵條以中小火煮約 1 分半鐘至熟透帶有咬勁，撈出瀝乾水分放入麵碗中。
  - text: 同鍋滾水放入小白菜汆燙 20 秒撈起鋪在麵條上，澆入擔擔麵底醬，撒上大量花生碎與青蔥花即可上桌拌勻享用。
