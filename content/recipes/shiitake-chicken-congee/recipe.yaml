title: 香菇雞肉粥
summary: 用熟白飯煮成濃稠的粥，加入炒過的乾香菇與雞腿肉，最後以青蔥和白胡椒粉調味。
servings: 4
category: 主食
draft: false
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 65
tags: [家常菜]
ingredients:
  - name: 乾香菇
    amount: { value: 10, unit: 朵 }
    note: 中小型，泡軟後切細條
  - name: 雞腿肉
    amount: { value: 2, unit: 大塊 }
    note: 去皮、去除筋與碎骨後切成一口大小；大小不同，重量會有差異
  - name: 青蔥
    amount: { value: 2, unit: 支 }
    note: 切成蔥粒
  - name: 白飯
    amount: { value: 1.5, unit: 米杯 }
    note: 煮熟後量取，不是生米；米杯容量不同，用量會有差異
  - name: 熱水
    amount: { value: 500, unit: ml }
    note: 泡乾香菇用，泡過的水留著煮粥
    group: 調味
  - name: 冷開水
    amount: { value: 700, unit: ml }
    group: 調味
  - name: 醬油
    amount: { value: 10, unit: ml }
    group: 調味
  - name: 食用油
    note: 適量，炒乾香菇用；來源未標明用量
    group: 調味
  - name: 鹽
    note: 適量
    group: 調味
  - name: 白胡椒粉
    note: 適量
    group: 調味
steps:
  - text: 洗去乾香菇上的雜質，用熱水浸泡至軟後切細條，泡過的水留用。青蔥切成蔥粒。
    image:
      src: ./step-1.webp
      alt: 木砧板上分開放著泡軟切條的乾香菇與蔥粒，旁邊有一碗褐色香菇水和一把菜刀
  - text: 去除雞腿肉的皮、筋與碎骨，用廚房紙巾吸乾，再切成一口大小的塊狀。
    image:
      src: ./step-2.webp
      alt: 木砧板上放著切成一口大小、已去皮去骨的生雞腿肉塊，右側有一把菜刀
  - text: 熱鍋後倒入食用油，放入泡軟切條的乾香菇炒出香味。
    image:
      src: ./step-3.webp
      alt: 灰色雙耳鍋裡放著正在用少量油拌炒的香菇細條，鍋底仍可看見
  - text: 加入雞腿肉翻炒，接著倒入醬油，炒到雞腿肉表面變色。
    image:
      src: ./step-4.webp
      alt: 灰色雙耳鍋中，雞腿肉塊表面已轉為淺色，和香菇細條一起沾著淡褐色醬汁
  - text: 倒入泡乾香菇的水和冷開水，煮滾後加鹽調味。
  - text: 加入白飯，等粥重新煮滾後繼續煮 15 分鐘。
  - text: 轉中小火續煮至粥湯濃稠，用食物溫度計確認雞腿肉中心達 74°C；不足時繼續加熱。
    image:
      src: ./step-7.webp
      alt: 灰色雙耳鍋裡的白飯已煮成濃稠米粥，粥中可見雞腿肉塊與香菇細條，尚未加入青蔥
  - text: 用鹽調整味道，拌入青蔥後關火，讓餘熱燜熟青蔥，撒上白胡椒粉。
hero:
  src: ./hero.webp
  alt: 灰色雙耳鍋中盛著濃稠的香菇雞肉粥，米粥裡有雞腿肉塊、香菇細條和綠色蔥粒
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 十朵乾香菇、兩大塊帶皮生雞腿肉、兩支青蔥、一碗熟白飯，以及兩壺水、小碟醬油、一瓶食用油和分裝的鹽與白胡椒粉
tip: 雞腿肉和乾香菇的大小、米杯容量不同，用量會有差異，水量可依喜歡的稠度調整。總時間為含泡香菇的推估，泡軟與煮稠所需時間會影響實際耗時。
