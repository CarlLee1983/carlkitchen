steps:
  - text: "取一炒鍋，在鍋中加入少許的沙拉油，以小火爆香蝦米後，加入水以大火煮滾。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的莧菜吻仔魚羹主要材料
  - text: "將莧菜、吻仔魚加入在作法1的材料中，以中火煮滾後加入所有的調味料，再加入太白粉水芶芡，起鍋前淋少許香油即可。" 
