steps:
  - text: 鱈魚洗淨用廚房紙巾徹底擦乾水分，雙面抹上米酒與少許鹽，放上耐熱蒸盤備用；青蔥切蔥花、大蒜切末備用。
    image:
      src: ./step-1.webp
      alt: 鱈魚洗淨用廚房紙巾徹底擦乾水分，雙面抹上米酒與少許鹽，放上耐熱蒸盤備用；青蔥切蔥花、大蒜切末備用。
  - text: 蒸鍋水煮沸，放入鱈魚大火蒸約 10 至 12 分鐘至魚肉熟透，取出倒出多餘蒸魚水分備用。
  - text: 另起一小鍋倒入沙拉油燒微溫，放入蒜末、蔥花與豆酥，以極小火慢慢煸炒約 2 分鐘至豆酥冒細泡、轉金黃酥脆，加入醬油與糖快速拌勻關火。
    image:
      src: ./step-3.webp
      alt: 另起一小鍋倒入沙拉油燒微溫，放入蒜末、蔥花與豆酥，以極小火慢慢煸炒約 2 分鐘至豆酥冒細泡、轉金黃酥
  - text: 將炒得滾燙酥脆的豆酥醬汁均勻淋在清蒸鱈魚表面，撒上少許新鮮蔥花點綴即可上桌。
