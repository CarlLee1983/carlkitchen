title: 豆酥鱈魚
summary: 厚切鱈魚抹少許鹽與米酒清蒸熟透，保留鮮甜原汁，取小鍋以溫油將特製豆酥、蒜末與蔥花小火慢炒至酥脆金黃、香氣四溢，調入少許醬油與糖，趁熱均勻淋在白嫩鱈魚排上，酥脆鹹香與細嫩魚肉完美交融。
servings: 2
category: 非湯料理
dishKinds: [seafood]
classificationReason: 以整片厚切鱈魚清蒸為唯一海鮮主角，淋上炒酥豆酥，屬於海鮮類料理。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [川菜, 家常菜, 鱈魚, 豆酥, 海鮮]
aliases: [香酥豆酥鱈魚, 經典豆酥鱈魚]
ingredients:
  - name: 厚切鱈魚
    amount:
      value: 1
      unit: 片
    note: 約 300 g 扁鱈或大比目魚
  - name: 豆酥
    amount:
      value: 30
      unit: g
    note: 黃豆酥顆粒
  - name: 青蔥
    amount:
      value: 15
      unit: g
    note: 切細蔥花
  - name: 蒜頭
    amount:
      value: 15
      unit: g
    note: 切細蒜末
  - name: 米酒
    amount:
