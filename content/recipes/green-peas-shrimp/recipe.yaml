title: 青豆蝦仁
summary: 鮮蝦去殼後蝦頭煉出濃郁蝦汁，蝦仁略炒盛起，青豆以蝦汁煨煮至軟甜後與蝦仁、蔥綠拌炒。清爽鮮脆、蝦香四溢。
servings: 4
category: 非湯料理
dishKinds: [vegetable, seafood]
classificationReason: 300 g 整蝦取仁與 150 g 青豆各自炒煮後合拌，青豆吸收蝦汁且蝦仁保留為主要食用料。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [家常菜]
aliases: [青豆炒蝦仁]
ingredients:
  - {
      name: 新鮮蝦子,
      amount: { value: 300, unit: g },
      note: 剝殼取蝦仁，保留蝦頭煉蝦汁,
    }
  - { name: 青豆, amount: { value: 150, unit: g }, note: 青豆仁 }
  - { name: 青蔥, amount: { value: 1, unit: 支 }, note: 蔥白、蔥綠分開切段 }
  - { name: 薑末, amount: { value: 5, unit: g }, note: 約 1 茶匙, group: 調味 }
  - {
      name: 鹽,
      amount: { value: 5, unit: g },
      note: 約 1 茶匙醃蝦仁；起鍋另備少許調味,
      group: 調味,
    }
  - {
      name: 米酒,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，醃蝦仁用,
      group: 調味,
    }
  - {
      name: 太白粉,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，醃蝦仁用,
      group: 調味,
    }
  - { name: 水, amount: { value: 150, unit: ml }, note: 煮蝦汁用, group: 調味 }
  - {
      name: 食用油,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，炒蝦仁、蝦頭與青豆用,
      group: 調味,
    }
steps:
  - text: 新鮮蝦子剝殼洗淨並吸乾水分，蝦頭保留備用；蝦仁加入鹽、米酒與太白粉抓勻醃漬。
  - text: 熱鍋倒入少許食用油，放入醃好的蝦仁快速翻炒至轉為粉紅變色，立刻盛起備用。
  - text: 原鍋補少許食用油，下蝦頭翻炒至通體轉紅並釋出橘紅蝦油，倒入水滾煮 2 分鐘，濾出濃郁蝦汁備用。
    image:
      src: ./step-3.webp
      alt: 平底鍋中蝦頭大火煸炒至通紅並注入清水滾煮煉出橙紅蝦汁
  - text: 鍋中加少許食用油，下蔥白與薑末爆出香氣，加入青豆翻炒，倒入蝦汁蓋上鍋蓋燜煮至青豆軟熟。
    image:
      src: ./step-4.webp
      alt: 平底鍋中蔥白、薑末與翠綠青豆在橙色蝦汁中燜煮冒出熱氣
  - text: 倒回炒好的蝦仁與蔥綠大火翻炒均勻，撒少許鹽調味即可起鍋盛盤。
hero:
  src: ./hero.webp
  alt: 白色圓瓷淺盤盛著油亮鮮嫩的粉紅蝦仁與翠綠青豆，表面帶有清亮芡汁光澤
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 木砧板上分開排著去殼生蝦仁、生蝦頭、翠綠青豆、蔥白段、蔥綠段與薑末，下方小碟分裝鹽、米酒和太白粉
tip: 蝦頭煸香後加水滾煮能煉出鮮味濃郁的天然蝦汁，用來煨煮青豆可讓整道菜鮮甜加倍。
