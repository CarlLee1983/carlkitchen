steps:
  - text: 四季豆洗淨摘除頭尾兩端並順勢撕去兩側粗硬老筋，折成 5 公分長段吸乾水氣；大蒜去皮切粗粒蒜碎、紅辣椒切小圈末備用。
    image:
      src: ./step-1.webp
      alt: 四季豆洗淨摘除頭尾兩端並順勢撕去兩側粗硬老筋，折成 5 公分長段吸乾水氣；大蒜去皮切粗粒蒜碎、紅辣椒
  - text: 炒鍋倒入植物油中火加熱，放入四季豆段慢煎煸炒約 3 分鐘，至豆莢表面表皮微起皺褶（虎皮狀）且轉為深翠綠色盛起。
    image:
      src: ./step-2.webp
      alt: 炒鍋倒入植物油中火加熱，放入四季豆段慢煎煸炒約 3 分鐘，至豆莢表面表皮微起皺褶（虎皮狀）且轉為深翠
  - text: 原鍋利用餘油，放入蒜碎與紅辣椒圈中火煸炒出濃郁蒜香，倒回煸好的四季豆段轉大火翻炒均勻。
  - text: 沿鍋邊淋入醬油、細砂糖與白胡椒粉，大火翻炒 20 秒使鹹香醬汁均勻緊裹在四季豆表面，即可熄火盛盤。
