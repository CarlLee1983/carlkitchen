title: 蒜香四季豆
summary: 清脆四季豆撕去兩側粗老硬筋切段，入油鍋半煎半煸至表面起虎皮微焦香，投入大量鮮切蒜末與紅辣椒碎中火煸炒，調入純釀醬油、白胡椒粉與少許細糖快火翻炒收汁，豆莢清甜爽脆、蒜香濃郁撲鼻、經典下飯蔬食。
servings: 3
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 以四季豆為唯一蔬菜主角，佐以大量蒜末大火快炒，屬於純蔬菜料理。
