steps:
  - text: 鱈魚洗淨用紙巾徹底吸乾兩面多餘水分，置於蒸盤中，均勻抹上薄鹽；青蔥切細絲、生薑切細絲、大蒜切薄片、紅辣椒切細絲備用。
    image:
      src: ./step-1.webp
      alt: 鱈魚洗淨用紙巾徹底吸乾兩面多餘水分，置於蒸盤中，均勻抹上薄鹽；青蔥切細絲、生薑切細絲、大蒜切薄片、紅
  - text: 調味碗中將米酒、蠔油與白胡椒粉攪拌均勻成蒸魚醬汁，均勻淋在鱈魚片上，再將薑絲、蒜片與半量蔥絲鋪在魚身上。
  - text: 蒸鍋注水大火燒滾，放入鱈魚盤蓋上鍋蓋大火蒸煮 8 分鐘至魚肉熟透蛋白質凝固（肉質熟透呈蒜瓣狀）。
    image:
      src: ./step-3.webp
      alt: 蒸鍋注水大火燒滾，放入鱈魚盤蓋上鍋蓋大火蒸煮 8 分鐘至魚肉熟透蛋白質凝固（肉質熟透呈蒜瓣狀）。
  - text: 取出鱈魚盤，鋪上剩餘青蔥絲與紅辣椒絲；另起小鍋將香油加熱至微冒熱氣，澆淋在蔥薑絲上熗出濃郁香氣即可上桌。
