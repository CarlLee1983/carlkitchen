tip: 扁鱈解凍後肉質水分較多，蒸之前務必用廚房紙巾徹底吸乾水分，蒸出的魚肉才不會出水過多而沖淡鮮美肉汁；大火蒸八分鐘剛剛好，肉質最為滑嫩如豆花。
