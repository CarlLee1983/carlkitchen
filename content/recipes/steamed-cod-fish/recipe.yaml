title: 清蒸鱈魚
summary: 厚切鮮嫩格陵蘭大扁鱈片吸乾多餘水分置盤，鋪上細嫩薑絲、大蒜片與蔥絲，均勻淋入純釀米酒、淡薄蠔油與白胡椒粉，入蒸鍋或電鍋大火清蒸八分鐘，出鍋淋上燒熱純芝麻香油激發深層辛香，魚肉如凝脂般細緻軟滑、入口即化。
servings: 2
category: 非湯料理
dishKinds: [seafood]
classificationReason: 以厚切鱈魚片清蒸為唯一海鮮主角，佐以蔥薑蒜絲，屬於海鮮類料理。
