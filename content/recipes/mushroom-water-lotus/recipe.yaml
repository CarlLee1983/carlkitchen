title: 香菇炒水蓮
summary: 台灣美濃特產翠綠水蓮洗淨切段，新鮮香菇切細絲，以溫潤葵花油爆香細薑末與紅辣椒絲，投入香菇絲煸炒出菌菇幽香，倒入水蓮段大火狂炒三十秒，加入海鹽與少許米酒熗鍋收汁，水蓮極致脆爽多汁、口口卡滋生響、鮮甜解膩。
servings: 3
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 以美濃水蓮為唯一蔬菜主角，搭配鮮香菇絲清炒，屬於純蔬菜料理。
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 10
tags: [水蓮, 香菇, 熱炒, 家常青菜, 素食友善]
aliases: [清炒水蓮, 美濃炒水蓮]
ingredients:
  - name: 水蓮
    amount:
      value: 250
      unit: g
    note: 洗淨去根部切 6 公分長段
  - name: 鮮香菇
    amount:
      value: 3
      unit: 朵
    note: 洗淨切薄絲
  - name: 生薑
    amount:
      value: 10
      unit: g
    note: 去皮切細薑末
  - name: 紅辣椒
    amount:
      value: 1
      unit: 根
    note: 去籽切細斜絲配色
  - name: 米酒
    amount:
      value: 15
      unit: ml
    note: 熗鍋保翠綠脆嫩
    group: 調味
  - name: 鹽
    amount:
      value: 3
      unit: g
    note: 約半茶匙調味
    group: 調味
  - name: 植物油
    amount:
      value: 25
      unit: ml
    note: 高溫快炒油
    group: 調味
steps:
  - text: 水蓮洗淨去除根部，切成 6 公分均勻長段泡冷水 5 分鐘保持水分瀝乾；鮮香菇切薄絲；生薑切細末；紅辣椒去籽切細絲備用。
    image:
      src: ./step-1.webp
      alt: 水蓮洗淨去除根部，切成 6 公分均勻長段泡冷水 5 分鐘保持水分瀝乾；鮮香菇切薄絲；生薑切細末；紅辣
  - text: 炒鍋加熱倒入植物油，放入薑末與紅辣椒絲中火爆出香氣，加入香菇絲翻炒 1 分鐘煸出濃郁菇香。
    image:
      src: ./step-2.webp
      alt: 炒鍋加熱倒入植物油，放入薑末與紅辣椒絲中火爆出香氣，加入香菇絲翻炒 1 分鐘煸出濃郁菇香。
  - text: 轉大火倒入瀝乾的水蓮段，立刻淋入米酒與鹽，以大火高速翻拋翻炒約 30 秒至水蓮稍變深綠但仍保持挺直爽脆，立即熄火盛盤。
hero:
  src: ./hero.webp
  alt: 盛盤完成的香菇炒水蓮
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 料理食材整齊擺放於木砧板上
tip: 水蓮含水量極高且質地纖細脆弱，切段後泡冷水保水再瀝乾，下鍋務必用大火快速翻炒不超過三十秒，才能完全鎖住咬下去口口卡滋的極致爽脆多汁感。
