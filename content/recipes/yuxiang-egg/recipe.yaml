steps:
  - text: 雞蛋打入大碗中，加入 10 ml 太白粉水攪打均勻備用；大蒜、生薑切細末，黑木耳切細碎丁，青蔥切細蔥花備用。
    image:
      src: ./step-1.webp
      alt: 雞蛋打入大碗中，加入 10 ml 太白粉水攪打均勻備用；大蒜、生薑切細末，黑木耳切細碎丁，青蔥切細蔥
  - text: 炒鍋倒入植物油燒至七分熱，一口氣倒入打勻蛋液，用鍋鏟快速從邊緣往中間推攏，中大火烘煎至兩面膨鬆金黃酥脆，盛入圓盤備用。
    image:
      src: ./step-2.webp
      alt: 炒鍋倒入植物油燒至七分熱，一口氣倒入打勻蛋液，用鍋鏟快速從邊緣往中間推攏，中大火烘煎至兩面膨鬆金黃酥
  - text: 鍋中留少許底油，放入豬絞肉小火煸炒至肉色轉白出油，加入蒜末、薑末與辣豆瓣醬小火炒出紅油香氣。
  - text: 放入黑木耳碎丁、醬油、烏醋、細砂糖與 50 ml 水煮滾，倒入剩餘太白粉水勾芡至濃稠明亮，撒入蔥花，將熱騰騰的魚香肉燥淋在烘蛋上即可盛盤。
