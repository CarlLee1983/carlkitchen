title: 魚香烘蛋
summary: 雞蛋打勻調入太白粉水入熱油鍋高溫烘煎成外酥內嫩金黃厚烘蛋，另起鍋爆香蒜末、薑末與辣豆瓣醬，炒香豬絞肉末、木耳丁與蔥花，調入醬油、烏醋與白糖燴煮成酸甜微辣魚香醬汁澆淋烘蛋上，層次豐富極致下飯。
servings: 3
category: 非湯料理
dishKinds: [egg-bean, meat]
classificationReason: 以雞蛋厚煎烘蛋為主角，淋上豬絞肉與辛香料烹調之經典魚香肉燥醬汁，屬於蛋豆與肉類並陳料理。
