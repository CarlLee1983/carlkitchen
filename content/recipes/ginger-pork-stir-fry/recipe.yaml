title: 薑汁燒肉
summary: 依核准食譜指南製作之經典家常薑汁燒肉，風味道地鮮明。
servings: 2
category: 非湯料理
dishKinds: [meat]
classificationReason: "豬肉薄片以生薑汁與醬油快炒，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣小吃]
ingredients:
  - {
      name: 豬小里肌肉,
      amount: { value: 100, unit: g },
      note: 原料標示 900公克,
    }
  - { name: 薑汁, amount: { value: 100, unit: g }, note: 原料標示 20㏄ }
  - { name: 薑末, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 高麗菜, amount: { value: 100, unit: g }, note: 原料標示 100公克 }
  - { name: 紅蘿蔔絲, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 醬油, amount: { value: 100, unit: g }, note: 原料標示 3大匙 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 3大匙 }
  - { name: 味醂, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 細砂糖, amount: { value: 100, unit: g }, note: 原料標示 1/2小匙 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 白胡椒粉, amount: { value: 100, unit: g }, note: 原料標示 少許 }
steps:
  - text: "高麗菜剝下葉片洗淨，紅蘿蔔洗淨去皮，兩樣均切絲、泡冰水，撈出瀝乾水分，平均放入盤中備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的薑汁燒肉主要材料
  - text: "豬小里肌肉洗淨切片，瀝乾水分後放入大碗中，加入所有調味料拌勻並醃約10分鐘備用。"
  - text: "熱鍋倒入適量沙拉油燒熱，放入薑末小火爆香，放入作法2豬小里肌肉片炒至變色，倒入作法2剩餘的醃汁小火燒煮至略收乾，盛出放在作法1上即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味薑汁燒肉
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之薑汁燒肉各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
