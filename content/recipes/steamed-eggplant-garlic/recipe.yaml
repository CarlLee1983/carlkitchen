title: 蒜泥蒸茄子
summary: 新鮮紫茄切長段蒸熟保持鮮豔亮麗紫色，冰鎮後瀝乾排盤，淋上以現磨蒜泥、薑末、醬油膏、烏醋、香油與紅辣椒末調製的濃香蒜蓉辣醬，茄肉軟綿如酪、蒜辣開胃酸爽。
servings: 2
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 以新鮮紫茄蒸熟為唯一蔬菜主角，佐以蒜泥醬汁，屬於純蔬菜涼拌料理。
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 15
tags: [涼拌, 家常菜, 茄子, 蒜泥]
aliases: [蒜泥茄子, 涼拌蒜泥蒸茄子]
