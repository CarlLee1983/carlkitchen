title: 鮮甜絲瓜麵線
summary: 新鮮絲瓜去皮切厚片，熱油小火煸香嫩薑絲，放入絲瓜大火翻炒燜煮出清甜原汁，注入高湯煮滾，加入白麵線與洗淨吻仔魚同煮至麵線軟熟入味，調入少許鹽，湯鮮甘甜、絲瓜翠綠軟滑、麵線滑順。
servings: 2
category: 主食
dishKinds: []
classificationReason: 主食不設料理主角與配餐角色，以絲瓜燜煮鮮甜湯汁搭配白麵線與吻仔魚為經典台式麵食主餐。
draft: false
mealCandidate: false
