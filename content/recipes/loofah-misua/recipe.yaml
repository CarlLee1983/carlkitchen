steps:
  - text: 絲瓜刨除粗外皮洗淨切成約 1 公分厚片；生薑切細薑絲；吻仔魚輕輕洗淨瀝乾；白麵線過滾水微燙 30 秒撈起泡冷水瀝乾備用。
    image:
      src: ./step-1.webp
      alt: 絲瓜刨除粗外皮洗淨切成約 1 公分厚片；生薑切細薑絲；吻仔魚輕輕洗淨瀝乾；白麵線過滾水微燙 30 秒
  - text: 熱鍋倒入少許油，放入薑絲小火煸炒至出香，加入絲瓜厚片翻炒數下，蓋上鍋蓋小火燜煮 2 分鐘讓絲瓜出水變軟。
    image:
      src: ./step-2.webp
      alt: 熱鍋倒入少許油，放入薑絲小火煸炒至出香，加入絲瓜厚片翻炒數下，蓋上鍋蓋小火燜煮 2 分鐘讓絲瓜出水變
  - text: 注入高湯煮滾，放入處理好的白麵線與吻仔魚拌煮約 1 至 2 分鐘至麵線充分吸收絲瓜甘甜湯汁，調入少許鹽與香油即可熄火盛碗享用。
