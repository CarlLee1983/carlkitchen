title: 芥菜蛤蜊雞湯
summary: 長年芥菜剝開汆燙退苦，土雞塊滾水汆燙洗淨，放入湯鍋注入清水、老薑片與米酒溫火細燉，起鍋前投入新鮮蛤蜊煮至開殼，芥菜清苦回甘、土雞肉質鮮嫩、蛤蜊海味鮮美交織，清潤甘甜。
servings: 4
category: 湯
dishKinds: []
classificationReason: 湯品不設料理主角與配餐角色，以長年芥菜、土雞肉與蛤蜊慢燉成清鮮回甘的經典家常湯品。
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 45
tags: [雞湯, 芥菜, 蛤蜊, 年菜湯品]
aliases: [長年菜雞湯, 芥菜雞湯]
ingredients:
  - name: 土雞肉
    amount:
      value: 400
      unit: g
    note: 剁塊汆燙
  - name: 芥菜
    amount:
      value: 250
      unit: g
    note: 芥菜仁洗淨切大塊
  - name: 蛤蜊
    amount:
      value: 150
      unit: g
    note: 吐沙洗淨提鮮
  - name: 生薑
    amount:
      value: 20
      unit: g
    note: 去皮切薑片
  - name: 水
    amount:
      value: 1000
      unit: ml
    note: 燉湯高湯底
  - name: 米酒
    amount:
      value: 20
      unit: ml
    note: 約 1.5 大匙
    group: 調味
