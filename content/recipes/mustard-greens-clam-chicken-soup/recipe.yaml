tip: 芥菜先以滾水快速汆燙再泡冷水，能有效去除過度苦澀味並保持翡翠般的鮮綠色澤；蛤蜊最後下鍋開殼即關火，湯頭最鮮美且蛤肉飽滿爆汁。
