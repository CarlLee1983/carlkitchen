steps:
  - text: 芥菜仁一片片剝開洗淨切大塊，入滾水中汆燙 30 秒撈起泡冷水去除苦澀味；土雞肉剁塊入沸水汆燙 2 分鐘洗淨瀝乾；蛤蜊吐沙洗淨備用。
    image:
      src: ./step-1.webp
      alt: 芥菜仁一片片剝開洗淨切大塊，入滾水中汆燙 30 秒撈起泡冷水去除苦澀味；土雞肉剁塊入沸水汆燙 2 分
  - text: 取湯鍋注入 1000 ml 水煮滾，放入雞肉塊、薑片與米酒，大火煮沸後撈去浮沫。
  - text: 轉小火蓋上鍋蓋慢燉約 25 分鐘至雞肉軟嫩，開蓋放入處理好的芥菜塊續煮 8 分鐘至芥菜翠綠透熟。
    image:
      src: ./step-3.webp
      alt: 轉小火蓋上鍋蓋慢燉約 25 分鐘至雞肉軟嫩，開蓋放入處理好的芥菜塊續煮 8 分鐘至芥菜翠綠透熟。
  - text: 最後轉中大火加入蛤蜊煮約 1 至 2 分鐘至全數開殼，加入少許鹽調味即可熄火盛入大湯碗趁熱享用。
