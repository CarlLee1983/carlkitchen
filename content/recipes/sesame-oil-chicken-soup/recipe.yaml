steps:
  - text: 土雞剁成均勻塊狀洗淨擦乾水分；老薑洗淨切成薄片備用。
    image:
      src: ./step-1.webp
      alt: 土雞剁成均勻塊狀洗淨擦乾水分；老薑洗淨切成薄片備用。
  - text: 取湯鍋倒入麻油以中小火慢慢爆香老薑片，煸炒至薑片邊緣微乾捲曲並散發濃烈薑香。
    image:
      src: ./step-2.webp
      alt: 取湯鍋倒入麻油以中小火慢慢爆香老薑片，煸炒至薑片邊緣微乾捲曲並散發濃烈薑香。
  - text: 放入土雞塊轉大火翻炒約 2 分鐘，炒至雞皮微焦、表面緊縮鎖住肉汁。
  - text: 倒入米酒煮沸蒸發酒精，加入水、鹽與白砂糖煮滾，轉小火蓋上鍋蓋慢燉 30 分鐘至雞肉軟嫩入味，起鍋前淋入黑麻油即可盛碗。
