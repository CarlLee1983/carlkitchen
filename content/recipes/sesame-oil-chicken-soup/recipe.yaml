title: 麻油雞湯
summary: 鮮嫩土雞剁塊洗淨，黑麻油以溫小火將老薑片煸至邊緣微焦捲曲飄香，倒入雞塊大火翻炒至皮緊封汁，注入米酒與清水慢火燉煮 30 分鐘至雞肉軟嫩脫骨、湯頭金黃甘醇，起鍋前淋入黑麻油提香，冬令溫補極品。
servings: 4
category: 湯
dishKinds: []
classificationReason: 土雞與老薑加入米酒及 800 ml 水慢燉成湯，沿用湯類且不分配非湯主角與組餐菜位。
