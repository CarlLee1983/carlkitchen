steps:
  - text: 海帶絲以清水漂洗去除泥沙，剪成約 10 公分長度；生薑去皮切細絲、紅辣椒去籽切長細絲、大蒜壓成細泥調入少許冷開水成蒜泥水備用。
    image:
      src: ./step-1.webp
      alt: 海帶絲以清水漂洗去除泥沙，剪成約 10 公分長度；生薑去皮切細絲、紅辣椒去籽切長細絲、大蒜壓成細泥調
  - text: 湯鍋注入足量清水煮滾，放入海帶絲大火煮約 3 分鐘至軟中帶脆，撈起立即浸入冰開水中冰鎮降溫，撈起徹底瀝乾水氣。
    image:
      src: ./step-2.webp
      alt: 湯鍋注入足量清水煮滾，放入海帶絲大火煮約 3 分鐘至軟中帶脆，撈起立即浸入冰開水中冰鎮降溫，撈起徹底
  - text: 取一大調理盆，放入瀝乾的海帶絲、嫩薑絲與紅辣椒絲，倒入蒜泥水、香油、白醋、鹽與細砂糖。
  - text: 戴上手套充分抓拌均勻使每一根海帶絲均勻裹上香油與調料，放入冰箱冷藏浸漬 30 分鐘以上更加入味爽脆，盛盤即可享用。
