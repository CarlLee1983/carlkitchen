title: 涼拌海帶絲
summary: 新鮮海帶絲入滾水汆燙去除海腥保留脆嫩，撈起沖冰開水冰鎮瀝乾，加入新鮮嫩薑細絲與紅辣椒絲，拌入蒜泥水、純純香油、白醋、細鹽與少許糖充分抓拌冷藏醃漬，酸香微辣、清脆滑爽、百吃不厭的經典小菜。
servings: 4
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 以海帶絲為唯一蔬菜主角（海藻類蔬菜），調入蒜香香油涼拌，屬於蔬菜類涼拌料理。
