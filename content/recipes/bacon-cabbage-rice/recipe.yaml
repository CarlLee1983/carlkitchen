tip: 培根先在乾鍋中煸炒出煙燻油脂再炒高麗菜，米飯吸收動物油脂與蔬菜甘甜精華會格外油潤甘美；蔬菜煮時會微出水，水量可略比平時煮飯少 20 ml。
