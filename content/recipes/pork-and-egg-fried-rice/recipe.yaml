title: 肉絲蛋炒飯
summary: 依核准食譜指南製作之經典家常肉絲蛋炒飯，風味道地鮮明。
servings: 2
category: 主食
dishKinds: []
classificationReason: "白飯、雞蛋與豬肉絲大火粒粒分明熱炒，經典主食。"
draft: false
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 15
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 白飯, amount: { value: 100, unit: g }, note: 原料標示 220公克 }
  - { name: 雞蛋, amount: { value: 100, unit: g }, note: 原料標示 1顆 }
  - { name: 肉絲, amount: { value: 100, unit: g }, note: 原料標示 60公克 }
  - { name: 紅蘿蔔, amount: { value: 100, unit: g }, note: 原料標示 40公克 }
  - { name: 高麗菜, amount: { value: 100, unit: g }, note: 原料標示 60公克 }
  - { name: 蔥花, amount: { value: 100, unit: g }, note: 原料標示 20公克 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 1/8茶匙 }
  - { name: 白胡椒粉, amount: { value: 100, unit: g }, note: 原料標示 1/8茶匙 }
steps:
  - text: "將白飯放入大碗中，灑上約20㏄的水，用大湯匙或用手將有結塊的白飯抓散，備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的肉絲蛋炒飯主要材料
  - text: "熱鍋，加入約2大匙的沙拉油，輕輕搖動鍋子使表面都覆蓋上薄薄一層沙拉油，轉中火倒入蛋液，快速攪散至蛋略凝固，再加入肉絲炒至肉絲散開變白。"
  - text: "於作法2中續加入作法1的白飯及紅蘿蔔絲、高麗菜絲、蔥花，用鍋鏟將飯翻炒至飯粒完全散開，再加入所有調味料拌勻，持續以中火翻炒至飯粒鬆散均勻即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味肉絲蛋炒飯
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之肉絲蛋炒飯各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
