title: 清炒豆芽
summary: 豆芽菜先短暫汆燙，再與韭菜、辣椒和大蒜拌炒。用米酒與胡椒調味，是一道清脆的家常配菜。
servings: 2
category: 非湯料理
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 10
tags: [家常菜]
ingredients:
  - { name: 豆芽菜, amount: { value: 300, unit: g } }
  - { name: 韭菜, amount: { value: 30, unit: g }, note: 切段 }
  - { name: 辣椒, amount: { value: 2, unit: 根 }, note: 切花 }
  - { name: 大蒜, amount: { value: 3, unit: 瓣 }, note: 切碎 }
  - { name: 水, amount: { value: 2000, unit: ml }, note: 汆燙用 }
  - { name: 植物油, note: 適量, group: 調味 }
  - { name: 鹽, note: 少許，汆燙及調味用, group: 調味 }
  - { name: 香油, note: 少許, group: 調味 }
  - { name: 米酒, amount: { value: 20, unit: ml }, group: 調味 }
  - { name: 黑胡椒, note: 少許, group: 調味 }
  - { name: 白胡椒粉, note: 少許, group: 調味 }
steps:
  - text: 煮滾水並加入少許鹽，放入豆芽菜汆燙約 10～15 秒，再撈出備用。
    image: { src: ./step-1.webp, alt: 不鏽鋼瀝水籃裡盛著剛撈起的豆芽菜 }
  - text: 切好韭菜段、辣椒花和大蒜碎，另把鹽、香油、米酒、黑胡椒及白胡椒粉拌成調味汁。
    image:
      {
        src: ./step-2.webp,
        alt: 木砧板上分開放著韭菜段、辣椒圈與蒜碎，旁邊有菜刀及一碗調味汁,
      }
  - text: 燒熱炒鍋，加入植物油，放入辣椒與大蒜炒香，再倒入調味汁。
    image: { src: ./step-3.webp, alt: 炒鍋底部有辣椒圈、蒜碎與少量調味汁 }
  - text: 加入豆芽菜及韭菜，翻炒到熟後盛盤。
    image:
      {
        src: ./step-4.webp,
        alt: 炒鍋裡的豆芽菜、韭菜段與辣椒圈拌炒在一起，夾著細小蒜碎,
      }
tip: 先汆燙豆芽菜，可縮短後續拌炒的時間。
hero:
  src: ./hero.webp
  alt: 素色瓷盤盛著豆芽菜，拌有韭菜段、紅辣椒圈與細小蒜碎
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 豆芽菜、一束韭菜、兩根紅辣椒、三瓣大蒜、一壺水，以及分開盛裝的植物油、鹽、香油、米酒、黑胡椒與白胡椒粉
