title: 宮保雞丁
summary: 雞丁裹上酸甜醬汁，拌入乾辣椒、花椒與烤花生，蔥白分兩次下鍋。
servings: 2
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags:
  - 家常菜
ingredients:
  - name: 去骨雞腿肉
    amount:
      value: 250
      unit: g
    note: 去皮，切成一口大小的丁
  - name: 烤花生
    amount:
      value: 0.5
      unit: 杯
    note: 使用現成烤花生，沿用來源杯量
  - name: 青蔥
    amount:
      value: 4
      unit: 支
    note: 只用蔥白，切約 1 公分小段
  - name: 乾辣椒
    amount:
      value: 6
      unit: 根
    note: 來源用 6 至 8 根，依辣度調整
  - name: 薑
    amount:
      value: 1
      unit: 塊
    note: 約拇指大小，切末
  - name: 蒜頭
    amount:
      value: 3
      unit: 瓣
    note: 切末
  - name: 花椒
    amount:
      value: 5
      unit: ml
    note: 約 1 茶匙，使用整粒花椒
    group: 調味
  - name: 食用油
    amount:
      value: 55
      unit: ml
    note: 醃雞丁用 10 ml、炒雞丁用 30 ml、炒香料用 15 ml
    group: 調味
  - name: 紹興酒
    amount:
      value: 15
      unit: ml
    note: 醃雞丁用
    group: 調味
  - name: 鹽
    note: 醃雞丁用少許；醬汁另用 0.625 ml，約 1/8 茶匙
    group: 調味
  - name: 白胡椒粉
    note: 醃雞丁、醬汁各用少許
    group: 調味
  - name: 玉米粉
    amount:
      value: 15
      unit: ml
    note: 醃雞丁用 5 ml、醬汁用 10 ml；此處指玉米澱粉
    group: 調味
  - name: 上色用深色醬油
    amount:
      value: 7.5
      unit: ml
    note: dark soy sauce，加入醬汁，主要用來上色
    group: 調味
  - name: 調味用醬油
    amount:
      value: 15
      unit: ml
    note: light soy sauce，加入醬汁調味；不是日式薄口醬油或減鹽醬油
    group: 調味
  - name: 黑醋
    amount:
      value: 22.5
      unit: ml
    note: 醬汁用
    group: 調味
  - name: 水
    amount:
      value: 30
      unit: ml
    note: 醬汁用
    group: 調味
  - name: 糖
    amount:
      value: 15
      unit: ml
    note: 約 1 大匙，醬汁用
    group: 調味
steps:
  - text: 將去骨雞腿肉去皮切丁，拌入紹興酒、少許鹽與白胡椒粉、5 ml 玉米粉，再拌入 10 ml 食用油。
    image:
      src: ./step-1.webp
      alt: 素色瓷碗中是拌好醃料的粉紅色生雞丁
  - text: 將青蔥的蔥白切成約 1 公分小段；薑、蒜頭切末。
    image:
      src: ./step-2.webp
      alt: 木砧板上分開放著蔥白小段、薑末、蒜末和菜刀
  - text: 拌勻上色用深色醬油、調味用醬油、黑醋、水、糖、10 ml 玉米粉、0.625 ml 鹽與少許白胡椒粉，備成醬汁。
    image:
      src: ./step-3.webp
      alt: 素色瓷碗裡是調勻的棕色醬汁
  - text: 取 30 ml 食用油，先加部分入鍋燒熱，加入其餘冷油，再加熱至溫熱。下雞丁，等 3 至 5 秒，再輕炒至表面開始變色。
    image:
      src: ./step-4.webp
      alt: 木柄炒鍋中的雞丁局部轉白，鍋中只有雞丁與食用油
  - text: 先將雞丁盛出，再加入 15 ml 食用油，以小火炒香花椒和乾辣椒。放入薑、蒜頭與一半蔥白，再炒 10 秒。
    image:
      src: ./step-5.webp
      alt: 同一只炒鍋中是六根乾辣椒、花椒、薑蒜末與部分蔥白段
  - text: 放回雞丁拌炒，將醬汁重新攪勻後倒入。炒到醬汁裹住雞丁，加入其餘蔥白和烤花生，拌炒 3 秒。
    image:
      src: ./step-6.webp
      alt: 同一只炒鍋中，雞丁、蔥白段、乾辣椒、花椒與烤花生裹著棕色醬汁
  - text: 用食物溫度計量雞肉中心，確認至少達到 74°C 再盛出上桌；未達時繼續加熱。
hero:
