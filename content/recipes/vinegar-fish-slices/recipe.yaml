title: 醋溜魚片
summary: 鯛魚小片先過油，再和洋蔥、蔥段及薑片一起燒煮，勾芡後加白醋。
servings: 2
category: 非湯料理
draft: false
mealCandidate: true
vegetable: true
protein: true
timeMinutes: 15
tags: [家常菜]
ingredients:
  - { name: 鯛魚肉, amount: { value: 180, unit: g }, note: 切小片 }
  - { name: 洋蔥, amount: { value: 120, unit: g }, note: 去皮切絲 }
  - { name: 蔥段, amount: { value: 10, unit: g } }
  - { name: 薑片, amount: { value: 5, unit: g } }
  - { name: 食用油, note: 適量，過油與爆香用, group: 調味 }
  - {
      name: 日式風味醬油（鮮美露）,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙,
      group: 調味,
    }
  - {
      name: 番茄醬,
      amount: { value: 7.5, unit: ml },
      note: 約 1/2 大匙,
      group: 調味,
    }
  - {
      name: 水,
      amount: { value: 7.5, unit: ml },
      note: 約 1/2 大匙,
      group: 調味,
    }
  - { name: 糖, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
  - { name: 太白粉水, note: 適量，來源未提供粉水比例, group: 調味 }
  - { name: 白醋, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
steps:
  - text: 將鯛魚肉切成小片；洋蔥去皮後切絲。
    image:
      src: ./step-1.webp
      alt: 木砧板上分開放著生鯛魚小片與洋蔥絲，右側是一把菜刀
  - text: 把鯛魚肉放入油鍋過油，取出備用。
    image:
      src: ./step-2.webp
      alt: 白色瓷盤中放著過油後取出的鯛魚小片，表面帶著油光
  - text: 熱鍋後倒入食用油，用蔥段爆香。加入日式風味醬油（鮮美露）、番茄醬、水、糖、薑片、洋蔥及鯛魚肉，稍微燒煮至鯛魚肉熟。
    image:
      src: ./step-3.webp
      alt: 深色長柄平底鍋內，鯛魚小片與洋蔥絲、蔥段和薑片浸在帶有小氣泡的紅褐色醬汁中
  - text: 用太白粉水將醬汁勾芡，起鍋前淋入白醋。
    image:
      src: ./step-4.webp
      alt: 深色長柄平底鍋內，鯛魚小片、洋蔥絲、蔥段與薑片裹著濃稠的紅褐色醬汁
hero:
  src: ./hero.webp
  alt: 白色淺瓷盤盛著鯛魚小片、洋蔥絲、蔥段與薑片，表面裹著紅褐色醬汁
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 俯視分開盛裝的生鯛魚小片、洋蔥絲、蔥段、薑片，以及七份調味材料：食用油、日式風味醬油、番茄醬、水、糖、太白粉水與白醋
tip: 份量取來源 2–3 人份的下限；總時間含備料，推估 15 分鐘。鯛魚肉煮熟後容易碎，翻動時放輕力道。
