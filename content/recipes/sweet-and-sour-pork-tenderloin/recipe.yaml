title: 糖醋里肌
summary: 里肌肉塊炸熟後，和洋蔥、青椒、甜椒一起裹上酸甜醬汁，收汁後拌入香油。
servings: 2
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [家常菜]
ingredients:
  - { name: 豬里肌肉, amount: { value: 300, unit: g }, note: 切小塊 }
  - { name: 洋蔥, amount: { value: 30, unit: g }, note: 切小塊 }
  - { name: 青椒, amount: { value: 40, unit: g }, note: 切小塊 }
  - { name: 甜椒, amount: { value: 40, unit: g }, note: 切小塊 }
  - { name: 太白粉, amount: { value: 100, unit: g }, note: 炸肉裹粉用 }
  - {
      name: 食用油,
      amount: { value: 400, unit: ml },
      note: 炸肉用；另鍋拌炒少許，來源未標用量,
    }
  - {
      name: 鹽,
      amount: { value: 0.8, unit: ml },
      note: 約 1/6 茶匙，醃肉用,
      group: 調味,
    }
  - {
      name: 太白粉,
      amount: { value: 5, unit: ml },
      note: 約 1 茶匙，醃肉用,
      group: 調味,
    }
  - {
      name: 米酒,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，醃肉用,
      group: 調味,
    }
  - {
      name: 蛋白,
      amount: { value: 5, unit: ml },
      note: 約 1 茶匙，醃肉用,
      group: 調味,
    }
  - {
      name: 白醋,
      amount: { value: 30, unit: ml },
      note: 約 2 大匙,
      group: 調味,
    }
  - {
      name: 番茄醬,
      amount: { value: 30, unit: ml },
      note: 約 2 大匙,
      group: 調味,
    }
  - {
      name: 水,
      amount: { value: 30, unit: ml },
      note: 約 2 大匙，醬汁用,
      group: 調味,
    }
  - {
      name: 細砂糖,
      amount: { value: 30, unit: g },
      note: 約 2 大匙半,
      group: 調味,
    }
  - {
      name: 太白粉水,
      amount: { value: 2.5, unit: ml },
      note: 約 1/2 茶匙,
      group: 調味,
    }
  - {
      name: 香油,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙,
      group: 調味,
    }
steps:
  - text: 豬里肌肉切小塊，加入鹽、太白粉、米酒和蛋白抓勻，醃漬 5 分鐘；洋蔥、青椒和甜椒切小塊。
    image:
      src: ./step-1.webp
      alt: 碗中里肌肉塊正醃漬，砧板上分開放著切小塊的洋蔥、青椒和紅甜椒
  - text: 里肌肉塊均勻裹上太白粉並捏緊。鍋中加約 400 ml 食用油，以小火炸約 4 分鐘至熟，撈起瀝油。
    image:
      src: ./step-2.webp
      alt: 裹粉炸熟的里肌肉塊從油鍋撈起，放在濾網上瀝油
  - text: 另鍋加少許食用油，放入洋蔥、青椒和甜椒略炒，加入白醋、番茄醬、水和細砂糖，小火煮滾。
    image:
      src: ./step-3.webp
      alt: 鍋中洋蔥、青椒與紅甜椒在糖醋醬汁裡煮滾，尚未放入里肌肉
  - text: 加入太白粉水勾芡，放回里肌肉塊快速拌炒至芡汁吸收，關火後拌入香油。
    image:
      src: ./step-4.webp
      alt: 炸里肌肉塊與洋蔥、青椒、紅甜椒在鍋中拌勻，裹上濃稠糖醋醬汁
hero:
  src: ./hero.webp
  alt: 淺盤盛著糖醋里肌肉塊，拌有洋蔥、青椒與紅甜椒，裹著橘紅色醬汁
ingredientsPhoto:
  src: ./ingredients.webp
