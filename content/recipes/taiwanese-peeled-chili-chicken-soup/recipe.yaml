title: 剝皮辣椒雞湯
summary: 依核准食譜指南製作之經典家常剝皮辣椒雞湯，風味道地鮮明。
servings: 4
category: 湯
dishKinds: []
classificationReason: "甘甜微辣剝皮辣椒與土雞肉慢火燉煮之回甘雞湯。"
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 40
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 土雞, amount: { value: 200.0, unit: g }, note: 原料標示 200公克 }
  - { name: 剝皮辣椒, amount: { value: 80.0, unit: g }, note: 原料標示 80公克 }
  - { name: 剝皮辣椒汁, amount: { value: 50.0, unit: g }, note: 原料標示 50㏄ }
  - { name: 蒜仁, amount: { value: 15.0, unit: g }, note: 原料標示 15公克 }
  - { name: 水, amount: { value: 800.0, unit: g }, note: 原料標示 800㏄ }
  - { name: 鹽, amount: { value: 1.0, unit: g }, note: 原料標示 1/2茶匙 }
  - { name: 雞粉, amount: { value: 1.0, unit: g }, note: 原料標示 1/4茶匙 }
steps:
  - text: "土雞肉剁小塊，放入滾水中汆燙去髒，再撈出用冷水沖涼洗淨，放入湯鍋中。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之剝皮辣椒雞湯主要材料
  - text: "在作法1的湯鍋中續加入剝皮辣椒、剝皮辣椒及汁、蒜仁、水，以中火煮至滾沸。"
  - text: "待作法2的雞湯滾沸後撈去浮沫，再轉微火，不蓋鍋蓋煮約30分鐘，關火後加入所有調味料調味即可。"
