title: 香菇紅燒豆腐
summary: 乾香菇泡發切厚塊油炸激發濃郁蕈菇香，板豆腐切厚片煎炸至表面金黃起泡，加入辣豆瓣醬、蒜片、薑片與米酒細火紅燒收汁，豆腐吸飽醇厚湯汁，醬香濃郁、軟嫩下飯。
servings: 3
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: 以板豆腐油炸後紅燒為唯一蛋豆類主角，佐以乾香菇提香，屬於蛋豆類料理。
