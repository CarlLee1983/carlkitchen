steps:
  - text: 乾香菇泡水軟化擠乾切半；板豆腐切成 1 公分厚片拭乾水分；蒜苗斜切段、薑蒜切片備用。
    image:
      src: ./step-1.webp
      alt: 乾香菇泡水軟化擠乾切半；板豆腐切成 1 公分厚片拭乾水分；蒜苗斜切段、薑蒜切片備用。
  - text: 熱鍋倒入適量油，放入豆腐片煎炸至兩面金黃微硬撈出瀝油；再將香菇下鍋過油炒香盛起。
    image:
      src: ./step-2.webp
      alt: 熱鍋倒入適量油，放入豆腐片煎炸至兩面金黃微硬撈出瀝油；再將香菇下鍋過油炒香盛起。
  - text: 原鍋留少許底油，爆香薑片、蒜片，加入辣豆瓣醬炒出紅油香氣，倒入炸香菇、炸豆腐、醬油、糖、米酒與水煮滾。
  - text: 轉小火煨煮約 5 分鐘至豆腐充分吸飽醬汁，投入蒜苗段翻炒斷生，淋上少許香油即可盛盤。
