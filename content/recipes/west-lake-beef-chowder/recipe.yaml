steps:
  - text: 牛絞肉加入米酒、薑泥抓勻；乾香菇泡軟切極細末；嫩豆腐切細丁；雞蛋分開蛋黃取純蛋白打散；香菜洗淨切碎末備用。
    image:
      src: ./step-1.webp
      alt: 牛絞肉加入米酒、薑泥抓勻；乾香菇泡軟切極細末；嫩豆腐切細丁；雞蛋分開蛋黃取純蛋白打散；香菜洗淨切碎末
  - text: 取湯鍋倒入 800 ml 高湯煮滾，先放入香菇末與嫩豆腐丁小火煮 2 分鐘，將醃好的牛肉茸慢慢分批撥入滾湯中，快速劃散防止結團，煮約 1 分鐘熟透。
    image:
      src: ./step-2.webp
      alt: 取湯鍋倒入 800 ml 高湯煮滾，先放入香菇末與嫩豆腐丁小火煮 2 分鐘，將醃好的牛肉茸慢慢分批撥
  - text: 加入鹽與白胡椒粉調味，轉中火一邊攪動一邊淋入太白粉水勾出濃稠亮滑羹湯，轉微火，緩緩倒入蛋白液，用湯勺輕輕推動劃出如白雪般的雲紋蛋花。
  - text: 熄火淋上香油，撒上滿滿香菜末，盛入大湯碗即可溫熱品嚐。
