tip: 牛肉末下鍋時湯水保持微滾並用筷子快速攪散，肉末才能均勻懸浮不結硬塊；只使用蛋白淋入推劃成雪白雲花，羹湯才能保持清雅如白雪浮江的經典視覺美感。
