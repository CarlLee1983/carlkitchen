title: 西湖牛肉羹
summary: 鮮嫩牛肉剁成極細肉茸，以米酒、少許醬油抓醃，入滾沸高湯中快速攪散成細緻肉粒，加入香菇末與豆腐末增添層次，以太白粉水勾出如絲綢般溫潤厚羹，細緩淋入純白蛋白推劃出如雪花般的白玉雲紋，撒上鮮綠香菜末與白胡椒粉，溫潤滑順、鮮香適口。
servings: 3
category: 湯
dishKinds: []
classificationReason: 西湖牛肉羹為傳統杭州經典燴羹，湯品不設料理主角與配餐角色。
