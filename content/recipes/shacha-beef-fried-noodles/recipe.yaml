steps:
  - text: 牛肉片加少許醬油、米酒與太白粉抓勻醃漬 10 分鐘；油麵入溫熱水洗散瀝乾；油菜切段、香菇切片、胡蘿蔔切絲備用。
    image:
      src: ./step-1.webp
      alt: 牛肉片加少許醬油、米酒與太白粉抓勻醃漬 10 分鐘；油麵入溫熱水洗散瀝乾；油菜切段、香菇切片、胡蘿蔔
  - text: 熱鍋倒入適量油，放入蒜碎爆香，加入牛肉片大火滑炒至八分熟表面變白即先盛出。
  - text: 原鍋補少許油，放入香菇片、胡蘿蔔絲炒香，加入沙茶醬炒出濃香紅油，倒入油麵與少許水燜煮 1 分鐘讓麵條吸味。
    image:
      src: ./step-3.webp
      alt: 原鍋補少許油，放入香菇片、胡蘿蔔絲炒香，加入沙茶醬炒出濃香紅油，倒入油麵與少許水燜煮 1 分鐘讓麵條
  - text: 倒回滑好的牛肉片與油菜段，調入醬油與少許糖大火翻炒收濃湯汁，菜葉翠綠斷生即可盛盤。
