title: 沙茶牛肉炒麵
summary: 牛肉片抓醃滑嫩，油麵沸水微燙去除鹼味，熱鍋爆香蒜末，牛肉片大火滑炒定型，加入油麵、香菇片、胡蘿蔔絲與油菜，調入經典台灣沙茶醬、醬油大火快炒收濃，鑊氣奔騰、醬香濃郁。
servings: 2
category: 主食
dishKinds: []
classificationReason: 主食不設料理主角與配餐角色，以油麵搭配醃牛肉片、油菜與沙茶醬大火快炒為獨立飽足主餐。
