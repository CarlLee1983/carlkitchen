title: 水蓮炒肉絲
summary: 鮮脆水蓮洗淨切段，鮮香菇切細絲，豬肉絲過油滑嫩，熱鍋爆香薑末與紅辣椒絲，大火快速翻炒水蓮斷生，調入少許鹽與米酒嗆鍋，鮮綠清脆、爽口甘甜。
servings: 3
category: 非湯料理
dishKinds: [vegetable, meat]
classificationReason: 以水蓮為主要蔬菜主角，搭配豬肉絲與香菇絲大火快炒，屬於蔬菜與肉類並陳的料理。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 熱炒, 水蓮, 肉絲]
aliases: [炒水蓮, 香菇水蓮炒肉絲]
ingredients:
  - name: 水蓮
    amount:
      value: 250
      unit: g
    note: 洗淨切段約 5 公分
  - name: 豬肉絲
    amount:
      value: 80
      unit: g
    note: 細豬里肌肉絲
  - name: 鮮香菇
    amount:
      value: 3
      unit: 朵
    note: 洗淨切細絲
  - name: 紅辣椒
    amount:
      value: 1
      unit: 根
    note: 切細絲配色
  - name: 生薑
    amount:
      value: 10
      unit: g
    note: 洗淨切末
  - name: 鹽
    amount:
      value: 3
      unit: g
    note: 約半茶匙
    group: 調味
  - name: 米酒
    amount:
      value: 10
      unit: ml
    note: 鍋邊嗆香
    group: 調味
steps:
  - text: 水蓮泡冷水充分洗淨泥沙，切成約 5 公分長段；鮮香菇、紅辣椒切細絲；生薑切末；豬肉絲抓少許米酒備用。
    image:
      src: ./step-1.webp
      alt: 水蓮泡冷水充分洗淨泥沙，切成約 5 公分長段；鮮香菇、紅辣椒切細絲；生薑切末；豬肉絲抓少許米酒備用。
  - text: 熱鍋倒入適量油，放入薑末、辣椒絲爆香，加入肉絲與香菇絲大火翻炒至肉絲變白斷生。
  - text: 倒入水蓮段轉大火快速翻炒約 45 秒至水蓮受熱軟化轉翠綠，加入鹽調味並沿鍋邊嗆入米酒快翻數秒即可盛盤。
    image:
      src: ./step-3.webp
      alt: 倒入水蓮段轉大火快速翻炒約 45 秒至水蓮受熱軟化轉翠綠，加入鹽調味並沿鍋邊嗆入米酒快翻數秒即可盛盤
  - text: 盛入圓盤趁熱享用爽脆口感。
hero:
