title: 古早味麻油麵線
summary: 手工白麵線滾水煮熟三點水至滑順筋道，撈起瀝乾放入大碗，老薑片以黑麻油小火煸香，加入少許純米酒、溫熱高湯與鹽調勻成金黃香醇麻油醬汁，趁熱澆淋在麵線上拌勻，麻油香氣撲鼻、滑潤溫補。
servings: 2
category: 主食
dishKinds: []
classificationReason: 主食不設料理主角與配餐角色，以手工麵線拌入老薑黑麻油與米酒為傳統溫潤主食餐點。
