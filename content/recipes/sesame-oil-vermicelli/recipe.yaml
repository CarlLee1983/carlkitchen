steps:
  - text: 老薑洗淨切薄片；小鍋倒入黑麻油，放入薑片以小火慢慢煸炒至薑片邊緣微捲金黃散發濃郁薑麻油香氣，加入米酒與高湯拌勻保溫備用。
    image:
      src: ./step-1.webp
      alt: 老薑洗淨切薄片；小鍋倒入黑麻油，放入薑片以小火慢慢煸炒至薑片邊緣微捲金黃散發濃郁薑麻油香氣，加入米酒
  - text: 深鍋注入大量水大火煮滾，放入白麵線煮沸，水滾時淋入少許冷水，重複兩次至麵線熟透無白心撈起瀝乾放入大碗中。
    image:
      src: ./step-2.webp
      alt: 深鍋注入大量水大火煮滾，放入白麵線煮沸，水滾時淋入少許冷水，重複兩次至麵線熟透無白心撈起瀝乾放入大碗
  - text: 將煮好的熱麻油薑汁均勻淋在滾燙麵線上，用筷子快速挑散拌勻讓每根麵條吸附油潤金黃麻油，盛入碗中即可趁熱享用。
