title: 豆乾肉絲
summary: 五香黃豆乾切細絲以少許熱油煸煎至表皮微金黃微焦香，原鍋爆香蔥段與辣椒醬，投入鮮嫩豬肉絲滑炒散開，倒回豆乾絲調入甘醇醬油、細糖與少許清水翻炒收汁，豆乾軟Ｑ微韌、肉絲滑嫩鹹甜，經典便當家常熱炒。
servings: 3
category: 非湯料理
dishKinds: [meat, egg-bean]
classificationReason: 以豆乾絲與豬肉絲同鍋熱炒為蛋豆與肉類雙主角，屬於蛋豆與肉類並陳料理。
