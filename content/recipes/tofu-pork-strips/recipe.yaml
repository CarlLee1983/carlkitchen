steps:
  - text: 豆乾先橫剖兩刀成薄片再順紋切成細絲；豬肉切細絲；青蔥洗淨切 3 公分長段、紅辣椒切細絲備用。
    image:
      src: ./step-1.webp
      alt: 豆乾先橫剖兩刀成薄片再順紋切成細絲；豬肉切細絲；青蔥洗淨切 3 公分長段、紅辣椒切細絲備用。
  - text: 炒鍋倒入植物油加熱，放入豆乾絲以中火慢煎煸炒約 2 分鐘，至豆乾絲表面呈現微金黃微韌起微皺褶後撈出瀝油。
    image:
      src: ./step-2.webp
      alt: 炒鍋倒入植物油加熱，放入豆乾絲以中火慢煎煸炒約 2 分鐘，至豆乾絲表面呈現微金黃微韌起微皺褶後撈出瀝
  - text: 原鍋留少許底油，放入青蔥段與紅辣椒絲小火爆香，加入豬肉絲大火翻炒至肉色轉白散開。
  - text: 倒回煸好的豆乾絲，加入醬油、細砂糖、米酒與清水，轉中大火快速翻炒約 2 分鐘讓醬汁收乾緊裹食材，起鍋前滴入香油翻勻盛盤。
