tip: 蝦背劃深至三分之二處，油炸時蝦肉受熱會自然外翻蜷曲成飽滿圓潤的花球狀；炸好後趁熱與爆香辛香料及椒鹽快速翻拋十秒，外殼酥香不含油、滋味絕佳。
