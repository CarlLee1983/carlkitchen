title: 五更腸旺
summary: 熟透滷豬大腸頭切厚圈片，嫩滑鴨血切厚塊滾水汆燙，熱油鍋爆香花椒粒、薑末、蒜末與香濃辣豆瓣醬炒出紅油，投入高湯、客家酸菜薄片、鴨血與大腸頭微火慢煨入味，太白粉水勾厚亮芡汁，撒入斜切青翠蒜苗，起鍋淋入花椒香油，麻辣鮮香、鴨血滑嫩、大腸軟糯Ｑ彈、川台融合經典砂鍋名菜。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: 以豬大腸頭與鴨血為主角慢火煨燒，屬於肉類料理。
