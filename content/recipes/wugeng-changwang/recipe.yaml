tip: 鴨血切塊後以微滾帶鹽的水小火慢浸汆燙，能使鴨血緊實滑嫩不破碎且易吸汁；辣豆瓣醬一定要以小火慢炒出紅油，湯色才紅亮誘人、辣香醇厚。
