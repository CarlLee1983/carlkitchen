steps:
  - text: 鴨血切適口厚片，入微滾熱水加少許鹽小火慢浸汆燙 3 分鐘撈起泡冷水保持滑嫩；滷大腸頭斜切厚圈片；酸菜切薄片漂洗擠乾；青蒜苗切斜段；大蒜、生薑切末備用。
    image:
      src: ./step-1.webp
      alt: 砧板上放著滷大腸頭圈片與鴨血塊，旁邊分碟擺著酸菜心、青蒜苗、大蒜末、生薑絲與辣豆瓣醬。
  - text: 炒鍋倒入植物油加熱，放入花椒粒以微火慢慢爆出香氣後撈出花椒粒，原油中放入蒜末、薑末與辣豆瓣醬小火炒出紅亮油光。
    image:
      src: ./step-2.webp
      alt: 炒鍋中的辣豆瓣醬與辛香料冒著氣泡，周圍可見紅油。
  - text: 倒入高湯、米酒、醬油與細砂糖煮滾，加入大腸頭圈片、酸菜片與汆燙好的鴨血，加蓋轉小火慢煨燉煮 6 分鐘至鴨血充分入味孔隙吸飽湯汁。
  - text: 倒入青蒜苗段，緩緩淋入太白粉水勾出油亮滑潤濃芡，起鍋前淋入花椒油翻勻，移入溫熱小砂鍋中即可沸騰上桌。
