steps:
  - text: 茄子洗淨切成長段並以紙巾擦乾水分；熱油鍋將茄子段炸至熟透且表皮保持鮮豔紫亮，撈起瀝乾油分備用。
    image:
      src: ./step-1.webp
      alt: 茄子洗淨切成長段並以紙巾擦乾水分；熱油鍋將茄子段炸至熟透且表皮保持鮮豔紫亮，撈起瀝乾油分備用。
  - text: 將薑、蔥、蒜頭與辣椒分別切成細末備用。
  - text: 熱鍋倒入適量油，放入薑末、蒜頭末、辣椒末與蔥花小火爆香，加入豬絞肉炒散至肉色轉白熟透。
    image:
      src: ./step-3.webp
      alt: 熱鍋倒入適量油，放入薑末、蒜頭末、辣椒末與蔥花小火爆香，加入豬絞肉炒散至肉色轉白熟透。
  - text: 淋入米酒、醬油、糖及少許清水煮滾，放入炸好的茄子段慢火煨煮約 1 分鐘入味，調入太白粉水勾薄芡，起鍋前淋入香油即可盛盤。
