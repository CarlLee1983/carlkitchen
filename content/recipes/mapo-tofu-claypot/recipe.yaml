title: 麻婆豆腐煲
summary: 依核准食譜指南製作之經典家常麻婆豆腐煲，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: "嫩豆腐與調味牛豬絞肉佐花椒辣豆瓣熱煲收汁，蛋豆主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 豆腐, amount: { value: 300.0, unit: g }, note: 原料標示 300公克 }
  - { name: 茄子, amount: { value: 100.0, unit: g }, note: 原料標示 100公克 }
  - { name: 絞肉, amount: { value: 50.0, unit: g }, note: 原料標示 50公克 }
  - { name: 花豆, amount: { value: 30.0, unit: g }, note: 原料標示 30公克 }
  - { name: 蒜末, amount: { value: 20.0, unit: g }, note: 原料標示 20公克 }
  - { name: 蔥花, amount: { value: 20.0, unit: g }, note: 原料標示 20公克 }
  - { name: 玉米筍, amount: { value: 30.0, unit: g }, note: 原料標示 30公克 }
  - { name: 鴻禧菇, amount: { value: 50.0, unit: g }, note: 原料標示 50公克 }
  - { name: 辣椒醬, amount: { value: 2.0, unit: g }, note: 原料標示 2大匙 }
  - { name: 醬油, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 糖, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 水, amount: { value: 500.0, unit: g }, note: 原料標示 500㏄ }
steps:
  - text: "豆腐切丁；茄子切圓段；花豆泡水；玉米筍切斜段，備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之麻婆豆腐煲主要材料
  - text: "熱鍋，倒入稍多的油，放入作法1的茄子段過油一下，取出瀝油備用。"
  - text: "作法2鍋中留少許油，放入蒜末爆香，再放入絞肉炒至變色。"
  - text: "放入豆腐、茄子、花豆、玉米筍、鴻喜菇及所有調味料炒勻，移入砂鍋中煮至收汁，撒入蔥花即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味麻婆豆腐煲
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之麻婆豆腐煲各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
