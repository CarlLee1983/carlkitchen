title: 九層塔炒海瓜子
summary: 海瓜子吐沙洗淨，熱鍋爆香蒜末與紅辣椒片，大火翻炒海瓜子並加入醬油膏與烏醋燜出海鮮甘味，起鍋前投入大把九層塔快炒翻勻，醬香撲鼻、肉嫩多汁。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: 以新鮮海瓜子大火快炒為唯一海鮮主角，搭配九層塔、蒜末提香，屬於海鮮類料理。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [熱炒, 海鮮, 家常菜, 九層塔]
aliases: [塔香炒海瓜子, 熱炒海瓜子]
