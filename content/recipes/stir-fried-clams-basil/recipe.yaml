steps:
  - text: 海瓜子浸鹽水吐沙洗淨；九層塔摘取嫩葉洗淨瀝乾；紅辣椒切片、蒜頭切碎備用。
    image:
      src: ./step-1.webp
      alt: 海瓜子浸鹽水吐沙洗淨；九層塔摘取嫩葉洗淨瀝乾；紅辣椒切片、蒜頭切碎備用。
  - text: 熱鍋倒入少許油，放入蒜碎與辣椒片中火爆炒出香氣。
  - text: 倒入海瓜子大火翻炒數下，加入水、醬油膏、烏醋與糖，蓋上鍋蓋大火燜煮約 1 至 2 分鐘至海瓜子全數開殼。
    image:
      src: ./step-3.webp
      alt: 倒入海瓜子大火翻炒數下，加入水、醬油膏、烏醋與糖，蓋上鍋蓋大火燜煮約 1 至 2 分鐘至海瓜子全數開
  - text: 開蓋投入大量九層塔嫩葉，快速翻炒數秒讓塔香融入醬汁中即可熄火盛盤。
hero:
  src: ./hero.webp
  alt: 盛盤完成的九層塔炒海瓜子
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 料理食材整齊擺放於木砧板上
tip: 海瓜子易熟，下鍋燜至剛好蚌殼全開時就要立刻下九層塔翻炒，肉質才能維持肥嫩飽滿、鮮嫩多汁而不縮水回縮。
