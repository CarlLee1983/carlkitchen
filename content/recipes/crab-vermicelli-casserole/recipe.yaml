title: 螃蟹粉絲煲
summary: 鮮美花蟹開殼斬塊大火煸炒出海味，注入高湯與金黃蛋液蟹膏烹煮，倒入泡軟冬粉慢火燜煨，粉絲吸飽螃蟹極鮮湯汁與蒜香，撒上蔥花與香油，鮮香濃郁。
servings: 4
category: 主食
dishKinds: []
classificationReason: 冬粉吸收高湯後鋪上炒熟螃蟹與蟹膏蛋汁，依既有主食分類不設料理主角標籤。
