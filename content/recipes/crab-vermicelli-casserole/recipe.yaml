steps:
  - text: 冬粉以溫水泡軟剪成小段；花蟹開殼洗淨剪除腮部，蟹螯拍裂，蟹身對切剁塊；將蟹膏刮出與打散的雞蛋拌勻備用。
    image:
      src: ./step-1.webp
      alt: 冬粉以溫水泡軟剪成小段；花蟹開殼洗淨剪除腮部，蟹螯拍裂，蟹身對切剁塊；將蟹膏刮出與打散的雞蛋拌勻備用
  - text: 炒鍋中注入水、高湯塊與醬油煮滾，放入冬粉煮約 2 分鐘撈起放入砂鍋中蓋上鍋蓋燜透，鍋中剩餘高湯盛起備用。
  - text: 起油鍋爆香蒜末與薑末，放入花蟹大火翻炒至甲殼變紅釋放香氣，倒入預留的高湯煮滾。
    image:
      src: ./step-3.webp
      alt: 起油鍋爆香蒜末與薑末，放入花蟹大火翻炒至甲殼變紅釋放香氣，倒入預留的高湯煮滾。
  - text: 將拌好的雞蛋蟹膏液淋入鍋中炒勻，撒上青蔥蔥花，將煮熟的螃蟹與濃郁湯汁均勻鋪在砂鍋冬粉上，淋上香油與胡椒粉拌勻即可上桌。
