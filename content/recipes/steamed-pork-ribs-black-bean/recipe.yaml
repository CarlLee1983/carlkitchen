title: 豆豉蒸排骨
summary: 依核准食譜指南製作之經典家常豆豉蒸排骨，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: "排骨拌入豆豉蒜蓉醬汁入鍋大火蒸透，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 30
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 小排骨, amount: { value: 1.0, unit: g }, note: 原料標示 1/2斤 }
  - { name: 蔥末, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 薑末, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 蒜末, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 辣椒末, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 香油, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 乾豆豉, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 蠔油, amount: { value: 2.0, unit: g }, note: 原料標示 2小匙 }
  - { name: 糖, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 醋, amount: { value: 100, unit: g }, note: 原料標示 少許 }
steps:
  - text: "小排骨洗淨切小塊，加入所有醃料拌勻，靜置約20分鐘至入味；乾豆豉泡水至軟備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之豆豉蒸排骨主要材料
  - text: "將半鍋油燒熱至油溫約170℃時，放入作法1的小排骨，用中火略炸約30秒即可撈出瀝乾油脂，放入盤內待涼備用。"
  - text: "將所有調味料拌勻，加入作法2的排骨中，連同盤子放入竹製蒸籠內，蓋上蒸籠蓋。"
  - text: "取一中華鍋，裝入半鍋水煮沸後，再放上作法3的竹蒸籠，用大火蒸約30分鐘後取出，並滴入香油，灑上蔥末、薑末、蒜末、辣椒末即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味豆豉蒸排骨
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之豆豉蒸排骨各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
