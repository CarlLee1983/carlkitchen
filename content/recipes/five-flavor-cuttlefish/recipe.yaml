title: 五味花枝
summary: 依核准食譜指南製作之經典家常五味花枝，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: "新鮮花枝刻花汆燙冰鎮後佐酸甜香辣五味醬，海鮮主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 花枝, amount: { value: 350.0, unit: g }, note: 原料標示 350公克 }
  - { name: 蔥, amount: { value: 1.0, unit: g }, note: 原料標示 1/2支 }
  - { name: 薑, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 蒜仁, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 蒜苗, amount: { value: 5.0, unit: g }, note: 原料標示 5公克 }
  - { name: 紅辣椒, amount: { value: 1.0, unit: g }, note: 原料標示 1/2支 }
  - { name: 香菜, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 九層塔, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 醬油膏, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 番茄醬, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 紅辣椒醬, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 白醋, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 砂糖, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 香油, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 辣油, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
steps:
  - text: "花枝清除內臟後洗淨，表面切十字刀，再切小片後，放入沸水中燙熟，瀝乾放入盤中備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之五味花枝主要材料
  - text: "蔥、薑、蒜仁、蒜苗、紅辣椒、香菜、九層塔切碎，加入所有調味料拌勻。"
  - text: "將作法2醬汁淋在花枝上即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味五味花枝
