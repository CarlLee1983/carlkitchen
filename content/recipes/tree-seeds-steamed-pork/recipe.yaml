  alt: 料理食材整齊擺放於木砧板上
tip: 肉餡中加入荸薺碎能讓蒸出的肉餅軟嫩中帶有爽脆咬勁，層次豐富不油膩；破布子的甘甜蔭汁淋在肉餅表面一同蒸透，滋味甘美無比。
