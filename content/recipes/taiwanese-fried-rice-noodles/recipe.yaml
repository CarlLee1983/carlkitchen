title: 台式炒米粉
summary: 乾米粉先汆燙再燜軟，和香菇、蝦米、豬肉絲與蔬菜加高湯一起拌炒入味，最後加芹菜末與香油。一盤就能當一餐。
servings: 3
category: 主食
draft: false
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 30
tags: [家常菜]
ingredients:
  - { name: 乾米粉, amount: { value: 200, unit: g } }
  - {
      name: 豬肉絲,
      amount: { value: 100, unit: g },
      note: 建議用里肌肉，也可用梅花肉或五花肉切絲,
    }
  - { name: 乾香菇, amount: { value: 3, unit: 朵 }, note: 泡軟後切絲 }
  - { name: 蝦米, amount: { value: 15, unit: g }, note: 泡軟 }
  - { name: 紅蔥頭, amount: { value: 10, unit: g }, note: 切末 }
  - { name: 紅蘿蔔, amount: { value: 15, unit: g }, note: 切絲 }
  - { name: 高麗菜, amount: { value: 150, unit: g }, note: 切粗絲 }
  - { name: 芹菜, amount: { value: 20, unit: g }, note: 切末 }
  - { name: 高湯, amount: { value: 120, unit: ml } }
  - {
      name: 食用油,
      amount: { value: 30, unit: ml },
      note: 約 2 湯匙,
      group: 調味,
    }
  - {
      name: 鹽,
      amount: { value: 1.5, unit: g },
      note: 約 1/4 茶匙,
      group: 調味,
    }
  - {
      name: 雞粉,
      amount: { value: 1.5, unit: g },
      note: 約 1/4 茶匙,
      group: 調味,
    }
  - {
      name: 醬油,
      amount: { value: 22.5, unit: ml },
      note: 約 1 又 1/2 湯匙,
      group: 調味,
    }
  - {
      name: 烏醋,
      amount: { value: 7.5, unit: ml },
      note: 約 1/2 湯匙,
      group: 調味,
    }
  - { name: 糖, note: 少許, group: 調味 }
  - { name: 米酒, note: 少許, group: 調味 }
  - { name: 白胡椒粉, note: 少許, group: 調味 }
  - { name: 香油, note: 少許, group: 調味 }
steps:
  - text: 煮一鍋水，水滾後放入乾米粉汆燙約 1 分鐘。撈起瀝乾，放進鍋中蓋上鍋蓋，燜 10 分鐘讓米粉變軟。
    image:
      src: ./step-1.webp
      alt: 不鏽鋼鍋的鍋蓋斜靠在鍋緣，鍋中是瀝乾後燜軟的白色米粉，冒著些許蒸氣，旁邊放著一個空的不鏽鋼瀝水籃
  - text: 燜米粉的同時，乾香菇和蝦米泡軟，香菇切絲；高麗菜切粗絲，紅蘿蔔切絲，紅蔥頭、芹菜切末，豬肉切絲。
    image:
      src: ./step-2.webp
      alt: 木砧板和菜刀上擺著高麗菜粗絲、紅蘿蔔絲、香菇絲、芹菜末和紅蔥末，旁邊有一碗泡軟的蝦米和一碗肉絲
  - text: 炒鍋燒熱後倒入食用油，放紅蔥末爆香，再放香菇絲、蝦米和豬肉絲，炒約 1 分鐘。
    image:
      src: ./step-3.webp
      alt: 炒鍋中加了少許油，炒著紅蔥末、香菇絲、蝦米和已變色的肉絲，鍋鏟靠在鍋緣
  - text: 放入紅蘿蔔絲和高麗菜絲，炒到微微變軟。倒入高湯煮滾，放入米粉，加鹽、糖、雞粉、醬油、米酒、烏醋和白胡椒粉，轉小火拌炒均勻。
    image:
      src: ./step-4.webp
      alt: 炒鍋中淺醬油色的米粉與肉絲、香菇絲、蝦米、紅蘿蔔絲和高麗菜絲拌在一起，鍋底有一點湯汁，鍋鏟靠在鍋緣
  - text: 最後撒入芹菜末，淋上香油，拌勻就能起鍋。
hero:
