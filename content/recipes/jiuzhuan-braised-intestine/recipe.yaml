tip: 大腸頭先加麵粉與鹽徹底翻面搓洗去黏液與異味，預先水煮一小時軟化後再紅燒，大腸頭口感最為軟糯Ｑ彈不韌；最後收汁大火翻拋使冰糖焦化發亮，紅潤透光且甘鹹濃郁。
