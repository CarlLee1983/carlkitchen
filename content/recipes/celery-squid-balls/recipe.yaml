    amount:
      value: 250
      unit: g
    note: 約 8 顆切厚片或對半切塊
  - name: 芹菜
    amount:
      value: 300
      unit: g
    note: 摘除老葉洗淨切 4 公分長段
  - name: 黑木耳
    amount:
      value: 30
      unit: g
    note: 泡軟切細絲
  - name: 紅辣椒
    amount:
      value: 10
      unit: g
    note: 去籽切細絲配色
  - name: 大蒜
    amount:
      value: 10
      unit: g
    note: 去皮剁蒜末
