steps:
  - text: 花枝丸切厚片或四等分大塊；芹菜摘去菜葉洗淨切 4 公分長段；黑木耳洗淨切絲、紅辣椒去籽切絲、大蒜切末備用。
    image:
      src: ./step-1.webp
      alt: 花枝丸切厚片或四等分大塊；芹菜摘去菜葉洗淨切 4 公分長段；黑木耳洗淨切絲、紅辣椒去籽切絲、大蒜切末
  - text: 炒鍋熱鍋倒入少許植物油，放入大蒜末小火爆出香氣，倒入花枝丸塊中火煸炒 2 分鐘至表面呈現微焦微金黃色澤。
  - text: 放入黑木耳絲、紅辣椒絲與芹菜段轉大火翻炒 1 分鐘，加入鹽、白胡椒粉與高湯煨炒至蔬菜斷生脆甜。
    image:
      src: ./step-3.webp
      alt: 放入黑木耳絲、紅辣椒絲與芹菜段轉大火翻炒 1 分鐘，加入鹽、白胡椒粉與高湯煨炒至蔬菜斷生脆甜。
  - text: 起鍋前滴入數滴香油快速翻勻，即可盛盤上桌。
hero:
  src: ./hero.webp
  alt: 盛盤完成的芹菜炒花枝丸
ingredientsPhoto:
