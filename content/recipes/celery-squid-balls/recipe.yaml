title: 芹菜炒花枝丸
summary: 鮮甜多汁花枝丸切厚塊，熱油爆香蒜末，投入花枝丸煸炒至表面微金黃微焦香，放入翠綠芹菜段、黑木耳絲與紅辣椒絲大火快炒，淋入少許高湯與香油燴炒收汁，爽脆多汁、海味清香。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: 以花枝丸切塊為主要海鮮主角，搭配芹菜與木耳絲快炒，屬於海鮮類料理。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [花枝丸, 芹菜, 熱炒, 家常菜, 海鮮]
aliases: [芹菜花枝丸, 芹菜炒墨魚丸]
ingredients:
