title: 豆豉苦瓜
summary: 依核准食譜指南製作之經典家常豆豉苦瓜，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [vegetable]
classificationReason: "苦瓜搭配黑豆豉燜煮入味，純蔬菜主角。"
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 20
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 苦瓜, amount: { value: 100, unit: g }, note: 原料標示 1條 }
  - { name: 嫩薑, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 豆豉, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 沙拉油, amount: { value: 100, unit: g }, note: 原料標示 500㏄ }
  - { name: 醬油膏, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
steps:
  - text: "苦瓜洗淨擦乾水分並切去頭尾橫剖去籽，切成大小一致的塊狀備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的豆豉苦瓜主要材料
  - text: "熱鍋，放入沙拉油以中火燒熱至175℃，放入作法1的苦瓜炸約2∼3分鐘，撈起瀝乾油份。"
  - text: "留約1小匙的沙拉油在油鍋，先將嫩薑炒香，加入豆豉及醬油膏，最後放入作法2的苦瓜拌勻即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味豆豉苦瓜
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之豆豉苦瓜各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
