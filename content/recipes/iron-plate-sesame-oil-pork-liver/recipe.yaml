title: 鐵板麻油豬肝
summary: 依核准食譜指南製作之經典家常鐵板麻油豬肝，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: "新鮮豬肝以黑麻油老薑片大火快炒，內臟肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 豬肝, amount: { value: 100, unit: g }, note: 原料標示 200公克 }
  - { name: 薑片, amount: { value: 100, unit: g }, note: 原料標示 50公克 }
  - { name: 芥蘭菜, amount: { value: 100, unit: g }, note: 原料標示 150公克 }
  - { name: 麻油, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 雞精粉, amount: { value: 100, unit: g }, note: 原料標示 1/4小匙 }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 1/4小匙 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 1杯 }
steps:
  - text: "豬肝洗淨切片；芥蘭洗淨，放入滾水中以大火汆燙至熟，撈出瀝乾鋪在盤中備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的鐵板麻油豬肝主要材料
  - text: "平底鍋以大火燒熱，放入麻油與薑片以小火爆香至薑片呈捲曲，再放入作法1的豬肝片及其餘調味料，蓋上鍋蓋轉大火燜煮1分鐘，起鍋鋪在作法1的盤中即可。" 
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味鐵板麻油豬肝
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之鐵板麻油豬肝各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
