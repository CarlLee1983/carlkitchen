title: 蚵仔酥
summary: 鮮蚵以少許鹽抓洗瀝乾水分，均勻沾裹地瓜粉回潮，投入油鍋以高溫炸至外皮金黃香脆、蚵肉飽滿多汁，搭配九層塔酥炸添香，佐胡椒鹽與番茄醬，台式熱炒經典滋味。
servings: 4
category: 非湯料理
dishKinds: [seafood]
classificationReason: 300 g 牡蠣逐顆裹粉炸酥，20 g 九層塔短暫過油只作添香配料。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [台式熱炒, 炸物, 海鮮, 家常菜]
aliases: [酥炸鮮蚵, 香酥蚵仔]
ingredients:
  - name: 牡蠣
    amount:
      value: 300
      unit: g
    note: 洗淨充分瀝乾水分
  - name: 地瓜粉
    amount:
      value: 150
      unit: g
    note: 約 1.5 杯沾粉用
  - name: 九層塔
    amount:
      value: 20
      unit: g
    note: 洗淨充分拭乾油炸
    group: 配菜
  - name: 胡椒鹽
    amount:
      value: 20
      unit: g
    note: 約 2 大匙沾食
    group: 調味
  - name: 番茄醬
    amount:
      value: 30
      unit: g
    note: 約 2 大匙沾食
    group: 調味
steps:
  - text: 牡蠣用少許鹽輕輕抓洗去除黏液，以清水沖洗乾淨至殘殼雜質沉澱，撈起以廚房紙巾徹底擦乾水分。
    image:
      src: ./step-1.webp
      alt: 牡蠣用少許鹽輕輕抓洗去除黏液，以清水沖洗乾淨至殘殼雜質沉澱，撈起以廚房紙巾徹底擦乾水分。
  - text: 地瓜粉倒入淺盤中，將瀝乾的牡蠣一顆顆放入均勻裹上地瓜粉，靜置 2 分鐘讓表面粉衣自然回潮附著。
    image:
      src: ./step-2.webp
      alt: 地瓜粉倒入淺盤中，將瀝乾的牡蠣一顆顆放入均勻裹上地瓜粉，靜置 2 分鐘讓表面粉衣自然回潮附著。
  - text: 熱油鍋至約 170 度，將沾粉的牡蠣逐顆滑入油鍋中，炸約 2 分鐘至外表酥脆定型後撈起瀝乾油分。
  - text: 油溫拉高投入拭乾的九層塔快速過油 5 秒撈起；將蚵仔酥與炸九層塔盛盤，附上胡椒鹽與番茄醬即可享用。
hero:
  src: ./hero.webp
  alt: 盛盤完成的蚵仔酥
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 料理食材整齊擺放於木砧板上
tip: 洗淨的牡蠣務必徹底吸乾水分再裹地瓜粉，下鍋油炸時才不會油爆噴濺；沾粉後靜置回潮片刻，油炸時粉衣緊緊吸附不脫落、外酥內嫩。
