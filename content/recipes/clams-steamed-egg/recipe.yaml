title: 蛤蜊蒸蛋
summary: 新鮮蛤蜊吐沙洗淨，雞蛋與水、鹽、糖充分打勻過濾去泡，蛋液注入深盤擺入肥美蛤蜊，入蒸鍋中小火蒸製。蛋面宛如布丁般平滑細緻，蛤蜊鮮甜原汁完全融入嫩蛋之中。
servings: 3
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 30
tags: [電鍋料理, 蒸蛋, 海鮮, 家常菜]
aliases: [水蒸蛋蛤蜊, 日式蛤蜊蒸蛋]
ingredients:
  - name: 蛤蜊
    amount:
      value: 6
      unit: 顆
    note: 吐沙洗淨
  - name: 蛋
    amount:
      value: 3
      unit: 顆
    note: 常溫新鮮雞蛋
  - name: 水
    amount:
      value: 240
      unit: ml
    note: 約 1 杯量米杯
  - name: 鹽
    amount:
      value: 5
      unit: g
    note: 約 1.5 小匙
    group: 調味
  - name: 糖
    amount:
      value: 5
      unit: g
    note: 約 1/3 大匙提鮮
    group: 調味
steps:
  - text: 蛤蜊泡入淡鹽水中靜置吐沙約 2 小時，外殼互相搓洗乾淨後瀝乾備用。
    image:
      src: ./step-1.webp
      alt: 蛤蜊泡入淡鹽水中靜置吐沙約 2 小時，外殼互相搓洗乾淨後瀝乾備用。
  - text: 將蛋打入碗中，加入鹽、糖與水，充分拌打均勻至蛋黃與蛋白完全融合。
  - text: 以細濾網過濾蛋液去除氣泡與繫帶，使蒸蛋質地細膩；將濾好的蛋汁倒入深瓷盤中，輕輕排入蛤蜊。
    image:
      src: ./step-3.webp
      alt: 以細濾網過濾蛋液去除氣泡與繫帶，使蒸蛋質地細膩；將濾好的蛋汁倒入深瓷盤中，輕輕排入蛤蜊。
  - text: 放入蒸鍋中以中火蒸約 20 分鐘；鍋蓋邊緣留出微小隙縫透氣，蒸至蛋液凝固表面平滑如鏡即可取出。
hero:
