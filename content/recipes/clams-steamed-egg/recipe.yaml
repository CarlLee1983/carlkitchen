tip: 蛋液過濾能去除氣泡與繫帶，是蒸出布丁般無孔洞滑嫩蒸蛋的關鍵；蒸煮時鍋蓋預留一條縫隙，能避免高溫水蒸氣聚集造成表面坑洞。
