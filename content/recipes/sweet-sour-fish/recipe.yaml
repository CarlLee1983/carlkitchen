tip: 魚片以全蛋抓醃能保持魚肉滑嫩，裹太白粉炸至金黃可鎖住鮮味；糖醋醬汁先在鍋中燒至濃稠勾芡再下魚片快炒，能保持外皮酥脆不回軟。
