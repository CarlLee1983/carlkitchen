steps:
  - text: 鯛魚肉洗淨斜切厚片，加入鹽、白胡椒粉、米酒與打散的雞蛋充分抓勻醃漬 2 分鐘；洋蔥、青椒與木耳洗淨切絲備用。
    image:
      src: ./step-1.webp
      alt: 鯛魚肉洗淨斜切厚片，加入鹽、白胡椒粉、米酒與打散的雞蛋充分抓勻醃漬 2 分鐘；洋蔥、青椒與木耳洗淨切
  - text: 將醃好的鯛魚肉均勻沾裹太白粉；油鍋燒熱至 150 度，放入魚片炸至外表金黃酥脆撈起瀝油。
    image:
      src: ./step-2.webp
      alt: 將醃好的鯛魚肉均勻沾裹太白粉；油鍋燒熱至 150 度，放入魚片炸至外表金黃酥脆撈起瀝油。
  - text: 熱鍋倒入少許油，放入洋蔥、青椒與木耳中火略微翻炒，加入蕃茄醬、白醋、糖與水煮滾，以太白粉水勾薄芡。
  - text: 倒入炸好的鯛魚肉快速翻炒裹滿酸甜醬汁，最後淋上香油提亮即可盛盤。
