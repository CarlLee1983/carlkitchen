title: 宮保豆腐
summary: 板豆腐切丁油炸至金黃定型，搭配乾辣椒、花椒粒與青蔥段爆香，調入豆瓣醬、白醋與糖快火收汁，起鍋撒入酥脆花生米，鹹香微辣帶甜、外酥內嫩。
servings: 3
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: 以板豆腐切丁油炸定型為唯一主角，佐以乾辣椒、花椒與花生米，屬於蛋豆類料理。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [川菜, 家常菜, 豆腐, 蛋豆類]
aliases: [川味宮保豆腐, 宮保板豆腐]
ingredients:
  - name: 板豆腐
    amount:
      value: 2
      unit: 塊
    note: 切丁狀約 400 g
  - name: 青蔥
    amount:
      value: 1
      unit: 根
    note: 洗淨切蔥段
  - name: 紅辣椒
    amount:
      value: 1
      unit: 根
    note: 切小片或段
  - name: 熟花生
    amount:
      value: 50
      unit: g
    note: 蒜味熟花生米
  - name: 沙拉油
    amount:
      value: 200
      unit: ml
    note: 炸豆腐用
    group: 調味
  - name: 豆瓣醬
    amount:
      value: 5
      unit: g
    note: 約 1 茶匙
    group: 調味
  - name: 糖
    amount:
      value: 3
      unit: g
    note: 約半茶匙
    group: 調味
  - name: 太白粉
    amount:
      value: 2
      unit: g
    note: 調兌汁勾芡
    group: 調味
  - name: 白醋
    amount:
      value: 5
      unit: ml
    note: 約半茶匙提香
    group: 調味
steps:
  - text: 板豆腐切成均勻丁塊，放入滾水中加少許鹽微燙 1 分鐘後撈起瀝乾水分；青蔥切段、紅辣椒切小片備用。
    image:
      src: ./step-1.webp
      alt: 板豆腐切成均勻丁塊，放入滾水中加少許鹽微燙 1 分鐘後撈起瀝乾水分；青蔥切段、紅辣椒切小片備用。
  - text: 豆瓣醬、糖、太白粉與白醋加入少許水調勻兌成宮保醬汁備用。
  - text: 熱鍋倒入沙拉油燒熱，放入豆腐丁中火炸至表皮金黃酥脆後撈起瀝油。
    image:
      src: ./step-3.webp
      alt: 熱鍋倒入沙拉油燒熱，放入豆腐丁中火炸至表皮金黃酥脆後撈起瀝油。
  - text: 原鍋留少許底油轉小火，放入辣椒片與蔥段炒香，倒入炸豆腐丁與宮保兌汁中火快炒裹勻，起鍋前撒入熟花生米拌炒均勻即可盛盤。
hero:
  src: ./hero.webp
  alt: 盛盤完成的宮保豆腐
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 料理食材整齊擺放於木砧板上
tip: 豆腐先用加鹽滾水汆燙能去除生豆味並使質地更緊實不易碎；炸豆腐時油溫足夠再下鍋，炸至外皮微硬再翻動可保持方正完好。
