steps:
  - text: 蝦仁挑去背部沙腸，加 1 茶匙鹽輕抓洗去黏液，用紙巾徹底吸乾水分，抓少許米酒與太白粉拌勻抓勻；生薑、大蒜切細末，青蔥分切蔥白末與蔥花備用。
    image:
      src: ./step-1.webp
      alt: 蝦仁挑去背部沙腸，加 1 茶匙鹽輕抓洗去黏液，用紙巾徹底吸乾水分，抓少許米酒與太白粉拌勻抓勻；生薑、
  - text: 熱鍋倒入適量植物油燒至 130°C 溫油，放入蝦仁滑油約 30 秒至蝦身蜷曲轉粉紅八分熟，迅速撈起瀝油備用。
    image:
      src: ./step-2.webp
      alt: 熱鍋倒入適量植物油燒至 130°C 溫油，放入蝦仁滑油約 30 秒至蝦身蜷曲轉粉紅八分熟，迅速撈起瀝
  - text: 鍋中留 1 大匙底油，放入薑末、蒜末、蔥白末與辣豆瓣醬小火炒出紅油香氣，加入番茄醬、細砂糖、白醋與 30 ml 水煮滾成濃郁紅亮乾燒醬汁。
  - text: 倒入滑好的大蝦仁轉大火快速翻拌煨燒約 20 秒，讓濃稠乾燒醬汁緊密包裹在每隻蝦球上，起鍋前撒入青翠蔥花翻勻即可盛盤。
