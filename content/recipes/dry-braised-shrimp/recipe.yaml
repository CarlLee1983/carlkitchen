tip: 蝦仁洗淨後務必用廚房紙巾徹底吸乾水分再裹薄粉，滑油時油溫不宜過高，蝦肉才能維持多汁彈脆而不乾韌；乾燒醬汁大火收濃至紅油發亮，緊緊包覆蝦仁最為美味。
