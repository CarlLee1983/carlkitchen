title: 乾燒蝦仁
summary: 鮮甜飽滿大蝦仁以少許海鹽抓洗吸乾水分裹薄太白粉，入溫油鍋滑油定型鎖住彈脆，另起熱鍋爆香薑末、蒜末、蔥白碎與豆瓣醬，加入番茄醬、白醋、糖與少許高湯，倒回大蝦仁轉大火快速乾燒收汁至紅亮黏稠，酸甜微辣、蝦肉極致爽彈、經典宴客川饌。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: 以新鮮蝦仁滑油乾燒收汁為唯一海鮮主角，屬於海鮮類料理。
