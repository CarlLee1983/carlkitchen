title: 金沙豆腐
summary: 熟透鹹鴨蛋黃細細壓碎入低溫油鍋微火慢煸，炒至金黃起滿綿密如沙的細緻油泡，投入表面炸至酥脆硬挺的雞蛋豆腐厚切丁，轉中大火快速翻拋包裹，起鍋撒入青翠蔥花與辣椒碎，豆腐外酥內嫩如布丁、表面裹滿鹹香甘潤金沙蛋黃，極致香濃下飯。
servings: 3
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: 以雞蛋豆腐裹熟鹹蛋黃（金沙）翻炒為唯一主角，屬於蛋豆類料理。
