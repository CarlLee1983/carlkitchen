tip: 鹹蛋黃先蒸熱再徹底壓細碎，下鍋時以小火慢煸至起滿綿密金黃細泡，這一步是金沙能否絲滑均勻裹上豆腐的關鍵；豆腐炸硬挺後下鍋快速翻拋十五秒即出鍋，保持外酥內嫩絕佳口感。
