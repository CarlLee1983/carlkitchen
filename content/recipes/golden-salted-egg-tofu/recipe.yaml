steps:
  - text: 雞蛋豆腐切成 2 公分均勻方塊，用紙巾輕輕吸去水分，均勻沾裹上一層薄地瓜粉；熟鹹蛋黃蒸熱後用刀背徹底壓碎成細膩沙狀；青蔥切細花、大蒜切末、紅辣椒切碎備用。
    image:
      src: ./step-1.webp
      alt: 雞蛋豆腐切成 2 公分均勻方塊，用紙巾輕輕吸去水分，均勻沾裹上一層薄地瓜粉；熟鹹蛋黃蒸熱後用刀背徹底
  - text: 油鍋燒熱至 170°C，放入沾粉豆腐丁以中大火油炸約 3 分鐘，至表面呈現金黃硬挺酥脆外殼，撈起充分瀝油備用。
    image:
      src: ./step-2.webp
      alt: 油鍋燒熱至 170°C，放入沾粉豆腐丁以中大火油炸約 3 分鐘，至表面呈現金黃硬挺酥脆外殼，撈起充分
  - text: 另取炒鍋倒入 1 大匙油加熱，轉微火倒入壓碎的鹹蛋黃泥，以鍋鏟不斷繞圈慢炒約 1 分鐘，至蛋黃完全融化膨起綿密金黃細泡（金沙狀）。
  - text: 倒入蒜末、辣椒碎略炒出香，倒入炸酥的雞蛋豆腐丁、細砂糖與白胡椒粉，轉大火迅速翻拋翻炒約 15 秒使金沙均勻裹滿豆腐，撒入蔥花翻勻即可熄火盛盤。
