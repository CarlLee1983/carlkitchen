title: 五行蔬菜湯
summary: 紅白蘿蔔、牛蒡、乾香菇和白蘿蔔葉放入電鍋煮成蔬菜湯。
servings: 4
category: 湯
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 60
tags: [家常湯]
ingredients:
  - { name: 紅蘿蔔, amount: { value: 100, unit: g }, note: 去皮切小塊 }
  - { name: 白蘿蔔, amount: { value: 150, unit: g }, note: 去皮切小塊 }
  - { name: 白蘿蔔葉, amount: { value: 80, unit: g }, note: 洗淨切開 }
  - { name: 牛蒡, amount: { value: 80, unit: g }, note: 去皮切片 }
  - { name: 乾香菇, amount: { value: 10, unit: 朵 } }
  - { name: 薑片, amount: { value: 10, unit: g } }
  - { name: 水, amount: { value: 1000, unit: ml } }
  - { name: 外鍋用水, amount: { value: 1, unit: 杯 }, note: 電鍋外鍋用 }
  - {
      name: 鹽,
      amount: { value: 7.5, unit: ml },
      note: 約 1 又 1/2 茶匙,
      group: 調味,
    }
  - {
      name: 紹興酒,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙,
      group: 調味,
    }
steps:
  - text: 洗淨紅蘿蔔與白蘿蔔，削皮後切成小塊；牛蒡削皮切片；白蘿蔔葉沖洗後切開。
    image:
      src: ./step-1.webp
      alt: 木砧板上分開擺著紅蘿蔔小塊、白蘿蔔小塊、牛蒡片與切開的白蘿蔔葉，旁邊放著菜刀
  - text: 把切好的紅蘿蔔、白蘿蔔、白蘿蔔葉與牛蒡，連同乾香菇、薑片放進電鍋內鍋，再加水和紹興酒。
    image:
      src: ./step-2.webp
      alt: 銀色不鏽鋼電鍋內鍋中，生紅白蘿蔔塊、白蘿蔔葉、牛蒡片、乾香菇與薑片分開浸在水中
  - text: 在外鍋倒 1 杯外鍋用水，蓋好鍋蓋後按下開關；等開關跳起，再加鹽調味。
    image:
      src: ./step-3.webp
      alt: 打開鍋蓋的電鍋內鍋中，紅白蘿蔔塊、白蘿蔔葉、牛蒡片、香菇與薑片煮成清湯
hero:
  src: ./hero.webp
  alt: 敞口素色湯鍋中盛著五行蔬菜清湯，可見紅白蘿蔔塊、白蘿蔔葉、牛蒡片、香菇與薑片
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 紅白蘿蔔小塊、白蘿蔔葉、牛蒡片、十朵乾香菇與薑片分開擺放，旁邊是水、紹興酒與鹽
