title: 小黃瓜醬爆雞丁
summary: 雞胸肉切丁醃過後快炒，再和甜麵醬、小黃瓜、辣椒拌炒。
servings: 2
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 40
tags: [雞肉, 快炒]
ingredients:
  - { name: 去骨雞胸肉, amount: { value: 0.5, unit: 個 }, note: 切丁 }
  - { name: 小黃瓜, amount: { value: 1, unit: 條 } }
  - { name: 紅辣椒, amount: { value: 2, unit: 支 } }
  - { name: 青蔥, amount: { value: 1, unit: 支 } }
  - { name: 大蒜, amount: { value: 2, unit: 瓣 } }
  - {
      name: 食用油,
      amount: { value: 75, unit: ml },
      note: 約 5 大匙，炒雞丁用，爆香另留少許,
      group: 調味,
    }
  - { name: 甜麵醬, amount: { value: 2, unit: 大匙 }, group: 調味 }
  - { name: 糖, amount: { value: 1, unit: 大匙 }, note: 炒醬用, group: 調味 }
  - { name: 糖, amount: { value: 1, unit: 小匙 }, note: 醃料, group: 調味 }
  - {
      name: 醬油,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙,
      group: 調味,
    }
  - { name: 水, note: 來源標示適量, group: 調味 }
  - { name: 鹽, amount: { value: 1, unit: 小匙 }, note: 醃料, group: 調味 }
  - {
      name: 太白粉,
      amount: { value: 0.5, unit: 大匙 },
      note: 醃料,
      group: 調味,
    }
  - { name: 蛋白, amount: { value: 0.5, unit: 顆 }, note: 醃料, group: 調味 }
  - {
      name: 酒,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙；醃料，來源未指明種類,
      group: 調味,
    }
steps:
  - text: 去骨雞胸肉切丁，加入醃料的糖、鹽、太白粉、蛋白與酒，醃約 20 分鐘。
    image:
      src: ./step-1.webp
      alt: 白色瓷碗裡的生雞胸肉丁拌著醃料與太白粉，碗邊有一支攪拌用湯匙
  - text: 小黃瓜洗淨、切掉頭尾後切小丁；紅辣椒去籽切菱形片，青蔥切段，大蒜切片。
    image:
      src: ./step-2.webp
      alt: 砧板上分開放著小黃瓜丁、去籽的紅辣椒菱形片、蔥段與蒜片，旁邊有菜刀
  - text: 鍋中倒入食用油，油熱後以大火快炒雞丁，炒熟後撈起瀝油。
    image:
      src: ./step-3.webp
      alt: 鋼製炒鍋裡的雞胸肉丁已炒到表面變色，邊緣略帶焦黃
  - text: 鍋中留少許油，以大火炒香青蔥與大蒜，加入甜麵醬、剩餘的糖、醬油和水煮開，再放回雞丁。
    image:
      src: ./step-4.webp
      alt: 鋼製炒鍋裡的雞丁、蔥段與蒜片正拌著深褐色甜麵醬汁
  - text: 加入小黃瓜與紅辣椒，炒勻後起鍋。
    image:
      src: ./step-5.webp
      alt: 鋼製炒鍋裡的雞丁、小黃瓜丁、紅辣椒片、蔥段與蒜片拌著甜麵醬汁
hero:
  src: ./hero.webp
  alt: 素色瓷盤裡盛著沾有甜麵醬的雞胸肉丁、小黃瓜丁、紅辣椒片、蔥段與蒜片
ingredientsPhoto:
