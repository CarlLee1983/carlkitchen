title: 炸魷魚鬚
summary: 依核准食譜指南製作之經典家常炸魷魚鬚，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: "魷魚鬚裹粉炸至金黃酥脆，海鮮主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 魷魚鬚, amount: { value: 100, unit: g }, note: 原料標示 250公克 }
  - { name: 九層塔, amount: { value: 100, unit: g }, note: 原料標示 5公克 }
  - { name: 蒜泥, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 蛋液, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 蕃薯粉, amount: { value: 100, unit: g }, note: 原料標示 200公克 }
  - { name: 黃豆粉, amount: { value: 100, unit: g }, note: 原料標示 30公克 }
  - { name: A.太白粉, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
  - { name: 白胡椒粉, amount: { value: 100, unit: g }, note: 原料標示 1/2小匙 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: B.胡椒鹽, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
steps:
  - text: "魷魚鬚洗淨後，並瀝乾水分備用，切成適當長度的條狀，如有頭部則將魷魚頭切成小塊狀。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的炸魷魚鬚主要材料
  - text: "將步驟1放入大碗中，加入蒜泥、蛋液及A料拌勻並醃2小時至入味。" 
  - text: "蕃薯粉與黃豆粉混合均勻成黃金蕃薯粉。將醃至入味的魷魚鬚均勻沾裹上黃金蕃薯粉裹衣。" 
  - text: "魷魚鬚放入180℃的熱油中以中火炸約1分鐘，待魷魚鬚浮起時再以漏勺集中盛起。" 
  - text: "將九層塔放入漏勺中，與魷魚鬚一起放入過油約2秒鐘。撈起瀝油，並趁熱撒上B料即可。" 
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味炸魷魚鬚
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之炸魷魚鬚各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
