title: 番茄燒雞肉
summary: 雞腿塊與番茄、洋蔥同煮，番茄醬、糖和水形成燒煮醬汁。
servings: 4
category: 非湯料理
dishKinds: [meat]
classificationReason: 雞腿塊 500 g 先炒後燒煮，番茄 200 g 與番茄醬、水共同形成燒雞醬汁。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 35
tags: [家常菜]
hero: { src: ./hero.webp, alt: 白色陶盤盛著番茄醬汁裡的雞腿塊、番茄與洋蔥。 }
ingredientsPhoto:
  {
    src: ./ingredients.webp,
    alt: 雞腿塊、番茄塊、洋蔥塊、蒜末與調味料分別擺放。,
  }
ingredients:
  - {
      name: 台灣棒棒腿,
      amount: { value: 500, unit: g },
      note: 剁成約 2 公分的小塊,
    }
  - { name: 番茄, amount: { value: 200, unit: g }, note: 切塊 }
  - { name: 洋蔥, amount: { value: 60, unit: g }, note: 切塊 }
  - { name: 蒜末, amount: { value: 10, unit: g } }
  - {
      name: 番茄醬,
      amount: { value: 60, unit: ml },
      note: 約 4 大匙,
      group: 調味,
    }
  - { name: 糖, amount: { value: 12, unit: g }, note: 約 1 大匙, group: 調味 }
  - { name: 水, amount: { value: 200, unit: ml }, group: 調味 }
  - { name: 炒油, note: 少許, group: 調味 }
steps:
  - text: 番茄與洋蔥切塊；台灣棒棒腿剁成邊長約 2 公分的小塊。
    image:
      {
        src: ./step-1.webp,
        alt: 木砧板上分別放著剁小塊的雞腿、番茄塊與洋蔥塊。,
      }
  - text: 熱鍋倒入少許炒油，轉中小火先把洋蔥與蒜末煸出香氣，再下雞腿塊翻炒，直到外層轉白。
    image:
      {
        src: ./step-2.webp,
        alt: 黑色雙耳鍋裡，表面已炒白的雞腿塊與半透明洋蔥塊、蒜末混在一起。,
      }
  - text: 接著放進番茄、番茄醬、糖與水，闔上鍋蓋，改用小火續煮約 20 分鐘。
    image:
      {
        src: ./step-3.webp,
        alt: 黑色鍋中雞腿塊、番茄與洋蔥在紅色醬汁裡燒煮，鍋蓋半掀。,
      }
