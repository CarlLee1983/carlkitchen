steps:
  - text: 花枝撕除外膜洗淨，內側斜切十字花刀後切成適口大片；綠竹筍與胡蘿蔔切薄片；青蔥切段、生薑切片、大蒜切末、紅辣椒切斜片備用。
    image:
      src: ./step-1.webp
      alt: 花枝撕除外膜洗淨，內側斜切十字花刀後切成適口大片；綠竹筍與胡蘿蔔切薄片；青蔥切段、生薑切片、大蒜切末
  - text: 煮一鍋滾水，將刻花花枝片、筍片與胡蘿蔔片放入熱水中汆燙 15 秒至花枝片微微捲曲立刻撈起瀝乾水分保脆。
    image:
      src: ./step-2.webp
      alt: 煮一鍋滾水，將刻花花枝片、筍片與胡蘿蔔片放入熱水中汆燙 15 秒至花枝片微微捲曲立刻撈起瀝乾水分保脆
  - text: 炒鍋加熱倒入植物油，小火爆香蒜末、生薑片、青蔥段與辣椒片，倒入汆燙好的花枝、筍片與胡蘿蔔片，淋入米酒與醬油大火快炒 20 秒。
  - text: 加入細砂糖、白胡椒粉與 50 ml 水煮滾，倒入太白粉水勾薄芡使湯汁光亮黏稠，起鍋前沿鍋邊淋入烏醋快炒翻勻即可盛盤。
