title: 生炒花枝
summary: 厚實新鮮花枝內側劃斜菱形十字花刀切片，滾水快燙捲曲保持脆彈，熱油鍋爆香蒜末、薑片、蔥段與辣椒片，投入清甜竹筍薄片與胡蘿蔔片大火快炒，淋入烏醋、白糖、米酒與薄芡翻炒收汁，酸甜爽口、花枝爽脆鮮嫩，經典夜市熱炒美味。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: 以新鮮花枝刻花過水快炒為唯一海鮮主角，搭配竹筍與胡蘿蔔片，屬於海鮮類料理。
