title: 肉絲炒麵
summary: 豬肉絲以醬油醃漬入味，起油鍋煸香洋蔥絲與蔥段，加入爽脆高麗菜絲、青江菜與肉絲大火快炒，投入彈牙烏龍麵條與高湯燜炒收汁，麵條吸滿鮮濃肉汁與蔬菜甘甜，鹹香濃郁、麵香十足。
servings: 2
category: 主食
dishKinds: []
classificationReason: 以麵條為主體搭配肉絲與蔬菜熱炒，可獨立作為一餐，屬於主食料理。
