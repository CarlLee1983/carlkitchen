steps:
  - text: 豬肉切均勻細絲加少許醬油抓勻醃漬；高麗菜切粗絲、青江菜切段、洋蔥切細絲、青蔥切段備用。
    image:
      src: ./step-1.webp
      alt: 豬肉切均勻細絲加少許醬油抓勻醃漬；高麗菜切粗絲、青江菜切段、洋蔥切細絲、青蔥切段備用。
  - text: 熱鍋倒入香油與少許植物油，放入洋蔥絲與蔥段中火煸炒出甜香，倒入醃好的豬肉絲大火快炒至肉色轉白八分熟。
  - text: 放入高麗菜絲與青江菜段大火翻炒均勻，倒入烏龍麵條、清水、醬油與白胡椒粉，蓋鍋蓋中小火燜煮約 2 分鐘讓麵條吸收鮮美醬汁。
    image:
      src: ./step-3.webp
      alt: 放入高麗菜絲與青江菜段大火翻炒均勻，倒入烏龍麵條、清水、醬油與白胡椒粉，蓋鍋蓋中小火燜煮約 2 分鐘
  - text: 揭蓋轉大火快速翻拌收乾多餘湯汁，淋入香油翻勻即可盛盤。
