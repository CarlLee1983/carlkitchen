steps:
  - text: 豬肝切成約 0.5 公分厚片，置於流動冷水中沖洗漂淨血水，用餐巾紙徹底吸乾表面水分，加入米酒、鹽與地瓜粉抓勻醃漬 5 分鐘；老薑切薄片；菠菜摘取嫩葉備用。
    image:
      src: ./step-1.webp
      alt: 盤中放著豬肝切片，旁邊擺著老薑、薑片、菠菜與一瓶油。
  - text: 起炒鍋倒入植物油燒至中高溫，放入抓粉豬肝片快速滑油約 15 秒至豬肝表面微變色七分熟，迅速撈起瀝乾油分。
    image:
      src: ./step-2.webp
      alt: 豬肝片在炒鍋的油中加熱，表面逐漸轉褐，周圍冒著氣泡。
  - text: 原鍋擦乾，倒入純黑麻油與老薑薄片，以中小火慢慢煸炒 2 分鐘至薑片邊緣微微捲曲散發濃郁薑香（注意火候避免麻油焦苦）。
  - text: 轉大火倒入滑好的豬肝片與菠菜葉，淋入米酒、細砂糖快速翻炒 15 秒至菠菜變軟、豬肝剛好熟透無血水，立即熄火盛盤。
