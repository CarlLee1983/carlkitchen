title: 麻油豬肝
summary: 新鮮粉嫩豬肝切厚片以清水充分漂洗血水擦乾，抓拌米酒與少許薄地瓜粉，入熱油鍋快速滑油十秒鎖住脆嫩，另起鍋以香醇純黑麻油小火煸香老薑薄片至邊緣微捲曲金黃，倒入滑熟豬肝與鮮嫩菠菜葉轉大火快速翻炒，嗆入米酒收汁，豬肝軟嫩粉嫩無腥味、麻油薑香溫潤暖身。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: 以新鮮豬肝切片黑麻油快炒為唯一肉類主角，屬於肉類料理。
