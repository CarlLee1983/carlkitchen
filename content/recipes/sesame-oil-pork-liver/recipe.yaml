tip: 豬肝切片後先用冷水沖洗去除多餘血水，吸乾水氣裹薄地瓜粉先滑油十五秒撈起，是豬肝脆嫩如布丁、入口化渣絕不乾硬變柴的關鍵技巧；黑麻油以中小火慢煸老薑片，不可大火燒焦以防苦味。
