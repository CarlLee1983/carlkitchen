steps:
  - text: 牛腩洗淨切塊以滾水燙過洗淨；白蘿蔔與紅蘿蔔去皮切塊；番茄洗淨去蒂切塊；洋蔥切片備用。
    image:
      src: ./step-1.webp
      alt: 牛腩洗淨切塊以滾水燙過洗淨；白蘿蔔與紅蘿蔔去皮切塊；番茄洗淨去蒂切塊；洋蔥切片備用。
  - text: 電鍋內鍋倒入少許油，放入洋蔥片、薑片與蔥段，加入牛腩塊、半量番茄塊、辣豆瓣醬與米酒拌勻，外鍋加 1 杯水蒸煮至開關跳起燜 10 分鐘。
  - text: 內鍋加入白蘿蔔塊、紅蘿蔔塊、剩餘番茄塊、醬油、糖、鹽與水，外鍋加 1.5 杯水續蒸至開關跳起燜 15 分鐘至牛腩軟爛酥香即可盛碗。
    image:
      src: ./step-3.webp
      alt: 內鍋加入白蘿蔔塊、紅蘿蔔塊、剩餘番茄塊、醬油、糖、鹽與水，外鍋加 1.5 杯水續蒸至開關跳起燜 15
  - text: 將燉好的番茄牛肉湯盛入大碗中，撒上少許蔥花增添清香即可趁熱享用。
