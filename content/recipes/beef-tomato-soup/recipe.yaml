title: 番茄燉牛肉湯
summary: 牛腩洗淨沖燙去血水，與洋蔥片、薑片、蔥段、番茄塊與辣豆瓣醬、米酒入電鍋燉出底蘊，再加入白蘿蔔、紅蘿蔔塊與其餘番茄及滷包慢燉至牛腩軟嫩化口，湯頭酸甜甘醇、肉香濃郁。
servings: 4
category: 湯
dishKinds: []
classificationReason: 牛腩、番茄與紅白蘿蔔加 1300 ml 水燉成湯，依湯類用途不設料理主角標籤。
