tip: 高麗菜用手撕比用刀切更能保留細胞壁完整，醃出來質地格外爽脆；抓鹽殺青後用冷開水漂洗乾淨，並務必將水分甩至極乾，糖醋汁才能完全滲透進菜葉纖維中。
