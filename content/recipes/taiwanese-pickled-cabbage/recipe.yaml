steps:
  - text: 高麗菜洗淨瀝乾，以雙手撕成約 5 公分均勻大片，去除粗硬菜梗；胡蘿蔔刨細絲；大蒜切片、紅辣椒切斜薄片備用。
    image:
      src: ./step-1.webp
      alt: 高麗菜洗淨瀝乾，以雙手撕成約 5 公分均勻大片，去除粗硬菜梗；胡蘿蔔刨細絲；大蒜切片、紅辣椒切斜薄片
  - text: 高麗菜片與胡蘿蔔絲放入大盆中，撒入鹽以雙手輕輕揉抓拌勻，靜置 30 分鐘讓菜葉出苦水軟化。
    image:
      src: ./step-2.webp
      alt: 高麗菜片與胡蘿蔔絲放入大盆中，撒入鹽以雙手輕輕揉抓拌勻，靜置 30 分鐘讓菜葉出苦水軟化。
  - text: 將出水的高麗菜倒掉澀水，置於流動冷開水下漂洗 5 分鐘洗去多餘鹹度，撈起以蔬菜脫水器徹底甩乾水分（水分越乾越脆嫩）。
  - text: 大玻璃保鮮盒中倒入白醋、細砂糖、蒜片與辣椒片充分攪拌至糖完全融化成糖醋汁，放入瀝乾的高麗菜片充分抓拌翻勻，加蓋置於冰箱冷藏浸漬 24 小時即可享用極致酸甜爽脆。
