title: 台式脆泡菜
summary: 台灣本產高麗菜純手撕成適口大片，搭配鮮甜胡蘿蔔絲，以鹽輕柔抓醃半小時去除生澀菜水，流動冷開水漂洗瀝乾，拌入甘醇白醋、純細白糖、生蒜片與新鮮辣椒片冷藏浸漬一天，晶瑩剔透、酸甜脆口、臭豆腐與炸物絕配解膩小菜。
servings: 4
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 以高麗菜為唯一蔬菜主角，調入醋糖醃漬涼拌，屬於純蔬菜涼拌料理。
draft: false
