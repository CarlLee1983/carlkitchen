title: 蔥油餅
summary: 中筋麵粉以溫水燙麵揉成光滑麵糰鬆弛，擀開均勻抹上豬油、青蔥蔥花、紅蔥酥與白芝麻捲成螺旋麵糰，入熱鍋煎至雙面金黃酥脆、內層絲縷分明，蔥香濃烈、外脆內 Q。
servings: 3
category: 主食
draft: false
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 45
tags: [麵食, 經典小吃, 煎餅, 台式小吃]
