steps:
  - text: 將中筋麵粉放入盆中，緩緩注入溫水攪拌成雪花狀，揉成光滑麵糰後蓋上保鮮膜，靜置鬆弛 15 分鐘。
    image:
      src: ./step-1.webp
      alt: 將中筋麵粉放入盆中，緩緩注入溫水攪拌成雪花狀，揉成光滑麵糰後蓋上保鮮膜，靜置鬆弛 15 分鐘。
  - text: 將蔥花、紅蔥酥、白芝麻、豬油與鹽混合拌勻成香濃蔥油內餡，分成三等份備用。
  - text: 將鬆弛好的麵糰分成三份擀成大圓薄片，均勻抹上蔥油內餡後捲成圓柱長條，再由一端向內盤捲成螺旋餅狀，蓋保鮮膜鬆弛 10 分鐘後擀平成圓餅。
    image:
      src: ./step-3.webp
      alt: 將鬆弛好的麵糰分成三份擀成大圓薄片，均勻抹上蔥油內餡後捲成圓柱長條，再由一端向內盤捲成螺旋餅狀，蓋保
  - text: 平底鍋中火燒熱倒入適量油，放入蔥油餅皮慢煎至兩面金黃酥脆，用鍋鏟由四周往中心拍擠出層次即可出鍋。
