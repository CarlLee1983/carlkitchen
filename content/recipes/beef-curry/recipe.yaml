title: 咖哩牛肉
summary: 牛臀肉先與蘋果、月桂葉燉煮，再和炒香的蔬菜、咖哩粉合鍋慢燉。
servings: 4
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 120
tags: [家常菜]
ingredients:
  - { name: 牛臀肉, amount: { value: 400, unit: g }, note: 切大塊 }
  - { name: 洋蔥, amount: { value: 1, unit: 顆 }, note: 切碎 }
  - { name: 蒜頭, amount: { value: 15, unit: g }, note: 切碎 }
  - { name: 西洋芹, amount: { value: 50, unit: g }, note: 切碎 }
  - { name: 紅蘿蔔, amount: { value: 50, unit: g }, note: 切碎 }
  - { name: 薑, amount: { value: 8, unit: g }, note: 切碎 }
  - { name: 番茄, amount: { value: 1, unit: 顆 }, note: 切碎 }
  - {
      name: 蘋果,
      amount: { value: 0.33, unit: 顆 },
      note: 約三分之一顆，切小塊,
    }
  - {
      name: 奶油,
      amount: { value: 60, unit: g },
      note: 分兩次各用 30 g,
      group: 調味,
    }
  - { name: 月桂葉, amount: { value: 1, unit: 片 }, group: 調味 }
  - { name: 低筋麵粉, amount: { value: 15, unit: g }, group: 調味 }
  - { name: 牛高湯, amount: { value: 1600, unit: ml }, group: 調味 }
  - { name: 米酒, amount: { value: 25, unit: ml }, group: 調味 }
  - { name: 咖哩粉, amount: { value: 25, unit: g }, group: 調味 }
  - { name: 鹽, note: 來源寫適量, group: 調味 }
  - { name: 粗粒黑胡椒粉, note: 來源寫適量, group: 調味 }
  - { name: 糖, note: 來源寫適量, group: 調味 }
steps:
  - text: 牛臀肉切大塊；洋蔥、蒜頭、西洋芹、紅蘿蔔、薑和番茄切碎，蘋果切小塊。
    image:
      src: ./step-1.webp
      alt: 木砧板上分開放著牛臀肉塊，以及切碎的洋蔥、蒜頭、西洋芹、紅蘿蔔、薑、番茄和蘋果
  - text: 熱鍋放入 30 g 奶油和月桂葉，以小火炒香。加入牛臀肉、蘋果、鹽、粗粒黑胡椒粉和糖，拌炒約 3 至 5 分鐘至牛肉變色。
    image:
      src: ./step-2.webp
      alt: 雙耳深鍋裡的牛臀肉塊已煎至表面變色，與蘋果塊、月桂葉放在一起
  - text: 倒入牛高湯和米酒，續煮約 45 分鐘。
  - text: 另起一鍋，以剩下 30 g 奶油炒香洋蔥、蒜頭、西洋芹、紅蘿蔔、薑和番茄，再加入低筋麵粉和咖哩粉炒出香味。
    image:
      src: ./step-4.webp
      alt: 雙耳深鍋裡的洋蔥、西洋芹、紅蘿蔔和番茄碎裹著褐色咖哩粉醬料
  - text: 將燉好的牛肉和湯汁倒入咖哩鍋，以小火再燉約 50 分鐘。
    image:
      src: ./step-5.webp
      alt: 雙耳深鍋裡的牛臀肉塊和蔬菜浸在濃褐色咖哩醬中，表面有一片月桂葉
hero:
  src: ./hero.webp
  alt: 米白色瓷碗中盛著褐色咖哩牛肉，牛肉塊周圍可見紅蘿蔔、西洋芹與番茄
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 牛臀肉塊、洋蔥、蒜頭、西洋芹、紅蘿蔔、薑、番茄、蘋果，以及分裝的奶油、月桂葉、麵粉、咖哩粉、調味料和牛高湯
