tip: 海鮮切成均勻小丁熟成速度快，下鍋燙一分鐘剛剛好熟透且鮮甜軟嫩；勾好芡汁後再淋入蛋液輕推，蛋花才會漂浮散開成薄如蟬翼的細緻絲緞。
