steps:
  - text: 蝦仁與花枝切成約 1 公分小丁加少許米酒抓勻；嫩豆腐切均勻小方丁；胡蘿蔔切細末、芹菜切細末、生薑切細末；雞蛋打成蛋液備用。
    image:
      src: ./step-1.webp
      alt: 蝦仁與花枝切成約 1 公分小丁加少許米酒抓勻；嫩豆腐切均勻小方丁；胡蘿蔔切細末、芹菜切細末、生薑切細
  - text: 取湯鍋注入 800 ml 高湯煮滾，放入薑末、胡蘿蔔末與豆腐丁大火煮滾 2 分鐘，倒入蝦仁丁與花枝丁煮約 1 分鐘至海鮮變色熟透。
    image:
      src: ./step-2.webp
      alt: 取湯鍋注入 800 ml 高湯煮滾，放入薑末、胡蘿蔔末與豆腐丁大火煮滾 2 分鐘，倒入蝦仁丁與花枝丁
  - text: 轉中火加入鹽、白胡椒粉調味，一邊攪動湯汁一邊緩緩倒入太白粉水勾芡至晶亮濃稠，轉小火以細流淋入打勻蛋液，用湯勺順時針輕推劃出美麗蛋花。
  - text: 熄火前撒入芹菜末並淋上香油，輕輕拌勻即可盛入大湯碗享用。
