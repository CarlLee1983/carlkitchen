title: 海鮮豆腐羹
summary: 鮮蝦仁、軟嫩花枝丁、鮮蚵與滑嫩豆腐丁切精緻小丁，熱高湯中煮出鮮美海味，調入鹽、白胡椒粉與淡醬油，以太白粉水勾出如絲綢般滑潤濃羹，淋入金黃蛋液推劃出細緻蛋花，滴入純釀香油、撒上翠綠芹菜碎，鮮甜滑潤、極致暖胃。
servings: 3
category: 湯
dishKinds: []
classificationReason: 海鮮豆腐羹為經典濃稠燴羹湯品，湯品不設料理主角與配餐角色。
