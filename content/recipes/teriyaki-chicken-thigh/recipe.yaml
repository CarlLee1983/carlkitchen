tip: 煎雞腿時皮朝下冷鍋慢慢煎，能自然逼出雞皮內部多餘油脂，煎出如烤鴨皮般極致薄脆的外皮；倒照燒醬前務必用紙巾吸去鍋內油脂，照燒醬汁才能均勻黏附乳化，呈現晶亮琥珀色澤。
