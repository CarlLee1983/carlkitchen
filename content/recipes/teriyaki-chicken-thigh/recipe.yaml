title: 照燒雞腿排
summary: 厚實去骨去軟骨新鮮雞腿排皮朝下入乾熱平底鍋，慢火乾煎逼出天然雞油並將雞皮煎至金黃薄脆硬挺，翻面煎至熟透，倒入以純釀醬油、味醂、米酒與冰糖調製的經典甘甜照燒醬汁微火慢煨收汁，醬汁濃稠紅亮緊裹雞腿，切厚塊盛盤撒上熟白芝麻，鮮嫩多汁、鹹甜濃郁。
servings: 2
category: 非湯料理
dishKinds: [meat]
classificationReason: 以厚切去骨雞腿排煎烤照燒收汁為唯一肉類主角，屬於肉類料理。
draft: false
mealCandidate: true
