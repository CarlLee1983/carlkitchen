steps:
  - text: 去骨雞腿排洗淨用紙巾徹底吸乾水分，肉質厚處斜劃兩刀切斷白筋防止回縮；碗中將醬油、味醂、米酒、細砂糖與生薑汁攪拌均勻調成照燒醬汁備用。
    image:
      src: ./step-1.webp
      alt: 去骨雞腿排洗淨用紙巾徹底吸乾水分，肉質厚處斜劃兩刀切斷白筋防止回縮；碗中將醬油、味醂、米酒、細砂糖與
  - text: 乾淨平底鍋不需放油，將雞腿排雞皮朝下放入冷鍋中，開中小火慢煎約 6 分鐘逼出雞皮油脂，煎至雞皮呈現金黃酥脆硬挺。
    image:
      src: ./step-2.webp
      alt: 乾淨平底鍋不需放油，將雞腿排雞皮朝下放入冷鍋中，開中小火慢煎約 6 分鐘逼出雞皮油脂，煎至雞皮呈現金
  - text: 將雞腿排翻面，用紙巾吸除鍋內多餘油脂，續煎約 4 分鐘至肉質八分熟。
  - text: 倒入調好的照燒醬汁轉小火慢煨，一邊將醬汁反覆澆淋在雞腿表面，煨煮約 3 分鐘至醬汁濃稠紅亮起大泡並均勻裹附，熄火取出切塊排盤，撒上熟白芝麻即可上桌。
