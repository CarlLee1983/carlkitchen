title: 台式胡椒蝦
summary: 嚴選鮮活肥美大白蝦修剪長鬚與蝦槍，薄拍細麵粉入高溫油鍋大火油炸至蝦殼紅亮酥脆，另起熱鍋爆香蒜片、青蔥段與辣椒片，倒入炸酥大蝦，撒入大量濃烈純白胡椒粉、海鹽與純香油，大火快速翻拋乾烘至胡椒香氣緊緊烘烤附著於酥脆蝦殼上，胡椒香氣撲鼻、蝦肉緊實鮮甜、經典啤酒熱炒名菜。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: 以整隻大白蝦乾炸胡椒乾烘為唯一海鮮主角，屬於海鮮類料理。
