steps:
  - text: 白蝦洗淨剪除頭部尖槍、蝦鬚與尾部尖刺，以牙籤從背部挑出沙腸，用餐巾紙徹底吸乾表面水分；青蔥切段、大蒜切片、紅辣椒切斜片備用。
    image:
      src: ./step-1.webp
      alt: 白蝦洗淨剪除頭部尖槍、蝦鬚與尾部尖刺，以牙籤從背部挑出沙腸，用餐巾紙徹底吸乾表面水分；青蔥切段、大蒜
  - text: 油鍋燒熱至 180°C 高溫，放入白蝦大火油炸約 2 分鐘，至蝦殼表面鮮紅酥脆硬挺、蝦身微曲，迅速撈起瀝乾油分。
    image:
      src: ./step-2.webp
      alt: 油鍋燒熱至 180°C 高溫，放入白蝦大火油炸約 2 分鐘，至蝦殼表面鮮紅酥脆硬挺、蝦身微曲，迅速撈
  - text: 另取乾淨炒鍋倒入 1 茶匙油熱鍋，放入蒜片、青蔥段與辣椒片以中火爆出濃郁辛香。
  - text: 倒入炸酥的白蝦，淋入米酒嗆鍋，均勻撒入大量白胡椒粉與鹽，滴入香油，轉大火迅速翻拋翻炒約 20 秒，讓胡椒香氣徹底乾烘附著在酥脆蝦殼表面即可盛盤上桌。
