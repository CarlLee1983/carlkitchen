tip: 蝦洗淨後剪去蝦鬚蝦槍並務必吸乾水分，高溫炸至外殼硬挺酥香；炒時大火快速撒入白胡椒粉翻拋乾烘二十秒，讓胡椒辛香熱氣徹底附著在蝦殼上，連殼都能酥香嚼食。
