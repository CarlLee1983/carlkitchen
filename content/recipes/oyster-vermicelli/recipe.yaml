title: 蚵仔麵線
summary: 依核准食譜指南製作之經典家常蚵仔麵線，風味道地鮮明。
servings: 3
category: 主食
dishKinds: []
classificationReason: "鮮蚵裹地瓜粉汆燙拌入紅麵線柴魚羹湯之經典台灣小吃主食。"
draft: false
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 30
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 鮮蚵, amount: { value: 350.0, unit: g }, note: 原料標示 350公克 }
  - { name: 紅蔥末, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 蒜末, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 香菜, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 柴魚片, amount: { value: 30.0, unit: g }, note: 原料標示 30公克 }
  - { name: 紅麵線, amount: { value: 300.0, unit: g }, note: 原料標示 300公克 }
  - { name: 地瓜粉, amount: { value: 150.0, unit: g }, note: 原料標示 150公克 }
  - { name: 蒜泥, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 高湯, amount: { value: 2000.0, unit: g }, note: 原料標示 2000㏄ }
  - { name: A.鹽, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 醬油, amount: { value: 3.0, unit: g }, note: 原料標示 3大匙 }
  - { name: 雞粉, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 冰糖, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: B.烏醋, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 太白粉水, amount: { value: 100, unit: g }, note: 原料標示 適量 }
steps:
  - text: "鮮蚵洗淨瀝乾水份，再沾裹上地瓜粉放入滾水中汆燙至熟撈出備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之蚵仔麵線主要材料
  - text: "紅麵線放入滾水中煮熟後撈出沖洗，並瀝乾水份。"
  - text: "熱一鍋倒入2大匙油量後，放入紅蔥末、蒜末爆香，再加入高湯煮滾後，放入調味料B中的太白粉水芶芡。"
  - text: "繼續放入紅麵線、調味料A於作法3的鍋中，一起煮5分鐘後，再放入作法1的鮮蚵、柴魚片拌勻。"
  - text: "食用時，再加入烏醋、香菜、蒜泥即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味蚵仔麵線
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之蚵仔麵線各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
