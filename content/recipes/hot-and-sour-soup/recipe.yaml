steps:
  - text: 熟竹筍、紅蘿蔔、黑木耳、豆腐與鴨血切成絲，分開放好。青蔥切成蔥花，雞蛋打散成蛋液。
    image:
      src: ./step-1.webp
      alt: 木砧板上分堆放著熟竹筍絲、紅蘿蔔絲、黑木耳絲與蔥花，旁邊的三個瓷碗分別盛著豆腐絲、鴨血絲與打散的蛋液，砧板右側有菜刀
  - text: 豬肉絲拌入醬油 5 g 和米酒，醃 20 分鐘。
    image:
      src: ./step-2.webp
      alt: 米白色瓷碗中是拌入醬油和米酒、裹上淺褐色醃料的生豬肉絲
  - text: 太白粉加入冷水攪勻，調成沒有乾粉的芡水，先放旁邊備用。
    image:
      src: ./step-3.webp
      alt: 米白色瓷碗內是拌勻的乳白色太白粉水，表面沒有乾粉塊
  - text: 鍋中放食用油，加入豬肉絲和青蔥翻炒，再沿鍋邊倒入剩下的醬油。
  - text: 倒入高湯，放入紅蘿蔔、熟竹筍、黑木耳、鴨血與豆腐，煮到湯汁沸騰。
    image:
      src: ./step-5.webp
      alt: 雙耳不鏽鋼鍋內的湯正在冒泡，湯中可見肉絲、熟竹筍絲、紅蘿蔔絲、黑木耳絲、豆腐絲、鴨血絲與蔥花，尚未加入蛋液
  - text: 芡水再攪勻，少量加入湯裡並攪拌，讓湯汁呈現略帶濃稠的薄芡。
  - text: 邊攪拌邊倒入蛋液，繼續加熱至蛋花凝固；用食物溫度計確認含肉與蛋的湯達 74°C，再進下一步。
    image:
      src: ./step-7.webp
      alt: 同一只雙耳不鏽鋼鍋盛著略帶濃稠的湯，肉絲、熟竹筍絲、紅蘿蔔絲、黑木耳絲、豆腐絲與鴨血絲間浮著凝固的黃色蛋花
  - text: 加入鹽、白胡椒粉與白醋拌勻，熄火盛碗。
tip: 這份四人份配方整合兩個公開食譜，部分主料重量經調整，未經試做。熟竹筍以半個計，來源未提供克數。
