title: 酸辣湯
summary: 肉絲、熟筍、木耳、豆腐與鴨血煮成薄芡湯，搭配蛋花，以白醋和白胡椒調出酸辣味。
servings: 4
category: 湯
draft: false
mealCandidate: true
vegetable: false
protein: false
tags:
