steps:
  - text: 蟹腿肉與草蝦仁去殼挑除腸泥，入滾水微汆燙去腥洗淨；蛤蜊吐沙洗淨備用；蛋豆腐切成適口方塊。
    image:
      src: ./step-1.webp
      alt: 蟹腿肉與草蝦仁去殼挑除腸泥，入滾水微汆燙去腥洗淨；蛤蜊吐沙洗淨備用；蛋豆腐切成適口方塊。
  - text: 熱油鍋至 180 度，將蛋豆腐塊輕輕放入油炸至表皮金黃酥脆定型，撈起瀝油排入深盤中。
  - text: 另起油鍋爆香蔥花，倒入蟹黃炒出金黃油亮香氣，放入蟹腿肉、草蝦仁、青豆仁、紅蘿蔔丁、玉米粒並加水煮滾。
    image:
      src: ./step-3.webp
      alt: 另起油鍋爆香蔥花，倒入蟹黃炒出金黃油亮香氣，放入蟹腿肉、草蝦仁、青豆仁、紅蘿蔔丁、玉米粒並加水煮滾。
  - text: 加入蛤蜊與鹽調味，煮至蛤蜊全開挑出蛤殼，以太白粉水勾薄芡淋入香油，趁熱淋在炸蛋豆腐上即可盛盤。
