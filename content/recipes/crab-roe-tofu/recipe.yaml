tip: 蛋豆腐水分較多，油炸前先用紙巾輕壓吸乾表面，高溫快炸即可形成金黃韌皮；蟹黃先以油炒散激發脂香，再加高湯海鮮煨煮，湯汁更加金黃濃醇。
