title: 蟹黃豆腐煲
summary: 滑嫩蛋豆腐切塊炸至金黃酥香，熱油鍋爆香蔥花與濃郁蟹黃，加入鮮甜蟹腿肉、草蝦仁、蛤蜊與青豆仁、紅蘿蔔丁加水煨煮，蛤蜊開殼後勾薄芡並淋上香油，淋在金黃嫩豆腐上，色澤金黃奢華、鮮美滑口。
servings: 4
category: 非湯料理
dishKinds: [seafood, egg-bean]
classificationReason: 約 300 g 炸蛋豆腐上淋蟹腿肉、蝦仁、蛤蜊及 75 g 蟹黃燴料，豆腐與多種實體海鮮並列。
