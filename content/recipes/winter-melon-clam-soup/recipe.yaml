title: 冬瓜蛤蜊湯
summary: 清甜冬瓜去皮切塊，與高湯同煮至晶透軟綿，加入吐沙鮮活蛤蜊與薑片煮至開殼釋放滿滿鮮味，調入鹽、米酒與香油，湯頭清甜鮮美、消暑利濕。
servings: 4
category: 湯
dishKinds: []
classificationReason: 冬瓜 600 g 與蛤蜊 400 g 加入 1200 ml 高湯煮成湯，沿用湯類且不分配非湯主角與組餐菜位。
draft: false
mealCandidate: false
