steps:
  - text: 蛤蜊泡水靜置吐沙約 2 小時後洗淨；冬瓜去皮去籽切成適口大厚塊；老薑洗淨切成薄片備用。
    image:
      src: ./step-1.webp
      alt: 蛤蜊泡水靜置吐沙約 2 小時後洗淨；冬瓜去皮去籽切成適口大厚塊；老薑洗淨切成薄片備用。
  - text: 湯鍋中倒入高湯煮沸，放入冬瓜塊轉中小火煮約 10 分鐘至冬瓜呈現半透明微軟狀態。
  - text: 轉大火加入蛤蜊與薑片，煮至蛤蜊外殼完全張開釋放鮮甜海味。
    image:
      src: ./step-3.webp
      alt: 轉大火加入蛤蜊與薑片，煮至蛤蜊外殼完全張開釋放鮮甜海味。
  - text: 加入鹽與香油調味，起鍋前沿鍋邊淋入米酒去腥提鮮，熄火盛碗即可上桌。
hero:
