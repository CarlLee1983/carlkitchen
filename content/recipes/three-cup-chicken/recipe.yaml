title: 三杯雞
summary: 雞肉塊先汆燙，用麻油煸香薑片和大蒜後下鍋快炒，再以米酒、醬油、冰糖燜煮收汁，起鍋前拌入九層塔。醬汁濃稠、香氣重，適合配飯。
servings: 4
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
tags: [家常菜]
ingredients:
  - { name: 雞肉塊, amount: { value: 400, unit: g }, note: 可用雞腿肉剁成小塊 }
  - { name: 薑, amount: { value: 20, unit: g }, note: 切片 }
  - { name: 大蒜, amount: { value: 3, unit: 瓣 }, note: 去皮，保留整瓣 }
  - { name: 辣椒, amount: { value: 10, unit: g }, note: 切片 }
  - { name: 九層塔, amount: { value: 15, unit: g }, note: 挑去粗莖 }
  - {
      name: 麻油,
      amount: { value: 30, unit: ml },
      note: 約 2 湯匙,
      group: 調味,
    }
  - {
      name: 米酒,
      amount: { value: 30, unit: ml },
      note: 約 2 湯匙,
      group: 調味,
    }
  - {
      name: 醬油,
      amount: { value: 30, unit: ml },
      note: 約 2 湯匙,
      group: 調味,
    }
  - {
      name: 冰糖,
      amount: { value: 7, unit: g },
      note: 約 1/2 湯匙,
      group: 調味,
    }
steps:
  - text: 薑切片，辣椒切片，大蒜去皮保留整瓣；九層塔挑去粗莖後洗淨瀝乾。
    image:
      src: ./step-1.webp
      alt: 木砧板上分成四堆的材料：薑片、紅辣椒片、去皮的整瓣大蒜和洗淨的九層塔葉，砧板右側放著一把菜刀
  - text: 雞肉塊放進滾水汆燙，表面轉白、浮出血沫就撈起，用冷水沖洗乾淨後瀝乾。
  - text: 炒鍋燒熱後倒入麻油，轉小火放入薑片和大蒜，慢慢煸到薑片邊緣微焦捲起。
    image:
      src: ./step-3.webp
      alt: 炒鍋中一層麻油，裡面是邊緣煎到微焦捲起的薑片和幾顆金黃的整瓣大蒜，鍋邊靠著一支木鍋鏟
  - text: 加入辣椒和瀝乾的雞肉塊，轉大火翻炒，炒到雞肉表面全部變白。
    image:
      src: ./step-4.webp
      alt: 炒鍋中表面已經變白、略帶金黃的雞肉塊，混著薑片、大蒜和紅色辣椒片，鍋底只有少許油，還沒有醬汁
  - text: 倒入米酒、醬油和冰糖快炒均勻，蓋上鍋蓋燜煮約 3 分鐘。
  - text: 打開鍋蓋繼續翻炒，炒到醬汁收到微乾、緊緊裹住雞肉，放入九層塔翻炒均勻就起鍋。
    image:
      src: ./step-6.webp
      alt: 炒鍋中裹著深褐色亮澤醬汁的雞肉塊，鍋底只剩薄薄一層醬汁，夾雜薑片、大蒜、辣椒片和剛下鍋的翠綠九層塔
hero:
  src: ./hero.webp
  alt: 米白陶瓷深盤中盛著三杯雞，深褐色醬汁裹住的雞肉塊間夾著薑片、整瓣大蒜、紅色辣椒片與九層塔
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 一盤生的帶骨雞肉塊、一塊老薑、三瓣去皮大蒜、一根紅辣椒、一小把九層塔，以及分裝在小瓶與小碟中的麻油、米酒、醬油和冰糖
tip: 想要醬汁更入味，可在加入調味料煮滾後移到砂鍋，用小火煮到湯汁收乾，再拌入九層塔。
