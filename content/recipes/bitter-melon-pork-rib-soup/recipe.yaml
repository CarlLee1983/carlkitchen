title: 苦瓜排骨湯
summary: 排骨和苦瓜分別汆燙沖涼，加薑片和水煮滾後，以小火保持微滾約 30 分鐘再調味。
servings: 3
category: 湯
dishKinds: []
classificationReason: 排骨與苦瓜各 200 g 加 700 ml 水煮成湯，依湯類用途不設料理主角標籤。
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 50
tags: [家常菜, 湯品]
ingredients:
  - { name: 排骨, amount: { value: 200, unit: g }, note: 切小塊 }
  - { name: 苦瓜, amount: { value: 200, unit: g }, note: 去皮去籽切小塊 }
  - { name: 薑片, amount: { value: 10, unit: g } }
  - { name: 水, amount: { value: 700, unit: ml } }
  - { name: 鹽, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
  - {
      name: 雞精粉,
      amount: { value: 5, unit: ml },
      note: 約 1 茶匙,
      group: 調味,
    }
  - { name: 米酒, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
steps:
  - text: 排骨切成小塊，下滾水燙約 1 分鐘，取出用冷水沖涼。
    image:
      src: ./step-1.webp
      alt: 不鏽鋼雙耳瀝水籃裡放著汆燙過的帶骨排骨小塊，表面轉成灰白色
  - text: 苦瓜削皮、挖掉籽，切成小塊，一樣下滾水燙約 1 分鐘，取出用冷水沖涼。
    image:
      src: ./step-2.webp
      alt: 同一只瀝水籃裡堆著汆燙過的苦瓜塊，去皮去籽後呈淡綠色，帶著水珠
  - text: 燙過的排骨和苦瓜放進湯鍋，加薑片與水，開中火煮到滾。
    image:
      src: ./step-3.webp
      alt: 不鏽鋼雙耳湯鍋裡的清水正滾著冒泡，鍋中有排骨塊、淡綠色苦瓜塊和幾片薑
  - text: 改小火，讓湯面保持微微冒泡約 30 分鐘，再加鹽、雞精粉和米酒調味。
hero:
  src: ./hero.webp
  alt: 敞口不鏽鋼雙耳湯鍋盛著苦瓜排骨湯，淡金色清湯裡有帶骨排骨塊、淡綠色苦瓜塊和幾片薑，冒著些許熱氣
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 一小堆切成小塊的生排骨、縱切的半條苦瓜、五片薑、一碗清水，以及分裝在小碟和小瓶中的鹽、雞精粉和米酒
