title: 蠔油什錦炒鮮蔬
summary: 香菇、青花菜、紅蘿蔔和玉米筍先下鍋，再加蠔油等調味料炒勻。
servings: 2
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 香菇、青花菜、紅蘿蔔和玉米筍直接炒成蔬菜配菜，蠔油與雞粉只負責調味。
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 15
tags: [家常菜]
ingredients:
  - { name: 香菇, amount: { value: 3, unit: 朵 }, note: 每朵切成四塊 }
  - { name: 青花菜, amount: { value: 6, unit: 朵 }, note: 分成小朵 }
  - { name: 紅蘿蔔, amount: { value: 10, unit: g }, note: 切片 }
  - { name: 玉米筍, amount: { value: 20, unit: g }, note: 斜切片 }
  - { name: 蒜頭, amount: { value: 2, unit: 粒 }, note: 切片 }
  - { name: 沙拉油, amount: { value: 1, unit: 大匙 }, group: 調味 }
  - { name: 蠔油, amount: { value: 1, unit: 大匙 }, group: 調味 }
  - { name: 香油, amount: { value: 1, unit: 小匙 }, group: 調味 }
  - { name: 雞粉, amount: { value: 1, unit: 小匙 }, group: 調味 }
  - { name: 鹽, note: 少許, group: 調味 }
  - { name: 白胡椒粉, note: 少許, group: 調味 }
steps:
  - text: 玉米筍斜切，紅蘿蔔和蒜頭切片；青花菜分成小朵，香菇洗淨後每朵切成四塊。
    image:
      src: ./step-1.webp
      alt: 木砧板上分開放著切成四塊的香菇、六朵青花菜、紅蘿蔔片、玉米筍斜片和蒜片，旁邊有菜刀
  - text: 炒鍋倒入沙拉油燒熱，放入香菇、青花菜、紅蘿蔔、玉米筍和蒜頭，以中火翻炒均勻。
    image:
      src: ./step-2.webp
      alt: 深色炒鍋中有青花菜、香菇塊、紅蘿蔔片、玉米筍斜片和蒜片，旁邊放著木鍋鏟
  - text: 加入蠔油、香油、雞粉、鹽與白胡椒粉，繼續翻炒至調味均勻裹上蔬菜即可。
    image:
      src: ./step-3.webp
      alt: 深色炒鍋中的青花菜、香菇塊、紅蘿蔔片和玉米筍沾著淡棕色醬汁，旁邊放著木鍋鏟
hero:
  src: ./hero.webp
  alt: 米白色瓷盤盛著沾上淡棕色醬汁的青花菜、香菇塊、紅蘿蔔片、玉米筍和蒜片
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 三朵切成四塊的香菇、六朵青花菜、紅蘿蔔片、玉米筍斜片和兩粒切片的蒜頭，下方分裝沙拉油、蠔油、香油、雞粉、鹽與白胡椒粉
