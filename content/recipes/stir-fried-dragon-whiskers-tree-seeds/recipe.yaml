steps:
  - text: 龍鬚菜仔細挑除粗纖維老梗，折成約 4 公分適口嫩段洗淨瀝乾；胡蘿蔔切細絲、生薑切絲、蒜頭切碎備用。
    image:
      src: ./step-1.webp
      alt: 龍鬚菜仔細挑除粗纖維老梗，折成約 4 公分適口嫩段洗淨瀝乾；胡蘿蔔切細絲、生薑切絲、蒜頭切碎備用。
  - text: 熱鍋倒入適量油，放入蒜碎與嫩薑絲中火爆香出香氣。
  - text: 轉大火倒入龍鬚菜段與胡蘿蔔絲快速翻炒約 40 秒至菜葉變軟轉深綠，加入破布子粒與醬汁、糖與少許鹽大火快炒勻。
    image:
      src: ./step-3.webp
      alt: 轉大火倒入龍鬚菜段與胡蘿蔔絲快速翻炒約 40 秒至菜葉變軟轉深綠，加入破布子粒與醬汁、糖與少許鹽大火
  - text: 起鍋前滴入香油翻炒數秒即可熄火盛盤趁熱享用脆嫩口感。
