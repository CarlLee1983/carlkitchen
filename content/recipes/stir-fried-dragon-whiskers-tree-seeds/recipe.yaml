title: 破布子炒龍鬚菜
summary: 龍鬚菜挑除老梗折成嫩段，紅蘿蔔切細絲，熱鍋爆香嫩薑絲與大蒜，倒入龍鬚菜大火快炒，加入甘甜破布子粒與醬汁翻炒入味，菜葉青翠爽脆、破布子鹹甘生津，風味純樸道地。
servings: 3
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 以新鮮龍鬚菜快炒甘甜破布子為唯一蔬菜主角，屬於純蔬菜熱炒料理。
draft: false
