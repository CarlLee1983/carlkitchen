  - { name: 沙拉油, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 鹽, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 砂糖, amount: { value: 1.0, unit: g }, note: 原料標示 1/2小匙 }
