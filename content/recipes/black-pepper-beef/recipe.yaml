title: 黑胡椒牛柳
summary: 牛肉條先醃漬，再與洋蔥、蒜頭、彩椒和黑胡椒醬汁快炒。
servings: 3
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 150
tags: [家常菜]
ingredients:
  - {
      name: 牛里肌肉,
      amount: { value: 400, unit: g },
      note: 切成約筷子寬、4 公分長的條狀；部位為依菜式補充,
    }
  - { name: 洋蔥, amount: { value: 0.25, unit: 顆 }, note: 切絲 }
  - { name: 蒜頭, amount: { value: 6, unit: 瓣 }, note: 切片 }
  - { name: 辣椒, amount: { value: 0.25, unit: 條 }, note: 切絲 }
  - { name: 青椒, amount: { value: 0.25, unit: 條 }, note: 切絲 }
  - { name: 黃椒, amount: { value: 0.25, unit: 條 }, note: 切絲 }
  - { name: 雞蛋白, amount: { value: 1, unit: 顆 }, group: 醃料 }
  - {
      name: 奶油,
      amount: { value: 30, unit: ml },
      note: 約 2 大匙,
      group: 調味,
    }
  - {
      name: 醬油,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙,
      group: 調味,
    }
  - {
      name: 辣醬油,
      amount: { value: 30, unit: ml },
      note: 約 2 大匙,
      group: 調味,
    }
  - {
      name: 黑胡椒,
      amount: { value: 30, unit: ml },
      note: 約 2 大匙，醃料與調味各用 1 大匙,
      group: 調味,
    }
  - {
      name: 砂糖,
      amount: { value: 10, unit: ml },
      note: 約 2 小匙,
      group: 調味,
    }
  - { name: 雞粉, amount: { value: 5, unit: ml }, note: 約 1 小匙, group: 調味 }
  - {
      name: 鹽,
      amount: { value: 2.5, unit: ml },
      note: 約 1/2 小匙,
      group: 調味,
    }
  - { name: 水, amount: { value: 100, unit: ml }, group: 調味 }
  - { name: 嫩精, group: 調味, note: 少許，醃料用 }
  - {
      name: 料理米酒,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，醃料用,
      group: 調味,
    }
  - {
      name: 香油,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，醃料用,
      group: 調味,
    }
  - {
      name: 太白粉,
      amount: { value: 10, unit: ml },
      note: 約 2 小匙，醃料用,
      group: 調味,
    }
  - {
      name: 食用油,
      amount: { value: 480, unit: ml },
      note: 約 2 杯用於牛肉過油；爆香另用適量,
      group: 調味,
    }
steps:
  - text: 牛里肌肉洗淨切條，加入 15 ml 黑胡椒、嫩精、料理米酒、香油、雞蛋白和太白粉，拌打至濃稠，冷藏約 2 小時。
    image:
      src: ./step-1.webp
      alt: 瓷碗中的牛里肌肉條裹著黑胡椒與醃料
  - text: 洋蔥、辣椒、青椒與黃椒切絲，蒜頭切片。
    image:
      src: ./step-2.webp
      alt: 木砧板上分放洋蔥絲、辣椒絲、青椒絲、黃椒絲與蒜片
  - text: 將 480 ml 食用油倒入鍋中，趁油還冷時放入牛里肌肉條，開大火快速攪散；牛肉表面轉白後撈起瀝油。
    image:
      src: ./step-3.webp
      alt: 深色炒鍋的油中，牛里肌肉條表面已轉白
  - text: 另起鍋加適量食用油，放入洋蔥和蒜頭爆香。加入奶油、醬油、辣醬油、15 ml 黑胡椒、砂糖、雞粉、鹽與水。
  - text: 放入牛里肌肉條，開大火炒到收汁；加入辣椒、青椒和黃椒，拌炒均勻。
    image:
      src: ./step-5.webp
      alt: 深色炒鍋中的牛里肌肉條拌著洋蔥、蒜片、辣椒絲、青椒絲與黃椒絲
hero:
  src: ./hero.webp
  alt: 素色陶盤中盛著裹有黑胡椒醬汁的牛肉條、洋蔥與彩椒絲
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 400 g 牛里肌肉條、四分之一顆洋蔥、六瓣蒜頭、少量辣椒、青椒與黃椒，及分裝的雞蛋白、奶油、醬油、辣醬油、黑胡椒、砂糖、雞粉、鹽、水、嫩精、料理米酒、香油、太白粉與食用油
