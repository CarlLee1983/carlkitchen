title: 白斬雞
summary: 依核准食譜指南製作之經典家常白斬雞，風味道地鮮明。
servings: 4
category: 非湯料理
dishKinds: [meat]
classificationReason: "全雞慢火浸熟冰鎮切塊佐客家桔醬或蒜蓉醬油，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 45
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 土雞, amount: { value: 1.0, unit: g }, note: 原料標示 1隻 }
  - { name: 薑片, amount: { value: 3.0, unit: g }, note: 原料標示 3片 }
  - { name: 蔥段, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - {
      name: 沾醬：雞湯,
      amount: { value: 150.0, unit: g },
      note: 原料標示 150㏄,
    }
  - { name: 素蠔油, amount: { value: 50.0, unit: g }, note: 原料標示 50㏄ }
  - { name: 醬油膏, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 香油, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 蒜末, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 辣椒末, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 米酒, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
steps:
  - text: "土雞洗淨、去毛，瀝乾後放入沸水中汆燙，再撈出瀝乾，備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之白斬雞主要材料
  - text: "接著重複放入沸水中汆燙，再撈出瀝乾的動作，重複來回約3至4次後，取出瀝乾備用。"
  - text: "將作法2的雞放入裝有冰塊的盆中，用冰塊將整隻雞外皮冰鎮冷卻，再放回作法2原鍋中，加入米酒、薑片及蔥段，以中火煮約15分鐘後熄火，蓋上蓋子續燜約30分鐘。"
  - text: "取作法3中150㏄的雞湯，加入其餘沾醬調勻，即為白斬雞沾醬。"
  - text: "將作法3的雞肉取出，待涼後剁塊盛盤，食用時搭配作法4的白斬雞沾醬即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味白斬雞
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之白斬雞各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
