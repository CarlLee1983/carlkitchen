title: 韓式泡菜炒牛肉
summary: 牛肉切條抓醃滑嫩，韓式白菜泡菜切塊，熱油鍋爆香蒜片、青蔥與辣椒，大火滑炒牛肉條至變色，加入泡菜、黃豆芽與芹菜大火快翻，調入韓式辣醬與米酒收汁，酸辣甘甜、鑊氣十足。
servings: 3
category: 非湯料理
dishKinds: [meat, vegetable]
classificationReason: 以牛肉條為肉類主角，搭配韓式泡菜與豆芽菜大火快炒，屬於肉類與蔬菜並陳料理。
