steps:
  - text: 牛肉切均勻條狀，加少許米酒、醬油與太白粉抓醃 10 分鐘；泡菜切粗塊；芹菜切段、蒜頭切片、青蔥切段備用。
    image:
      src: ./step-1.webp
      alt: 牛肉切均勻條狀，加少許米酒、醬油與太白粉抓醃 10 分鐘；泡菜切粗塊；芹菜切段、蒜頭切片、青蔥切段備
  - text: 熱鍋倒入適量油，放入蒜片、蔥段爆香，倒入牛肉條大火滑炒至表面變白約八分熟先盛出。
  - text: 原鍋放入泡菜塊、黃豆芽與芹菜段大火翻炒 1 分鐘出香氣，加入韓式辣椒醬與米酒炒勻。
    image:
      src: ./step-3.webp
      alt: 原鍋放入泡菜塊、黃豆芽與芹菜段大火翻炒 1 分鐘出香氣，加入韓式辣椒醬與米酒炒勻。
  - text: 倒回牛肉條大火快炒均勻包裹醬汁，淋上香油快速拌炒數秒即可盛盤趁熱享用。
