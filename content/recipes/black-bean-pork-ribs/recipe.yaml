title: 豆豉排骨
summary: 豬腩排浸去血水後拌入豆豉與調味料，放進電鍋蒸熟。
servings: 4
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 60
tags: [家常菜]
ingredients:
  - { name: 豬腩排, amount: { value: 600, unit: g }, note: 來源稱「腩排」 }
  - { name: 豆豉, amount: { value: 30, unit: g } }
  - { name: 辣椒片, amount: { value: 15, unit: g } }
  - { name: 蒜末, amount: { value: 50, unit: g } }
  - {
      name: 太白粉,
      amount: { value: 30, unit: ml },
      group: 調味,
      note: 約 2 大匙,
    }
  - {
      name: 醬油,
      amount: { value: 15, unit: ml },
      group: 調味,
      note: 來源列 1 大匙，但未交代加入時機,
    }
  - {
      name: 細砂糖,
      amount: { value: 15, unit: ml },
      group: 調味,
      note: 約 1 大匙,
    }
  - {
      name: 鹽,
      amount: { value: 2.5, unit: ml },
      group: 調味,
      note: 約 1/2 茶匙,
    }
  - {
      name: 水,
      amount: { value: 45, unit: ml },
      group: 調味,
      note: 約 3 大匙，拌入排骨,
    }
  - {
      name: 米酒,
      amount: { value: 15, unit: ml },
      group: 調味,
      note: 約 1 大匙,
    }
  - {
      name: 香油,
      amount: { value: 15, unit: ml },
      group: 調味,
      note: 約 1 大匙,
    }
  - { name: 外鍋水, amount: { value: 1, unit: 杯 }, note: 來源未標杯量 }
steps:
  - text: 豬腩排浸水約 30 分鐘，至血水滲出。豆豉沖洗乾淨。
    image:
      src: ./step-1.webp
      alt: 白色陶碗中的帶骨豬腩排浸在淡紅色水裡，旁邊濾網盛著洗過的豆豉
  - text: 將豬腩排與辣椒片、鹽、太白粉、細砂糖、米酒拌至黏稠，再加入水、蒜末、豆豉和香油拌勻。
    image:
      src: ./step-2.webp
      alt: 白色陶碗中的生豬腩排拌著黑色豆豉、紅色辣椒片與蒜末
  - text: 把拌好的豬腩排鋪平在蒸盤上。電鍋加入外鍋水並按下開關，冒出蒸氣後放入蒸盤，蒸約 15 分鐘至開關跳起。
    image:
      src: ./step-3.webp
      alt: 掀開的電鍋內有一盤蒸熟的帶骨豬腩排，表面有豆豉與辣椒片
hero:
  src: ./hero.webp
  alt: 白色陶盤中盛著帶骨的豆豉排骨，排骨上可見豆豉、辣椒片與蒜末
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 帶骨豬腩排、豆豉、辣椒片、蒜末與八組調味料分開擺放，其中有兩份水
