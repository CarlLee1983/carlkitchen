title: 蜜汁叉燒
summary: 依核准食譜指南製作之經典家常蜜汁叉燒，風味道地鮮明。
servings: 4
category: 非湯料理
dishKinds: [meat]
classificationReason: "梅花肉醃漬後抹蜜汁烘烤，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 45
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 梅花肉, amount: { value: 100, unit: g }, note: 原料標示 300公克 }
  - { name: 蜂蜜, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 醬油, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 紅腐乳, amount: { value: 100, unit: g }, note: 原料標示 1小塊 }
  - { name: 細糖, amount: { value: 100, unit: g }, note: 原料標示 5大匙 }
  - { name: 五香粉, amount: { value: 100, unit: g }, note: 原料標示 1/4茶匙 }
  - { name: 豆瓣醬, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
steps:
  - text: "梅花肉切成厚約1公分的長肉條。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的蜜汁叉燒主要材料
  - text: "將所有調味料拌勻成醃醬。將作法1的梅花肉條加入醬料中，醃約2小時。"
  - text: "將梅肉平鋪於平底鍋上，蓋上鍋蓋。開中火煎烤約5分鐘後翻面再煎。"
  - text: "煎至肉熟(切開看)，打開鍋蓋間至水份收乾表面微焦香取出。刷上蜂蜜即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味蜜汁燒肉
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之蜜汁叉燒各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
