title: 炒海瓜子
summary: 依核准食譜指南製作之經典家常炒海瓜子，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: "蒜末辣椒醬油大火快炒海瓜子，海鮮主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 12
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 海瓜子, amount: { value: 100, unit: g }, note: 原料標示 300公克 }
  - { name: 薑, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 辣椒, amount: { value: 100, unit: g }, note: 原料標示 1根 }
  - { name: 蒜仁, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 九層塔, amount: { value: 100, unit: g }, note: 原料標示 20公克 }
  - { name: A.沙茶醬, amount: { value: 100, unit: g }, note: 原料標示 1茶匙 }
  - { name: 醬油膏, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 細糖, amount: { value: 100, unit: g }, note: 原料標示 1/4茶匙 }
  - { name: 料酒, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: B.香油, amount: { value: 100, unit: g }, note: 原料標示 1茶匙 }
steps:
  - text: "把海瓜子洗淨後，放在加入少許鹽的水中吐砂；九層塔挑去粗莖、洗淨瀝乾；薑切絲；蒜仁、辣椒切碎，備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的炒海瓜子主要材料
  - text: "熱鍋，加入1大匙沙拉油，以小火爆香薑絲、蒜末、辣椒末後，加入作法1的海瓜子及調味料A，開中火略炒勻。"
  - text: "待作法2煮開出水後，偶而翻炒幾下至海瓜子大部分都開口後，即可轉大火炒至水分略乾，再加入九層塔及香油略炒幾下即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味炒海瓜子
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之炒海瓜子各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
