title: 九層塔煎蛋
summary: 九層塔切碎後拌入蛋液，以平底鍋煎成兩面金黃的厚蛋餅。
servings: 2
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: 三顆雞蛋拌入切碎九層塔後整片煎熟，蛋餅為成品主體而九層塔提供香氣。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜]
ingredients:
  - { name: 雞蛋, amount: { value: 3, unit: 顆 } }
  - { name: 九層塔, amount: { value: 75, unit: g }, note: 摘葉洗淨後切碎 }
  - {
      name: 鹽,
      amount: { value: 1.25, unit: ml },
      note: 約 1/4 小匙,
      group: 調味,
    }
  - {
      name: 沙拉油,
      amount: { value: 30, unit: ml },
      note: 約 2 大匙,
      group: 調味,
    }
steps:
  - text: 摘下九層塔嫩葉洗淨、切碎；雞蛋打散後拌入九層塔和鹽。
    image:
      src: ./step-1.webp
      alt: 木砧板上放著切碎的九層塔葉，旁邊有一碗混合均勻的蛋液和菜刀
  - text: 平底鍋加熱後倒入沙拉油，轉動鍋身讓油均勻覆蓋鍋面，再倒入九層塔蛋液。
    image:
      src: ./step-2.webp
      alt: 平底鍋裡倒入九層塔蛋液，液面均勻鋪開並開始凝固
  - text: 待底面煎熟後翻面，續煎至兩面熟透並呈金黃色即可盛盤。
    image:
      src: ./step-3.webp
      alt: 兩面煎成金黃色的九層塔蛋餅正在平底鍋中完成
hero:
  src: ./hero.webp
  alt: 白色圓盤上放著切成片的金黃色九層塔煎蛋
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 雞蛋、九層塔葉，以及分裝的鹽和沙拉油
