steps:
  - text: "艾草洗淨，放入水中以中火煮約半小時，擠乾水份後，將它剁碎備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的艾草粿主要材料
  - text: "巴蕉葉洗淨，剪成適當大小；蘿蔔絲洗淨、香菇泡軟切丁備用。" 
  - text: "將糯米、蓬萊米洗淨泡水4小時，加入1200㏄的水，用研磨機磨成米漿，裝入布袋中，壓乾（或脫水）製成粉糰。" 
  - text: "取2塊約200g的粉糰，放入滾水鍋中煮到浮起；其餘粉糰搓揉粉碎，再與煮熟的麵糰、糖及艾草混合均勻，揉至光滑。" 
  - text: "蒸籠水煮開，鋪上蒸籠布，再放入作法4粉糰，蒸40分鐘。" 
  - text: "起油鍋，將香菇、開陽及絞肉炒香，加入調味料，再放入紅蔥酥及蘿蔔絲拌炒至熟香起鍋。" 
  - text: "將蒸好的粿待稍涼後，分成40等份，再分別包入作法6餡料，放在巴蕉葉上即可。" 
