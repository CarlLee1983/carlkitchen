title: 艾草粿
summary: 依核准食譜指南製作之經典家常艾草粿，風味道地鮮明。
servings: 4
category: 主食
dishKinds: []
classificationReason: "新鮮艾草揉入糯米糰包餡蒸熟，傳統米食點心。"
draft: false
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 60
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 艾草乾, amount: { value: 100, unit: g }, note: 原料標示 15g }
  - { name: 巴蕉葉, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 圓糯米, amount: { value: 100, unit: g }, note: 原料標示 1斤 }
  - { name: 蓬萊米, amount: { value: 100, unit: g }, note: 原料標示 1斤 }
  - { name: 水, amount: { value: 100, unit: g }, note: 原料標示 1200㏄ }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 375g }
  - { name: 餡料：紅蔥酥, amount: { value: 100, unit: g }, note: 原料標示 3大匙 }
  - { name: 蘿蔔絲, amount: { value: 100, unit: g }, note: 原料標示 187g }
  - { name: 香菇, amount: { value: 100, unit: g }, note: 原料標示 10朵 }
  - { name: 開陽, amount: { value: 100, unit: g }, note: 原料標示 20g }
  - { name: 絞肉, amount: { value: 100, unit: g }, note: 原料標示 200g }
  - { name: 花生油, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 醬油, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 香油, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 3大匙 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 2茶匙 }
  - { name: 味精, amount: { value: 100, unit: g }, note: 原料標示 2茶匙 }
