steps:
  - text: 玉米筍切斜段入沸水汆燙 30 秒撈起；鮮香菇切片、鴻禧菇撕開小撮；甜豆莢撕去兩側粗筋；蒜頭切片、胡蘿蔔切片備用。
    image:
      src: ./step-1.webp
      alt: 玉米筍切斜段入沸水汆燙 30 秒撈起；鮮香菇切片、鴻禧菇撕開小撮；甜豆莢撕去兩側粗筋；蒜頭切片、胡蘿
  - text: 熱鍋倒入適量油，放入蒜片爆香，加入香菇片、鴻禧菇與胡蘿蔔片中大火翻炒至菇類出香微軟。
  - text: 倒入汆燙過的玉米筍段與甜豆莢大火快速翻炒約 1 分鐘至甜豆翠綠斷生，調入鹽與米酒大火翻炒收汁均勻即可盛盤。
    image:
      src: ./step-3.webp
      alt: 倒入汆燙過的玉米筍段與甜豆莢大火快速翻炒約 1 分鐘至甜豆翠綠斷生，調入鹽與米酒大火翻炒收汁均勻即可
  - text: 盛入白色圓盤趁熱享用清脆香甜的多層次口感。
