title: 玉米筍炒百菇
summary: 鮮脆玉米筍切斜段汆燙脆甜，搭配鮮香菇片、鴻禧菇、秀珍菇與甜豆莢，熱油爆香大蒜薄片與紅蘿蔔花片，大火快炒綜合菇類與玉米筍，調入少許鹽與米酒嗆香，鮮香甘美、爽脆多汁且色彩繽紛。
servings: 3
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 以玉米筍、綜合鮮菇與甜豆莢清炒為唯一蔬菜主角，屬於純蔬菜清炒料理。
draft: false
mealCandidate: true
