steps:
  - text: 豬肉片加 1 大匙醬油與 1 茶匙太白粉抓勻醃漬；青椒切小塊，辣椒切片；另取小碗將 2 大匙醬油、糖、米酒、水與半茶匙太白粉調勻成兌汁備用。
    image:
      src: ./step-1.webp
      alt: 豬肉片加 1 大匙醬油與 1 茶匙太白粉抓勻醃漬；青椒切小塊，辣椒切片；另取小碗將 2 大匙醬油、糖
  - text: 熱鍋倒入適量油燒熱，放入抓醃好的豬肉片，以大火快炒至肉片表面轉白微焦，撈起瀝乾油分。
  - text: 原鍋留少許底油，轉小火爆香辣椒片、薑片與蔥段至香氣四溢。
  - text: 投入青椒塊略微翻炒，再倒入過油的豬肉片，大火快炒約 5 秒後邊炒邊淋入調好的兌汁，翻炒均勻裹上醬色，起鍋前淋入香油即可盛盤。
    image:
      src: ./step-4.webp
      alt: 投入青椒塊略微翻炒，再倒入過油的豬肉片，大火快炒約 5 秒後邊炒邊淋入調好的兌汁，翻炒均勻裹上醬色，
