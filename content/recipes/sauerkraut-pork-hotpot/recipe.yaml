title: 酸菜白肉鍋
summary: 豬小排先煮出湯底，再加入酸白菜與豬五花肉片，最後放蒜苗煮到轉綠。
servings: 6
category: 湯
dishKinds: []
classificationReason: 豬小排煮出 2000 ml 湯底後加入酸白菜與豬五花，沿用湯類且不分配非湯主角與組餐菜位。
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 45
tags: [豬肉, 酸白菜, 鍋物]
ingredients:
  - {
      name: 酸白菜,
      amount: { value: 0.5, unit: 顆 },
      note: 切絲，來源未提供重量,
    }
  - {
      name: 豬小排,
      amount: { value: 300, unit: g },
      note: 來源僅寫豬排骨，部位為補充,
    }
  - {
      name: 豬五花肉片,
      amount: { value: 500, unit: g },
      note: 來源範圍 500–600 g，採下限,
    }
  - { name: 老薑, amount: { value: 1, unit: 小塊 }, note: 切絲，來源未提供重量 }
  - { name: 蒜苗, amount: { value: 2, unit: 根 }, note: 切斜段 }
  - {
      name: 水,
      amount: { value: 2000, unit: ml },
      note: 煮湯用；汆燙另備水，來源未定量,
      group: 調味,
    }
  - {
      name: 米酒,
      amount: { value: 2, unit: 匙 },
      note: 來源未註明湯匙或茶匙，待核,
      group: 調味,
    }
  - { name: 鹽, note: 來源標示視需要添加, group: 調味 }
steps:
  - text: 豬小排洗淨。另鍋備水，以中大火煮滾後放入豬小排汆燙 3 至 5 分鐘，撈出並沖掉浮沫。
    image:
      src: ./step-1.webp
      alt: 不鏽鋼瀝水籃裡放著汆燙後洗淨的豬小排，表面沒有浮沫
  - text: 酸白菜切絲；老薑切成細絲，蒜苗斜切成段。
    image:
      src: ./step-2.webp
      alt: 木砧板上分開擺著老薑絲、蒜苗斜段和酸白菜絲，旁邊有菜刀
  - text: 把豬小排與老薑放入湯鍋，加入 2000 ml 水。以中大火煮滾，再轉小火煮 20 至 25 分鐘。
    image:
      src: ./step-3.webp
      alt: 敞口湯鍋裡的豬小排與老薑絲浸在清湯中，小火微微冒泡
  - text: 加入酸白菜，再煮 8 至 10 分鐘。
    image:
      src: ./step-4.webp
      alt: 湯鍋裡的酸白菜絲與豬小排、老薑絲在清湯中煮著
  - text: 放入豬五花肉片並加入米酒，煮到肉片轉白。
    image:
      src: ./step-5.webp
      alt: 湯鍋裡的豬五花肉片轉白，和酸白菜絲、豬小排一起浸在湯中
  - text: 放上蒜苗，煮到變綠就關火。
hero:
  src: ./hero.webp
  alt: 敞口素色湯鍋盛著酸菜白肉鍋，清湯中可見豬五花肉片、豬小排、酸白菜絲和翠綠蒜苗
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 半顆酸白菜、300 克豬小排、約 500 克豬五花肉片、一小塊老薑、兩根蒜苗，以及分裝的水、米酒與鹽
tip: 湯若太酸或太鹹，可酌量加水；鹹度不夠再加少許鹽。
