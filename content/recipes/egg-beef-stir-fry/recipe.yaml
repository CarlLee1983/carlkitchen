tip: 蛋液中加少許清水能讓蛋質地如絲綢般軟滑；牛肉快速滑油八分熟即撈出，最後與半熟嫩蛋在鍋中快速翻拋十秒，牛肉鮮嫩不老、滑蛋溫潤細緻。
