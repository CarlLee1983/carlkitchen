title: 蔥爆豬肉
summary: 依核准食譜指南製作之經典家常蔥爆豬肉，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: "豬肉片醃漬後與大段青蔥熱鍋大火快炒，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣料理]
ingredients:
  - {
      name: 小里肌肉,
      amount: { value: 300.0, unit: g },
      note: 原料標示 300g公克,
    }
  - { name: 洋蔥, amount: { value: 1.0, unit: g }, note: 原料標示 1/2顆 }
  - { name: 蔥, amount: { value: 1.0, unit: g }, note: 原料標示 1根 }
  - { name: 辣椒, amount: { value: 1.0, unit: g }, note: 原料標示 1根 }
  - { name: 蒜頭, amount: { value: 3.0, unit: g }, note: 原料標示 3~4瓣 }
  - {
      name: A.龜甲萬料亭和露,
      amount: { value: 1.0, unit: g },
      note: 原料標示 1大匙,
    }
  - { name: 米酒, amount: { value: 1.0, unit: g }, note: 原料標示 1茶匙 }
  - { name: 香油, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - {
      name: 玉米粉或太白粉,
      amount: { value: 100, unit: g },
      note: 原料標示 適量,
    }
  - {
      name: B.龜甲萬料亭和露,
      amount: { value: 2.0, unit: g },
      note: 原料標示 2大匙,
    }
  - { name: 糖, amount: { value: 1.0, unit: g }, note: 原料標示 1茶匙 }
  - { name: 鹽, amount: { value: 1.0, unit: g }, note: 原料標示 1/4茶匙 }
  - { name: 水, amount: { value: 100, unit: g }, note: 原料標示 少許 }
steps:
  - text: "先準備好所需材料，小里肌肉切片、搭配蔬菜洗淨切成適當大小備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之蔥爆豬肉主要材料
  - text: "小里肌肉片先以調味料A抓勻入味。"
  - text: "鍋內放入油2大匙燒熱，將作法2下鍋，拌炒至7~8分熟後先盛起備用。"
  - text: "用原鍋餘油爆香辣椒、蒜頭、蔥段、再加入洋蔥拌炒均勻，接著加入所有調味料快速翻炒均勻即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味蔥爆豬肉
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之蔥爆豬肉各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
