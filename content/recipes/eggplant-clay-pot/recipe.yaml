title: 紅燒茄子煲
summary: 茄子先過油，再與蔥段和醬油膏放入砂鍋燜煮至湯汁收乾。
servings: 2
category: 非湯料理
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 30
tags: [家常菜, 蔬食]
ingredientsPhoto:
  {
    src: ./ingredients.webp,
    alt: 白盤上約十段切段的茄子，另一盤放蔥段，旁邊是一小碟醬油膏、一碗水和一碟食用油。,
  }
ingredients:
  - { name: 茄子, amount: { value: 2, unit: 條 }, note: 切段 }
  - { name: 蔥, amount: { value: 3, unit: 支 }, note: 切段 }
  - {
      name: 醬油膏,
      amount: { value: 30, unit: ml },
      note: 約 2 大匙,
      group: 調味,
    }
  - { name: 水, note: 來源未標用量, group: 調味 }
  - { name: 食用油, note: 過油及爆香用，來源未標用量, group: 調味 }
steps:
  - text: 茄子切成段，先浸在水裡，撈出後把水分瀝乾。
    image:
      {
        src: ./step-1.webp,
        alt: 不鏽鋼瀝水籃裡盛著泡過水、帶著水珠的茄段，旁邊的白瓷碗留著少許清水。,
      }
  - text: 油鍋燒熱後放入茄段過油，再撈出放在一旁。
    image:
      { src: ./step-2.webp, alt: 白瓷盤上放著過油後表皮油亮、切面微黃的茄段。 }
  - text: 鍋裡重新熱油，先把蔥段爆出香味，再把茄段倒回鍋中。
    image:
      {
        src: ./step-3.webp,
        alt: 黑色炒鍋裡，蔥段與過油的茄段放在一起，還沒加醬汁。,
      }
  - text: 加進醬油膏和水後，全部移到砂鍋裡，燜煮到湯汁收乾為止。
hero:
  src: ./hero.webp
  alt: 紅棕色砂鍋中盛著收汁的紫色茄子段與青綠蔥段，茄子表面沾著醬油膏。
