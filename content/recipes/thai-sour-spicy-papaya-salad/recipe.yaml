tip: 青木瓜刨絲後務必浸泡冰開水 10 分鐘再徹底瀝乾，木瓜絲會變得極致脆口彈嫩；調拌時輕輕按壓抓揉，讓酸辣鹹甜醬汁能迅速被纖維吸收。
