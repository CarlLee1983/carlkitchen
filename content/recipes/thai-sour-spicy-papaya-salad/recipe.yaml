title: 泰式涼拌青木瓜
summary: 新鮮未熟青木瓜刨去外皮刨成極細脆絲，泡冰水冰鎮爽脆，加入鮮紅番茄片、洋蔥絲、泡軟蝦米碎，倒入新鮮檸檬汁、魚露、辣椒碎與椰糖調製的泰式酸辣醬汁充分拌勻，表面撒上熟花生碎與新鮮香菜，酸辣甘甜、極致清脆爽口。
servings: 2
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 以新鮮青木瓜刨絲為唯一蔬菜主角，調入泰式檸檬魚露酸辣醬汁，屬於純蔬菜涼拌料理。
