steps:
  - text: 青木瓜刨皮對剖去籽，用刨絲器刨成均勻細絲，浸入冰開水中冷鎮 10 分鐘撈起徹底瀝乾水分；蝦米泡溫水軟化後用刀背拍鬆；洋蔥切細絲、番茄切小塊；花生壓碎備用。
    image:
      src: ./step-1.webp
      alt: 青木瓜刨皮對剖去籽，用刨絲器刨成均勻細絲，浸入冰開水中冷鎮 10 分鐘撈起徹底瀝乾水分；蝦米泡溫水軟
  - text: 大碗中倒入檸檬汁、魚露、糖與紅辣椒末充分攪拌至糖完全融化成泰式酸辣醬汁。
  - text: 將瀝乾水分的青木瓜絲、洋蔥絲、番茄塊與蝦米碎放入大碗中，倒入酸辣醬汁，用手套輕輕抓拌按壓使醬汁充分滲透入木瓜絲纖維中入味。
    image:
      src: ./step-3.webp
      alt: 將瀝乾水分的青木瓜絲、洋蔥絲、番茄塊與蝦米碎放入大碗中，倒入酸辣醬汁，用手套輕輕抓拌按壓使醬汁充分滲
  - text: 盛入盤中，表面撒上大量香脆熟花生碎與新鮮香菜末，即可享用冰涼脆爽的泰式風味。
