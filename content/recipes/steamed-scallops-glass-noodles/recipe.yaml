title: 蒜蓉粉絲蒸扇貝
summary: 帶殼新鮮大扇貝洗淨去腸泥，冬粉泡軟吸飽鮮甜高湯鋪在貝殼底層，放上飽滿厚實扇貝肉，淋上現剁蒜末與料理米酒，入蒸鍋大火清蒸 5 分鐘至貝肉彈牙鮮嫩，鋪上蔥花澆淋滾燙熱油激發香氣，淋上蒸魚豉油，冬粉吸飽扇貝鮮美精華，蒜香撲鼻。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: 以帶殼鮮扇貝清蒸為唯一海鮮主角，佐以冬粉與蒜蓉醬，屬於海鮮類料理。
