steps:
  - text: 扇貝洗淨去除內臟砂囊，輕輕刮下貝肉保留底殼洗淨；冬粉泡冷水 15 分鐘至軟剪短段；大蒜切碎末、青蔥切蔥花、生薑切末備用。
    image:
      src: ./step-1.webp
      alt: 扇貝洗淨去除內臟砂囊，輕輕刮下貝肉保留底殼洗淨；冬粉泡冷水 15 分鐘至軟剪短段；大蒜切碎末、青蔥切
  - text: 在每隻扇貝殼底鋪上一撮泡軟冬粉，放上厚實扇貝肉，均勻鋪上蒜末與少許薑末，淋上米酒，排入蒸盤。
    image:
      src: ./step-2.webp
      alt: 在每隻扇貝殼底鋪上一撮泡軟冬粉，放上厚實扇貝肉，均勻鋪上蒜末與少許薑末，淋上米酒，排入蒸盤。
  - text: 蒸鍋水大滾後放入蒸盤，蓋上鍋蓋以大火清蒸約 5 分鐘至扇貝剛好熟透彈牙，取出蒸盤鋪上大量青蔥花。
  - text: 另起小鍋將沙拉油加熱至高溫，均勻澆淋在蔥花蒜蓉上滋滋激發出香氣，最後在每個扇貝邊緣淋上蒸魚醬油即可盛盤趁熱享用。
