tip: 用紙包或鋁箔紙包裹烘烤能牢牢鎖住鮭魚體內的天然水分與健康魚油，烘烤後魚肉宛如舒肥般柔嫩爆汁，底層洋蔥亦能吸飽甘甜魚脂。
