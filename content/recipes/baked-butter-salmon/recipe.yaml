    group: 調味
steps:
  - text: 鮭魚菲力雙面均勻抹上鹽、黑胡椒粒與米酒醃漬 10 分鐘拭乾水分；洋蔥切細絲；鴻禧菇撕成小撮；大蒜切薄片備用。
    image:
      src: ./step-1.webp
      alt: 鮭魚菲力雙面均勻抹上鹽、黑胡椒粒與米酒醃漬 10 分鐘拭乾水分；洋蔥切細絲；鴻禧菇撕成小撮；大蒜切薄
  - text: 取一張大烘焙紙或鋁箔紙，底層鋪上洋蔥絲與鴻禧菇、蒜片，擺上醃好的鮭魚菲力，頂部放上奶油塊，四周向上折緊密封成包狀。
    image:
      src: ./step-2.webp
      alt: 取一張大烘焙紙或鋁箔紙，底層鋪上洋蔥絲與鴻禧菇、蒜片，擺上醃好的鮭魚菲力，頂部放上奶油塊，四周向上折
  - text: 烤箱預熱至 220°C，將紙包鮭魚放入烤盤烘烤約 14 至 15 分鐘至魚肉熟透、油脂溢出香氣四溢。
  - text: 取出小心撕開紙包，表面撒上少許新鮮黑胡椒粒與綠色香草末，即可端盤趁熱享用多汁細嫩的魚肉。
