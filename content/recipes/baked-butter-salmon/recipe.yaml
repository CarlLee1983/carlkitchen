title: 奶油香烤鮭魚菲力
summary: 厚切新鮮大西洋鮭魚菲力雙面均勻抹上海鹽、黑胡椒粒與米酒醃漬，鋁箔紙上鋪上鮮甜洋蔥絲、鴻禧菇與蒜片，放上鮭魚菲力並抹上香濃天然發酵奶油包裹密封，入烤箱高溫烘烤至魚肉熟透溢出甘甜魚脂，撒上香草末，肉質鮮嫩多汁、奶香撲鼻。
servings: 2
category: 非湯料理
dishKinds: [seafood]
classificationReason: 以厚切鮭魚菲力抹奶油烘烤為唯一海鮮主角，佐以洋蔥、鮮菇，屬於海鮮類料理。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [西式料理, 烤箱料理, 鮭魚, 奶油, 海鮮]
aliases: [紙包烤鮭魚, 奶油烤鮭魚排]
ingredients:
  - name: 鮭魚菲力
    amount:
      value: 250
      unit: g
    note: 厚切新鮮鮭魚切片
  - name: 洋蔥
    amount:
      value: 50
      unit: g
    note: 切細絲鋪底
  - name: 鴻禧菇
    amount:
      value: 40
      unit: g
    note: 切去蒂頭撕散
  - name: 蒜頭
    amount:
      value: 10
      unit: g
    note: 切薄片
  - name: 無鹽奶油
    amount:
      value: 20
      unit: g
    note: 天然發酵奶油
  - name: 米酒
    amount:
      value: 10
      unit: ml
    note: 或白酒醃魚
    group: 調味
  - name: 黑胡椒粒
    amount:
