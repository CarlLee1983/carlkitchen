steps:
  - text: "蝦仁洗淨擦乾後切丁；叉燒切丁；青豆以沸水汆燙後澇起瀝乾。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的揚州炒飯主要材料
  - text: "鍋入少許油燒熱，將叉燒丁、蝦仁丁以大火快炒過油後隨即撈起備用。"
  - text: "蛋打散成蛋液，趁熱下鍋翻炒至顏色略變金黃時，放入白飯翻炒至米粒呈鬆散狀，再加入作法2的叉燒丁、蝦仁丁及熟青豆、蔥花、西生菜絲及所有調味料繼續拌炒均勻入味即可盛起食用。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味揚州炒飯
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之揚州炒飯各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
