title: 揚州炒飯
summary: 依核准食譜指南製作之經典家常揚州炒飯，風味道地鮮明。
servings: 3
category: 主食
dishKinds: []
classificationReason: "叉燒蝦仁與蔬菜丁金黃米飯拌炒，經典主食。"
draft: false
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 20
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 叉燒, amount: { value: 100, unit: g }, note: 原料標示 1兩 }
  - { name: 蝦仁, amount: { value: 100, unit: g }, note: 原料標示 1兩 }
  - { name: 蛋, amount: { value: 100, unit: g }, note: 原料標示 1個 }
  - { name: 青豆, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 西生菜絲, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 蔥花, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 白飯, amount: { value: 100, unit: g }, note: 原料標示 6兩 }
  - { name: 美極鮮味露, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 鮮雞晶, amount: { value: 100, unit: g }, note: 原料標示 1/4小匙 }
