tip: 虱目魚肚肉質細嫩，滾水下鍋後以中小火煮 3 分鐘即可，切勿久滾以保持滑潤魚脂；薑絲於起鍋前或盛碗時加入，清爽辛香最能襯托魚肚甘甜。
