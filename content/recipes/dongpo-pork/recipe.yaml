steps:
  - text: 整塊帶皮五花肉洗淨修成正方塊，燒一鍋滾水將肉塊汆燙去除血水與雜質後撈出洗淨。
    image:
      src: ./step-1.webp
      alt: 整塊帶皮五花肉洗淨修成正方塊，燒一鍋滾水將肉塊汆燙去除血水與雜質後撈出洗淨。
  - text: 電鍋內鍋先放入蔥段與薑片均勻鋪底，再將汆燙好的帶皮五花肉皮朝下放入鍋中。
    image:
      src: ./step-2.webp
      alt: 電鍋內鍋先放入蔥段與薑片均勻鋪底，再將汆燙好的帶皮五花肉皮朝下放入鍋中。
  - text: 內鍋中倒入細砂糖、紹興酒、水及醬油；電鍋外鍋加 2 杯水，按下開關蒸煮至跳起。
  - text: 開蓋將肉塊翻面使外皮朝上，外鍋再加 2 杯水續蒸至跳起，蒸好後燜 15 分鐘讓肉質酥爛入味。
  - text: 挑去蔥段與薑片將東坡肉裝盤；青江菜對切入滾水汆燙熟後圍邊裝飾，淋上鍋中濃郁湯汁即可。
