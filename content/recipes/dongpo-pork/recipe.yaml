title: 東坡肉
summary: 帶皮五花肉修成方正大塊，汆燙洗淨後皮朝下置於鋪滿蔥段與薑片的鍋中，加入紹興酒、醬油與細砂糖慢火燜蒸至肉質酥爛。色澤紅亮晶透，肥而不膩。
servings: 4
category: 非湯料理
