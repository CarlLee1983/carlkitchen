  alt: 盤中盛裝熱氣騰騰之美味三杯炒海瓜子
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之三杯炒海瓜子各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
