title: 生菜蝦鬆
summary: 新鮮鮮蝦仁剁細粒，搭配清脆荸薺丁、竹筍丁、芹菜末與香菇丁熱油大火爆炒，調入少許海鹽與白胡椒粉帶出海鮮甘甜，拌入酥脆老油條碎，包入冰鎮後爽脆如碗的新鮮美生菜葉中，外脆內嫩、清甜多汁、經典名饌。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: 以鮮蝦仁切丁熱炒為主軸海鮮主角，搭配荸薺與美生菜包食，屬於海鮮類料理。
