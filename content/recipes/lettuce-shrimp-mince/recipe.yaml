steps:
  - text: 蝦仁挑除泥腸洗淨用紙巾吸乾水分，粗剁成米粒大小蝦丁加少許米酒抓勻；荸薺、熟竹筍去皮切細丁；芹菜切末、生薑切細末；老油條低溫烤酥壓碎；美生菜剪修成圓碗狀泡冰水瀝乾備用。
    image:
      src: ./step-1.webp
      alt: 蝦仁挑除泥腸洗淨用紙巾吸乾水分，粗剁成米粒大小蝦丁加少許米酒抓勻；荸薺、熟竹筍去皮切細丁；芹菜切末、
  - text: 炒鍋倒入植物油加熱，放入薑末小火炒香，倒入蝦仁丁大火快炒約 40 秒至蝦肉變粉紅緊實八分熟盛出。
    image:
      src: ./step-2.webp
      alt: 炒鍋倒入植物油加熱，放入薑末小火炒香，倒入蝦仁丁大火快炒約 40 秒至蝦肉變粉紅緊實八分熟盛出。
  - text: 原鍋放入荸薺丁、竹筍丁與芹菜末翻炒 1 分鐘煸出香氣，倒回炒好的蝦仁丁，加入鹽、白胡椒粉與香油快速翻炒均勻熄火盛盤。
  - text: 將炒好的蝦鬆盛入盤中，表面撒上酥脆老油條碎，搭配冰脆美生菜碗一同上桌，食用時以生菜包裹享用。
