tip: 肉餡拌好後分次打入冷水攪至出膠，蒸出來的肉餅才會鮮嫩多汁不乾柴硬塊；鹹魚本身鹽分高，無需額外加鹽，少許糖能柔和鹹度激發甘鮮。
