protein: false
timeMinutes: 10
tags: [地瓜葉, 家常青菜, 蒜炒, 蔬菜, 素食友善]
aliases: [蒜香地瓜葉, 燙地瓜葉淋蒜醬]
ingredients:
  - name: 地瓜葉
    amount:
      value: 250
      unit: g
    note: 摘取嫩葉與嫩莖撕除表皮粗絲洗淨
  - name: 大蒜
    amount:
      value: 30
      unit: g
    note: 去皮切細蒜碎
  - name: 醬油
    amount:
      value: 20
      unit: ml
    note: 約 1.5 大匙甘醇醬油
    group: 調味
  - name: 香油
    amount:
      value: 15
      unit: ml
    note: 約 1 大匙純芝麻香油
    group: 調味
  - name: 細砂糖
    amount:
      value: 5
      unit: g
    note: 約 1 茶匙中和鹹度
    group: 調味
  - name: 水
    amount:
      value: 45
      unit: ml
    note: 煮醬汁用
    group: 調味
  - name: 鹽
    amount:
      value: 2
      unit: g
