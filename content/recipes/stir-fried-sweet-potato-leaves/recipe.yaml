    group: 調味
steps:
  - text: 地瓜葉摘除粗老梗部，順勢撕去莖部外圍粗硬筋絲，洗淨瀝乾；大蒜去皮剁成細碎末備用。
    image:
      src: ./step-1.webp
      alt: 地瓜葉摘除粗老梗部，順勢撕去莖部外圍粗硬筋絲，洗淨瀝乾；大蒜去皮剁成細碎末備用。
  - text: 深鍋注入大半鍋水，加 1 茶匙鹽與幾滴植物油煮至大滾，放入地瓜葉大火汆燙約 40 秒至葉色碧綠柔軟，迅速撈起瀝乾水分盛入盤中。
    image:
      src: ./step-2.webp
      alt: 深鍋注入大半鍋水，加 1 茶匙鹽與幾滴植物油煮至大滾，放入地瓜葉大火汆燙約 40 秒至葉色碧綠柔軟，
  - text: 取小平底鍋倒入香油與少許植物油加熱，放入蒜末以中小火煸炒出濃郁蒜香，加入醬油、細砂糖與水煮滾 30 秒至醬汁香醇。
  - text: 將熱騰騰的蒜香甘醇醬汁均勻澆淋在地瓜葉上方，食用時稍加拌勻即可享用軟嫩滑順的家常好滋味。
