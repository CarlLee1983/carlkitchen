tip: 汆燙地瓜葉時水一定要足且水滾後下鍋，滾水中加入少許鹽與植物油能有效隔絕空氣，燙出的地瓜葉能長久保持碧綠翠亮不發黑；淋上熱蒜油醬汁香氣倍增。
