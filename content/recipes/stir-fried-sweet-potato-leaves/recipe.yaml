title: 蒜炒地瓜葉
summary: 鮮嫩地瓜葉摘除老梗撕去外皮粗絲洗淨，入滾水加幾滴油快速汆燙保翠綠，撈起瀝乾置盤，平底鍋爆香大量金黃蒜末，調入純釀醬油、甘甜白糖與純芝麻香油燴煮成甘醇蒜香醬汁，趁熱澆淋在翠綠地瓜葉上拌勻，菜葉柔嫩細緻、蒜香甘醇、經典家常青菜。
servings: 3
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 以新鮮地瓜葉為唯一蔬菜主角，佐以蒜末醬汁澆拌，屬於純蔬菜料理。
draft: false
mealCandidate: true
