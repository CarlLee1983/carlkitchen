steps:
  - text: "排骨切塊放入沸水中汆燙去除血水；白蘿蔔去皮切滾刀塊，放入沸水中汆燙去除辛辣味，備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之蘿蔔排骨湯主要材料
  - text: "將作法1的排骨塊、白蘿蔔塊及所有調味料放入沸水中以大火煮至沸騰。"
  - text: "轉小火繼續煮約30分鐘，起鍋前放入香油及香菜即可。"
