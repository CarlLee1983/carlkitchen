title: 蘿蔔排骨湯
summary: 依核准食譜指南製作之經典家常蘿蔔排骨湯，風味道地鮮明。
servings: 4
category: 湯
dishKinds: []
classificationReason: "清甜白蘿蔔塊與豬排骨慢火細熬之甘甜家常湯。"
