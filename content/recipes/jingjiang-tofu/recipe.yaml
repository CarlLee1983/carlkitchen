title: 京醬豆腐
summary: 板豆腐切厚三角塊入油鍋微炸定型形成金黃酥皮，熱鍋爆香青蔥段、薑片與胡蘿蔔片，加入甜麵醬、醬油與糖慢火煨煮入味，豆腐吸飽鹹甜濃稠醬汁，淋上香油，豆香濃郁、醬汁醇厚下飯。
servings: 3
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: 以板豆腐切塊炸黃煨醬為唯一蛋豆類主角，屬於蛋豆類家常料理。
