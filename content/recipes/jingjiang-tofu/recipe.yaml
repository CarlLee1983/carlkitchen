steps:
  - text: 板豆腐洗淨瀝乾，斜對角切成厚三角形塊狀；青蔥切段、生薑切片、胡蘿蔔切薄片備用。
    image:
      src: ./step-1.webp
      alt: 板豆腐洗淨瀝乾，斜對角切成厚三角形塊狀；青蔥切段、生薑切片、胡蘿蔔切薄片備用。
  - text: 熱鍋倒入適量油燒至約 160°C，放入三角豆腐塊以中火煎炸至外表微金黃定型後撈起瀝油。
    image:
      src: ./step-2.webp
      alt: 熱鍋倒入適量油燒至約 160°C，放入三角豆腐塊以中火煎炸至外表微金黃定型後撈起瀝油。
  - text: 原鍋留少許底油，爆香蔥段、薑片與胡蘿蔔片，加入甜麵醬炒香出醬味，注入醬油、糖與約 150 ml 水煮滾。
  - text: 放入炸好的豆腐塊轉小火燒煮約 3 分鐘至湯汁微收濃入味，淋入太白粉水勾薄芡，起鍋前滴入香油拌勻即可盛盤。
