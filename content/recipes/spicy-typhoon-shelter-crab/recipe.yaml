steps:
  - text: 螃蟹刷洗乾淨去除鰓肺，斬成適口塊狀，蟹肉切口均勻沾裹上一層薄地瓜粉；青蔥切段、乾辣椒剪小段備用。
    image:
      src: ./step-1.webp
      alt: 螃蟹刷洗乾淨去除鰓肺，斬成適口塊狀，蟹肉切口均勻沾裹上一層薄地瓜粉；青蔥切段、乾辣椒剪小段備用。
  - text: 起油鍋燒熱至約 180°C，放入沾粉螃蟹塊大火炸約 3 分鐘至外殼鮮紅硬挺酥脆，撈起充分瀝乾油分。
    image:
      src: ./step-2.webp
      alt: 起油鍋燒熱至約 180°C，放入沾粉螃蟹塊大火炸約 3 分鐘至外殼鮮紅硬挺酥脆，撈起充分瀝乾油分。
  - text: 另取炒鍋留少許底油，放入蔥段、乾辣椒段與黑豆豉碎小火煸炒出濃郁香氣。
  - text: 倒入炸酥的螃蟹塊與大量金黃蒜酥，撒上胡椒鹽，轉大火快速翻拋翻炒均勻，使蒜酥緊緊裹附在蟹殼表面即可熄火盛盤。
