title: 避風塘炒蟹
summary: 螃蟹切塊拍薄脆漿粉高溫酥炸至外殼紅亮酥脆、肉質鮮甜多汁，熱鍋以少許油爆香乾辣椒段與蔥段，倒入大量金黃香脆蒜酥、豆豉碎與炸螃蟹大火快速翻炒，蒜香撲鼻、微辣酥脆、經典港式海鮮名菜。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: 以螃蟹裹薄粉油炸後與金黃蒜酥大火翻炒為唯一海鮮主角，屬於海鮮類料理。
draft: false
mealCandidate: true
