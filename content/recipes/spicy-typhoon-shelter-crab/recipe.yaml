tip: 螃蟹切口沾上地瓜粉能緊緊鎖住鮮美蟹汁不流失；蒜酥本身已是熟香金黃，下鍋後只需大火快速與炸蟹翻拋混合即可，不可久炒以防蒜酥焦苦變黑。
