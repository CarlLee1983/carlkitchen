title: 紅酒燉牛肉
summary: 牛腩與馬鈴薯、紅蘿蔔加入紅酒和香料燉煮至軟熟。
servings: 3
category: 非湯料理
draft: true
mealCandidate: true
vegetable: true
protein: true
timeMinutes: 60
tags: [家常菜, 燉煮]
ingredients:
  - { name: 牛腩, amount: { value: 300, unit: g }, note: 切小塊 }
  - { name: 馬鈴薯, amount: { value: 2, unit: 顆 }, note: 去皮切滾刀塊 }
  - { name: 紅蘿蔔, amount: { value: 0.5, unit: 條 }, note: 去皮切滾刀塊 }
  - { name: 蒜頭, amount: { value: 3, unit: 顆 }, note: 切片 }
  - { name: 綠花椰菜, amount: { value: 1, unit: 朵 } }
  - { name: 水, amount: { value: 800, unit: ml } }
  - { name: 紅酒, amount: { value: 250, unit: ml } }
  - { name: 奶油, amount: { value: 20, unit: g } }
  - {
      name: 沙拉油,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙,
      group: 調味,
    }
  - { name: 鹽, note: 少許, group: 調味 }
  - { name: 黑胡椒, note: 少許, group: 調味 }
  - { name: 月桂葉, amount: { value: 3, unit: 片 }, group: 調味 }
  - {
      name: 迷迭香,
      amount: { value: 5, unit: ml },
      note: 約 1 小匙,
      group: 調味,
    }
steps:
  - text: 牛腩洗淨切小塊，放入滾水汆燙後瀝乾。
  - text: 馬鈴薯和紅蘿蔔去皮切滾刀塊，蒜頭切片。
  - text: 熱鍋加入沙拉油，以中火將牛腩煎至上色。
  - text: 加入馬鈴薯、紅蘿蔔和蒜片炒香，倒入紅酒與水煮滾。
  - text: 加入奶油、鹽、黑胡椒、月桂葉和迷迭香，蓋鍋以中小火燉煮約 25 分鐘。
