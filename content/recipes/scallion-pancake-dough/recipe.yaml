title: 蔥油餅麵糰
summary: 依核准食譜指南製作之經典家常蔥油餅麵糰，風味道地鮮明。
servings: 4
category: 主食
dishKinds: []
classificationReason: "自製層次分明之燙麵蔥油餅，主食點心。"
draft: false
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 45
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 中筋麵粉, amount: { value: 100, unit: g }, note: 原料標示 600公克 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 5公克 }
  - { name: 細砂糖, amount: { value: 100, unit: g }, note: 原料標示 30公克 }
  - { name: 溫水, amount: { value: 100, unit: g }, note: 原料標示 380㏄ }
steps:
  - text: "將中筋麵粉過篩入大盆中，加入細砂糖和鹽稍微拌勻，倒入約70℃溫水後以桿麵棍或筷子拌勻。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的蔥油餅麵糰主要材料
  - text: "再以雙手將作法1揉桿約3分鐘，用乾淨的濕毛巾或保鮮膜蓋好，靜置放涼醒約20分鐘。"
  - text: "最後將作法2的麵糰取出，揉至表面光滑即可。"
