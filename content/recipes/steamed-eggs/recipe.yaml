title: 家常蒸蛋
summary: 雞蛋加水蒸成滑嫩蛋羹，起鍋後淋上醬油與麻油，味道清淡，適合配飯。
servings: 4
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: 三顆雞蛋加水蒸成完整蛋羹，醬油與麻油只在起鍋後調味。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 55
tags: [家常菜]
ingredients:
  - { name: 雞蛋, amount: { value: 3, unit: 顆 } }
  - { name: 水, amount: { value: 450, unit: g }, note: 加入蛋液用 }
  - { name: 鹽, amount: { value: 3, unit: g }, note: 約 3/4 茶匙, group: 調味 }
  - { name: 醬油, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
  - { name: 麻油, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
steps:
  - text: 將雞蛋與鹽打勻，再拌入水，透過篩網倒進蒸碗。
    image:
      {
        src: ./step-1.webp,
        alt: 素色瓷碗裡盛著拌勻過篩的淡黃色蛋液，旁邊放著帶有少量蛋液的篩網,
      }
  - text: 用鋁箔紙蓋住蒸碗，放入蒸鍋。先以大火蒸 5 分鐘，再轉小火蒸 20 分鐘。
    image:
      {
        src: ./step-2.webp,
        alt: 金屬蒸鍋裡放著以鋁箔紙覆蓋的瓷碗，碗下可見蒸架，周圍有蒸氣,
      }
  - text: 熄火後保持鍋蓋蓋著，讓蛋羹在鍋內燜 15 至 20 分鐘，再揭開鋁箔紙。
    image:
      {
        src: ./step-3.webp,
        alt: 蒸鍋內的瓷碗已揭開部分鋁箔紙，露出平整的淡黃色蛋羹，表面尚未淋醬,
      }
  - text: 用食品溫度計確認蛋羹內部達到 71°C；若未達溫度，繼續蒸至達標。
  - text: 將醬油與麻油淋在蛋羹表面即可上桌。
tip: 醬油與麻油的用量可依口味調整。
