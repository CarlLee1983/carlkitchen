title: 薑絲大腸
summary: 依核准食譜指南製作之經典家常薑絲大腸，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: "豬大腸以嫩薑絲與白醋快炒酸香爽口，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [家常菜, 台灣小吃]
ingredients:
  - {
      name: 處理好大腸,
      amount: { value: 100, unit: g },
      note: 原料標示 600公克,
    }
  - { name: 嫩薑, amount: { value: 100, unit: g }, note: 原料標示 1塊 }
  - { name: 蒜末, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 辣椒, amount: { value: 100, unit: g }, note: 原料標示 1支 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 1/2小匙 }
  - { name: 雞粉, amount: { value: 100, unit: g }, note: 原料標示 1/2小匙 }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 醋精, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 香油, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 油, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
steps:
  - text: "大腸以清洗處理後，放入滾水中汆燙約1分鐘，取出備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的薑絲大腸主要材料
  - text: "將作法1的大腸切段；嫩薑切絲；辣椒切片，備用。"
  - text: "熱一鍋，倒入油，放入蒜末及作法2的薑絲爆香，再放入作法2的大腸段以大火炒約1分鐘。"
  - text: "加入米酒蓋上鍋蓋，以中火燜煮約2分鐘，再放入作法2的辣椒片、其餘調味料炒入味即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味薑絲大腸
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之薑絲大腸各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
