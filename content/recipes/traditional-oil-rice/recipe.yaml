title: 傳統古早味油飯
summary: 長糯米浸泡蒸至米心透亮，熱油爆香紅蔥頭與金黃蝦米，加入乾香菇絲、發泡魷魚條與醃豬肉絲大火炒香，淋入醬油、五香粉、白胡椒粉與米酒調味，拌入晶瑩糯米飯炒勻回蒸，油亮粒粒分明、香氣撲鼻。
servings: 4
category: 主食
dishKinds: []
classificationReason: 主食不設料理主角與配餐角色，以長糯米拌炒香菇肉絲與蝦米紅蔥酥為經典傳統米食主餐。
