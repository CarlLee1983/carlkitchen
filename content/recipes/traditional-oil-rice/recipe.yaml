tip: 糯米先蒸熟再與炒香的料汁翻拌，能確保米粒粒粒分明Q彈而不軟爛；紅蔥頭一定要以中小火慢慢煸至微金黃，不可焦黑，蔥油香氣才會醇厚甘甜。
