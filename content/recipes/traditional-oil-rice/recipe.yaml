steps:
  - text: 長糯米浸泡冷水 2 小時瀝乾，入蒸籠大火蒸約 15 分鐘至米心熟透呈透明狀；香菇、蝦米、魷魚泡軟切絲；紅蔥頭切薄片；豬肉絲抓少許醬油備用。
    image:
      src: ./step-1.webp
      alt: 長糯米浸泡冷水 2 小時瀝乾，入蒸籠大火蒸約 15 分鐘至米心熟透呈透明狀；香菇、蝦米、魷魚泡軟切絲
  - text: 熱鍋倒入適量油，放入紅蔥頭薄片與蝦米以中小火煸炒至金黃酥香散發濃烈蔥香。
  - text: 加入香菇絲、魷魚絲與豬肉絲翻炒至熟，調入醬油、糖、米酒、五香粉與白胡椒粉炒出濃郁醬香。
    image:
      src: ./step-3.webp
      alt: 加入香菇絲、魷魚絲與豬肉絲翻炒至熟，調入醬油、糖、米酒、五香粉與白胡椒粉炒出濃郁醬香。
  - text: 轉小火倒入蒸好的糯米飯快速翻拌均勻，讓米粒均勻吸附醬汁呈琥珀油亮色，重新入蒸籠回蒸 5 分鐘，出籠撒上香菜即可享用。
