title: 台式海鮮粥
summary: 以鮮美高湯滾煮白飯至米粒軟糊，放入鮮甜白蝦仁、花枝片、魚片與鮮蚵大火滾煮，調入鹽巴與白胡椒粉，淋入蛋液化作金黃蛋花，撒上香油，鮮香濃郁、暖胃鮮甜。
servings: 3
category: 主食
dishKinds: []
classificationReason: 主食不設料理主角與配餐角色，以白米飯與綜合海鮮熬煮成一碗飽足的海鮮粥品。
