steps:
  - text: 蝦仁挑除腸泥、花枝切花刀刻紋、魚片切厚片、鮮蚵輕輕洗淨瀝乾；白飯加少許水輕輕抓散備用。
    image:
      src: ./step-1.webp
      alt: 蝦仁挑除腸泥、花枝切花刀刻紋、魚片切厚片、鮮蚵輕輕洗淨瀝乾；白飯加少許水輕輕抓散備用。
  - text: 湯鍋倒入高湯大火煮滾，加入抓散的白飯轉小火熬煮約 5 分鐘至米粒開花微稠。
  - text: 轉中大火放入蝦仁、花枝、魚片與鮮蚵快速攪拌煮約 1 分鐘至海鮮全熟變色，調入鹽、白胡椒粉與香油。
    image:
      src: ./step-3.webp
      alt: 轉中大火放入蝦仁、花枝、魚片與鮮蚵快速攪拌煮約 1 分鐘至海鮮全熟變色，調入鹽、白胡椒粉與香油。
  - text: 淋入打散的蛋液輕輕攪出蛋花，凝固後立即熄火盛入大碗趁熱享用。
