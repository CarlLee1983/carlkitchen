steps:
  - text: 南瓜洗淨去籽切成約半公分厚片，表面拍上薄薄一層低筋麵粉備用；鹹蛋黃與蛋白分別切碎。
    image:
      src: ./step-1.webp
      alt: 南瓜洗淨去籽切成約半公分厚片，表面拍上薄薄一層低筋麵粉備用；鹹蛋黃與蛋白分別切碎。
  - text: 熱鍋倒入適量油，放入裹粉南瓜片煎至兩面金黃微軟後撈起瀝乾油分。
  - text: 原鍋留少許底油，放入鹹蛋黃碎以小火慢炒至起細白泡泡（金沙狀），加入絞肉與薑末炒散炒香。
    image:
      src: ./step-3.webp
      alt: 原鍋留少許底油，放入鹹蛋黃碎以小火慢炒至起細白泡泡（金沙狀），加入絞肉與薑末炒散炒香。
  - text: 倒入煎好的南瓜片輕輕翻拌裹勻金沙，撒入少許白胡椒粉與蔥花拌勻即可盛盤。
