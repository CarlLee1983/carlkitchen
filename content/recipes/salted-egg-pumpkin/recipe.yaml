title: 金沙南瓜
summary: 新鮮南瓜切厚片裹薄粉微煎熟透，熟鹹蛋黃細剁碎後入鍋炒至金黃起泡，再放入南瓜片與薑末快速翻炒包裹均勻，鹹甜粉糯、香氣四溢。
servings: 3
category: 非湯料理
dishKinds: [vegetable, egg-bean]
classificationReason: 以新鮮南瓜切片煎熟為蔬菜主角，裹上細炒起泡的鹹蛋黃金沙，屬於蔬菜與蛋豆類料理。
