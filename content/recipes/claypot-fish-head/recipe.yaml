steps:
  - text: 鰱魚頭刮洗乾淨擦乾水分，表面均勻拍上一層薄地瓜粉；大白菜手撕成大片、乾香菇泡軟切厚片、腐竹泡軟切段滾水汆燙撈起；大蒜切碎、青蒜切絲備用。
    image:
      src: ./step-1.webp
      alt: 鰱魚頭刮洗乾淨擦乾水分，表面均勻拍上一層薄地瓜粉；大白菜手撕成大片、乾香菇泡軟切厚片、腐竹泡軟切段滾
  - text: 油鍋燒熱，放入拍粉魚頭中火油炸約 6 分鐘至兩面表皮金黃酥脆硬挺，撈起瀝乾油分備用。
    image:
      src: ./step-2.webp
      alt: 油鍋燒熱，放入拍粉魚頭中火油炸約 6 分鐘至兩面表皮金黃酥脆硬挺，撈起瀝乾油分備用。
  - text: 取砂鍋熱鍋加少許油，爆香蒜末、薑片與扁魚乾至香氣四溢，鋪入大白菜、香菇、腐竹與金針菇，將炸金黃的魚頭擺在蔬菜上方。
  - text: 倒入高湯、米酒、醬油、鹽與白胡椒粉煮滾，加蓋轉小火慢燉 25 分鐘讓魚香與蔬菜鮮甜充分融合，起鍋前撒上青蒜絲即可整鍋上桌。
