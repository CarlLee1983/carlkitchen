title: 砂鍋魚頭
summary: 肥美新鮮大鰱魚頭沾薄地瓜粉炸至金黃酥香，砂鍋中以蒜末與爆香扁魚乾為底，鋪滿甘甜大白菜、香菇、腐竹、金針菇與熟筍片，擺入炸魚頭注入高湯細火慢燉，白菜釋放自然清甜、魚肉鮮濃軟嫩、湯頭濃郁甘醇。
servings: 4
category: 湯
dishKinds: []
classificationReason: 砂鍋魚頭為經典大鍋燉湯，湯品不設料理主角與配餐角色。
