title: 什錦炒米粉
summary: 台灣純米米粉泡溫水剪段，爆香開陽蝦米、香菇絲與金黃油蔥酥，投入鮮嫩豬肉絲大火快炒，倒入甘甜高麗菜絲、紅蘿蔔絲與韭菜段煨煮出清甜高湯，投入米粉充分翻拌燜煮吸飽蔬菜肉汁，起鍋前大火翻乾，米粉Ｑ彈爽口、香氣四溢、經典古早味。
servings: 3
category: 主食
dishKinds: []
classificationReason: 以米粉為主體搭配肉絲與蔬菜熱炒，可獨立作為一餐，屬於主食料理。
