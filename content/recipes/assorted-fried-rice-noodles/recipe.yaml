steps:
  - text: 米粉以溫水浸泡 10 分鐘軟化撈起，以剪刀對剪兩刀瀝乾；蝦米泡溫水洗淨；乾香菇泡軟切細絲；高麗菜切粗絲、胡蘿蔔切細絲、韭菜切段；豬肉切細絲備用。
    image:
      src: ./step-1.webp
      alt: 米粉以溫水浸泡 10 分鐘軟化撈起，以剪刀對剪兩刀瀝乾；蝦米泡溫水洗淨；乾香菇泡軟切細絲；高麗菜切粗
  - text: 炒鍋加熱倒入植物油，放入香菇絲與蝦米中火炒出濃郁海味，加入豬肉絲翻炒至肉色轉白散開。
    image:
      src: ./step-2.webp
      alt: 炒鍋加熱倒入植物油，放入香菇絲與蝦米中火炒出濃郁海味，加入豬肉絲翻炒至肉色轉白散開。
  - text: 加入胡蘿蔔絲、油蔥酥、醬油、鹽、細砂糖、白胡椒粉與 250 ml 香菇水大火煮滾，放入高麗菜絲稍煮 1 分鐘使蔬菜甘甜溶入湯汁。
  - text: 倒入瀝乾的米粉與韭菜段，以長鍋鏟迅速翻拌抓鬆，加蓋小火燜煮 2 分鐘讓米粉徹底吸乾精華湯汁，揭蓋大火翻炒乾爽即可盛盤。
