tip: 炒米粉最怕乾硬或軟爛，關鍵在於煮滾蔬菜肉絲高湯後再下米粉，蓋上鍋蓋微火燜兩分鐘讓米粉如海綿般吸飽鮮甜高湯，拌炒時用筷子挑鬆，根根均勻潤澤彈牙。
