title: 家常紅燒豆腐
summary: 依核准食譜指南製作之經典家常家常紅燒豆腐，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: "嫩豆腐切厚塊兩面煎金黃以醬油高湯醬燒入味，蛋豆主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 蛋豆腐, amount: { value: 1.0, unit: g }, note: 原料標示 1盒 }
  - { name: 蔥, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 蒜末, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 辣椒絲, amount: { value: 5.0, unit: g }, note: 原料標示 5公克 }
  - {
      name: 牛頭牌紅蔥肉燥,
      amount: { value: 2.0, unit: g },
      note: 原料標示 2大匙,
    }
  - {
      name: 牛頭牌原味高湯,
      amount: { value: 50.0, unit: g },
      note: 原料標示 50㏄,
    }
steps:
  - text: "將蛋豆腐切厚片；蔥切花，備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之家常紅燒豆腐主要材料
  - text: "熱鍋，倒入少許油，將作法1的蛋豆腐片放入鍋中煎至兩面金黃。"
  - text: "加入蒜末、辣椒絲、牛頭牌紅蔥肉燥及牛頭牌原味高湯，以小火煮開。"
  - text: "續煮約1分鐘後湯汁略收乾，起鍋盛盤撒上蔥花及辣椒絲即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味家常紅燒豆腐
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之家常紅燒豆腐各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
