title: 馬鈴薯燉肉
summary: 豬肉、馬鈴薯和紅蘿蔔加入醬油調味，以電鍋燉到入味。
servings: 2
category: 非湯料理
draft: true
mealCandidate: true
vegetable: true
protein: true
timeMinutes: 60
tags: [家常菜, 電鍋料理]
ingredients:
  - { name: 豬肉, amount: { value: 300, unit: g }, note: 切塊 }
  - { name: 馬鈴薯, amount: { value: 200, unit: g }, note: 去皮切小塊 }
  - { name: 紅蘿蔔, amount: { value: 80, unit: g }, note: 去皮切小塊 }
  - { name: 蔥段, amount: { value: 15, unit: g } }
  - { name: 薑片, amount: { value: 5, unit: g } }
  - {
      name: 醬油,
      amount: { value: 60, unit: ml },
      note: 約 4 大匙,
      group: 調味,
    }
  - {
      name: 細砂糖,
      amount: { value: 12, unit: g },
      note: 約 1 大匙,
      group: 調味,
    }
  - {
      name: 米酒,
      amount: { value: 30, unit: ml },
      note: 約 2 大匙,
      group: 調味,
    }
  - { name: 水, amount: { value: 300, unit: ml }, group: 調味 }
  - { name: 外鍋水, amount: { value: 2, unit: 杯 }, note: 電鍋外鍋用 }
steps:
  - text: 馬鈴薯和紅蘿蔔去皮，切成小塊。
  - text: 豬肉切塊，放入滾水汆燙去血水後洗淨、瀝乾。
  - text: 將豬肉、馬鈴薯、紅蘿蔔、蔥段、薑片、醬油、細砂糖、米酒和水放入電鍋內鍋。
  - text: 外鍋加入 2 杯水，按下開關蒸煮至跳起，再燜 10 分鐘。
