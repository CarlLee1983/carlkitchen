title: 何首烏雞湯
summary: 特選台灣優質黑羽土雞剁塊滾水汆燙，砂鍋中加入製何首烏、黑棗、熟地、黃耆、枸杞與甘甜老薑片，注入米酒與清水慢火細燉四十分鐘，深黑晶亮黑金湯頭散發溫厚甘醇漢方香氣，雞肉軟嫩鮮甜、養血溫潤、深秋初冬滋補名品。
servings: 4
category: 湯
dishKinds: []
classificationReason: 何首烏雞湯為經典漢方藥膳燉湯，湯品不設料理主角與配餐角色。
