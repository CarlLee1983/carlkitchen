steps:
  - text: 土雞肉剁成均勻塊狀，放入滾水鍋中汆燙 2 分鐘徹底去除血水雜沫，撈起用冷水沖淨瀝乾；何首烏、黑棗、黃耆以冷水快速沖淨，黑棗表面輕劃兩刀備用。
    image:
      src: ./step-1.webp
      alt: 土雞肉剁成均勻塊狀，放入滾水鍋中汆燙 2 分鐘徹底去除血水雜沫，撈起用冷水沖淨瀝乾；何首烏、黑棗、黃
  - text: 砂鍋注入 1200 ml 清水與米酒煮滾，放入汆燙好的雞肉塊、生薑片、何首烏、黑棗與黃耆，大火煮沸後撈除表面微沫。
    image:
      src: ./step-2.webp
      alt: 砂鍋注入 1200 ml 清水與米酒煮滾，放入汆燙好的雞肉塊、生薑片、何首烏、黑棗與黃耆，大火煮沸後
  - text: 蓋上鍋蓋轉小火慢燉 35 分鐘讓首烏天然甘甜與藥性充分溶入雞湯中，放入枸杞與鹽續煮 5 分鐘至雞肉軟嫩多汁即可盛碗享用。
