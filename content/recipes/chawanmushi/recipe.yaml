title: 日式茶碗蒸
summary: 柴魚高湯調入蛋液後過濾，倒進放好蝦、雞肉、銀杏和秀珍菇的蒸碗，先大火再轉中小火蒸熟。
servings: 2
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 35
tags: [日式料理, 蛋料理]
ingredients:
  - { name: 水, amount: { value: 300, unit: ml } }
  - { name: 柴魚素, amount: { value: 2, unit: g } }
  - { name: 雞蛋, amount: { value: 2, unit: 顆 } }
  - { name: 鹽, amount: { value: 2, unit: g }, group: 調味 }
  - { name: 醬油, amount: { value: 3, unit: ml }, group: 調味 }
  - { name: 味醂, amount: { value: 3, unit: ml }, group: 調味 }
  - { name: 蝦, amount: { value: 2, unit: 隻 }, note: 去殼留尾 }
  - { name: 雞肉, amount: { value: 2, unit: 小塊 } }
  - { name: 銀杏, amount: { value: 4, unit: 粒 } }
  - { name: 秀珍菇, amount: { value: 2, unit: 朵 } }
  - { name: 山芹菜, amount: { value: 1, unit: 支 }, note: 切小段 }
steps:
  - text: 水煮滾後加入柴魚素，關火放涼，就是柴魚高湯。蝦挑掉泥腸、摘頭剝殼，尾巴末端那一節殼留著；雞肉、銀杏、秀珍菇和山芹菜洗乾淨。
    image:
      src: ./step-1.webp
      alt: 木砧板上分開放著兩隻去殼留尾的生蝦、兩小塊生雞肉、四顆銀杏、兩朵秀珍菇和一支山芹菜，旁邊一碗淡琥珀色的柴魚高湯
  - text: 雞蛋打進碗中攪散，先拌入鹽、醬油和味醂，再倒進放涼的柴魚高湯混勻。
    image:
      src: ./step-2.webp
      alt: 素色瓷碗裡盛著拌勻的淡黃色蛋液，表面浮著一些小泡沫
  - text: 用細網濾網把蛋液濾一次，表面若浮著泡沫一併撈掉。
    image:
      src: ./step-3.webp
      alt: 細網濾網架在瓷碗上，網中留著少許蛋液泡沫，碗裡是濾過後平滑的淡黃色蛋液
  - text: 蒸碗裡先擺蝦、雞肉、銀杏和秀珍菇，倒入蛋液到七、八分滿，封上保鮮膜。
    image:
      src: ./step-4.webp
      alt: 兩個封著保鮮膜的素色蒸碗，生蛋液約七、八分滿，裡面各有一隻蝦、一塊雞肉、兩顆銀杏和一朵秀珍菇
  - text: 蒸鍋放好網架，水滾後放入蒸碗、蓋上鍋蓋，大火蒸 3 分鐘；看到蛋液表面轉白，把鍋蓋推開一條小縫，改中小火再蒸約 10 分鐘。
    image:
      src: ./step-5.webp
      alt: 不鏽鋼蒸鍋的鍋蓋推開一條縫，冒出蒸氣，縫隙中可見網架上兩個蒸碗，蛋液表面已轉為淡黃白色
  - text: 用竹籤戳進蒸蛋檢查，一戳就留下小洞代表已熟；表面若滲出水，再多蒸 1 至 2 分鐘。山芹菜切小段，下滾水略燙，擺在蒸蛋上。
hero:
  src: ./hero.webp
  alt: 兩個素色瓷杯裝著蒸好的淡黃色茶碗蒸，表面各有一隻留著紅色蝦尾的蝦、一朵秀珍菇、一顆銀杏和幾段山芹菜
