title: 客家炒茄子
summary: 依核准食譜指南製作之經典家常客家炒茄子，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [vegetable]
classificationReason: "茄子以九層塔大火快炒，純蔬菜主角。"
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 15
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: A.茄子, amount: { value: 100, unit: g }, note: 原料標示 1/2斤 }
  - { name: 九層塔, amount: { value: 100, unit: g }, note: 原料標示 30g }
  - { name: B.絞肉, amount: { value: 100, unit: g }, note: 原料標示 50g }
  - { name: 蒜末, amount: { value: 100, unit: g }, note: 原料標示 10粒 }
  - { name: 辣椒醬, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 蔥花, amount: { value: 100, unit: g }, note: 原料標示 2支 }
  - { name: 薑末, amount: { value: 100, unit: g }, note: 原料標示 10g }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 3/2大匙 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 1茶匙 }
  - { name: 味精, amount: { value: 100, unit: g }, note: 原料標示 1茶匙 }
  - { name: 醬油, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
steps:
  - text: "茄子洗淨後，去頭尾，切滾刀塊，放入150℃油鍋油炸約1分鐘備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的客家炒茄子主要材料
  - text: "九層塔摘葉洗淨備用。" 
  - text: "起油鍋，爆香材料B，倒入作法1茄子拌炒，再加入調味料快速翻炒數下，起鍋前放入九層塔葉略炒即可起鍋。" 
