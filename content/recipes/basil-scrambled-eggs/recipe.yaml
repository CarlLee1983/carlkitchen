title: 九層塔炒蛋
summary: 依核准食譜指南製作之經典家常九層塔炒蛋，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: "鮮香九層塔葉切碎拌入蛋液熱油烘炒，蛋豆主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 10
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 九層塔, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 全蛋, amount: { value: 3.0, unit: g }, note: 原料標示 3粒 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 白胡椒粉, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 香油, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
steps:
  - text: "將九層塔挑除梗，洗淨後切成碎狀備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之九層塔炒蛋主要材料
  - text: "取一個容器打入全蛋、作法1的九層塔碎和所有調味料攪拌均勻。"
  - text: "熱鍋，加入1大匙沙拉油，放入作法2的所有材料，以中火將蛋煎成二面呈金黃色。"
  - text: "上桌前再切成小片狀即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味九層塔炒蛋
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之九層塔炒蛋各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
