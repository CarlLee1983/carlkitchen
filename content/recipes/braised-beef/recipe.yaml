title: 紅燒牛腩
summary: 牛腩與白蘿蔔、紅蘿蔔先拌炒，再用醬油與豆瓣醬燉煮。
servings: 4
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 75
tags: [家常菜]
ingredients:
  - { name: 牛腩, amount: { value: 600, unit: g }, note: 牛腩條，洗淨後切段 }
  - { name: 白蘿蔔, amount: { value: 100, unit: g }, note: 切塊 }
  - { name: 紅蘿蔔, amount: { value: 100, unit: g }, note: 切塊 }
  - { name: 洋蔥, amount: { value: 100, unit: g } }
  - { name: 薑片, amount: { value: 50, unit: g } }
  - { name: 青蔥, amount: { value: 50, unit: g }, note: 切段 }
  - { name: 蒜頭, amount: { value: 50, unit: g } }
  - { name: 辣椒, amount: { value: 2, unit: 條 } }
  - { name: 八角, amount: { value: 5, unit: 粒 } }
  - { name: 水, amount: { value: 1000, unit: ml } }
