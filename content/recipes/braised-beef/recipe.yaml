steps:
  - text: 牛腩洗淨切段，放入滾水汆燙去血水，撈起瀝乾。
    image:
      src: ./step-1.webp
      alt: 不鏽鋼瀝水籃中的牛腩段已汆燙並瀝去水分
  - text: 加少許食用油熱鍋，放入薑片、青蔥、蒜頭、辣椒與八角炒香。加入牛腩、番茄醬、甜麵醬與辣豆瓣醬，拌炒至有香氣。
    image:
      src: ./step-2.webp
      alt: 深色雙耳鍋中的牛腩拌著薑片、青蔥、蒜頭、辣椒、八角與醬料
  - text: 加入醬油、砂糖、料理米酒、白蘿蔔、紅蘿蔔、洋蔥與水，拌勻後開大火煮滾。
  - text: 蓋上鍋蓋，轉小火續燉約 40 分鐘。
    image:
      src: ./step-4.webp
      alt: 深色雙耳鍋中的牛腩與白蘿蔔、紅蘿蔔浸在棕紅色湯汁裡
