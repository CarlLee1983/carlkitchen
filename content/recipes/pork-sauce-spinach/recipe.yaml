title: 肉燥菠菜
summary: 菠菜汆燙後盛盤，淋上以紅蔥頭、蒜末和豬絞肉煮成的肉燥。
servings: 2
category: 非湯料理
draft: true
mealCandidate: true
vegetable: true
protein: true
timeMinutes: 25
tags: [家常菜]
ingredients:
  - { name: 菠菜, amount: { value: 300, unit: g }, note: 洗淨切小段 }
  - { name: 豬絞肉, amount: { value: 50, unit: g } }
  - { name: 紅蔥頭, amount: { value: 20, unit: g }, note: 切碎 }
  - { name: 蒜末, amount: { value: 20, unit: g } }
  - { name: 食用油, note: 炒肉燥用，來源未標用量, group: 調味 }
  - {
      name: 食用油,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，汆燙菠菜用,
      group: 調味,
    }
  - {
      name: 醬油膏,
      amount: { value: 30, unit: ml },
      note: 約 2 大匙,
      group: 調味,
    }
  - {
      name: 水,
      amount: { value: 60, unit: ml },
      note: 約 4 大匙，肉燥用；汆燙另備,
      group: 調味,
    }
steps:
  - text: 紅蔥頭切碎，菠菜洗淨後切小段。
    image:
      src: ./step-1.webp
      alt: 切碎的紅蔥頭放在砧板上，旁邊是洗淨切段的菠菜
  - text: 平底鍋加少許食用油，以小火炒香紅蔥頭和蒜末，加入豬絞肉炒散至變白。
    image:
      src: ./step-2.webp
      alt: 紅蔥頭與蒜末炒香後，拌炒中的豬絞肉大多已變白
  - text: 倒入醬油膏和水，以小火煮開，等湯汁略為收少後盛起作肉燥。
    image:
      src: ./step-3.webp
      alt: 豬絞肉和醬油膏在鍋中煮至醬汁略收
  - text: 另煮一鍋水，加入食用油和菠菜，蓋上鍋蓋煮至水再次沸騰，翻動菠菜後再煮約 10 秒，撈出瀝乾。
  - text: 菠菜盛盤，淋上肉燥。
    image:
      src: ./step-5.webp
      alt: 瀝乾菠菜盛盤，頂部淋上豬絞肉燒成的肉燥
hero:
  src: ./hero.webp
  alt: 白盤盛著汆燙菠菜，中央淋有豬絞肉與紅蔥頭肉燥
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 300 g 菠菜、50 g 豬絞肉、20 g 紅蔥頭、20 g 蒜末，以及炒肉燥和汆燙菠菜用的食用油、醬油膏與水
