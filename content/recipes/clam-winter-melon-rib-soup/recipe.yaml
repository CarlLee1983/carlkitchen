title: 蛤蜊冬瓜排骨湯
summary: 依核准食譜指南製作之經典家常蛤蜊冬瓜排骨湯，風味道地鮮明。
servings: 4
category: 湯
dishKinds: []
classificationReason: "冬瓜塊與排骨慢火燉煮起鍋前加入鮮活蛤蜊提鮮之甘美湯品。"
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 45
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 排骨, amount: { value: 200.0, unit: g }, note: 原料標示 200公克 }
  - { name: 冬瓜, amount: { value: 200.0, unit: g }, note: 原料標示 200公克 }
  - { name: 薑片, amount: { value: 8.0, unit: g }, note: 原料標示 8公克 }
  - { name: 水, amount: { value: 700.0, unit: g }, note: 原料標示 700㏄ }
  - { name: 鹽, amount: { value: 1.0, unit: g }, note: 原料標示 1茶匙 }
  - { name: 雞精粉, amount: { value: 1.0, unit: g }, note: 原料標示 1茶匙 }
  - { name: 米酒, amount: { value: 1.0, unit: g }, note: 原料標示 1茶匙 }
steps:
  - text: "排骨切小塊，放入滾沸的水中汆燙約1分鐘撈起，以冷水沖涼備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之蛤蜊冬瓜排骨湯主要材料
  - text: "冬瓜去皮切小塊，放入滾沸的水中汆燙約1分鐘撈起，以冷水沖涼備用。"
  - text: "將作法1的排骨塊和作法2的冬瓜塊放入湯鍋中，加入薑片、水，以中火將冬瓜排骨湯煮至滾沸，轉至微火使湯保持在微微滾沸的狀態下煮約30分鐘後，放入所有調味料調味即可。"
