title: 香辣宮保雞丁
summary: 依核准食譜指南製作之經典家常香辣宮保雞丁，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: "雞肉丁醃漬過油與乾辣椒花生花椒大火醬炒，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 雞肉, amount: { value: 250.0, unit: g }, note: 原料標示 250公克 }
  - { name: 蔥, amount: { value: 1.0, unit: g }, note: 原料標示 1根 }
  - { name: 乾辣椒, amount: { value: 5.0, unit: g }, note: 原料標示 5公克 }
  - { name: 沙拉油, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 蒜味花生, amount: { value: 40.0, unit: g }, note: 原料標示 40公克 }
  - { name: A.醬油, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 米酒, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 蛋液, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 太白粉, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: B.醬油, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 烏醋, amount: { value: 3.0, unit: g }, note: 原料標示 3/2小匙 }
  - { name: 糖, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 米酒, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 辣油, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 水, amount: { value: 2.0, unit: g }, note: 原料標示 2小匙 }
steps:
  - text: "將雞肉洗乾淨後切成丁狀，再放入調味料A一起醃漬20分鐘後，放入180℃油鍋中，以中火過油30秒後撈起備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之香辣宮保雞丁主要材料
  - text: "將蔥、乾辣椒切成小段備用。取一鍋，鍋中加入沙拉油熱鍋後，再以小火爆香乾辣椒段，然後依序放入雞丁、蔥段、調味料B，一起用大火快速拌炒到所有湯汁收乾，在起鍋之前再加入蒜味花生拌勻即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味香辣宮保雞丁
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之香辣宮保雞丁各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
