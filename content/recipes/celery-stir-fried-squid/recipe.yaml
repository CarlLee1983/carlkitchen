title: 芹菜炒透抽
summary: 依核准食譜指南製作之經典家常芹菜炒透抽，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: "爽脆芹菜段與鮮美透抽圈大火快炒，海鮮主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 透抽, amount: { value: 500.0, unit: g }, note: 原料標示 500公克 }
  - { name: 芹菜, amount: { value: 200.0, unit: g }, note: 原料標示 200公克 }
  - { name: 辣椒絲, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 蒜末, amount: { value: 5.0, unit: g }, note: 原料標示 5公克 }
  - { name: 鹽, amount: { value: 1.0, unit: g }, note: 原料標示 1/4茶匙 }
  - { name: 米酒, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 水, amount: { value: 3.0, unit: g }, note: 原料標示 3大匙 }
  - { name: 太白粉水, amount: { value: 1.0, unit: g }, note: 原料標示 1茶匙 }
steps:
  - text: "透抽去皮去內臟後洗淨再切花；芹菜挑去葉子洗淨切小段。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之芹菜炒透抽主要材料
  - text: "熱鍋，下少許油，小火爆香辣椒絲及蒜末後下透抽炒至捲曲。"
  - text: "加入芹菜略翻炒。下鹽、白胡椒粉、米酒及水小火炒勻。加入太白粉水勾芡即可起鍋。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味芹菜炒透抽
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之芹菜炒透抽各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
