title: 蔥油雞腿
summary: 依核准食譜指南製作之經典家常蔥油雞腿，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: "去骨雞腿蒸熟後淋滾燙香濃蔥油，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 35
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 仿土雞腿, amount: { value: 100, unit: g }, note: 原料標示 1支 }
  - { name: 薑, amount: { value: 100, unit: g }, note: 原料標示 7公克 }
  - { name: 青蔥, amount: { value: 100, unit: g }, note: 原料標示 2支 }
  - { name: 蔥油醬, amount: { value: 100, unit: g }, note: 原料標示 適量 }
steps:
  - text: "將薑切片；青蔥切段備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的蔥油雞腿主要材料
  - text: "首先將雞腿洗淨，放入鍋中加入冷水淹過雞腿再加入作法1的材料，再蓋鍋蓋以中火煮開約10分鐘，再關火以餘溫續燜約20分鐘至熟。"
  - text: "接者再將作法2的雞腿切成塊狀，淋上熱的蔥油醬即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味蔥油雞腿
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之蔥油雞腿各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
