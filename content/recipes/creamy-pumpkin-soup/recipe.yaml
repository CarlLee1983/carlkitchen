title: 南瓜濃湯
summary: 南瓜與紅蘿蔔用牛奶、鮮奶油煮軟，打勻過篩後，做成帶培根風味的濃湯。
servings: 4
category: 湯
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 85
ingredients:
  - { name: 南瓜, amount: { value: 1650, unit: g } }
  - { name: 培根, amount: { value: 35, unit: g } }
  - { name: 大蒜, amount: { value: 100, unit: g } }
  - { name: 洋蔥, amount: { value: 235, unit: g } }
  - { name: 紅蘿蔔, amount: { value: 200, unit: g } }
  - {
      name: 奶油,
      amount: { value: 110, unit: g },
      note: 分成 10 g 與 100 g 使用,
      group: 調味,
    }
  - { name: 鮮奶油, amount: { value: 60, unit: g }, group: 調味 }
  - { name: 牛奶, amount: { value: 460, unit: ml }, group: 調味 }
  - { name: 月桂葉, amount: { value: 2, unit: 片 }, group: 調味 }
  - {
      name: 鹽,
      amount: { value: 15, unit: g },
      note: 分成 5 g 與 10 g 使用,
      group: 調味,
    }
  - { name: 白糖, amount: { value: 20, unit: g }, group: 調味 }
steps:
  - text: 將南瓜切小塊、培根切丁；大蒜切末、洋蔥切碎，紅蘿蔔切片。
    image:
      src: ./step-1.webp
      alt: 木砧板上分放南瓜小塊、大蒜末、洋蔥碎與紅蘿蔔片，旁邊的小碟裝著培根丁
  - text: 將 10 g 奶油放入湯鍋，炒香大蒜與洋蔥；洋蔥呈金黃色後加入培根，炒約 5 分鐘至微焦。
    image:
      src: ./step-2.webp
      alt: 灰色湯鍋底部有金黃色洋蔥、大蒜末與邊緣微焦的培根丁，右側放著木匙
  - text: 放入紅蘿蔔、南瓜與 5 g 鹽，翻炒約 5 分鐘。
  - text: 加入鮮奶油、牛奶及剩餘 100 g 奶油，大火煮滾後放入月桂葉，轉小火煮約 20 分鐘。
    image:
      src: ./step-4.webp
      alt: 灰色湯鍋中的南瓜塊與紅蘿蔔片浸在乳白偏橘的湯汁裡，表面浮著兩片月桂葉
  - text: 將湯鍋移離爐火，取出月桂葉，讓湯料降溫至調理機說明書允許攪打的溫度。
    image:
      src: ./step-5.webp
      alt: 離火的灰色湯鍋中裝著南瓜湯料，取出的兩片月桂葉放在旁邊的小碟上
  - text: 確認調理機可處理目前湯溫，再少量分批打勻；依該機型說明保留排氣，勿把滾燙湯料直接密封攪打。
    image:
      src: ./step-6.webp
      alt: 桌上型調理機的透明容杯中只有少量打勻的橘色南瓜湯，杯上裝有排氣式蓋子
  - text: 將打勻的湯用濾網過篩，再倒回原湯鍋。
    image:
      src: ./step-7.webp
      alt: 灰色湯鍋上架著細網篩，橘色南瓜泥過篩後流入下方鍋中，篩內放著木匙
  - text: 將濃湯回鍋加熱約 10 分鐘，加入剩餘 10 g 鹽與白糖調味。
hero:
  src: ./hero.webp
  alt: 灰色敞口湯鍋盛著一整鍋平滑細緻的橘色南瓜濃湯
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 南瓜、培根、大蒜、洋蔥、紅蘿蔔，以及分裝的奶油、鮮奶油、牛奶、兩片月桂葉、鹽與白糖
tip: 這份用量可做 4 大份，含培根，並非素湯。降溫與分批攪打所需時間依湯量及機型而異，不以固定分鐘數判斷能否攪打。
