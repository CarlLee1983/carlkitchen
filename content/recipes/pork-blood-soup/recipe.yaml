steps:
  - text: 豬血洗淨後切成約一口大小的厚塊。另備一鍋水煮至微滾，放入豬血塊以微火汆燙約 2 分鐘去除雜質與血腥味，撈出後立即浸泡在冷水中備用，保持滑嫩緊實口感。
    image:
      src: ./step-1.webp
      alt: 鍋中微滾的熱水裡汆燙著切塊豬血，一旁放著浸泡汆燙後豬血的冷水碗
  - text: 韭菜摘除老葉並洗淨切成約 3 公分小段；酸菜充分漂洗以去除多餘鹹味與雜質，擠乾多餘水分後切成細絲備用。
  - text: 湯鍋注入高湯煮至大滾，放入瀝乾的豬血塊。再度沸騰後轉中小火，加入鹽、冰糖、米酒與白胡椒粉，慢煮約 5 分鐘讓豬血吸收高湯風味。
    image:
      src: ./step-3.webp
      alt: 湯鍋中高湯滾沸，滑嫩豬血塊在湯中慢煮，調味料正均勻拌入湯底
  - text: 放入切好的酸菜絲與韭菜段，隨後加入油蔥酥與沙茶醬提香，繼續滾煮約 30 秒至韭菜轉為鮮綠色即可關火盛出。
hero:
