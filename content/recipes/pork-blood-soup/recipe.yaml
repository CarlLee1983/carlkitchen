title: 豬血湯
summary: 滑嫩豬血經汆燙去腥後入豬骨高湯慢煮，搭配脆爽酸菜、清甜韭菜與香氣四溢的油蔥酥及沙茶醬，湯鮮味濃，是經典台式傳統小吃。
servings: 4
category: 湯
dishKinds: []
classificationReason: 豬血以豬骨高湯慢煮並加入韭菜、酸菜，沿用湯類且不分配非湯主角與組餐菜位。
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 20
tags: [台灣小吃, 湯品, 家常菜]
aliases: [台式豬血湯]
ingredients:
  - { name: 豬血, amount: { value: 600, unit: g }, note: 切成適口厚塊 }
  - { name: 韭菜, amount: { value: 40, unit: g }, note: 去頭尾洗淨切段 }
  - { name: 酸菜, amount: { value: 50, unit: g }, note: 漂洗擠乾切細絲 }
  - {
      name: 高湯,
      amount: { value: 700, unit: ml },
      note: 豬骨高湯為佳,
      group: 調味,
    }
