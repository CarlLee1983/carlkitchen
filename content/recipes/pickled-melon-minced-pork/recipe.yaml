steps:
  - text: 脆花瓜撈出切成半公分細碎小丁，花瓜罐頭醬汁保留備用；紅蔥頭與大蒜去皮切細末；青蔥切細蔥花備用。
    image:
      src: ./step-1.webp
      alt: 脆花瓜撈出切成半公分細碎小丁，花瓜罐頭醬汁保留備用；紅蔥頭與大蒜去皮切細末；青蔥切細蔥花備用。
  - text: 取炒鍋倒入植物油加熱，放入紅蔥頭碎與蒜碎以中小火慢煸 2 分鐘至金黃微焦香氣四溢，倒入豬絞肉轉大火翻炒至肉色轉白散開。
    image:
      src: ./step-2.webp
      alt: 取炒鍋倒入植物油加熱，放入紅蔥頭碎與蒜碎以中小火慢煸 2 分鐘至金黃微焦香氣四溢，倒入豬絞肉轉大火翻
  - text: 倒入切碎的花瓜丁與花瓜醃汁，加入醬油、米酒、細砂糖、白胡椒粉與 300 ml 清水大火煮滾，撈除表面浮沫。
  - text: 轉小火蓋上鍋蓋慢燉 20 分鐘，至湯汁濃稠油亮、絞肉軟爛吸收花瓜甘甜，撒入蔥花拌勻即可盛入深碗配飯享用。
