title: 瓜仔肉燥
summary: 台灣甘醇陳年花瓜切細碎丁，搭配肥瘦適中豬前腿絞肉煸炒出油脂，投入新鮮紅蔥頭末、蒜碎與青蔥花慢火煸出迷人蔥香，倒入甘甜花瓜醬汁、純釀醬油與清水小火慢燉二十分鐘，肉燥軟嫩多汁、花瓜脆嫩鹹甜回甘，澆飯拌麵皆令人食指大動。
servings: 4
category: 非湯料理
dishKinds: [meat]
classificationReason: 以豬絞肉為主要肉類主角，搭配醃漬醬花瓜慢火燉煮，屬於肉類料理。
