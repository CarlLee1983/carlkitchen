steps:
  - text: 白花椰菜與青花菜切成均勻適口小朵，入滾水加少許鹽汆燙 1 分鐘撈起瀝乾水分，整齊排入耐熱焗烤瓷盤中備用。
    image:
      src: ./step-1.webp
      alt: 白花椰菜與青花菜切成均勻適口小朵，入滾水加少許鹽汆燙 1 分鐘撈起瀝乾水分，整齊排入耐熱焗烤瓷盤中備
  - text: 小鍋融化無鹽奶油，加入洋蔥碎小火炒香，倒入麵粉小火翻炒均勻成麵糊，分次慢慢注入鮮奶油與水攪拌均勻煮開成滑順濃郁白醬，調入鹽與黑胡椒粉。
    image:
      src: ./step-2.webp
      alt: 小鍋融化無鹽奶油，加入洋蔥碎小火炒香，倒入麵粉小火翻炒均勻成麵糊，分次慢慢注入鮮奶油與水攪拌均勻煮開
  - text: 將煮好的香濃白醬均勻淋在雙色花椰菜表面，均勻鋪滿一層厚厚起司絲。
  - text: 移入預熱至 200°C 烤箱烘烤約 8 至 10 分鐘，至表面起司完全融化、呈現漂亮金黃焦香斑紋即可取出趁熱享用。
