tip: 花椰菜汆燙後務必用廚房紙巾或濾籃徹底瀝乾水分再排盤，否則烤製時蔬菜出水會稀釋白醬；白醬炒麵粉時火候保持最小火，分次加鮮奶油可避免結塊。
