title: 起司焗烤白花椰菜
summary: 白花椰菜與綠花椰菜切小朵汆燙瀝乾，鋪入焗烤瓷盤，淋上以奶油、洋蔥碎、麵粉、鮮奶油與溫水慢煮而成的香濃白醬，表面撒滿雙色起司絲，入烤箱高溫烘烤至起司融化金黃焦香、牽絲濃郁，蔬菜清甜爽口、奶香濃醇誘人。
servings: 3
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 以白花椰菜與綠花椰菜汆燙後裹白醬起司焗烤為唯一蔬菜主角，屬於純蔬菜西式焗烤料理。
