title: 客家鹹豬肉
summary: 特選五花三層肉修整吸乾水分，均勻抹上以炒香海鹽、黑胡椒粒、五香粉、肉桂粉、大蒜末與高粱米酒調製之濃郁醃料，冷藏低溫熟成醃漬入味，入平底鍋慢火乾煎至兩面金黃焦香薄脆，斜切薄片排盤搭配白醋蒜苗沾醬，肥而不膩、皮Ｑ肉香、香醇撲鼻。
servings: 4
category: 非湯料理
dishKinds: [meat]
classificationReason: 以五花三層肉香料醃漬乾煎切片為唯一肉類主角，屬於肉類料理。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 25
tags: [客家菜, 鹹豬肉, 五花肉, 下酒菜, 傳統名菜]
aliases: [客家香煎鹹豬肉, 黑椒客家鹹豬肉]
ingredients:
  - name: 五花肉
    amount:
      value: 400
      unit: g
    note: 帶皮三層五花肉厚度約 2.5 公分整條洗淨擦乾
  - name: 大蒜
    amount:
      value: 30
      unit: g
    note: 去皮壓碎成蒜泥
  - name: 青蒜
    amount:
      value: 30
      unit: g
    note: 切斜薄片搭配食用
  - name: 鹽
    amount:
      value: 15
      unit: g
    note: 乾鍋炒香的海鹽
    group: 調味
  - name: 粗黑胡椒粒
    amount:
      value: 10
      unit: g
    note: 現磨粗粒黑胡椒增香
    group: 調味
  - name: 五香粉
    amount:
      value: 3
      unit: g
    note: 約半茶匙傳統香料
    group: 調味
  - name: 米酒
    amount:
      value: 30
      unit: ml
    note: 約 2 大匙去腥滲透
    group: 調味
  - name: 白醋
    amount:
      value: 30
      unit: ml
    note: 沾醬調味解膩
    group: 調味
  - name: 植物油
    amount:
      value: 10
      unit: ml
    note: 煎肉潤鍋油
    group: 調味
steps:
  - text: 五花肉洗淨用廚房紙巾徹底吸乾水分；炒鍋不放油，放入鹽以小火炒至微黃出香盛出放涼，與黑胡椒粒、五香粉、蒜泥與米酒調成醃肉香料膏。
    image:
      src: ./step-1.webp
      alt: 五花肉洗淨用廚房紙巾徹底吸乾水分；炒鍋不放油，放入鹽以小火炒至微黃出香盛出放涼，與黑胡椒粒、五香粉、
  - text: 將香料均勻塗抹按壓在五花肉整條表面每一處，裝入密封袋放冰箱冷藏醃漬至少 2 天入味；煎之前取出用清水洗去表面過多鹽粒並擦乾水分。
    image:
      src: ./step-2.webp
      alt: 將香料均勻塗抹按壓在五花肉整條表面每一處，裝入密封袋放冰箱冷藏醃漬至少 2 天入味；煎之前取出用清水
  - text: 平底鍋抹少許植物油加熱，放入醃好的五花肉，皮朝下以小火慢煎逼出油脂，再翻面慢煎各個側面，煎約 12 分鐘至四面金黃酥脆硬挺熟透，取出放涼 5 分鐘。
  - text: 用利刀將煎好的鹹豬肉斜切成 0.3 公分均勻薄片整齊排盤，附上一小碟白醋蒜末與青蒜薄片一同上桌享用。
hero:
  src: ./hero.webp
  alt: 盛盤完成的客家鹹豬肉
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 料理食材整齊擺放於木砧板上
tip: 海鹽先入乾鍋炒熱炒香後再與黑胡椒粒拌勻抹肉，香氣更為深邃滲透；醃好後的五花肉先洗去表面過多附著鹽粒再煎，肉質鹹香適中，皮脆肉香不焦黑。
