title: 蒜頭蛤蜊雞湯
summary: 整顆去皮蒜仁分半，一半先入油鍋煎至金黃焦香逼出濃郁蒜甜，另一半保持生蒜辛香，與汆燙鮮嫩土雞肉塊、老薑片入鍋細火慢熬三十分鐘，起鍋前投入肥美鮮活蛤蜊煮至全開，蒜香醇厚、蛤蜊鮮甜提味、湯清味濃、極致暖心。
servings: 4
category: 湯
dishKinds: []
classificationReason: 蒜頭蛤蜊雞湯為經典家常海陸雙鮮燉湯，湯品不設料理主角與配餐角色。
