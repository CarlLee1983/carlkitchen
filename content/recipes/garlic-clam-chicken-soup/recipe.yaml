    group: 調味
steps:
  - text: 土雞肉剁塊放入滾水中汆燙 2 分鐘撈起沖涼；大蒜剝除外皮保留完整蒜粒；蛤蜊充分泡鹽水吐沙洗淨；生薑切片備用。
    image:
      src: ./step-1.webp
      alt: 土雞肉剁塊放入滾水中汆燙 2 分鐘撈起沖涼；大蒜剝除外皮保留完整蒜粒；蛤蜊充分泡鹽水吐沙洗淨；生薑切
  - text: 取小平底鍋倒少許油，放入一半蒜頭（約 50 g）以中小火慢煎至表面呈現均勻金黃微焦色澤，撈出備用（炸蒜仁增香糯甘甜）。
    image:
      src: ./step-2.webp
      alt: 取小平底鍋倒少許油，放入一半蒜頭（約 50 g）以中小火慢煎至表面呈現均勻金黃微焦色澤，撈出備用（炸
  - text: 取湯鍋倒入 1200 ml 清水煮滾，放入汆燙好的雞肉塊、生薑片、金黃煎蒜與生蒜瓣，淋入米酒大火煮開轉小火慢燉 25 分鐘至蒜仁軟化如膏。
  - text: 轉大火放入吐好沙的蛤蜊，煮約 2 分鐘至蛤蜊外殼完全張開釋出鮮甜精華，試味道加入少許鹽調味即可熄火盛湯。
