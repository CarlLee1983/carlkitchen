tip: 蒜頭分一半先煎成金黃蒜仁再燉，能去除生蒜嗆辣並轉化為濃郁甘甜，另一半生蒜則保有天然殺菌香氣；蛤蜊在最後一刻下鍋，開殼立刻熄火，蛤肉最為飽滿多汁。
