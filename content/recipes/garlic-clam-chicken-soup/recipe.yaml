ingredients:
  - name: 土雞肉
    amount:
      value: 500
      unit: g
    note: 剁塊洗淨汆燙
  - name: 蛤蜊
    amount:
      value: 200
      unit: g
    note: 吐沙洗淨瀝乾
  - name: 大蒜
    amount:
      value: 100
      unit: g
    note: 去皮完整蒜瓣約 20 粒
  - name: 生薑
    amount:
      value: 15
      unit: g
    note: 切生薑片
  - name: 水
    amount:
      value: 1200
      unit: ml
