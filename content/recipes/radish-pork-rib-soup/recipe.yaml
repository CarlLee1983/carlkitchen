title: 白蘿蔔排骨湯
summary: 豬小排先燉煮，再放入紅、白蘿蔔續煮。最後用干貝風味高湯粉、胡椒粉與香菜調味。
servings: 4
category: 湯
dishKinds: []
classificationReason: 豬小排與紅白蘿蔔加入 1600 ml 水長時間燉湯，沿用湯類且不分配非湯主角與組餐菜位。
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 100
tags: [家常菜]
ingredients:
  - { name: 豬小排, amount: { value: 300, unit: g }, note: 剁塊 }
  - { name: 白蘿蔔, amount: { value: 300, unit: g }, note: 切塊 }
  - { name: 紅蘿蔔, amount: { value: 100, unit: g }, note: 切塊 }
  - { name: 水, amount: { value: 1600, unit: ml }, note: 煮湯用 }
  - {
      name: 干貝風味高湯粉,
      amount: { value: 30, unit: ml },
      note: 2 湯匙,
      group: 調味,
    }
  - { name: 胡椒粉, amount: { value: 5, unit: ml }, note: 1 茶匙, group: 調味 }
  - { name: 香菜, note: 少許, group: 調味 }
steps:
  - text: 將豬小排剁成塊，放入沸水汆燙後取出，再用清水沖洗。
    image:
      src: ./step-1.webp
      alt: 不鏽鋼瀝水籃裡放著汆燙並沖洗後的豬小排塊，帶骨的肉塊表面呈灰白色
  - text: 把白蘿蔔與紅蘿蔔分別切塊。
    image:
      src: ./step-2.webp
      alt: 木砧板上分成兩堆的白蘿蔔塊和紅蘿蔔塊，右側放著一把菜刀
  - text: 將水和豬小排放入湯鍋，開大火煮滾，再改小火煮 30 分鐘。
    image:
      src: ./step-3.webp
      alt: 不鏽鋼雙耳湯鍋裡只有豬小排與淡色湯水，部分帶骨肉塊浮在湯面
  - text: 放入白蘿蔔及紅蘿蔔，再煮 50 分鐘。
    image:
      src: ./step-4.webp
      alt: 同一只雙耳湯鍋中，豬小排、白蘿蔔塊和紅蘿蔔塊一起在淡色湯水中燉煮
  - text: 拌入干貝風味高湯粉、胡椒粉與香菜，混合均勻即可。
hero:
  src: ./hero.webp
  alt: 敞口不鏽鋼雙耳湯鍋盛著白蘿蔔排骨湯，湯中有帶骨豬小排、白蘿蔔塊、紅蘿蔔塊與少許香菜
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 一盤生豬小排、一段白蘿蔔、一根紅蘿蔔、一小把香菜、一壺水，以及分別裝著干貝風味高湯粉和胡椒粉的兩只小碟
