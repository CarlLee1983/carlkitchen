tip: 青木瓜刨成薄片後用鹽抓勻殺青去除生澀苦水，並務必用冷開水沖淨瀝乾，才能保持最爽脆乾淨的果香口感；冷藏醃漬至少四小時能讓話梅的甘甜徹底釋放融於百香果汁中。
