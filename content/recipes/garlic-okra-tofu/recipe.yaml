title: 蒜蓉秋葵豆腐
summary: 秋葵燙熟放涼，搭配嫩豆腐與蒜蓉醬，口感滑嫩帶脆。適合當作涼拌配菜。
servings: 4
category: 非湯料理
draft: false
mealCandidate: true
vegetable: true
protein: true
timeMinutes: 25
tags: [涼拌菜]
ingredients:
  - {
      name: 嫩豆腐,
      amount: { value: 1, unit: 盒 },
      note: 整塊使用，盒裝容量依產品而異,
    }
  - {
      name: 秋葵,
      amount: { value: 10, unit: 條 },
      note: 整條使用，大小依實際食材而異,
    }
  - { name: 蒜頭, amount: { value: 3, unit: 瓣 }, note: 去皮、去蒂後切末 }
  - {
      name: 辣椒,
      amount: { value: 1, unit: 條 },
      note: 去蒂切末，可減為 1/2 條,
    }
  - { name: 水, amount: { value: 1000, unit: ml }, note: 汆燙用 }
  - {
      name: 醬油膏,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙,
      group: 調味,
    }
  - {
      name: 冷開水,
      amount: { value: 5, unit: ml },
      note: 約 1 茶匙,
      group: 調味,
    }
  - {
      name: 糖,
      amount: { value: 1.25, unit: ml },
      note: 約 1/4 茶匙,
      group: 調味,
    }
  - { name: 香油, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
  - {
      name: 鹽,
      amount: { value: 2.5, unit: ml },
      note: 約 1/2 茶匙，汆燙用,
      group: 調味,
    }
  - { name: 鹽, note: 少量，搓洗秋葵用，另備, group: 調味 }
steps:
  - text: 洗淨秋葵，用少量鹽輕搓表面，修掉蒂端及周圍較老的部分，保留一小段蒂頭。
    image:
      src: ./step-1.webp
      alt: 木砧板上十條洗淨的秋葵，蒂端已修整並保留短蒂，旁邊放著菜刀
  - text: 將水以中大火煮滾，加入汆燙用的鹽。放入秋葵燙約 1 分鐘，至顏色轉綠、略帶透感。
    image:
      src: ./step-2.webp
      alt: 不鏽鋼鍋的熱水中，十條整條秋葵燙成綠色，表面略帶透感
  - text: 撈出秋葵，瀝乾水分後放涼。
    image:
      src: ./step-3.webp
      alt: 不鏽鋼瀝水籃裡十條整條秋葵已撈起瀝水，表面留有水珠
  - text: 去掉蒜頭的外皮與蒂部，辣椒去蒂，兩者分別切末；怕辣可先去掉辣椒籽。
    image:
      src: ./step-4.webp
      alt: 木砧板上分開放著蒜末與紅辣椒末，旁邊放著菜刀
  - text: 混合蒜頭、辣椒、醬油膏、冷開水、糖和香油，拌成蒜蓉醬。
    image:
      src: ./step-5.webp
      alt: 素色小碗中拌好的褐色蒜蓉醬，裡面可見蒜末和紅辣椒末
  - text: 取出整塊嫩豆腐盛盤，擺上放涼的整條秋葵，最後淋上蒜蓉醬。
    image:
      src: ./step-6.webp
      alt: 整塊嫩豆腐上方與旁邊共擺著十條綠色秋葵，表面淋有蒜末與紅辣椒末的褐色醬汁
hero:
  src: ./hero.webp
  alt: 整塊嫩豆腐搭配十條綠色秋葵，淋上褐色蒜蓉醬，醬中可見細碎蒜末與紅辣椒
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 一塊嫩豆腐、十條秋葵、三瓣蒜頭、一條紅辣椒，另有水、冷開水、醬油膏、糖、香油和分開盛裝的兩份鹽
tip: 豆腐盒裝容量與秋葵大小各有差異，這裡保留原單位，不換算固定重量。總時間包含放涼的推估；若要冷藏到冰涼，還需另外預留時間。
