tip: 青椒在炒飯收尾前三十秒才加入大火快炒，能徹底保留青椒的脆甜與鮮豔綠色，不會變軟出水；現磨黑胡椒粒在出鍋前撒入熗香，能激發出濃郁辛香風味。
