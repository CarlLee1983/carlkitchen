title: 青椒牛肉炒飯
summary: 鮮嫩牛肉絲以醬油、米酒抓醃入味，熱鍋滑油至變色撈起，大火爆炒洋蔥絲與甜脆青椒絲，倒入鬆散隔夜白飯與牛肉絲快速翻拋，調入黑胡椒粒、少許醬油大火快炒熗鍋，米粒粒粒分明乾爽帶焦香、青椒清脆鮮甜、牛肉滑嫩多汁。
servings: 2
category: 主食
dishKinds: []
classificationReason: 以白飯為主體搭配牛肉絲與青椒熱炒，可獨立作為一餐，屬於主食料理。
draft: false
mealCandidate: false
