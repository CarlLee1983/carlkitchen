steps:
  - text: 牛肉切均勻細絲，加入醬油、米酒與太白粉抓勻醃漬 10 分鐘；青椒去籽切細絲；洋蔥切細絲；隔夜白飯以雙手輕輕抓鬆備用。
    image:
      src: ./step-1.webp
      alt: 碗中盛著拌有醃料的牛肉絲，旁邊放著青椒絲、洋蔥絲、白飯與黑胡椒粒。
  - text: 炒鍋倒入植物油燒至七分熱，放入醃好牛肉絲以大火快速滑炒約 30 秒至肉色轉粉紅八分熟，盛出瀝油備用。
    image:
      src: ./step-2.webp
      alt: 牛肉絲攤放在炒鍋中，表面呈褐色，部分仍帶粉紅色。
  - text: 原鍋留少許底油，放入洋蔥絲煸炒出甜香，倒入鬆散白飯，轉中大火以鍋鏟切壓翻拋，炒至米粒完全散開且在鍋中跳動。
  - text: 倒回滑好的牛肉絲與青椒絲，撒入黑胡椒粒與鹽，沿鍋邊淋入少許醬油嗆鍋，轉大火高速翻炒 30 秒至青椒斷生翠綠，即可關火盛盤。
