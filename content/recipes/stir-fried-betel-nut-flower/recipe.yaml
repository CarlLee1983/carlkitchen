title: 炒檳榔花
summary: 依核准食譜指南製作之經典家常炒檳榔花，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [vegetable]
classificationReason: "檳榔花嫩穗以肉絲或蒜末清炒爽脆，蔬菜主角。"
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 15
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 紅蘿蔔, amount: { value: 100, unit: g }, note: 原料標示 50g }
  - { name: 里脊肉, amount: { value: 100, unit: g }, note: 原料標示 100g }
  - { name: 香菇, amount: { value: 100, unit: g }, note: 原料標示 3朵 }
  - { name: 蔥, amount: { value: 100, unit: g }, note: 原料標示 1支 }
  - { name: 辣椒, amount: { value: 100, unit: g }, note: 原料標示 1條 }
  - { name: 檳榔花, amount: { value: 100, unit: g }, note: 原料標示 450g }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 1茶匙 }
  - { name: 味精, amount: { value: 100, unit: g }, note: 原料標示 1茶匙 }
  - { name: 水, amount: { value: 100, unit: g }, note: 原料標示 3大匙 }
steps:
  - text: "將紅蘿蔔、里脊肉、香菇洗淨切絲，蔥、辣椒切斜段，檳榔花切段備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的炒檳榔花主要材料
  - text: "起油鍋，將蔥、辣椒、肉絲、里脊肉、香菇等材料先炒香後，再加入調味料拌炒均勻，最後放入檳榔花，以大火快炒數下即可。" 
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味炒檳榔花
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之炒檳榔花各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
