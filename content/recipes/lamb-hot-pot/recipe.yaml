title: 清燉羊肉爐
summary: 帶皮羊肉塊洗淨滾水汆燙去除羶氣，砂鍋中放入老薑片、青蔥段與溫潤中藥包（當歸、川芎、枸杞、黃耆），倒入米酒與甘甜大骨高湯，慢火細燉一小時至羊皮Ｑ彈、羊肉軟爛無羶，搭配大白菜與凍豆腐，湯頭溫潤甘醇、暖胃驅寒。
servings: 4
category: 湯
dishKinds: []
classificationReason: 清燉羊肉爐為經典冬令進補湯鍋，湯品不設料理主角與配餐角色。
