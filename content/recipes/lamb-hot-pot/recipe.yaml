steps:
  - text: 帶皮羊肉剁適口小塊，放入冷水鍋中加薑片、蔥段大火煮滾汆燙 3 分鐘徹底清除血沫，撈起以冷水沖洗乾淨瀝乾；當歸、黃耆與白胡椒粒裝入棉布包；大白菜切大片備用。
    image:
      src: ./step-1.webp
      alt: 帶皮羊肉剁適口小塊，放入冷水鍋中加薑片、蔥段大火煮滾汆燙 3 分鐘徹底清除血沫，撈起以冷水沖洗乾淨瀝
  - text: 取砂鍋注入 1500 ml 高湯與 100 ml 米酒，放入汆燙好的帶皮羊肉塊、薑片、蔥結與中藥包，大火煮滾後撈去表面微沫。
    image:
      src: ./step-2.webp
      alt: 取砂鍋注入 1500 ml 高湯與 100 ml 米酒，放入汆燙好的帶皮羊肉塊、薑片、蔥結與中藥包，
  - text: 蓋上鍋蓋轉微火慢燉 50 分鐘，至羊皮軟Ｑ黏嘴、羊肉軟爛離骨不柴，放入大白菜與鹽續燉 10 分鐘至白菜軟爛釋出清甜。
  - text: 起鍋前投入鮮紅枸杞滾煮 2 分鐘，整鍋熱氣騰騰上桌享用。
