title: 蒜香炒中卷
summary: 依核准食譜指南製作之經典家常蒜香炒中卷，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: "新鮮中卷切圈大火與蒜末蔥花快炒起鍋，海鮮主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 12
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 中卷, amount: { value: 200.0, unit: g }, note: 原料標示 200公克 }
  - { name: 蔥花, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 辣椒末, amount: { value: 5.0, unit: g }, note: 原料標示 5公克 }
  - { name: 大蒜, amount: { value: 5.0, unit: g }, note: 原料標示 5公克 }
  - {
      name: 歐洲粉玫瑰,
      amount: { value: 10.0, unit: g },
      note: 原料標示 10公克,
    }
  - { name: 蒜味花生, amount: { value: 20.0, unit: g }, note: 原料標示 20公克 }
  - {
      name: 炸粉：雞蛋,
      amount: { value: 30.0, unit: g },
      note: 原料標示 30公克,
    }
  - { name: 地瓜粉, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 太白粉, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 沙拉油, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 辣椒粉, amount: { value: 100, unit: g }, note: 原料標示 少許 }
steps:
  - text: "先將中卷洗淨去除腸泥，切成一圈一圈備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之蒜香炒中卷主要材料
  - text: "將大蒜剁成末，以低油溫方式炸至金黃色，瀝乾備用。"
  - text: "起油鍋，將油溫加熱至200℃，把作法1的中卷拌入炸粉，入油鍋炸至金黃色撈起。"
  - text: "起乾鍋先將蔥花，辣椒末，在依序放入作法3的中卷、作法2的蒜酥、花生、調味料即可。"
  - text: "放入玫瑰，拌炒至香味出來即可。"
hero:
