title: 芋頭米粉湯
summary: 依核准食譜指南製作之經典家常芋頭米粉湯，風味道地鮮明。
servings: 3
category: 主食
dishKinds: []
classificationReason: "鬆軟芋頭塊與細米粉吸飽油蔥大骨高湯，經典主食。"
draft: false
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 35
tags: [家常菜, 台灣料理]
ingredients:
  - {
      name: 埔里米粉,
      amount: { value: 300.0, unit: g },
      note: 原料標示 300公克,
    }
  - { name: 芋頭, amount: { value: 200.0, unit: g }, note: 原料標示 200公克 }
  - { name: 香菇, amount: { value: 3, unit: 朵 }, note: 原料標示 3朵 }
  - { name: 紅蔥頭, amount: { value: 5, unit: 顆 }, note: 原料標示 5顆 }
  - { name: 瘦肉, amount: { value: 100.0, unit: g }, note: 原料標示 100公克 }
  - { name: 高湯, amount: { value: 1500, unit: ml }, note: 原料標示 1500㏄ }
  - { name: 芹菜末, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 油蔥酥, group: 調味, note: 少許 }
  - { name: 香菜, group: 調味, note: 少許 }
  - {
      name: 鹽,
      amount: { value: 0.5, unit: 大匙 },
      group: 調味,
      note: 原料標示 1/2大匙,
    }
  - {
      name: 胡椒粉,
      amount: { value: 1, unit: 小匙 },
      group: 調味,
      note: 原料標示 1小匙,
    }
steps:
  - text: "削去芋頭外皮，切成細丁。香菇泡水約1小時，泡軟再切丁。洗過的紅蔥頭切末，瘦肉洗淨後也切丁。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之芋頭米粉湯主要材料
  - text: "在鍋中煮滾適量的水，放米粉汆燙約3分鐘，取出後瀝去水分。"
  - text: "將適量沙拉油倒入熱鍋，加熱到130℃，放入芋頭丁炸約1分鐘後取出。"
  - text: "熱鍋加入3大匙沙拉油，先爆香紅蔥頭，炒至微黃再加入香菇丁、瘦肉丁。炒香後倒入高湯，放進燙好的米粉與炸過的芋頭丁，煮滾後加鹽，改小火燜10分鐘。起鍋前撒入少許油蔥酥、芹菜末、胡椒粉與香菜。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味芋頭米粉湯
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之芋頭米粉湯各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
