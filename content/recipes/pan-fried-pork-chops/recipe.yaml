title: 香煎豬排
summary: 依核准食譜指南製作之經典家常香煎豬排，風味道地鮮明。
servings: 2
category: 非湯料理
dishKinds: [meat]
classificationReason: "醃漬里肌豬排下鍋香煎，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 豬排, amount: { value: 100, unit: g }, note: 原料標示 3片 }
  - { name: 蔥段, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 薑片, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 蒜仁, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 地瓜粉, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 醬油, amount: { value: 100, unit: g }, note: 原料標示 1又1/2大匙 }
  - { name: 醬油膏, amount: { value: 100, unit: g }, note: 原料標示 1/2大匙 }
  - { name: 細砂糖, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 烏醋, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 胡椒粉, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 五香粉, amount: { value: 100, unit: g }, note: 原料標示 少許 }
steps:
  - text: "豬排洗淨瀝乾水份，以刀背或肉槌拍打數下備用；蒜仁拍扁備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的香煎豬排主要材料
  - text: "作法1豬排加入蔥段、薑片、作法1蒜仁以及所有調味料拌勻，醃漬約1小時備用。" 
  - text: "熱鍋，倒入少許沙拉油燒熱，放上作法2豬排，以中火煎至上色，翻面再煎至上色，煎熟後即可。" 
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味香煎豬排
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之香煎豬排各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
