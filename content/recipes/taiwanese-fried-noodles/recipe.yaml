title: 台式炒麵
summary: 依核准食譜指南製作之經典家常台式炒麵，風味道地鮮明。
servings: 3
category: 主食
dishKinds: []
classificationReason: "黃油麵搭配肉絲蔬菜大火醬炒，經典主食。"
draft: true
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 20
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 油麵, amount: { value: 100, unit: g }, note: 原料標示 150公克 }
  - { name: 韭菜, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 洋蔥, amount: { value: 100, unit: g }, note: 原料標示 30公克 }
  - { name: 紅蘿蔔, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 豬肉絲, amount: { value: 100, unit: g }, note: 原料標示 50公克 }
  - { name: 油蔥酥, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 蝦米, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 醬油, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 雞粉, amount: { value: 100, unit: g }, note: 原料標示 1/2小匙 }
  - { name: 白胡椒粉, amount: { value: 100, unit: g }, note: 原料標示 1/2小匙 }
  - { name: 黑醋, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
  - { name: 水, amount: { value: 100, unit: g }, note: 原料標示 400㏄ }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 1/2小匙 }
steps:
  - text: "韭菜洗淨切段；洋蔥、紅蘿蔔洗淨切絲備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的台式炒麵主要材料
  - text: "取鍋，加入適量油燒熱，放入油蔥酥、蝦米、洋蔥絲和紅蘿蔔絲炒香。"
  - text: "續加入豬肉絲、油麵和調味料拌炒均勻，加鍋蓋燜煮至水份略收乾即可盛盤。"
  - text: "加入豬肉絲和調味料燜煮至水略收乾，再放入韭菜段略拌炒均勻即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味台式炒麵
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之台式炒麵各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
