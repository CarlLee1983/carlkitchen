title: 蔥油雞
summary: 去骨雞腿先冷藏醃漬再蒸熟，淋上以青蔥、蒜末和薑末煮成的蔥油。
servings: 4
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 510
tags: [雞肉, 家常菜]
ingredients:
  - { name: 去骨雞腿, amount: { value: 2, unit: 支 } }
  - { name: 青蔥, amount: { value: 3, unit: 支 }, note: 切末 }
  - { name: 薑, amount: { value: 5, unit: 片 }, note: 切末 }
  - { name: 蒜頭, note: 來源標示少許，切末, group: 調味 }
  - {
      name: 亞麻油,
      amount: { value: 45, unit: ml },
      note: 約 3 大匙,
      group: 調味,
    }
  - {
      name: 米酒,
      amount: { value: 30, unit: ml },
      note: 來源列 2 湯匙，未交代加入步驟，待核,
      group: 調味,
    }
  - { name: 鹽, note: 來源標示少許, group: 調味 }
  - { name: 胡椒粉, note: 來源標示少許, group: 調味 }
steps:
  - text: 去骨雞腿拌入鹽和胡椒粉，放進冰箱冷藏醃漬一晚。
    image:
      src: ./step-1.webp
      alt: 白色瓷盤中放著兩支去骨雞腿，表面撒有鹽與胡椒粉
  - text: 將去骨雞腿放進電鍋，外鍋加一杯水，蒸約 20 分鐘。
    image:
      src: ./step-2.webp
      alt: 敞開的電鍋內鍋裡放著兩支蒸熟的去骨雞腿與蒸出的汁液
  - text: 青蔥切末，蒜頭與薑切末。
    image:
      src: ./step-3.webp
      alt: 木砧板上分開放著蔥末、蒜末與薑末，旁邊有菜刀
  - text: 鍋中加熱亞麻油，放入青蔥、蒜頭與薑末，煮到油滾。
    image:
      src: ./step-4.webp
      alt: 小鍋中的亞麻油正加熱蔥末、蒜末與薑末，油面微微冒泡
  - text: 將蒸雞腿留下的雞油倒進鍋中，和蔥末、蒜末、薑末一起煮滾。
  - text: 將去骨雞腿盛起，淋上煮好的蔥油。
hero:
  src: ./hero.webp
  alt: 米白色淺陶盤盛著兩支去骨雞腿，表面淋著帶蔥末、蒜末與薑末的蔥油
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 兩支去骨雞腿、三支青蔥、五片薑與少量蒜頭，旁邊分裝亞麻油、米酒、鹽和胡椒粉
