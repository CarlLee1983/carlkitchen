title: 大腸蚵仔麵線
summary: 柴魚高湯煮滾下紅麵線微煨，調入紅蔥酥與醬油，以太白粉水勾出經典滑順琉璃芡，加入肥美鮮蚵與滷透軟嫩大腸段，起鍋前淋入香醇烏醋與香菜，鹹香濃郁、滑潤順口。
servings: 3
category: 主食
dishKinds: []
classificationReason: 主食不設料理主角與配餐角色，以紅麵線搭配柴魚高湯、鮮蚵與滷大腸為經典傳統主食小吃。
