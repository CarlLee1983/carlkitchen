steps:
  - text: 鮮蚵輕柔洗淨瀝乾，均勻裹上一層地瓜粉，投入滾水中汆燙約 20 秒至表面定型即撈起泡涼水備用；熟大腸切約 1.5 公分小段；紅麵線切短段泡水洗淨鹽分瀝乾。
    image:
      src: ./step-1.webp
      alt: 鮮蚵輕柔洗淨瀝乾，均勻裹上一層地瓜粉，投入滾水中汆燙約 20 秒至表面定型即撈起泡涼水備用；熟大腸切
  - text: 取湯鍋注入高湯與柴魚片煮滾，放入紅麵線煮沸，加入油蔥酥、醬油、糖轉小火慢煮約 5 分鐘至麵線軟熟入味。
  - text: 將太白粉水邊倒邊用湯勺朝同方向畫圈攪拌，勾出滑順不結塊的濃郁琉璃芡汁。
    image:
      src: ./step-3.webp
      alt: 將太白粉水邊倒邊用湯勺朝同方向畫圈攪拌，勾出滑順不結塊的濃郁琉璃芡汁。
  - text: 加入汆燙好的蚵仔與滷大腸段稍微拌煮加熱即可關火盛碗，淋入烏醋、撒上白胡椒粉與香菜即可享用。
