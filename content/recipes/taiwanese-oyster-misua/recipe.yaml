tip: 鮮蚵裹上一層地瓜粉再汆燙，能緊緊鎖住水分不縮水且口感滑溜；勾芡時務必轉中小火慢慢倒粉水邊攪動，芡汁均勻透亮，放涼後也不易反水化開。
