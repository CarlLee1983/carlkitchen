title: 麻醬涼麵
summary: 冰鎮彈牙油麵鋪排小黃瓜絲、火腿絲、熟香菇絲與金黃蛋皮絲，淋上以芝麻醬、花生粉、醬油、烏醋、蒜泥與辣油調和的香濃特調麻醬汁，拌勻後濃醇芝麻香直撲鼻息，消暑開胃。
