steps:
  - text: 油麵入滾水汆燙後快速撈起泡入冰水冰鎮，瀝乾水分後盛入深盤中備用。
    image:
      src: ./step-1.webp
      alt: 油麵入滾水汆燙後快速撈起泡入冰水冰鎮，瀝乾水分後盛入深盤中備用。
  - text: 在油麵上方整齊排上小黃瓜絲、火腿絲、熟香菇絲與蛋皮絲。
    image:
      src: ./step-2.webp
      alt: 在油麵上方整齊排上小黃瓜絲、火腿絲、熟香菇絲與蛋皮絲。
  - text: 取碗將芝麻醬、花生粉、蒜泥、醬油、糖、烏醋、辣椒末與高湯充分調和均勻成滑順麻醬汁。
  - text: 食用時將特調麻醬汁均勻淋在麵條與配料上，充分攪拌均勻即可品嚐。
