tip: 櫻花蝦先單獨用少許油以小火煸炒至香脆酥爽再盛起，最後炒飯收尾時才倒回翻勻，這樣櫻花蝦能始終保持卡滋卡滋的酥脆口感而不被飯氣蒸軟。
