steps:
  - text: 隔夜白飯先以乾淨雙手捏散成粒粒分明狀態；雞蛋打散成蛋液；杏鮑菇切細小丁；紅蔥頭去皮切薄片；青蔥切細花備用。
    image:
      src: ./step-1.webp
      alt: 隔夜白飯先以乾淨雙手捏散成粒粒分明狀態；雞蛋打散成蛋液；杏鮑菇切細小丁；紅蔥頭去皮切薄片；青蔥切細花
  - text: 炒鍋加熱倒入 1 茶匙油，放入乾燥櫻花蝦以中小火慢煸炒約 2 分鐘，至蝦身轉為深粉紅香脆酥爽，盛起備用。
    image:
      src: ./step-2.webp
      alt: 炒鍋加熱倒入 1 茶匙油，放入乾燥櫻花蝦以中小火慢煸炒約 2 分鐘，至蝦身轉為深粉紅香脆酥爽，盛起備
  - text: 原鍋補入剩餘植物油燒熱，放入紅蔥頭片與杏鮑菇丁翻炒至微金黃，倒入打散蛋液快速攪炒至半凝固嫩蛋花，立即倒入白飯轉大火快速壓炒翻拋，炒至米粒均勻沾裹蛋香且粒粒分明。
  - text: 倒入煸酥的櫻花蝦、鹽、白胡椒粉與蔥花，沿鍋邊淋入醬油嗆出焦香，轉大火高速翻炒 30 秒至炒飯乾爽香氣四溢即可盛盤。
