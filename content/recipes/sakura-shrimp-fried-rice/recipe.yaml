title: 櫻花蝦炒飯
summary: 台灣東港珍貴乾燥櫻花蝦入乾熱鍋以小火慢煸出誘人酥脆甲殼焦香，原鍋爆香紅蔥頭碎與杏鮑菇丁，倒入金黃滑嫩蛋液與粒粒分明隔夜冷白飯大火快炒，撒上海鹽、白胡椒粉與青翠蔥花翻炒至米粒在鍋中歡快跳躍，粒粒分明、海味濃烈酥香、經典台味炒飯。
servings: 2
category: 主食
dishKinds: []
classificationReason: 以米飯為主體搭配櫻花蝦與雞蛋熱炒，可獨立作為一餐，屬於主食料理。
