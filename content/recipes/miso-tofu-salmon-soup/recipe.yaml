steps:
  - text: 鮭魚洗淨切成約 2 公分見方厚塊；豆腐切成約 1.5 公分方塊；細味噌以少許溫高湯在碗中攪拌溶解備用。
    image:
      src: ./step-1.webp
      alt: 鮭魚洗淨切成約 2 公分見方厚塊；豆腐切成約 1.5 公分方塊；細味噌以少許溫高湯在碗中攪拌溶解備用
  - text: 湯鍋中倒入高湯煮沸，放入切好的鮭魚塊與豆腐丁，中火煮約 3 至 4 分鐘至鮭魚肉熟透變白。
    image:
      src: ./step-2.webp
      alt: 湯鍋中倒入高湯煮沸，放入切好的鮭魚塊與豆腐丁，中火煮約 3 至 4 分鐘至鮭魚肉熟透變白。
  - text: 轉微火倒入化開的細味噌、糖與鹽攪拌均勻，加入柴魚片略微滾煮 1 分鐘後立即熄火。
  - text: 將煮好的味噌鮭魚豆腐湯盛入大碗中，表面撒上鮮綠蔥花即可享用。
