title: 味噌鮭魚豆腐湯
summary: 肥美鮭魚切塊、嫩豆腐切丁，入柴魚高湯中輕煮釋放鮮甜魚脂，拌入甘醇細味噌慢火化開，撒入柴魚片與蔥花，魚肉滑嫩、豆腐軟綿，湯頭濃醇甘美、暖胃生津。
servings: 4
category: 湯
dishKinds: []
classificationReason: 250 g 鮭魚與約 300 g 豆腐在 1000 ml 高湯中煮熟後化入味噌，成品屬湯。
draft: false
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 15
tags: [日式料理, 味噌湯, 鮭魚, 暖胃湯品]
aliases: [鮭魚味噌湯, 日式鮭魚豆腐味噌湯]
ingredients:
  - name: 鮭魚
    amount:
      value: 250
      unit: g
    note: 切適口厚方塊
  - name: 豆腐
    amount:
      value: 1
      unit: 塊
    note: 約 300 g 嫩豆腐切丁
  - name: 柴魚片
    amount:
      value: 10
      unit: g
    note: 約半杯提鮮
    group: 調味
  - name: 蔥花
    amount:
      value: 20
      unit: g
    note: 約 2 大匙青蔥花
    group: 調味
