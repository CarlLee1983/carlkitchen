title: 麻油川七
summary: 依核准食譜指南製作之經典家常麻油川七，風味道地鮮明。
servings: 2
category: 非湯料理
dishKinds: [vegetable]
classificationReason: "鮮嫩川七葉以黑麻油老薑絲與枸杞快炒，純蔬菜主角。"
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 10
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 川七, amount: { value: 150.0, unit: g }, note: 原料標示 150公克 }
  - { name: 枸杞, amount: { value: 10.0, unit: g }, note: 原料標示 10公克 }
  - { name: 老薑, amount: { value: 30.0, unit: g }, note: 原料標示 30公克 }
  - { name: 高湯, amount: { value: 200.0, unit: g }, note: 原料標示 200㏄ }
  - { name: 黑麻油, amount: { value: 2.0, unit: g }, note: 原料標示 2大匙 }
  - { name: 米酒, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
steps:
  - text: "將川七葉中較老的梗摘除後，洗淨瀝乾；枸杞洗淨瀝乾；老薑洗淨瀝乾後，切片狀備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之麻油川七主要材料
  - text: "取鍋，倒入黑麻油，續放入作法1老薑片爆香後，加入高湯、作法1的川七、枸杞和米酒，煮至滾沸後盛起即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味麻油川七
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之麻油川七各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
