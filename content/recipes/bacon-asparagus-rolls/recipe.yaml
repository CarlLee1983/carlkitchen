title: 培根蘆筍捲
summary: 依核准食譜指南製作之經典家常培根蘆筍捲，風味道地鮮明。
servings: 2
category: 非湯料理
dishKinds: [meat, vegetable]
classificationReason: "培根捲裹嫩蘆筍煎烤，肉類與蔬菜雙主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 20
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 培根, amount: { value: 100, unit: g }, note: 原料標示 5片 }
  - { name: 蘆筍, amount: { value: 100, unit: g }, note: 原料標示 150公克 }
  - { name: 薑絲, amount: { value: 100, unit: g }, note: 原料標示 50公克 }
  - { name: 沙拉油, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 1/2小匙 }
  - { name: 黑胡椒, amount: { value: 100, unit: g }, note: 原料標示 1/2小匙 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
steps:
  - text: "蘆筍切成5公分長，放入滾水中燙熟撈出，均勻分成五等份；薑絲均勻分成５等份備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的培根蘆筍捲主要材料
  - text: "取一片培根包入１等份的作法1蘆筍段及一等份的薑絲，捲起再以牙籤固定備用。" 
  - text: "將所有調味料拌勻備用。" 
  - text: "取一平底鍋，倒入沙拉油燒熱後，放入作法2處理好的培根捲，以大火煎至外皮的油脂成透明狀時，加入作法3調勻的調味料，蓋上鍋蓋約10秒，開蓋取出排入盤中即可。" 
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味培根蘆筍捲
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之培根蘆筍捲各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
