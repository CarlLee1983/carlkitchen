title: 冬瓜排骨湯
summary: 排骨汆燙後與冬瓜、薑片和米酒一起放入電鍋蒸煮，起鍋前加鹽並燜五分鐘。
servings: 6
category: 湯
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 65
tags: [家常菜]
ingredients:
  - {
      name: 冬瓜,
      amount: { value: 1500, unit: g },
      note: 烹調前去皮、去籽、切塊,
    }
  - { name: 豬小排, amount: { value: 600, unit: g } }
  - { name: 薑片, amount: { value: 25, unit: g } }
  - { name: 米酒, amount: { value: 50, unit: ml } }
  - {
      name: 水,
      amount: { value: 2500, unit: ml },
      note: 內鍋用，外鍋另加 2 杯水,
    }
  - { name: 鹽, amount: { value: 12, unit: g }, note: 約 1 大匙, group: 調味 }
steps:
  - text: 冬瓜削去外皮並挖掉籽，切成塊狀。
    image:
      src: ./step-1.webp
      alt: 木砧板上放著去皮去籽後的冬瓜塊，旁邊有削下的瓜皮、瓜籽與菜刀
  - text: 煮滾一鍋水，放入豬小排，水再次煮滾後續汆燙約 30 秒，撈起用清水洗淨。
    image:
      src: ./step-2.webp
      alt: 不鏽鋼瀝水籃裡放著沖洗後的汆燙排骨塊，骨頭與灰白色肉面清楚可見
  - text: 把冬瓜、豬小排、薑片、米酒和水放進電鍋內鍋；外鍋加 2 杯水，按下開關蒸煮至跳起。
    image:
      src: ./step-3.webp
      alt: 電鍋裡的雙耳內鍋裝著冬瓜塊、排骨、薑片與清澈湯水
  - text: 打開鍋蓋加鹽，蓋回鍋蓋再燜約 5 分鐘。
    image:
      src: ./step-4.webp
      alt: 電鍋內鍋的冬瓜排骨湯旁放著鍋蓋與一小碟鹽，冬瓜塊和排骨浸在湯中
hero:
  src: ./hero.webp
  alt: 敞口雙耳湯鍋盛著冬瓜排骨湯，清湯裡有冬瓜塊、帶骨排骨和薑片
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 一大塊帶皮帶籽的冬瓜、生排骨塊、薑片、一小杯米酒、一壺水、兩小杯外鍋用水和一碟鹽
tip: 電鍋跳起後加鹽並燜 5 分鐘，讓冬瓜更入味。
