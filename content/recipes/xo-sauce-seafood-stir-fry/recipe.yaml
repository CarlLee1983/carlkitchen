title: XO 醬炒雙鮮
summary: 蝦仁與刻花透抽快速汆燙，與青花菜、紅甜椒一同以 XO 醬大火翻炒，勾薄芡並淋香油。海味鮮甜彈牙、醬香濃郁微辣。
servings: 4
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 25
tags: [家常菜]
aliases: []
ingredients:
  - { name: 蝦仁, amount: { value: 200, unit: g }, note: 去腸泥 }
  - { name: 透抽, amount: { value: 200, unit: g }, note: 洗淨刻花切塊 }
  - { name: 綠花椰菜, amount: { value: 50, unit: g }, note: 切小朵 }
  - { name: 紅甜椒, amount: { value: 0.5, unit: 顆 }, note: 約半顆，切菱形片 }
  - { name: 洋蔥, amount: { value: 0.5, unit: 顆 }, note: 約半顆，切菱形片 }
  - { name: 薑, amount: { value: 10, unit: g }, note: 切片 }
  - { name: 蒜仁, amount: { value: 3, unit: 顆 }, note: 切片 }
  - { name: 紅辣椒, amount: { value: 1, unit: 根 }, note: 切片 }
  - {
      name: XO 醬,
      amount: { value: 5, unit: ml },
      note: 約 1 茶匙,
      group: 調味,
    }
  - { name: 水, amount: { value: 75, unit: ml }, note: 約 5 大匙, group: 調味 }
  - { name: 鹽, note: 少許, group: 調味 }
  - { name: 白胡椒粉, note: 少許, group: 調味 }
  - {
      name: 細砂糖,
      amount: { value: 5, unit: g },
      note: 約 1 茶匙,
      group: 調味,
    }
  - { name: 香油, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
  - {
      name: 米酒,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙,
      group: 調味,
    }
