    }
steps:
  - text: 蝦仁挑去腸泥洗淨；透抽洗淨在內面劃菱形十字花刀後切成小塊；綠花椰菜切成小朵，入滾水汆燙後撈起瀝乾。
    image:
      src: ./step-1.webp
      alt: 木砧板上放著劃好菱形花刀的透抽塊與生蝦仁，旁邊瀝水篩盛著汆燙好的翠綠花椰菜
  - text: 薑、蒜仁與紅辣椒洗淨後切成薄片；紅甜椒與洋蔥洗淨切成菱形片備用。
  - text: 煮滾一鍋水，放入透抽塊與蝦仁快速汆燙約 10 秒，表面微捲即撈起瀝乾多餘水分。
  - text: 炒鍋中倒入沙拉油燒熱，下薑片、蒜片、紅辣椒片與洋蔥片以中火爆香，加入蝦仁、透抽、綠花椰菜、紅甜椒與 XO 醬、水、米酒、細砂糖、鹽及白胡椒粉大火翻炒均勻。
    image:
      src: ./step-4.webp
      alt: 鐵炒鍋在大火上翻炒著蝦仁、透抽花、花椰菜與紅甜椒，均勻裹上琥珀色 XO 醬汁
  - text: 淋入太白粉水勾薄芡，起鍋前滴入香油翻勻即可盛盤。
hero:
  src: ./hero.webp
  alt: 白色圓瓷大盤盛著色澤油亮的蝦仁、刻花透抽、綠花椰菜與紅甜椒，均勻裹著琥珀色 XO 醬汁
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 木砧板上擺著生蝦仁、刻花透抽、綠花椰菜、紅甜椒片、洋蔥片、蒜片、薑片與紅辣椒片，下方分裝 XO 醬、米酒、太白粉水與香油
tip: 透抽與蝦仁入鍋前先短暫汆燙瀝乾，可去除多餘水分，大火快炒時鑊氣更足且不易出水稀釋醬汁。
