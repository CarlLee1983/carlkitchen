title: 酸菜牛肉湯
summary: 牛肉汆燙後，與酸菜心、薑片、蔥和牛骨高湯放入電鍋燉煮，最後以鹽和米酒調味。
servings: 4
category: 湯
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 160
tags: [家常菜]
ingredients:
  - { name: 牛腱, amount: { value: 300, unit: g }, note: 切成約 6 × 3 公分塊 }
  - { name: 酸菜心, amount: { value: 150, unit: g }, note: 沖洗後切片 }
  - { name: 老薑, amount: { value: 50, unit: g }, note: 去皮切片 }
  - { name: 青蔥, amount: { value: 2, unit: 根 }, note: 切段 }
  - { name: 牛骨高湯, amount: { value: 3000, unit: ml } }
  - {
      name: 鹽,
      amount: { value: 1.25, unit: ml },
      note: 約 1/4 茶匙,
      group: 調味,
    }
  - {
      name: 米酒,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙,
      group: 調味,
    }
  - { name: 水, amount: { value: 2, unit: 杯 }, note: 電鍋外鍋用 }
steps:
  - text: 牛腱放入滾水中汆燙，撈出瀝乾後切成約 6 × 3 公分的塊狀。
    image:
      src: ./step-1.webp
      alt: 滾水鍋中汆燙牛肉塊，旁邊放著瀝乾後的牛肉
  - text: 酸菜心以清水沖洗後切片，老薑去皮切片，青蔥切段。
    image:
      src: ./step-2.webp
      alt: 木砧板上放著酸菜心片、薑片和青蔥段，旁邊有菜刀
  - text: 依序把酸菜心、牛腱、薑片和青蔥放入電鍋內鍋，加入牛骨高湯、鹽和米酒。
    image:
      src: ./step-3.webp
      alt: 電鍋內鍋裡依序放著酸菜心片、牛肉塊、薑片和青蔥段，注入牛骨高湯
  - text: 外鍋倒入 1 杯水後按下開關燉煮；開關跳起後再加 1 杯水，續煮至總時間約 2.5 小時。
    image:
      src: ./step-4.webp
      alt: 電鍋外鍋加水燉煮內鍋中的酸菜牛肉湯
hero:
  src: ./hero.webp
  alt: 白色湯碗中盛著牛肉塊、酸菜心片、薑片和青蔥，浸在深色牛骨湯裡
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 牛肉、酸菜心、老薑和青蔥，以及分裝的牛骨高湯、鹽、米酒和電鍋用水
