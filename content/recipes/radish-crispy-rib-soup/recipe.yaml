title: 蘿蔔排骨酥湯
summary: 帶骨豬小排以醬油、五香粉、米酒與油蔥酥醃漬入味，裹地瓜粉中火高溫炸至外殼紅棕金黃酥脆鎖住肉汁，放入湯鍋搭配清甜白蘿蔔滾刀塊與大骨高湯清燉，蘿蔔軟透甘甜、排骨酥吸滿鮮美湯汁、肉質軟嫩離骨、湯頭濃郁甘潤。
servings: 3
category: 湯
dishKinds: []
classificationReason: 蘿蔔排骨酥湯為經典台式燉湯，湯品不設料理主角與配餐角色。
draft: false
mealCandidate: true
