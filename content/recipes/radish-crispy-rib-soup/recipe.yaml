    group: 調味
steps:
  - text: 豬小排剁成小塊洗淨吸乾水分，加入醬油、米酒、五香粉、細砂糖、少許油蔥酥與蛋液抓拌至黏稠起膠，均勻裹上地瓜粉靜置 5 分鐘回潮；白蘿蔔去皮切大滾刀塊備用。
    image:
      src: ./step-1.webp
      alt: 豬小排剁成小塊洗淨吸乾水分，加入醬油、米酒、五香粉、細砂糖、少許油蔥酥與蛋液抓拌至黏稠起膠，均勻裹上
  - text: 起油鍋燒熱至 160°C，逐塊放入排骨塊小火慢炸 3 分鐘定型，轉中大火炸至外殼紅棕金黃酥脆，撈起充分瀝油成排骨酥。
    image:
      src: ./step-2.webp
      alt: 起油鍋燒熱至 160°C，逐塊放入排骨塊小火慢炸 3 分鐘定型，轉中大火炸至外殼紅棕金黃酥脆，撈起充
  - text: 湯鍋注入高湯與清水煮滾，放入白蘿蔔塊與炸好的排骨酥，加入剩餘油蔥酥與鹽，加蓋轉小火燉煮 30 分鐘至蘿蔔晶瑩透光、排骨酥軟嫩入味。
  - text: 起鍋前撒入白胡椒粉提香，盛入大湯碗即可熱氣騰騰享用。
