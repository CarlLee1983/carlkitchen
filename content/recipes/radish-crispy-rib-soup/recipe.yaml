timeMinutes: 45
tags: [排骨酥湯, 白蘿蔔, 排骨, 夜市小吃, 暖胃湯品]
aliases: [白蘿蔔排骨酥湯, 台式排骨酥湯]
ingredients:
  - name: 豬小排
    amount:
      value: 300
      unit: g
    note: 剁 2 公分適口小塊洗淨擦乾
  - name: 白蘿蔔
    amount:
      value: 300
      unit: g
    note: 去皮切大滾刀塊
  - name: 油蔥酥
    amount:
      value: 15
      unit: g
    note: 醃排骨與燉湯增香
  - name: 地瓜粉
    amount:
      value: 45
      unit: g
    note: 裹粉炸排骨酥
  - name: 雞蛋
    amount:
      value: 1
      unit: 顆
    note: 取半顆蛋液抓醃排骨
  - name: 高湯
    amount:
      value: 1000
      unit: ml
    note: 大骨高湯或清水
  - name: 醬油
    amount:
      value: 15
      unit: ml
    note: 醃肉調味
    group: 調味
  - name: 米酒
    amount:
      value: 15
      unit: ml
    note: 醃肉去腥
    group: 調味
