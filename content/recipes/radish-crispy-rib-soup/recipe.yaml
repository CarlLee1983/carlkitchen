tip: 排骨裹上地瓜粉後務必靜置五分鐘回潮，炸的時候粉漿才不會在熱油中脫落；燉湯時小火慢煨三十分鐘，排骨酥外皮吸飽甘甜蘿蔔高湯卻不散碎，滋味最為醇厚。
