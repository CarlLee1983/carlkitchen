title: 蒜香炒鴨賞
summary: 宜蘭特產甘蔗煙燻去骨鴨賞切薄片，熱油鍋爆香新鮮蒜末與紅辣椒片，投入鴨賞片大火快速翻炒逼出煙燻蔗香油脂，加入青翠青蒜苗斜段，嗆入米酒、少許細砂糖與清水翻炒收汁，鴨皮Ｑ脆、鴨肉軟嫩多汁、煙燻香與蒜香完美融合，經典宜蘭鄉土名菜。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: 以煙燻鴨賞切片快炒為唯一肉類主角，屬於肉類料理。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 10
tags: [鴨賞, 宜蘭名產, 熱炒, 家常菜, 煙燻料理]
aliases: [蒜苗炒鴨賞, 宜蘭煙燻炒鴨賞]
ingredients:
  - name: 煙燻鴨賞
    amount:
      value: 200
      unit: g
    note: 宜蘭甘蔗煙燻去骨鴨賞切薄片
  - name: 青蒜苗
    amount:
      value: 60
      unit: g
    note: 洗淨斜切厚段
  - name: 大蒜
    amount:
      value: 15
      unit: g
    note: 去皮切蒜片
  - name: 紅辣椒
    amount:
      value: 1
      unit: 根
    note: 斜切薄片配色
  - name: 米酒
    amount:
      value: 15
      unit: ml
    note: 嗆鍋增香
    group: 調味
  - name: 細砂糖
    amount:
      value: 5
