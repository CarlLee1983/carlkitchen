    note: 炒料油
    group: 調味
steps:
  - text: 煙燻鴨賞切成適口薄片；青蒜苗洗淨斜切長片；大蒜切片；紅辣椒切斜片備用。
    image:
      src: ./step-1.webp
      alt: 木砧板上分別放著切片的煙燻鴨賞、青蒜苗段、大蒜片與紅辣椒片。
  - text: 炒鍋加熱倒入植物油，放入蒜片與紅辣椒片以中小火爆炒出香氣。
  - text: 倒入切好的鴨賞薄片轉中大火快速翻炒約 1 分鐘，煸出鴨皮中的煙燻蔗糖油脂與濃郁肉香。
  - text: 放入青蒜苗段，沿鍋邊嗆入米酒、細砂糖、白醋與少許清水，大火高速翻炒 20 秒至蒜苗斷生翠綠，滴入香油翻勻即可盛盤。
    image:
      src: ./step-4.webp
      alt: 煙燻鴨賞片與青蒜苗段在鍋中冒著熱氣，鍋底可見油汁與氣泡。
hero:
  src: ./hero.webp
  alt: 盛盤完成的蒜香炒鴨賞
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 料理食材整齊擺放於木砧板上
tip: 鴨賞本身已具備煙燻鹹甘底味，料理時無需再額外加鹽；起鍋前嗆入少許白醋與白糖大火快炒，能完美平衡煙燻的鹹重感，使肉質更加甘甜爽口。
