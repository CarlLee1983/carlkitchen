title: 香菇肉燥飯
summary: 優質豬前腿絞肉入鍋煸出油脂，投入泡發厚切乾香菇丁與大量金黃油蔥酥慢火煸炒出深邃古早味，加入醬油、米酒、冰糖與清水細火慢燉三十分鐘，滷汁油亮甘醇，澆淋在熱騰騰白飯上，香濃黏嘴、經典台灣美味。
servings: 4
category: 主食
dishKinds: []
classificationReason: 以白米飯為底淋上甘醇香菇肉燥滷汁，可直接作為一餐食用，屬於主食料理。
