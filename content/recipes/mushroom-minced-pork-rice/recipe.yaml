tip: 香菇泡發水富含天然甘甜鳥苷酸，過濾掉底部泥沙後倒入同燉能讓肉燥香氣更加濃郁醇厚；冰糖先在炒肉時炒融上色能讓肉燥色澤紅潤發亮。
