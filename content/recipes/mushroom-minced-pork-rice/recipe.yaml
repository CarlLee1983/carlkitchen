steps:
  - text: 乾香菇沖淨以溫水泡軟，去除硬蒂頭後切成約半公分均勻香菇小丁，香菇水沉澱過濾保留備用。
    image:
      src: ./step-1.webp
      alt: 乾香菇沖淨以溫水泡軟，去除硬蒂頭後切成約半公分均勻香菇小丁，香菇水沉澱過濾保留備用。
  - text: 取燉鍋加少許油熱鍋，倒入豬前腿絞肉以中火翻炒煸出多餘豬油與肉香，倒入香菇丁持續翻炒 3 分鐘至香氣四溢。
    image:
      src: ./step-2.webp
      alt: 取燉鍋加少許油熱鍋，倒入豬前腿絞肉以中火翻炒煸出多餘豬油與肉香，倒入香菇丁持續翻炒 3 分鐘至香氣四
  - text: 加入冰糖翻炒至微焦糖化上色，倒入醬油、米酒、白胡椒粉、過濾香菇水與清水，加入金黃油蔥酥攪拌均勻煮滾。
  - text: 轉微火蓋上鍋蓋燜燉 35 分鐘至肉燥軟爛膠質釋出，湯汁濃郁油潤，盛裝熱白飯，淋上兩大匙甘醇香菇肉燥即可上桌。
