    amount:
      value: 2
      unit: g
    note: 出鍋少許提辛香
    group: 調味
steps:
  - text: 豬肚加粗鹽與麵粉徹底抓洗搓揉乾淨，入滾水加薑片、米酒汆燙 5 分鐘撈起沖涼，切成 1.5 公分寬厚條；芡實、淮山、蓮子與茯苓以清水沖淨泡水 30 分鐘備用。
    image:
      src: ./step-1.webp
      alt: 豬肚加粗鹽與麵粉徹底抓洗搓揉乾淨，入滾水加薑片、米酒汆燙 5 分鐘撈起沖涼，切成 1.5 公分寬厚條
  - text: 取燉鍋注入 1500 ml 高湯煮滾，放入豬肚條、生薑片、芡實、淮山、蓮子與茯苓，淋入米酒大火煮沸，撈除表面浮沫。
    image:
      src: ./step-2.webp
      alt: 取燉鍋注入 1500 ml 高湯煮滾，放入豬肚條、生薑片、芡實、淮山、蓮子與茯苓，淋入米酒大火煮沸，
  - text: 蓋上鍋蓋轉小火慢燉 50 分鐘，至豬肚軟爛Ｑ彈、蓮子與芡實粉糯化開，加入鹽調味續煮 5 分鐘，起鍋前撒入白胡椒粉即可盛碗。
