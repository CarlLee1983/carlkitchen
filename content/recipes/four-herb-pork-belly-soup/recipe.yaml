timeMinutes: 60
tags: [四神湯, 豬肚, 藥膳湯品, 養生, 台灣傳統小吃]
aliases: [四神豬肚湯, 傳統四神湯]
ingredients:
  - name: 豬肚
    amount:
      value: 500
      unit: g
    note: 洗淨滾水汆燙煮軟切厚條
  - name: 淮山
    amount:
      value: 30
      unit: g
    note: 乾山藥片洗淨泡軟
  - name: 芡實
    amount:
      value: 40
      unit: g
    note: 洗淨溫水浸泡 1 小時
  - name: 蓮子
    amount:
      value: 40
      unit: g
    note: 去芯洗淨
  - name: 茯苓
    amount:
      value: 20
      unit: g
    note: 洗淨略浸泡
  - name: 生薑
    amount:
      value: 20
      unit: g
    note: 切生薑片
  - name: 高湯
    amount:
      value: 1500
      unit: ml
    note: 大骨高湯或清水
  - name: 米酒
    amount:
      value: 50
      unit: ml
    note: 約 3 大匙去腥增香
    group: 調味
  - name: 鹽
    amount:
      value: 6
      unit: g
    note: 調整湯底鹹度
    group: 調味
