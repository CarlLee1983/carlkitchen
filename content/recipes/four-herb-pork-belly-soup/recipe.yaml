tip: 芡實與蓮子質地較硬，料理前先以溫水浸泡半小時，同豬肚小火慢燉五十分鐘即可煮得鬆軟綿密；豬肚先以麵粉和粗鹽抓搓洗去黏液，燉出的湯色乳白清香無異味。
