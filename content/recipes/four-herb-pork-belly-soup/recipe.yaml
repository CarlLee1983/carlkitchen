title: 豬肚四神湯
summary: 新鮮厚實豬肚徹底洗淨汆燙切厚條，搭配淮山、芡實、蓮子、茯苓四味中藥材與大骨高湯慢火細燉一個半小時，豬肚軟Ｑ滑嫩、藥材粉糯香濃，起鍋淋入當歸藥酒，湯頭溫潤甘醇、健脾暖胃、台灣歷史悠久養生名湯。
servings: 4
category: 湯
dishKinds: []
classificationReason: 豬肚四神湯為傳統藥膳燉湯，湯品不設料理主角與配餐角色。
draft: false
mealCandidate: true
