  - { name: 蒜末, note: 少許，來源未標用量, group: 調味 }
steps:
  - text: 義大利直麵放進滾水，煮約 8 分鐘後撈出。
    image:
      src: ./step-1.webp
      alt: 不鏽鋼瀝水籃裡裝著剛煮好撈出的義大利直麵，冒著熱氣
  - text: 中卷洗淨切成圈，蝦仁去腸泥；青椒、紅椒、紅蘿蔔和洋蔥切絲，番茄切小丁。
    image:
      src: ./step-2.webp
      alt: 木砧板上分堆放著生中卷圈、去腸泥的生蝦仁、青椒絲、紅椒絲、紅蘿蔔絲、洋蔥絲和番茄丁，砧板旁放著一把菜刀
  - text: 鍋裡倒橄欖油，放入中卷、蝦仁和蛤蜊拌炒，蛤蜊開口後淋入白酒，盛出備用。
    image:
      src: ./step-3.webp
      alt: 木柄黑色平底鍋裡有炒熟的中卷圈、轉紅的蝦仁和開口的蛤蜊，鍋底帶少許油與白酒湯汁，冒著熱氣
  - text: 另起一鍋融化奶油，先把蒜末和洋蔥絲炒香，加番茄丁、月桂葉稍炒，再拌入番茄醬與番茄糊。
  - text: 放入青椒、紅椒和紅蘿蔔絲炒勻，倒進高湯煮滾。
    image:
      src: ./step-5.webp
      alt: 同一只平底鍋裡的番茄醬汁正冒泡滾起，裡面有青椒絲、紅椒絲、洋蔥絲、番茄丁和一片月桂葉
  - text: 加入義大利直麵、俄力岡和義大利香料，再把海鮮放回鍋中，以鹽、糖調味，拌炒均勻。
