title: 海鮮義大利麵
summary: 海鮮炒到蛤蜊開口先取出，奶油番茄醬汁加蔬菜絲與高湯煮滾，再和義大利麵、海鮮拌炒。
servings: 2
category: 主食
draft: true
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 40
tags: [義式料理, 麵食, 海鮮]
ingredients:
  - { name: 義大利直麵, amount: { value: 180, unit: g } }
  - { name: 中卷, amount: { value: 1, unit: 尾 } }
  - { name: 蝦仁, amount: { value: 120, unit: g } }
  - { name: 蛤蜊, amount: { value: 150, unit: g } }
  - { name: 青椒, amount: { value: 0.5, unit: 個 } }
  - { name: 紅椒, amount: { value: 0.5, unit: 個 } }
  - { name: 洋蔥, amount: { value: 0.5, unit: 個 } }
  - { name: 番茄, amount: { value: 1, unit: 個 } }
  - { name: 紅蘿蔔, note: 少許, group: 調味 }
  - { name: 月桂葉, amount: { value: 1, unit: 片 }, group: 調味 }
  - { name: 九層塔, note: 少許, group: 調味 }
  - { name: 高湯, amount: { value: 300, unit: ml } }
  - { name: 橄欖油, note: 少許, group: 調味 }
  - {
      name: 番茄醬,
      amount: { value: 60, unit: ml },
      note: 約 4 大匙,
      group: 調味,
    }
  - {
      name: 番茄糊,
      amount: { value: 30, unit: ml },
      note: 約 2 大匙,
      group: 調味,
    }
  - { name: 俄力岡, note: 少許, group: 調味 }
  - { name: 義大利香料, note: 少許，與俄力岡分開使用, group: 調味 }
  - { name: 鹽, amount: { value: 5, unit: ml }, note: 約 1 小匙, group: 調味 }
  - {
      name: 糖,
      amount: { value: 12, unit: g },
      note: 約 1 大匙，換算估值,
      group: 調味,
    }
  - {
      name: 白酒,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙,
      group: 調味,
    }
  - { name: 奶油, note: 適量，來源未標數量, group: 調味 }
  - { name: 蒜末, note: 少許，來源步驟提及但材料表未列, group: 調味 }
steps:
  - text: 義大利直麵放進滾水，煮約 8 分鐘後撈出。
  - text: 中卷洗淨切成圈，蝦仁去腸泥；青椒、紅椒、紅蘿蔔和洋蔥切絲，番茄切小丁。
  - text: 鍋裡倒橄欖油，放入中卷、蝦仁和蛤蜊拌炒，蛤蜊開口後淋入白酒，盛出備用。
  - text: 另起一鍋融化奶油，先把蒜末和洋蔥絲炒香，加番茄丁、月桂葉稍炒，再拌入番茄醬與番茄糊。
  - text: 放入青椒、紅椒和紅蘿蔔絲炒勻，倒進高湯煮滾。
  - text: 加入義大利直麵、俄力岡和義大利香料，再把海鮮放回鍋中，以鹽、糖調味，拌炒均勻。
