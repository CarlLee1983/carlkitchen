title: 爆炒海瓜子
summary: 依核准食譜指南製作之經典家常爆炒海瓜子，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: "熱鍋大火爆炒海瓜子至開口，海鮮主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 10
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 海瓜子, amount: { value: 100, unit: g }, note: 原料標示 300公克 }
  - { name: 蔥, amount: { value: 100, unit: g }, note: 原料標示 1支 }
  - { name: 蒜頭, amount: { value: 100, unit: g }, note: 原料標示 4粒 }
  - { name: 紅辣椒, amount: { value: 100, unit: g }, note: 原料標示 1支 }
  - { name: 九層塔, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
  - { name: 醬油膏, amount: { value: 100, unit: g }, note: 原料標示 2大匙 }
steps:
  - text: "蔥切小段；蒜頭切末；紅辣椒切末，備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的爆炒海瓜子主要材料
  - text: "海瓜子泡水吐砂備用。" 
  - text: "熱鍋倒入適量的油，放入作法1的蔥段、蒜末、辣椒末爆香。" 
  - text: "放入作法2的海瓜子，蓋上鍋蓋燜約3~4分鐘至海瓜子打開。" 
  - text: "再放入所有調味料及九層塔炒熟即可。" 
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味爆炒海瓜子
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之爆炒海瓜子各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
