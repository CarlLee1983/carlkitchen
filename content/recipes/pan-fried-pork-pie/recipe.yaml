title: 豬肉餡餅
summary: 依核准食譜指南製作之經典家常豬肉餡餅，風味道地鮮明。
servings: 3
category: 主食
dishKinds: []
classificationReason: "麵皮包裹鮮美豬肉蔥花餡兩面煎金黃，主食點心。"
draft: false
mealCandidate: false
vegetable: false
protein: false
timeMinutes: 40
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 中筋麵粉, amount: { value: 100, unit: g }, note: 原料標示 200公克 }
  - { name: 滾水, amount: { value: 100, unit: g }, note: 原料標示 110公克 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 豬肉, amount: { value: 100, unit: g }, note: 原料標示 200公克 }
  - { name: 蔥末, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 薑末, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 高湯, amount: { value: 100, unit: g }, note: 原料標示 適量 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 1/3大匙 }
  - { name: 糖, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
  - { name: 醬油膏, amount: { value: 100, unit: g }, note: 原料標示 1/2大匙 }
  - { name: 胡椒粉, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
steps:
  - text: "將滾水加入麵粉、糖與鹽中製作燙麵，將麵糰搓揉至光滑後，醒麵30分鐘，將醒完的麵團搓揉桿成圓形的餅皮。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的豬肉餡餅主要材料
  - text: "將豬肉、蔥末、薑末和鹽、糖、醬油膏、胡椒粉混合攪拌均勻後，再將高湯分次慢慢地加入，並一邊攪拌至略帶黏性的狀態。" 
  - text: "將作法2的豬肉內餡包入作法1的餅皮中，並整形好。" 
  - text: "取平底鍋燒熱後，將作法3整形好的豬肉餡餅收口朝下平放於鍋內，以中火煎約5分鐘，再反覆翻面香煎至麵皮鼓起並呈現金黃色外觀即可。" 
