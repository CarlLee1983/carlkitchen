steps:
  - text: 小排骨洗淨剁成小塊瀝乾，加入辣豆瓣醬、蛋液、醬油、酒與糖抓勻醃漬約 30 分鐘入味。
    image:
      src: ./step-1.webp
      alt: 小排骨洗淨剁成小塊瀝乾，加入辣豆瓣醬、蛋液、醬油、酒與糖抓勻醃漬約 30 分鐘入味。
  - text: 地瓜去皮切成滾刀厚塊鋪於蒸盤底部；將醃好的小排骨均勻沾裹蒸肉粉，一塊塊排放在地瓜上方。
    image:
      src: ./step-2.webp
      alt: 地瓜去皮切成滾刀厚塊鋪於蒸盤底部；將醃好的小排骨均勻沾裹蒸肉粉，一塊塊排放在地瓜上方。
  - text: 蒸鍋中倒入充足清水大火燒滾，放入蒸盤蓋緊鍋蓋，大火蒸煮 40 分鐘至排骨軟爛透味、地瓜綿密熟透即可取出盛盤。
