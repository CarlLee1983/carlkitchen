title: 香煎菜脯蛋
summary: 依核准食譜指南製作之經典家常香煎菜脯蛋，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: "古早味菜脯煎至金黃酥香之烘蛋，蛋豆主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 12
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 碎菜脯, amount: { value: 100, unit: g }, note: 原料標示 100公克 }
  - { name: 雞蛋, amount: { value: 100, unit: g }, note: 原料標示 4個 }
  - { name: 蔥花, amount: { value: 100, unit: g }, note: 原料標示 10公克 }
  - { name: 太白粉, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 醬油, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 1/2小匙 }
steps:
  - text: "碎菜脯洗淨泡水3分鐘後瀝乾，加入太白粉拌勻備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的香煎菜脯蛋主要材料
  - text: "雞蛋打散，加入所有調味料拌勻，再放入作法1的碎菜脯、蔥花拌勻。" 
  - text: "取鍋燒熱後倒入適量油，加入作法2的菜脯蛋液，煎至定型後翻面，再倒入少許油煎至上色變熟後，取出切片即可。" 
hero:
