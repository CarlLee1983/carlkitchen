title: 洋蔥炒豬絞肉
summary: 洋蔥丁炒至金黃，再與豬絞肉拌炒收汁。以醬油和醬油膏調味，適合配飯或拌麵。
servings: 3
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 10
tags: [家常菜]
ingredients:
  - { name: 豬絞肉, amount: { value: 300, unit: g }, note: 選用低脂豬絞肉 }
  - { name: 洋蔥, amount: { value: 170, unit: g }, note: 約半顆，切丁 }
  - { name: 食用油, note: 少許, group: 調味 }
  - {
      name: 醬油,
      amount: { value: 15, unit: ml },
      note: 約 1 湯匙,
      group: 調味,
    }
  - {
      name: 醬油膏,
      amount: { value: 15, unit: ml },
      note: 約 1 湯匙,
      group: 調味,
    }
  - {
      name: 米酒,
      amount: { value: 15, unit: ml },
      note: 約 1 湯匙,
      group: 調味,
    }
  - { name: 味醂, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
  - { name: 糖, amount: { value: 1, unit: g }, note: 約 1/4 茶匙, group: 調味 }
  - {
      name: 香油,
      amount: { value: 1.25, unit: ml },
      note: 約 1/4 茶匙,
      group: 調味,
    }
  - { name: 鹽, note: 視情況少許，最多約 1 g（1/4 茶匙）, group: 調味 }
steps:
  - text: 將洋蔥切丁。把醬油、醬油膏、米酒、味醂、糖與香油混合成調味汁。
    image:
      {
        src: ./step-1.webp,
        alt: 木砧板上放著切好的洋蔥丁與菜刀，旁邊的素色小碗盛著調好的褐色醬汁,
      }
  - text: 倒少許食用油入平底鍋，放入洋蔥，以中小火炒到金黃。
    image: { src: ./step-2.webp, alt: 平底鍋中散布著炒成金黃色的洋蔥丁 }
  - text: 撥開洋蔥，放入豬絞肉並炒散。肉色變白後，與洋蔥拌炒至略帶焦香。
    image:
      {
        src: ./step-3.webp,
        alt: 平底鍋中炒散的豬絞肉已轉色，與金黃洋蔥丁混合，部分肉粒略帶褐色,
      }
  - text: 倒入調味汁拌炒收汁，起鍋前用食物溫度計確認豬絞肉中心至少達 71°C。
    image:
      {
        src: ./step-4.webp,
        alt: 平底鍋中的豬絞肉與洋蔥丁裹著褐色醬汁，鍋底只剩少量湯汁,
      }
  - text: 確認豬絞肉熟透後試味，若不夠鹹或偏甜，加入少許鹽拌勻再盛出。
tip: 鹽依醬料鹹甜度調整，添加量不超過約 1 g（1/4 茶匙）。豬絞肉是否熟透須以食物溫度計確認，不能只靠肉色判斷。
