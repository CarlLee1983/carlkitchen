title: 生菜雞鬆
summary: 雞肉、荸薺與蔬菜炒成雞鬆，拌入炸脆的油條，以生菜葉包著吃。
servings: 3
category: 非湯料理
dishKinds: [vegetable, meat]
classificationReason: 100 g 雞肉與芹菜、荸薺、紅蘿蔔合計 90 g 炒成餡，再以 6 片完整生菜葉包食。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 30
tags: [雞肉料理]
ingredients:
  - { name: 雞肉, amount: { value: 100, unit: g }, note: 切丁，建議用雞胸肉 }
  - { name: 芹菜, amount: { value: 30, unit: g }, note: 切丁 }
  - { name: 油條, amount: { value: 0.5, unit: 條 }, note: 切丁 }
  - { name: 荸薺, amount: { value: 30, unit: g }, note: 切丁 }
  - { name: 紅蘿蔔, amount: { value: 30, unit: g }, note: 切丁 }
  - { name: 西生菜, amount: { value: 6, unit: 片 }, note: 取整葉修成圓片 }
  - { name: 乾冬粉, amount: { value: 25, unit: g } }
  - { name: 蒜末, amount: { value: 1, unit: 大匙 } }
  - { name: 薑末, amount: { value: 1, unit: 大匙 } }
  - { name: 鹽, amount: { value: 1, unit: 小匙 }, group: 調味 }
  - { name: 白胡椒粉, group: 調味, note: 少許 }
  - { name: 米酒, amount: { value: 15, unit: ml }, group: 調味 }
  - { name: 香油, amount: { value: 1, unit: 小匙 }, group: 調味 }
  - { name: 沙拉油, group: 調味, note: 炸冬粉、油條及炒餡用；來源未列用量 }
steps:
  - text: 雞肉、芹菜、油條、荸薺和紅蘿蔔分別切丁。
    image:
      src: ./step-1.webp
      alt: 木砧板上分別擺著雞肉丁、芹菜丁、油條丁、荸薺丁和紅蘿蔔丁
  - text: 西生菜去菜心，泡冷水 5 分鐘，在水中剝下整片葉子，再修成圓片。
    image:
      src: ./step-2.webp
      alt: 六片修成圓形的西生菜葉圍著一碗冷水擺放
  - text: 乾冬粉放入 190°C 油鍋，以大火炸約 10 秒，膨鬆後撈出瀝油、放入盤中。
    image:
      src: ./step-3.webp
      alt: 深色炒鍋中的乾冬粉在熱油裡膨成蓬鬆的白色絲團
  - text: 油條丁放入 180°C 油鍋，以中火回炸約 30 秒，撈起瀝油。
  - text: 鍋中加沙拉油，以小火炒香蒜末和薑末，放雞肉、芹菜、荸薺、紅蘿蔔，轉中火炒約 2 分鐘。
    image:
      src: ./step-5.webp
      alt: 深色炒鍋裡正拌炒雞肉丁、芹菜丁、荸薺丁與紅蘿蔔丁
  - text: 鍋中水分收乾後，拌入鹽、白胡椒粉、米酒和香油，再拌入油條丁，盛在炸冬粉上。
    image:
      src: ./step-6.webp
      alt: 深色炒鍋裡的雞肉丁、芹菜丁、荸薺丁和紅蘿蔔丁拌有金黃油條碎塊
  - text: 將炒好的雞鬆包入西生菜葉，排入盤中。
hero:
