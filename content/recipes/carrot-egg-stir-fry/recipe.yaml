title: 胡蘿蔔炒蛋
summary: 蛋裹在炒軟的胡蘿蔔粗絲上，拌入蒜香，做法只需五樣材料。
servings: 3
category: 非湯料理
draft: false
mealCandidate: true
vegetable: true
protein: true
timeMinutes: 15
tags:
  - 家常菜
  - 蛋料理
ingredients:
  - name: 胡蘿蔔
    amount:
      value: 370
      unit: g
    note: 約 1 根，去皮刨粗絲
  - name: 雞蛋
    amount:
      value: 3
      unit: 顆
  - name: 蒜頭
    amount:
      value: 2
      unit: 瓣
    note: 切末
  - name: 食用油
    amount:
      value: 15
      unit: ml
    group: 調味
  - name: 鹽
    amount:
      value: 3
      unit: g
    group: 調味
steps:
  - text: 將胡蘿蔔去皮，刨成粗絲；蒜頭切末，雞蛋備成蛋液。
    image:
      src: ./step-1.webp
      alt: 木砧板上分開放著胡蘿蔔粗絲、蒜末和菜刀，旁邊瓷碗盛著蛋液
  - text: 用中火熱鍋 30 秒，倒入食用油和蒜末。炒出香氣後放胡蘿蔔絲，炒到半軟時加鹽，接著炒軟。
    image:
      src: ./step-2.webp
      alt: 木柄炒鍋裡是炒軟的胡蘿蔔粗絲和細小蒜末
  - text: 把胡蘿蔔絲攤開，再將蛋液淋入鍋中，轉成大火。
  - text: 輕拌並翻動胡蘿蔔絲與蛋，等蛋液完全凝固就盛出。
    image:
      src: ./step-4.webp
      alt: 同一只木柄炒鍋中，胡蘿蔔粗絲與完全凝固的金黃蛋塊拌在一起
hero:
  src: ./hero.webp
