title: 紅燒獅子頭
summary: 豬後腿絞肉混入板豆腐與荸薺，做成四顆肉丸，與大白菜同燜。
servings: 4
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 40
tags: [家常菜]
ingredients:
  - { name: 豬後腿絞肉, amount: { value: 200, unit: g } }
  - { name: 板豆腐, amount: { value: 2, unit: 塊 }, note: 捏碎 }
  - { name: 荸薺, amount: { value: 2, unit: 顆 }, note: 拍碎擰乾 }
  - { name: 大白菜, amount: { value: 160, unit: g }, note: 切絲 }
  - {
      name: 蔥末,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，肉餡與爆香各用一半,
    }
  - {
      name: 薑末,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，肉餡與爆香各用一半,
    }
  - { name: 蛋白, amount: { value: 0.333, unit: 顆 }, note: 約 1/3 顆 }
  - {
      name: 太白粉,
      amount: { value: 5, unit: ml },
      note: 約 1 茶匙,
      group: 調味,
    }
  - {
      name: 鹽,
      amount: { value: 0.625, unit: ml },
      note: 約 1/8 茶匙,
      group: 調味,
    }
  - { name: 糖, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
  - {
      name: 素蠔油,
      amount: { value: 20, unit: ml },
      note: 肉餡用 5 ml、燜煮用 15 ml,
      group: 調味,
    }
  - {
      name: 白胡椒粉,
      amount: { value: 0.625, unit: ml },
      note: 約 1/8 茶匙,
      group: 調味,
    }
  - { name: 香油, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
  - { name: 水, note: 肉丸定型、汆燙白菜及燜煮用, group: 調味 }
steps:
  - text: 把荸薺裝進滷包袋，以刀背拍碎再擰乾水分；大白菜洗淨切絲。
    image:
      src: ./step-1.webp
      alt: 木砧板上分放切絲的大白菜、陶碗中的拍碎荸薺、滷包袋與菜刀
  - text: 把蛋白、5 ml 素蠔油、鹽、糖、白胡椒粉、太白粉，連同一半的蔥末和薑末加進豬後腿絞肉，攪拌均勻。
    image:
      src: ./step-2.webp
      alt: 陶碗中的生豬後腿絞肉與蛋白、蔥薑末和調味料拌勻
  - text: 捏碎板豆腐混進肉餡，再拌入荸薺，均分成四顆肉丸。
    image:
      src: ./step-3.webp
      alt: 陶碗中的生豬肉餡混有碎板豆腐和荸薺，旁邊分放四顆生肉丸
  - text: 燒滾一鍋水，下四顆肉丸煮到定型就撈起；接著把大白菜下熱水汆燙。
  - text: 鍋中加入香油與剩餘蔥末、薑末炒香，倒入約兩大碗水和 15 ml 素蠔油。
  - text: 湯汁煮滾後放入肉丸，燜煮 15 至 20 分鐘。加入大白菜煮軟，盛盤。
    image:
      src: ./step-6.webp
      alt: 敞口陶鍋中四顆獅子頭與煮軟的大白菜浸在淺褐色湯汁裡
hero:
  src: ./hero.webp
  alt: 白色陶碗中盛著四顆獅子頭，周圍有煮軟的大白菜和淺褐色湯汁
