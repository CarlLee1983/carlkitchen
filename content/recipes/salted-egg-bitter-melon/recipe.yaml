title: 鹹蛋苦瓜
summary: 苦瓜薄片先汆燙，再與切碎的熟鹹蛋快炒。苦瓜帶淡淡鹹香，適合當配飯的家常菜。
servings: 2
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 整條苦瓜切片汆燙後拌炒，一顆熟鹹蛋切碎用來裹味提鹹香。
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 15
tags: [家常菜]
ingredients:
  - { name: 苦瓜, amount: { value: 1, unit: 條 }, note: 去籽切薄片 }
  - { name: 熟鹹蛋, amount: { value: 1, unit: 顆 }, note: 切碎 }
  - { name: 青蔥, amount: { value: 1, unit: 支 }, note: 切絲 }
  - { name: 大蒜, amount: { value: 2, unit: 瓣 }, note: 切末 }
  - {
      name: 食用油,
      amount: { value: 30, unit: ml },
      note: 約 2 湯匙,
      group: 調味,
    }
  - { name: 鹽, note: 約 1/6 茶匙, group: 調味 }
  - { name: 糖, note: 約 1/4 茶匙, group: 調味 }
  - { name: 水, amount: { value: 30, unit: ml }, note: 約 2 湯匙, group: 調味 }
  - { name: 香油, amount: { value: 5, unit: ml }, note: 約 1 茶匙, group: 調味 }
steps:
  - text: 苦瓜去籽，挖除內側白膜後切成薄片。熟鹹蛋切碎，青蔥切絲，大蒜切末。
    image:
      src: ./step-1.webp
      alt: 木砧板上分開放著去籽的苦瓜薄片、切碎的熟鹹蛋、青蔥絲和蒜末，旁邊有一把菜刀
  - text: 煮滾一鍋水，放入苦瓜汆燙約 10 秒，撈起沖涼並瀝乾。
    image:
      src: ./step-2.webp
      alt: 不鏽鋼瀝水籃中盛著汆燙後瀝水的苦瓜薄片
  - text: 炒鍋燒熱後倒入食用油，放入青蔥和大蒜，以小火炒出香氣。
    image:
      src: ./step-3.webp
      alt: 炒鍋的油中有青蔥絲和蒜末，旁邊放著木鍋鏟
  - text: 加入苦瓜、熟鹹蛋、鹽、糖和水，轉中火拌炒約 30 秒，淋上香油後盛出。
    image:
      src: ./step-4.webp
      alt: 炒鍋中有苦瓜薄片與切碎的熟鹹蛋，表面裹著蛋黃與油，旁邊放著木鍋鏟
hero:
  src: ./hero.webp
  alt: 米白色瓷盤中盛著苦瓜薄片與切碎的熟鹹蛋，表面裹著金黃色蛋黃，夾雜青蔥絲
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 分開擺放的苦瓜薄片、切碎的熟鹹蛋、青蔥絲和蒜末，旁邊有分裝的食用油、鹽、糖、水和香油
tip: 苦瓜內側白膜挖得乾淨一些，再汆燙約 10 秒，可減少苦味。
