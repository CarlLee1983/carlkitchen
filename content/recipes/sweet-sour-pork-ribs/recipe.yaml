tip: 排骨裹粉後靜置 3 分鐘待粉回潮再下鍋炸，粉皮不易脫落；青椒最後與排骨同時下鍋快速翻裹即起鍋，能保持青椒的翠綠清脆與排骨的酥脆口感。
