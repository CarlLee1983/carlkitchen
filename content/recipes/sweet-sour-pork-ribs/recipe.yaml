title: 家常糖醋排骨
summary: 豬小排切適口塊抓醃入味，均勻沾裹地瓜粉入油鍋炸至表皮金黃酥脆、肉質軟嫩，熱鍋炒香洋蔥塊、青椒塊與紅蘿蔔片，調入經典番茄醬、白醋與糖熬煮成紅亮糖醋醬，倒入酥排骨翻勻裹芡，酸甜適口、外酥裡嫩。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: 以豬小排油炸裹糖醋醬汁為唯一肉類主角，佐以青椒、洋蔥配色，屬於肉類料理。
