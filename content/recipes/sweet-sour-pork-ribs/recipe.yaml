steps:
  - text: 小排骨加少許醬油、米酒醃漬 15 分鐘，表面均勻裹上一層地瓜粉靜置回潮；洋蔥、青椒切小塊；胡蘿蔔切薄片；蒜頭拍扁備用。
    image:
      src: ./step-1.webp
      alt: 小排骨加少許醬油、米酒醃漬 15 分鐘，表面均勻裹上一層地瓜粉靜置回潮；洋蔥、青椒切小塊；胡蘿蔔切薄
  - text: 起油鍋加熱至 170°C，放入排骨以中小火炸約 4 分鐘至熟透，再轉大火炸 1 分鐘逼油至表皮金黃硬脆後撈起瀝乾油分。
  - text: 另取鍋加少許油爆香蒜頭，加入洋蔥塊與胡蘿蔔片翻炒，倒入番茄醬、白醋、糖與少許水煮滾，淋入太白粉水勾薄芡成紅亮糖醋醬。
    image:
      src: ./step-3.webp
      alt: 另取鍋加少許油爆香蒜頭，加入洋蔥塊與胡蘿蔔片翻炒，倒入番茄醬、白醋、糖與少許水煮滾，淋入太白粉水勾薄
  - text: 倒入炸好的酥排骨與青椒片，大火快速翻炒數秒讓每塊排骨均勻裹滿醬汁即可盛盤享用。
