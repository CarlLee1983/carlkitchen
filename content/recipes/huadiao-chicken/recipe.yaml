title: 花雕雞
summary: 依核准食譜指南製作之經典家常花雕雞，風味道地鮮明。
servings: 4
category: 非湯料理
dishKinds: [meat]
classificationReason: "雞肉切塊以濃醇花雕酒及特調醬汁燜煮收汁，肉類主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 30
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 仿土雞, amount: { value: 1.0, unit: g }, note: 原料標示 1/2隻 }
  - { name: 紅蔥頭, amount: { value: 5.0, unit: g }, note: 原料標示 5粒 }
  - { name: 蒜仁, amount: { value: 5.0, unit: g }, note: 原料標示 5粒 }
  - { name: 乾辣椒, amount: { value: 5.0, unit: g }, note: 原料標示 5條 }
  - { name: 芹菜, amount: { value: 30.0, unit: g }, note: 原料標示 30公克 }
  - { name: 洋蔥, amount: { value: 30.0, unit: g }, note: 原料標示 30公克 }
  - { name: 黑木耳, amount: { value: 50.0, unit: g }, note: 原料標示 50公克 }
  - { name: A.辣豆瓣醬, amount: { value: 1.0, unit: g }, note: 原料標示 1茶匙 }
  - { name: 花雕酒, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 蠔油, amount: { value: 2.0, unit: g }, note: 原料標示 2茶匙 }
  - { name: 麻醬, amount: { value: 1.0, unit: g }, note: 原料標示 1/2茶匙 }
  - { name: 糖, amount: { value: 1.0, unit: g }, note: 原料標示 1/2茶匙 }
  - { name: 水, amount: { value: 1.0, unit: g }, note: 原料標示 1碗 }
  - { name: 雞粉, amount: { value: 1.0, unit: g }, note: 原料標示 1茶匙 }
  - { name: B.花雕酒, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
steps:
  - text: "雞肉剁小塊，加入所有醃料拌勻，醃漬約1小時，備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之花雕雞主要材料
  - text: "紅蔥頭及蒜仁切片；乾辣椒切小段；洋蔥切小塊；芹菜切段；木耳切小片，備用。"
  - text: "熱鍋，放入2大匙沙拉油，將作法1的雞塊煎至兩面金黃後盛出，備用。"
  - text: "同作法3原鍋，放入蒜片、紅蔥片、乾辣椒段、洋蔥塊以小火炸至金黃，再加入作法3的雞塊及所有調味料A炒勻，轉小火蓋上鍋蓋燜煮約15分鐘。"
  - text: "接著開蓋加入芹菜段、木耳片拌炒1分鐘，再淋入1大匙花雕酒炒勻後盛入小鍋中即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味花雕雞
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之花雕雞各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
