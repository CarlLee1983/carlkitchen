  alt: 料理食材整齊擺放於木砧板上
tip: 雞腿肉厚處劃兩刀可使醃料快速滲入內部且受熱更均勻；出爐刷上一層香油能鎖住表皮水分並讓烤雞腿更加油亮焦香。
