steps:
  - text: 將醬油、糖、米酒與肉桂粉倒入大碗中攪拌均勻，調製成香濃醃料。
    image:
      src: ./step-1.webp
      alt: 將醬油、糖、米酒與肉桂粉倒入大碗中攪拌均勻，調製成香濃醃料。
  - text: 雞腿洗淨拭乾水分，在肉質較厚處劃上兩刀，放入醃料中充分抓勻，靜置醃漬 20 分鐘。
    image:
      src: ./step-2.webp
      alt: 雞腿洗淨拭乾水分，在肉質較厚處劃上兩刀，放入醃料中充分抓勻，靜置醃漬 20 分鐘。
  - text: 從醃料中取出雞腿瀝乾表面醬汁，於雞腿外皮均勻抹上一層薄薄的胡椒鹽。
  - text: 烤箱預熱至 200 度，將雞腿皮面朝上擺入烤盤，送入烤箱以 200 度烘烤 30 分鐘至表面金黃焦香、骨肉熟透。
  - text: 將烤好的雞腿取出，外皮趁熱均勻刷上香油提亮增香，即可盛盤上桌。
