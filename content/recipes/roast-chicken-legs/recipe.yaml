title: 香烤雞腿
summary: 大雞腿洗淨劃刀，以醬油、糖、米酒與肉桂粉醃漬入味，抹上胡椒鹽送入烤箱高溫烘烤至外皮金黃酥脆、肉質軟嫩多汁，出爐刷上香油增色提香。
servings: 3
category: 非湯料理
draft: false
