title: 紅燒家常豆腐
summary: 厚切板豆腐入油鍋慢火煎至兩面金黃微焦硬挺，爆香蒜末、生薑絲與肉絲，倒入豆腐塊與甘醇醬油、糖、白胡椒煨煮入味，青蔥段與辣椒絲收汁勾薄芡，豆腐外酥內軟、吸飽鹹甜肉汁，經典家常代表菜。
servings: 3
category: 非湯料理
dishKinds: [egg-bean, meat]
classificationReason: 以板豆腐切片煎黃為主角，搭配少許豬肉絲與辛香料紅燒，屬於蛋豆與肉類並陳料理。
