steps:
  - text: 板豆腐切成 1 公分厚、3 公分均勻方塊片，以紙巾輕壓吸乾表面水氣；豬肉切細絲；生薑切絲、青蔥切段、紅辣椒切斜片備用。
    image:
      src: ./step-1.webp
      alt: 板豆腐切成 1 公分厚、3 公分均勻方塊片，以紙巾輕壓吸乾表面水氣；豬肉切細絲；生薑切絲、青蔥切段、
  - text: 平底鍋倒入植物油加熱，放入板豆腐片以中小火慢煎約 3 分鐘，翻面續煎至兩面皆呈現金黃微焦微酥外皮，盛起備用。
    image:
      src: ./step-2.webp
      alt: 平底鍋倒入植物油加熱，放入板豆腐片以中小火慢煎約 3 分鐘，翻面續煎至兩面皆呈現金黃微焦微酥外皮，盛
  - text: 原鍋留少許底油，放入薑絲與紅辣椒片爆香，加入豬肉絲翻炒至肉色轉白散開。
  - text: 倒回煎好的金黃豆腐塊，加入醬油、細砂糖與水煮滾，轉小火加蓋煨煮 3 分鐘讓豆腐充分吸附醬汁，放入蔥段，淋入太白粉水勾薄芡收汁，起鍋淋上香油翻勻即可盛盤。
