tip: 板豆腐煎之前用紙巾吸乾水分，下鍋就不會油爆，且能迅速煎出焦香金黃硬皮；煨煮時小火燜三分鐘讓豆腐孔隙充分吸收醬汁，咬下去多汁入味。
