title: 鮮蝦蒸釀豆腐
summary: 板豆腐切厚長方塊略挖小槽，填入細絞肉與鮮蝦泥拌製的鮮香肉餡，抹成飽滿小丘，表面點綴紅辣椒片，入平底鍋微煎底層定型，加高湯小火煨煮蒸透，豆香濃郁、肉餡鮮嫩多汁。
servings: 3
category: 非湯料理
dishKinds: [seafood, egg-bean]
classificationReason: 以板豆腐挖槽填入鮮蝦絞肉餡蒸煮為主角，蛋豆類豆腐與海鮮蝦肉並重，屬於蛋豆與海鮮料理。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 25
tags: [家常菜, 釀豆腐, 豆腐, 海鮮]
aliases: [蝦仁釀豆腐, 清蒸釀豆腐]
ingredients:
  - name: 盒裝豆腐
    amount:
      value: 1
      unit: 塊
    note: 約 300 g 切 6 塊厚塊
  - name: 豬絞肉
    amount:
      value: 100
      unit: g
    note: 細絞肉
  - name: 蝦仁
    amount:
      value: 50
      unit: g
    note: 剁成粗蝦泥
  - name: 青蔥
    amount:
      value: 20
      unit: g
    note: 切細蔥花
  - name: 生薑
    amount:
      value: 10
      unit: g
    note: 切薑末
  - name: 紅辣椒
    amount:
      value: 1
      unit: 根
    note: 切 6 片小片飾頂
  - name: 太白粉
    amount:
      value: 10
      unit: g
    note: 拍豆腐槽與拌餡
    group: 調味
  - name: 醬油
    amount:
      value: 15
      unit: ml
    note: 約 1 大匙
    group: 調味
  - name: 米酒
    amount:
      value: 15
      unit: ml
    note: 約 1 大匙
    group: 調味
  - name: 鹽
    amount:
      value: 2
      unit: g
    note: 約半茶匙
    group: 調味
steps:
  - text: 豬絞肉與剁碎蝦泥混合，加入蔥花、薑末、少許鹽、糖、米酒與太白粉攪打至出筋產生黏性成蝦肉餡；豆腐切成 6 等份厚塊，表面擦乾並拍上一層薄薄太白粉。
    image:
      src: ./step-1.webp
      alt: 攪打出黏性的蝦肉餡與拍上薄薄太白粉的厚塊豆腐
  - text: 將蝦肉餡均勻鑲在每塊豆腐表面抹成飽滿小丘狀，頂端各貼上一片紅辣椒片點綴。
    image:
      src: ./step-2.webp
      alt: 將蝦肉餡均勻鑲在每塊豆腐表面抹成飽滿小丘狀，頂端各貼上一片紅辣椒片點綴。
  - text: 平底鍋倒入少許油燒熱，放入釀豆腐以小火煎至底面金黃定型，注入醬油、米酒與水約 100 ml 煮滾。
  - text: 蓋上鍋蓋以中小火燜煨燒煮約 10 分鐘至肉餡全熟透透，開蓋淋入剩餘湯汁即可盛盤享用。
