title: 絲瓜炒蛤蜊
summary: 依核准食譜指南製作之經典家常絲瓜炒蛤蜊，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [seafood, vegetable]
classificationReason: "鮮甜絲瓜與鮮活蛤蜊燜煮出鮮甜湯汁，海鮮與蔬菜雙主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 絲瓜, amount: { value: 1.0, unit: g }, note: 原料標示 1條 }
  - { name: 蛤蜊, amount: { value: 250.0, unit: g }, note: 原料標示 250公克 }
  - { name: 蒜頭, amount: { value: 3.0, unit: g }, note: 原料標示 3粒 }
  - { name: 薑, amount: { value: 15.0, unit: g }, note: 原料標示 15公克 }
  - { name: 雞粉, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 香油, amount: { value: 100, unit: g }, note: 原料標示 少許 }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 少許 }
steps:
  - text: "蛤蜊放入冷水中，加入1小匙鹽,，讓蛤蜊慢慢吐沙，再撈起瀝乾備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之絲瓜炒蛤蜊主要材料
  - text: "絲瓜去皮再切成小條狀備用。"
  - text: "蒜頭與薑都切成片狀備用。"
  - text: "熱鍋，加入1大匙沙拉油，放入作法3的材料以中火爆香。"
  - text: "加入作法1、2的所有材料與所有調味料，以中火翻炒均勻至蛤蜊開口即可。"
hero:
  src: ./hero.webp
  alt: 盤中盛裝熱氣騰騰之美味絲瓜炒蛤蜊
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 備料桌上整齊擺放之絲瓜炒蛤蜊各項新鮮食材
tip: 烹調過程中注意火候掌握與時間控制，食材受熱均勻能保有最佳口感與香氣。
