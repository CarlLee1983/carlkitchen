title: 蒜燒黃魚
summary: 依核准食譜指南製作之經典家常蒜燒黃魚，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [seafood]
classificationReason: "整尾黃魚煎至兩面金黃後佐大量蒜瓣醬油燒煮入味，海鮮主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 25
tags: [家常菜, 台灣料理]
ingredients:
  - { name: 黃魚, amount: { value: 1.0, unit: g }, note: 原料標示 1條 }
  - { name: 蒜仁, amount: { value: 10.0, unit: g }, note: 原料標示 10顆 }
  - { name: 蔥段, amount: { value: 1.0, unit: g }, note: 原料標示 1根 }
  - { name: 蠔油, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 醬油, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 番茄醬, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
  - { name: 米酒, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 鎮江醋, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 水, amount: { value: 400.0, unit: g }, note: 原料標示 400cc }
  - { name: 香油, amount: { value: 1.0, unit: g }, note: 原料標示 1大匙 }
  - { name: 辣油, amount: { value: 1.0, unit: g }, note: 原料標示 1小匙 }
steps:
  - text: "蒜仁洗淨，去蒂去尾，再取一油鍋用150℃油溫炸至金黃色，撈起備用。"
    image:
      src: ./step-1.webp
      alt: 備料桌上準備妥當並切整齊之蒜燒黃魚主要材料
  - text: "黃魚洗淨，去鰓去鱗，再取作法1的油鍋用160℃油溫，略炸撈起備用。"
  - text: "取作法2的油鍋留少許油，將蔥段放入炒香，再加入作法1的蒜仁、作法2的黃魚及所有調味料，小火煮至湯汁略乾即可。"
