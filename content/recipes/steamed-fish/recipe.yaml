title: 清蒸魚
summary: 整尾鱸魚大火蒸熟，鋪上蔥、薑、辣椒絲淋熱油，再澆蠔油醬汁。魚肉細嫩、醬汁鹹甜，適合配飯。
servings: 4
category: 非湯料理
dishKinds: [seafood]
classificationReason: 整尾鱸魚蒸熟後淋熱油與蠔油醬，蔥薑辣椒只作去腥和提香。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 30
tags: [家常菜]
aliases: [清蒸鱸魚]
ingredients:
  - { name: 鱸魚, amount: { value: 1, unit: 尾 }, note: 整尾，洗淨 }
  - { name: 青蔥, amount: { value: 4, unit: 支 }, note: 2 支蒸魚用、2 支切絲 }
  - {
      name: 薑,
      amount: { value: 30, unit: g },
      note: 10 g 切片蒸魚用、20 g 切絲,
    }
  - { name: 辣椒, amount: { value: 1, unit: 支 }, note: 切絲 }
  - {
      name: 米酒,
      amount: { value: 15, unit: ml },
      note: 約 1 湯匙,
      group: 調味,
    }
  - {
      name: 蠔油,
      amount: { value: 15, unit: ml },
      note: 約 1 湯匙,
      group: 調味,
    }
  - {
      name: 醬油,
      amount: { value: 30, unit: ml },
      note: 約 2 湯匙,
      group: 調味,
    }
  - { name: 水, amount: { value: 50, unit: ml }, group: 調味 }
  - { name: 糖, amount: { value: 12, unit: g }, note: 約 1 湯匙, group: 調味 }
  - { name: 白胡椒粉, note: 約 1/6 茶匙, group: 調味 }
  - { name: 食用油, amount: { value: 50, unit: ml }, group: 調味 }
steps:
  - text: 鱸魚洗淨，從背鰭靠魚頭的地方下刀，沿著魚背直劃到魚尾，切到刀碰到中間的大骨為止。
    image:
      src: ./step-1.webp
      alt: 木砧板上一尾生鱸魚，魚背從頭後方到尾巴劃開一道長切口，露出淡粉色魚肉，旁邊放著一把菜刀
  - text: 蒸盤上橫放一支筷子，把魚切口那一面朝下架在筷子上，讓蒸氣能從魚身下方通過。
    image:
      src: ./step-2.webp
      alt: 白色橢圓瓷盤上橫放一支木筷，一尾生鱸魚順著盤長邊架在筷子上，魚身微微離開盤面
  - text: 取 2 支青蔥切段後拍扁，10 g 薑切片，一起鋪在魚身上，再淋上米酒。
    image:
      src: ./step-3.webp
      alt: 白色橢圓瓷盤中架在筷子上的生鱸魚，魚身鋪著幾段拍扁的青蔥和三片薑片，盤底有一層清澈的米酒
  - text: 放進蒸籠，大火蒸 15 分鐘到魚肉熟透。取出後把魚移到乾淨的盤子，蔥段、薑片和蒸出的湯汁都不要。
    image:
      src: ./step-4.webp
      alt: 炒鍋上架著打開的竹蒸籠，籠中白瓷盤盛著蒸熟的鱸魚，魚身鋪著蔥段與薑片，冒著熱氣，蒸籠蓋放在一旁
  - text: 剩下的 2 支青蔥、20 g 薑和辣椒都切成細絲，鋪在魚身上。
    image:
      src: ./step-5.webp
      alt: 木砧板上分成三堆的細絲：青蔥絲、淺黃色薑絲和紅辣椒絲，砧板右側放著一把菜刀
  - text: 炒鍋倒入食用油燒熱，舀起熱油淋在蔥薑絲上。
    image:
      src: ./step-6.webp
      alt: 白瓷盤中的蒸鱸魚鋪滿青蔥、薑和紅辣椒細絲，一支湯杓正把熱油淋在絲料上，後方是盛著油的炒鍋
  - text: 炒鍋放入蠔油、醬油、水、糖和白胡椒粉，煮到滾後淋在魚身上就完成。
hero:
  src: ./hero.webp
  alt: 白色橢圓瓷盤中盛著一整尾清蒸鱸魚，魚身鋪著青蔥、薑和紅辣椒細絲，盤底有一層淺褐色醬汁
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 一尾鱸魚、四支青蔥、一塊薑、一支紅辣椒，以及分裝在小瓶與小碟中的米酒、蠔油、醬油、水、糖、白胡椒粉和食用油
tip: 魚身較小時，蒸的時間可縮短到 10 分鐘左右。
