title: 糖醋燒茄
summary: 茄子先加水燜軟，再與番茄、青椒拌炒，裹上收濃的糖醋醬汁。
servings: 4
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 茄子 250 g、番茄 150 g 與青椒 100 g 分別炒燜後合拌糖醋汁，三種蔬菜構成成品。
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 35
ingredients:
  - { name: 茄子, amount: { value: 250, unit: g }, note: 約 2 條 }
  - { name: 番茄, amount: { value: 150, unit: g }, note: 約 1 顆 }
  - { name: 青椒, amount: { value: 100, unit: g }, note: 約 1 顆 }
  - { name: 大蒜, amount: { value: 4, unit: 瓣 } }
  - { name: 青蔥, amount: { value: 2, unit: 支 } }
  - {
      name: 水,
      amount: { value: 180, unit: ml },
      note: 150 ml 燜茄子、30 ml 燜番茄,
      group: 調味,
    }
  - {
      name: 食用油,
      amount: { value: 45, unit: ml },
      note: 30 ml 炒茄子、15 ml 炒香料,
      group: 調味,
    }
  - { name: 醬油, amount: { value: 15, unit: ml }, group: 調味 }
  - { name: 白醋, amount: { value: 15, unit: ml }, group: 調味 }
  - {
      name: 糖,
      amount: { value: 24, unit: g },
      note: 約 2 湯匙，公制重量為推估,
      group: 調味,
    }
  - { name: 番茄醬, amount: { value: 30, unit: ml }, note: 2 湯匙, group: 調味 }
  - {
      name: 鹽,
      amount: { value: 1, unit: g },
      note: 約 1/4 茶匙，公制重量為推估,
      group: 調味,
    }
  - {
      name: 太白粉,
      amount: { value: 1, unit: g },
      note: 約 1/4 茶匙，公制重量為推估,
      group: 調味,
    }
steps:
  - text: 將大蒜切碎，青蔥切小段，番茄與青椒切塊。切除茄子蒂頭，再切成滾刀塊。
    image:
      src: ./step-1.webp
      alt: 木砧板上分開放著帶皮茄子滾刀塊、番茄塊、青椒塊、蒜末與青蔥小段，旁邊有菜刀
  - text: 將醬油、白醋、糖、番茄醬、鹽與太白粉拌成醬汁，放旁邊備用。
    image:
      src: ./step-2.webp
      alt: 米白色小碗中拌勻的紅褐色糖醋醬汁
  - text: 將 30 ml 食用油倒入炒鍋，熱油後放入茄子與 150 ml 水拌勻，加蓋以中火燜 3 分鐘。
  - text: 盛出燜軟的茄子，放旁邊備用。
    image:
      src: ./step-4.webp
      alt: 米白色淺碗中盛著已燜軟的帶皮茄子滾刀塊，尚未加入糖醋醬汁
  - text: 將剩餘食用油倒入鍋中，熱油後炒香大蒜、青蔥。加入番茄與剩餘的水，加蓋以中小火燜 5 至 6 分鐘至番茄軟化。
    image:
      src: ./step-5.webp
      alt: 深灰色炒鍋中是軟化的番茄塊、蒜末與青蔥小段，鍋底留有番茄湯汁
  - text: 加入青椒拌炒 1 至 2 分鐘。
  - text: 放回茄子拌勻，倒入糖醋醬汁，以中火翻炒至湯汁濃稠。
    image:
      src: ./step-7.webp
      alt: 同一只深灰色炒鍋中，帶皮茄子、番茄與青椒裹著濃稠紅褐色醬汁，夾有蒜末和青蔥小段
hero:
  src: ./hero.webp
  alt: 米白色陶盤中盛著帶皮茄子滾刀塊、軟化的番茄塊與青椒塊，裹有紅褐色糖醋醬汁
ingredientsPhoto:
