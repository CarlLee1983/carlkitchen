title: 豉汁蒸排骨
summary: 精選新鮮豬小排剁成適口小塊流水沖洗去血水擦乾，黑豆豉粗剁泡發，與香脆炸金蒜末、生蒜蓉、蠔油、米酒、白糖與少許太白粉充分抓勻醃漬入味，鋪平盤中入大火蒸籠蒸二十分鐘，肉質滑嫩多汁、豉香濃郁醇厚、骨香肉滑、經典茶樓名點。
servings: 3
category: 非湯料理
dishKinds: [meat]
classificationReason: 以豬小排拌黑豆豉蒜蓉蒸熟為唯一肉類主角，屬於肉類料理。
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 30
tags: [蒸排骨, 豆豉, 港式點心, 家常菜, 肉類料理]
aliases: [港式豉汁蒸排骨, 豆豉蒸小排]
ingredients:
  - name: 豬小排
    amount:
      value: 350
      unit: g
    note: 剁 2 公分小方塊洗淨沖水吸乾水分
  - name: 黑豆豉
    amount:
      value: 20
      unit: g
    note: 溫水泡軟粗剁碎
  - name: 大蒜
    amount:
      value: 25
      unit: g
    note: 去皮切細蒜碎一半炸金黃一半生蒜
  - name: 青蔥
    amount:
      value: 1
      unit: 根
    note: 切細蔥花出鍋飾頂
  - name: 紅辣椒
    amount:
      value: 1
      unit: 根
    note: 切小圓圈增色
  - name: 蠔油
    amount:
      value: 15
      unit: ml
    note: 約 1 大匙增甘醇底味
    group: 調味
  - name: 醬油
    amount:
      value: 10
      unit: ml
    note: 約 2 茶匙
    group: 調味
  - name: 米酒
    amount:
      value: 15
      unit: ml
    note: 約 1 大匙去腥
    group: 調味
  - name: 細砂糖
    amount:
      value: 5
      unit: g
    note: 約 1 茶匙提鮮
    group: 調味
