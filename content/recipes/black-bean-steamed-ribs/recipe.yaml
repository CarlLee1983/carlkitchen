    amount:
      value: 5
      unit: ml
    note: 少許提香
    group: 調味
steps:
  - text: 豬小排剁成適口小塊，用流水沖洗約 15 分鐘洗去骨血，用廚房紙巾徹底吸乾水分；黑豆豉洗淨泡軟粗剁碎；大蒜一半炸至金黃酥香、一半保留生蒜末；紅辣椒切圈備用。
    image:
      src: ./step-1.webp
      alt: 豬小排剁成適口小塊，用流水沖洗約 15 分鐘洗去骨血，用廚房紙巾徹底吸乾水分；黑豆豉洗淨泡軟粗剁碎；
  - text: 小排塊放入大碗中，加入生熟蒜末、黑豆豉碎、紅辣椒圈、蠔油、醬油、米酒、細砂糖、香油與太白粉，用手充分抓拌均勻抓至起膠黏稠，醃漬 20 分鐘。
    image:
      src: ./step-2.webp
      alt: 小排塊放入大碗中，加入生熟蒜末、黑豆豉碎、紅辣椒圈、蠔油、醬油、米酒、細砂糖、香油與太白粉，用手充分
  - text: 將醃好的排骨平鋪於淺蒸盤中，盡量鋪平不重疊，放入水滾蒸鍋中，蓋上鍋蓋大火蒸煮 20 分鐘至肉質軟嫩熟透熟汁豐沛。
  - text: 取出蒸盤，表面撒上青翠細蔥花，即可熱騰騰端上桌享用。
