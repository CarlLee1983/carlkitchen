tip: 排骨剁小塊後用流水沖去殘留血水並徹底吸乾水分，是蒸排骨肉質鮮甜不腥、色澤潔白不發黑的關鍵秘訣；平鋪於盤中蒸二十鐘，受熱均勻肉質最為彈滑多汁。
