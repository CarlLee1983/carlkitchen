title: 金針菇炒絲瓜
summary: 當令新鮮翠綠絲瓜削去粗皮切滾刀厚塊，金針菇洗淨切除根部，熱油鍋爆香薑絲與蒜末，倒入絲瓜塊大火快炒一分鐘，加入鮮脆金針菇與少許熱水加蓋燜煮兩分鐘，絲瓜清甜多汁、金針菇滑嫩爽脆、湯汁翠綠澄澈、天然鮮美清甜。
servings: 3
category: 非湯料理
dishKinds: [vegetable]
classificationReason: 以絲瓜為主要蔬菜主角，搭配金針菇清炒燜煮，屬於純蔬菜料理。
draft: false
mealCandidate: true
vegetable: true
protein: false
timeMinutes: 10
tags: [絲瓜, 金針菇, 熱炒, 家常青菜, 素食友善]
aliases: [金針菇燴絲瓜, 絲瓜炒金針菇]
ingredients:
  - name: 絲瓜
    amount:
      value: 350
      unit: g
    note: 約 1 條去粗皮切滾刀厚塊
  - name: 金針菇
    amount:
      value: 150
      unit: g
    note: 去除根部洗淨撕成小束
  - name: 生薑
    amount:
      value: 15
      unit: g
    note: 切細嫩薑絲
  - name: 大蒜
    amount:
      value: 10
      unit: g
    note: 切細碎末
  - name: 米酒
