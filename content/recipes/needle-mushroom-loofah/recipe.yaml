steps:
  - text: 絲瓜削去外層粗硬深綠表皮，保留薄薄翠綠內皮，切成適口滾刀厚塊；金針菇切除底部木質化部位，洗淨撕成小束對切半；生薑切細絲、大蒜切碎末備用。
    image:
      src: ./step-1.webp
      alt: 木砧板上放著部分切塊的絲瓜、整束金針菇、生薑絲與大蒜末。
  - text: 炒鍋加熱倒入植物油，放入薑絲與蒜碎以中小火爆炒出清雅香氣。
  - text: 倒入絲瓜厚塊轉大火快速翻炒約 1 分鐘，倒入金針菇束，淋入米酒與 30 ml 熱水，蓋上鍋蓋以中火燜煮約 2 分鐘至絲瓜變得晶瑩軟嫩釋出清甜原汁。
    image:
      src: ./step-3.webp
      alt: 玻璃鍋蓋下可見絲瓜與金針菇，鍋中湯汁冒泡，鍋蓋凝著水珠。
  - text: 掀開鍋蓋，加入鹽與白胡椒粉輕輕翻炒均勻入味，絲瓜翠綠鮮嫩、金針菇吸飽絲瓜甘甜原汁，立即盛盤即可享用。
hero:
  src: ./hero.webp
  alt: 盛盤完成的金針菇炒絲瓜
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 料理食材整齊擺放於木砧板上
tip: 絲瓜去皮時輕輕刨去外層粗皮保留薄薄翠綠層，切滾刀厚塊入鍋燜煮兩分鐘剛好熟透多汁，且絲瓜水色清亮翠綠不氧化發黑；加鹽在起鍋前調味能保持絲瓜鮮甜爽口。
