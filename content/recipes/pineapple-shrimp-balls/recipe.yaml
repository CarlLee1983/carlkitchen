title: 鳳梨蝦球
summary: 蝦仁裹粉炸酥後，與鳳梨片拌入美乃滋檸檬醬汁。
servings: 3
category: 非湯料理
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 25
tags: [家常菜, 海鮮]
ingredients:
  - { name: 草蝦仁, amount: { value: 300, unit: g } }
  - { name: 鳳梨片, amount: { value: 80, unit: g } }
  - {
      name: 鹽,
      amount: { value: 0.83, unit: ml },
      note: 約 1/6 茶匙，調味 A,
      group: 調味,
    }
  - {
      name: 蛋白,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，調味 A,
      group: 調味,
    }
  - {
      name: 太白粉,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，調味 A,
      group: 調味,
    }
  - {
      name: 美乃滋,
      amount: { value: 45, unit: ml },
      note: 約 3 大匙，調味 B,
      group: 調味,
    }
  - {
      name: 細砂糖,
      amount: { value: 12, unit: g },
      note: 約 1 大匙，調味 B,
      group: 調味,
    }
  - {
      name: 檸檬汁,
      amount: { value: 15, unit: ml },
      note: 約 1 大匙，調味 B,
      group: 調味,
    }
  - {
      name: 太白粉,
      amount: { value: 1, unit: 碗 },
      note: 裹蝦仁用，調味 C,
      group: 調味,
    }
  - { name: 炸油, note: 適量，來源未標用量, group: 調味 }
steps:
  - text: 蝦仁洗好後把水瀝乾，沿背部下刀切開約三分之一深，加入調味 A 抓勻，醃約 2 分鐘。
    image:
      src: ./step-1.webp
      alt: 白瓷碗中盛著背部劃開的生蝦仁，表面裹著一層透亮的蛋白醃料
  - text: 美乃滋、細砂糖和檸檬汁放進碗裡攪勻，做成醬汁。
    image:
      src: ./step-2.webp
      alt: 白瓷碗中盛著攪拌均勻、質地滑順的淡乳黃色醬汁
  - text: 炸油燒到約 180°C。蝦仁沾滿調味 C 的太白粉，下鍋炸約 2 分鐘，外皮酥脆就撈出瀝油。
    image:
      src: ./step-3.webp
      alt: 不鏽鋼瀝油架上排著十多顆炸好的蝦球，外層是酥脆的金黃薄粉
  - text: 另取一鍋，放進炸好的蝦仁和鳳梨片，倒入醬汁翻拌均勻。
hero:
  src: ./hero.webp
  alt: 白色圓瓷盤中盛著裹薄粉炸成金黃的蝦球，和淡黃色鳳梨塊拌在一起，表面淋著乳白色醬汁
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 一盤生的去殼蝦仁、一盤鳳梨塊、一大碗太白粉，以及分裝在小碟中的鹽、蛋白、太白粉、美乃滋、細砂糖、檸檬汁，旁邊一小瓶炸油
