title: 甘甜剝皮辣椒雞湯
summary: 土雞切塊滾水汆燙洗淨，放入湯鍋注入清水、老薑片與蔥段慢火細燉，倒入甘醇花蓮剝皮辣椒湯汁一同燜煮，起鍋前投入完整翠綠剝皮辣椒滾煮數分鐘，湯頭甘醇微辣透出自然果甜、雞肉軟嫩多汁、暖身開胃。
servings: 4
category: 湯
dishKinds: []
classificationReason: 湯品不設料理主角與配餐角色，以剝皮辣椒與甘甜醬汁同土雞塊慢燉成花蓮代表性家常湯品。
