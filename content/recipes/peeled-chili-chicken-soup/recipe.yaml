tip: 剝皮辣椒的精華在於罐內的醃甘醬汁，先下醬汁慢燉雞肉能使甜味充分滲入肉質；完整的辣椒在起鍋前 5 分鐘再下，能保留辣椒軟脆口感而不致煮爛碎化。
