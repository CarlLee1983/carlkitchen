steps:
  - text: 土雞肉剁成適口大小，放入滾水中加蔥段、薑片汆燙 2 分鐘去除血水浮沫，撈起用清水沖淨瀝乾備用。
    image:
      src: ./step-1.webp
      alt: 土雞肉剁成適口大小，放入滾水中加蔥段、薑片汆燙 2 分鐘去除血水浮沫，撈起用清水沖淨瀝乾備用。
  - text: 取湯鍋注入 1000 ml 清水煮滾，倒入剝皮辣椒罐頭的醃湯汁、汆燙好的雞肉塊、薑片與米酒。
  - text: 大火煮沸後撈除表面少許浮沫，轉中小火蓋上鍋蓋燜燉約 25 分鐘至雞肉軟嫩、湯頭吸收甘甜香氣。
    image:
      src: ./step-3.webp
      alt: 大火煮沸後撈除表面少許浮沫，轉中小火蓋上鍋蓋燜燉約 25 分鐘至雞肉軟嫩、湯頭吸收甘甜香氣。
  - text: 開蓋放入 8 條完整的剝皮辣椒，繼續小火煮約 3 至 5 分鐘讓辣香融合，嚐味後依個人喜好加入少許鹽微調，即可盛鍋趁熱享用。
