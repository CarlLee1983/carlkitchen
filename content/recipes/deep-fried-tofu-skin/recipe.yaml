title: 炸百頁豆腐
summary: 依核准食譜指南製作之經典家常炸百頁豆腐，風味道地鮮明。
servings: 3
category: 非湯料理
dishKinds: [egg-bean]
classificationReason: "百頁豆腐切塊油炸至蓬鬆酥香，蛋豆主角。"
draft: false
mealCandidate: true
vegetable: false
protein: true
timeMinutes: 15
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 百頁豆腐, amount: { value: 100, unit: g }, note: 原料標示 150公克 }
  - { name: 胡椒鹽, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
steps:
  - text: "將百頁豆腐洗淨瀝乾水分後，切塊狀備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的炸百頁豆腐主要材料
  - text: "將作法1放入180℃的熱油中以中火炸約4分鐘，至表皮呈酥脆狀後，撈出瀝油，並趁熱撒上胡椒鹽即可。" 
