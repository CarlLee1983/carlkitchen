tip: 將一半大蒜仁用油小火炸至金黃，另一半保持生蒜一同入鍋慢燉，炸蒜帶來濃醇撲鼻香氣、生蒜釋放清甜滋味，雙重蒜香融合使湯頭層次豐富迷人。
