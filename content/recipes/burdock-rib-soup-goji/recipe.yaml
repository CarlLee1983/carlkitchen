title: 枸杞牛蒡排骨湯
summary: 依核准食譜指南製作之經典家常枸杞牛蒡排骨湯，風味道地鮮明。
servings: 4
category: 湯
dishKinds: []
classificationReason: "新鮮牛蒡與排骨細火慢燉之甘甜清湯。"
draft: false
mealCandidate: true
vegetable: false
protein: false
timeMinutes: 50
tags: [家常菜, 台灣小吃]
ingredients:
  - { name: 排骨, amount: { value: 100, unit: g }, note: 原料標示 300公克 }
  - { name: 牛蒡, amount: { value: 100, unit: g }, note: 原料標示 350公克 }
  - { name: 枸杞, amount: { value: 100, unit: g }, note: 原料標示 15公克 }
  - { name: 薑片, amount: { value: 100, unit: g }, note: 原料標示 5公克 }
  - { name: 水, amount: { value: 100, unit: g }, note: 原料標示 1500㏄ }
  - { name: 鹽, amount: { value: 100, unit: g }, note: 原料標示 1小匙 }
  - { name: 米酒, amount: { value: 100, unit: g }, note: 原料標示 1大匙 }
steps:
  - text: "排骨洗淨，放入滾水汆燙一下，撈起備用。"
    image:
      src: ./step-1.webp
      alt: 砧板上準備妥當並切整齊的枸杞牛蒡排骨湯主要材料
  - text: "牛蒡去皮切塊；枸杞洗淨備用。" 
  - text: "取湯鍋，加入水煮滾，放入作法1、2的排骨牛蒡和薑片煮滾，蓋上鍋蓋，以小火煮50分鐘。" 
  - text: "續放入枸杞煮10分鐘，最後再加入調味料所有材料煮勻即可。" 
