title: 小黃瓜
summary: 小黃瓜是小胡瓜。農業部資料以胡瓜整體（含大、小胡瓜）統計，主要產在臺灣中南部，屏東縣產量最多。這篇整理挑選、清洗、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: true
selection: 挑果皮鮮綠、果刺明顯的小黃瓜，果體粗細平均、硬實，拿起來有重量感。
preparation: 用流動清水沖洗，特別要搓洗蒂頭。胡瓜是連續採收的作物，來源提醒料理前要清洗乾淨，也可以用滾水燙過。洗淨後可直接生吃，或切段、拍裂後再料理。
storage: 用濕報紙包好，或放進密封容器，再放入冰箱冷藏室，約可保存一週。
uses: 小黃瓜洗淨後可以直接生吃，切段拍裂後加鹽醃漬就成了涼拌小黃瓜；也能刨絲和蛋液拌勻煎成蛋餅，或切條汆燙後捲進壽司。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 南部地區（含臺東）
      months: 1 月中旬至 10 月下旬適合栽培
    - area: 中部地區（含花蓮）
      months: 2 月上旬至 10 月上旬適合栽培
    - area: 北部地區（含宜蘭）
      months: 3 月中旬至 9 月中旬適合栽培
  scope: 農業部食農教育平臺產期頁的產季圖卡標示「全年」，文字則列出各地區適合栽培的期間；以上月份是栽培適期，不是採收月份，平臺也沒有寫盛產期。胡瓜一年可多次收穫，南部約 3 至 4 收、中部約 3 收。以下產地資料是胡瓜整體的資料：主要產地為屏東縣里港鄉、九如鄉，另有高雄市美濃與路竹、雲林縣莿桐與西螺、彰化縣大城、南投縣埔里；小胡瓜約占胡瓜種植面積 65%。
