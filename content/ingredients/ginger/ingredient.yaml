title: 薑
summary: 嫩薑、粉薑與老薑的成熟程度不同，挑選與保存方式也不同。這篇以農業部農業知識入口網的資料為範圍。
category: aromatic
draft: false
selection: 嫩薑可看塊莖是否潔白飽滿、末端鱗片呈粉紅色且無腐爛；粉薑看塊莖飽滿、表皮光滑無損；老薑則避開皺縮枯萎或腐爛者。
preparation: 按料理需要取用；薑切開後應包好切口並冷藏。嫩薑、粉薑與老薑質地不同，使用時先分辨手上的薑是哪一種。
storage: 老薑可放通風處；嫩薑、粉薑用保鮮膜包起後放冰箱。切過的薑須包好切口再冷藏，並留意實際狀態。
uses: 農業部資料列出薑可醃製或做薑茶；薑絲蛤蜊湯是本站的一種料理例子。
relatedRecipes:
