title: 番茄醬
summary: 番茄醬以番茄糊加糖、醋、鹽等調製，可沾、可淋，也能入菜。這篇以可果美和十全的番茄醬為例，整理標示、保存與用途。
category: seasoning
draft: false
selection: 各品牌配方不同，選購時請看成分標示。可果美蕃茄醬（柔軟瓶）的成分為水、蕃茄糊、甘蔗液糖、釀造醋、食鹽和多種香辛料；十全番茄醬則以水、番茄糊、高果糖糖漿、鹽、醋等製成。
preparation: 本篇來源沒有另外說明處理方式；用量請依菜譜。
storage: 可果美標示開封前放陰涼處、避免日照，開封後冷藏並儘快用完，保存期限 15 個月；十全標示開封前放陰涼乾燥處、開封後儘速用完，產品頁沒有寫是否冷藏，保存期限一年。香港消委會提到番茄醬產品標示上建議開封後冷藏，但經常使用、能在 1 至 2 星期內用完整瓶的話，不一定要放冰箱。請依手上產品的包裝標示保存。
uses: 可果美說明番茄醬可用於中式與西式料理，可烹調，也可當沾醬或淋醬；十全列出沾薯條、蛋包飯、糖醋排骨和吐司抹醬等用法。本站的糖醋茄子和番茄牛肉麵用到番茄醬。
