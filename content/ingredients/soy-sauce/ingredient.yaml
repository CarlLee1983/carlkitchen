title: 醬油
summary: 醬油有不同原料與風味。本篇以萬家香丸大豆醬油的產品頁為例，說明標示、保存與用途。
category: seasoning
draft: false
selection: 本篇例子的萬家香丸大豆醬油標示以黃豆、小麥等為原料；其他醬油配方不同，選購時請核對實際產品標籤。
preparation: 按菜譜酌量加入；這款產品列出沾、炒、滷、醃等用法，實際用量仍須配合料理與產品鹹度。
storage: 萬家香丸大豆醬油產品頁標示開瓶後須冷藏；其他醬油請依各自包裝標示保存。
uses: 萬家香將這款丸大豆醬油列為可沾、炒、滷、醃的產品；不是所有醬油都具有相同原料或調味強度。
notices:
  alcohol: 萬家香丸大豆醬油的產品原料表列有酒精；請以實際瓶身標示確認。
  allergens:
    - 萬家香丸大豆醬油的產品原料表列有黃豆與小麥；過敏者請核對實際瓶身的原料及過敏原標示。
