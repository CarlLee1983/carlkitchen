title: 香菇
summary: 香菇有鮮食和乾燥兩種用法，乾燥香菇的菇傘顏色較深、烘乾後香氣濃，鮮食香菇菇傘較淡、肉質軟厚。這篇分開整理鮮香菇與乾香菇的挑選、處理與保存；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: false
selection: 鮮香菇挑菇傘圓而厚、表面沒有皺紋，菌褶白淨、沒有灰點或黑點，按壓菇傘後會馬上回彈，聞起來沒有酸味；菇傘表面看得到散生絨毛，表示含水量較低。乾香菇挑菇傘呈褐色至深褐色、皺縮無裂紋，菌褶淡黃，菇柄有修剪、約留 1 公分以上，摸起來硬而厚實，同重量包裝下朵數較少的較好，聞起來有像烤花生或堅果的香氣。香菇品質和大小無關，要看菇傘肉質是否厚實細緻。
preparation: 鮮香菇不需清洗，可直接下鍋；不放心時用廚房紙巾稍微擦拭，若習慣水洗，洗過要當餐用完。菇柄修剪處若有褐變，切掉即可。乾香菇料理前先沖洗去除雜質，再泡冷水至軟化舒展；泡過香菇的水不必倒掉，可加入料理或湯品。
storage: 鮮香菇先擦去表面水分，用擦手紙包覆菇體，避免塑膠袋直接貼在菇體表面，放進約 4°C 的冰箱冷藏，約可保存 7 至 10 天。乾香菇開封後用夾鏈袋密封，放冰箱冷藏或冷凍，賞味期可延長到約一年。
uses: 乾香菇常用在香菇雞湯、肉粽、炒米粉、鹹粥、油飯與肉羹，泡香菇的水可一起入湯；香菇也適合炒食、煮湯或當火鍋料。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 臺中市新社區、南投縣魚池鄉與埔里鎮（太空包栽培，臺中與南投合占全臺八成以上）；段木香菇以宜蘭縣、新竹縣為主
      months: 冬菇 1 月中旬至 5 月中旬；夏菇 5 月至 8 月中旬
  scope: 依農業部食農教育平臺產地與產期頁，香菇一年四季都有出產，主要分為冬菇與夏菇兩個採收期，月份即為採收期。段木香菇在冬季低溫下生長較慢、菇傘較厚。實際產期會隨栽培方式、地區與年度變動。
