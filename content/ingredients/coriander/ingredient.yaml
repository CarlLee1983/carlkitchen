title: 香菜
summary: 香菜又稱芫荽，莖葉細嫩、氣味特殊，通常不煮過直接食用。這篇整理挑選、清洗、保存與用途。
category: aromatic
draft: true
selection: 挑選葉片與莖部翠綠、沒有損傷或病蟲害，菜梗沒有斷裂的香菜。已經發黃或腐爛的香菜沒有香氣，不要食用。
preparation: 香菜一般不先煮過，食用前要仔細清洗。切碎後，香菜的特殊氣味會較快散去。
storage: 香菜容易枯黃腐爛。買回後整理好放進保鮮盒，倒入足量冷水蓋過根部，放冰箱冷藏，每 2 至 3 天換一次水，約可放 2 至 3 週；也可以分裝冷凍，要用時再解凍。
uses: 香菜可以加進火鍋，也可以和水果、番茄、洋蔥一起打成醬料。湯品可在盛碗時放上少許點綴，做法請看相關菜譜。
season:
  production:
    - area: 彰化縣為主要產地，雲林、臺南、新北、宜蘭少量生產
      months: 中秋節後到清明節前盛產
  bestFlavor: 農曆過年前後
  scope: 以上依農業兒童網〈香菜〉：一年四季都能種植，盛產期與品質最好的時期照原文以節日與農曆表示。該頁寫彰化北斗產量最高，農業E報則寫彰化二林、溪州與雲林西螺為主要種植區，兩者鄉鎮不同，本篇只寫到縣市。實際產期會隨產地與年度變動。
