title: 青椒
summary: 青椒是甜椒還沒轉色的幼果，椒味比成熟的紅、黃甜椒重。這篇整理挑選、清洗、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: true
selection: 挑選果形端正、完整飽滿，皮薄肉厚、果面光滑的青椒；顏色均勻亮麗，沒有斑點、皺褶軟化、水傷、碰傷、腐爛或蟲咬。蒂頭短而鮮綠，枯萎的表示不夠新鮮。
preparation: 甜椒的蒂頭凹陷，容易殘留農藥或塵土，清洗時要特別沖洗蒂頭凹處。外皮洗淨後切半，去掉蒂頭和種子，內部再用水沖過即可料理。
storage: 先擦乾表皮的水氣，用塑膠袋、保鮮膜或白報紙包好後冷藏，新鮮的甜椒約可保存 7 至 10 天。
uses: 青椒椒味較重，比較適合和其他食材快炒，也可以炸成蔬菜天婦羅。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 南投縣（信義鄉、仁愛鄉，以夏季為主）、雲林縣、嘉義縣
      months: 全年生產；12 月至翌年 5 月盛產，此時主要產地為雲林縣與嘉義縣
  scope: 以上是農業部食農教育平臺產地與產期頁對甜椒整體的記載，來源沒有另列青椒（未轉色果）的產期或產地。農業知識入口網生產地圖也列甜椒 1 月至 12 月都有生產。實際供應會隨產地、品種與年度條件變動。
