title: 紅蔥頭
summary: 紅蔥頭是乾燥後的鱗莖，常用來爆香或炸成油蔥酥。這篇整理挑選、處理、保存與用途；份量與步驟請看相關菜譜。
category: aromatic
draft: true
selection: 挑選外皮光滑、沒有發霉、腐爛或發黑，外觀飽滿不乾扁的紅蔥頭；表皮乾癟、起皺的新鮮度較差。也避開已長芽眼或發芽的，保存不當發芽後口感與風味都會下降。
preparation: 切除頭尾，用紙巾擦乾表面水分後切成薄片。去頭尾後先泡冰水約 15 分鐘再切，可以減少流淚。炸油蔥酥時把薄片放進熱油，分次下鍋以免油泡溢出，炸到金黃後撈起瀝油；火候說法不一，農業部料理頁寫先熱油再轉小火，生物多樣性研究所教材寫中小火，份量與時間請依菜譜。
storage: 完整紅蔥頭裝進網袋，吊在陰涼通風處，保持乾燥約可放 1 至 3 個月，避免潮濕或溫暖的地方。也可以洗淨去皮切片，平鋪在保鮮袋裡冷凍，但切開後風味會漸漸流失，建議 1 個月內用完。炸好的油蔥酥與蔥油放涼後裝罐，冷藏或冷凍；用植物油炸的要密封，並儘早吃完。
uses: 紅蔥頭是臺灣菜常用的爆香佐料，可用於炒菜、拌飯、拌麵與滷肉。炸成油蔥酥後，最常見的用法是加在滷肉飯上。
season:
  production:
    - area: 臺南市（七股、安南、北門、學甲）
      months: 2 月至 3 月收成（以安南種為例）
  scope: 產地鄉鎮與月份依農業部食農教育平臺產地頁，月份只就安南種舉例；該頁另列雲林縣、嘉義縣為次要產區。依同平臺在地特色頁，臺南、嘉義、雲林在 107 至 109 年合計占全臺紅蔥頭的 99.7%，其中臺南產量約占 88%。農糧署南區分署寫 9 至 11 月種植、翌年 1 至 2 月採收；食農平臺在地特色頁則寫農曆年後由南往北採收，清明節前大致收完。各來源口徑不同，實際收成會隨品種、產地與年度變動。
