title: 番茄
summary: 番茄在臺灣全年都有生產，冬季冷涼時是盛產期；市場上分大果番茄與小果番茄。這篇整理挑選、清洗、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: false
selection: 大果番茄挑果形圓潤飽滿、沒有裂紋，表皮光滑沒有擦傷，果臍完整且已轉紅，果蒂也要完整。小果番茄挑果形完整、沒有擠壓傷或萎縮，顏色鮮紅或鮮黃，果蒂完整。
preparation: 番茄碰水容易裂果，要吃時再洗，吃多少洗多少。清洗以流動水沖洗為主，可搭配軟毛刷；大果番茄去掉蒂頭後稍加清洗，小果番茄清洗時保留蒂頭，吃的時候再拔掉。需要去皮時，可把番茄放進滾水稍燙再剝皮。
storage: 已經成熟的番茄不要清洗，直接裝進塑膠袋冷藏，要吃時再洗；還沒熟的番茄同樣不洗，放在通風陰涼處等它轉熟。來源沒有提供保存天數。
uses: 番茄可以和蛋同炒、和雞肉煮湯，也能打成果汁，與洋蔥、蒜一起熬成義大利番茄醬；小果番茄可汆燙去皮後浸入糖水，做成冰釀小番茄。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 臺灣；嘉義縣、南投縣、臺南市、高雄市、雲林縣為產量前五名
      months: 12 月至翌年 4 月盛產
  scope: 農業部食農教育平臺記載番茄全年都有生產，因為適合冷涼氣候，以 12 月至翌年 4 月為盛產期。產量排名取自同頁的縣市產量圖，圖上沒有標示統計年度；實際產期會隨產地與年度變動。
