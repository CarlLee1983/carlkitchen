title: 韭菜
summary: 韭菜葉片扁而細長，以莖葉為食用部位；吃花苞的叫韭菜花，軟化栽培的黃嫩莖葉叫韭黃。這篇以葉用韭菜為主，整理挑選、處理、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: true
selection: 韭菜挑莖葉粗、葉片翠綠、沒有軟爛的。韭黃挑莖葉不軟爛、沒有臭味的；韭菜花挑花苞還沒開、莖一折就斷的。
preparation: 先去除腐葉和根部，再用流動的水沖洗莖葉，依料理需要切成段。
storage: 用牛皮紙或麻將紙把韭菜包起來，再放進塑膠袋，葉片朝上直立冷藏，約可保存 7 天。牛皮紙能兼顧吸濕與保濕；只用塑膠袋不透氣，報紙的油墨則可能沾到莖葉。
uses: 韭菜可以清炒，也能做韭菜盒子、韭菜捲餅，或和其他食材拌炒成蒼蠅頭、韭菜炒魚片。不同產地風味有差異，桃園韭菜辛香味濃，適合包水餃；花蓮吉安的韭白長而甜嫩，適合清炒或川燙。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 彰化縣埔鹽鄉（葉用韭菜最大產區）、桃園市大溪區、花蓮縣吉安鄉
      months: 全年生產
    - area: 韭菜花：彰化縣二林鎮、溪湖鎮
      months: 8 月至 10 月為主要產季
  bestFlavor: 農曆二月
  scope: 依農業部食農教育平臺產地與產期頁，臺灣一年四季都有出產韭菜和韭黃；俗話說「正月蔥、二月韭」，冬春季日夜溫差大，農曆二月的韭菜葉品質最好，最佳賞味期照原文以農曆標示。韭菜花另有 8 月至 10 月的主要產季。實際供應會隨產地與年度條件變動。
