title: 茄子
summary: 茄子在臺灣全年都有生產，夏秋季是盛產期，屏東縣是最大產地。這篇整理挑選、處理、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: true
selection: 挑茄身完整、緊緻、勻稱又帶光澤的茄子，蒂頭的果萼色澤鮮明、包覆緊密，花萼邊緣尖銳較佳。表皮要光滑發亮，沒有外傷、皺紋、疤痕或斑點；果皮顏色呈現一圈白色或淡紫色表示新鮮，變成暗紫色就不夠新鮮。尾端隆起膨大的可能過熟。好的茄子皮薄肉厚，輕壓有彈性；避開軟化、萎縮或裂開的。茄子直或彎是受品種和生長環境影響，口感沒有差別。
preparation: 茄子洗淨去蒂後再切段，不必削皮，留著外皮可維持口感與色澤。切開放太久，果肉會氧化變成褐色，這是自然變化，不影響食用安全。想減少變色，可以先用高溫過油定色；水煮時等水滾再放入，讓茄子完全浸在沸水中，或縱切後紫色外皮朝下、不翻動煮熟；要爆炒時，先過油或汆燙，壓去多餘水分或油分再下鍋。
storage: 整條放在陰涼通風處，常溫約可放 2 至 3 天。冷藏時用濕紙巾或保鮮膜包好，再裝進塑膠袋密封，約可放 3 至 5 天；也可以去蒂切段、汆燙放涼後裝進保鮮盒冷藏，約 3 至 5 天。
uses: 茄子可以蒸熟或燙熟後放涼，淋上醬油膏、香油和蒜末做成涼拌小菜；也能蒸、煮或炸熟後淋上絞肉醬汁，做成魚香茄子。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 臺灣；屏東縣約占全臺種植面積一半
      months: 全年生產，5 月至 11 月盛產
    - area: 中部地區（春夏作為主）
      months: 5 月至 10 月採收
    - area: 南部地區（秋作為主）
      months: 9 月至翌年 4 月採收，近年四季栽培
  scope: 以上是農業部食農教育平臺記載的臺灣茄子產期，全年都有生產，5 月至 11 月為盛產期。依民國 111 至 113 年統計，主要產地前五名為屏東縣、南投縣、彰化縣、高雄市、雲林縣，屏東集中在里港、鹽埔、高樹。依品種而言，高雄 2 號產期集中在 11 月至翌年 4 月，麻芝茄則全年都有。
