title: 蔥
summary: 青蔥的蔥白與蔥綠都能入菜，切成蔥段或蔥花有不同用途。這篇介紹挑選、處理與保存。
category: aromatic
draft: false
selection: 挑選蔥白結實、略有光澤與彈性，莖葉挺直且沒有腐爛或枯焦的青蔥。四季蔥幾乎全年可見，不代表所有青蔥品種都有相同產期。
preparation: 按料理需要切成蔥段或蔥花；農業部的蔥燒蘿蔔雞腿食譜將蔥白先入鍋、蔥綠於後段加入，這是其中一種做法。
storage: 桃園區農業改良場建議用紙包裹青蔥、放進塑膠袋，再置於冰箱冷藏；保存時間仍需看實際狀態。
uses: 青蔥可作為菜餚調味，也可切段入菜；蔥白與蔥綠在料理中的加入時機可依食譜調整。
