title: 青江菜
summary: 青江菜屬於不結球白菜，葉柄肥厚、形狀像湯匙，臺灣全年都能生產。這篇整理挑選、清洗、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: false
selection: 挑選植株硬挺、沒有腐爛的青江菜；葉柄肥厚、莖部緊實，葉片翠綠完整，沒有黃化或破損。莖部軟爛或葉片斷裂的比較不新鮮。
preparation: 青江菜尾端容易卡泥土和灰塵，清洗時先剝開蒂頭，把葉片一片片分開，翻開葉片沖洗，特別注意葉柄和根部。
storage: 不結球白菜碰水後容易軟爛，保存前不要先洗；也不要放在太乾的地方，以免葉片萎凋。用塑膠袋包好、擠出多餘空氣後冷藏，並儘快料理。來源沒有給保存天數。
uses: 青江菜可以清炒或汆燙，也可以當包子、餃子或餛飩的內餡，上海菜飯用的也是青江菜。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 全臺各地；雲林縣（西螺、二崙）、桃園市、高雄市栽培面積最大
      months: 全年生產
  scope: 農業部食農教育平臺的產地與產期頁以「不結球白菜」整體記載，因品種適應不同季節而全年都能生產，本篇產期欄採用這個說法。農業兒童網另寫青江菜最佳收穫期在 6 月至 7 月及 10 月至 11 月，主產地為雲林、臺南、桃園、新北，與上述口徑不同，僅供參考。實際供應會隨產地、品種及年度條件變動。
