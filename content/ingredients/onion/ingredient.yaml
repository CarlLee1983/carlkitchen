title: 洋蔥
summary: 臺灣的洋蔥產季集中在冬季到春季，產地包括屏東、高雄、雲林與彰化；國產洋蔥產季有限，8 月至 11 月必須仰賴進口洋蔥。這篇整理挑選、處理、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: true
selection: 挑球形完整、堅實，外皮完整光滑又乾燥的洋蔥，沒有萌芽、鬚根或腐爛。國產洋蔥顏色較淺、呈紡錘形，外皮容易剝落破碎，味道較甜、不嗆；進口洋蔥顏色較深、較圓胖，外皮完整乾淨不帶土，辛辣味較強。
preparation: 切洋蔥前先切掉根部，把洋蔥放進水裡泡一下再處理，可以減少流淚。依料理需要切成圈、片或粒；要生吃時，切絲後泡冷開水可減少辛辣味，用前瀝乾。
storage: 洋蔥放在陰涼、乾燥且通風的地方常溫保存，不要放進冰箱。發芽的洋蔥不會產生毒素，但品質和口感可能變差，宜儘早食用；洋蔥變軟可能是內部發霉或腐爛，就不要吃。來源沒有提供保存天數。
uses: 洋蔥切絲泡水後可與雞絲涼拌，切丁可和甜椒、番茄拌成莎莎醬，也能對切取內層當容器，填料後蒸熟。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 彰化縣、雲林縣
      months: 12 月進入產季
    - area: 高雄市
      months: 1 月底至 3 月初
    - area: 屏東縣
      months: 3 月至 4 月盛產
  bestFlavor: 12 月至翌年 4 月
  scope: 以上是農業部食農教育平臺記載的各產區產季，知名產地有屏東恆春與車城、高雄林園、雲林臺西與東勢、彰化伸港。產期段落的文字指 12 月至翌年 4 月的國產洋蔥最鮮甜，同段的產季圖卡把這段期間標為「最佳賞味期」。屏東洋蔥較耐儲放，冷藏後 7 至 8 月仍買得到；8 月至 11 月市場則要仰賴進口洋蔥，這些是市場供應資訊，不是國產產期。
