title: 太白粉
summary: 太白粉是勾芡、裹粉常用的澱粉。臺灣市售太白粉的原料可能是樹薯或馬鈴薯，要看包裝標示；這篇整理標示規定、勾芡方式與保存。
category: seasoning
draft: false
selection: 衛福部規定自 2017 年 1 月 1 日起製造的太白粉，須在內容物如實標示原料名稱，例如「樹薯粉」或「馬鈴薯粉」，選購時可從標示分辨。以仙知味太白粉為例，產品頁標示原料為樹薯澱粉、原產地泰國。
preparation: 勾芡時先把太白粉加冷水調勻，再加入熱的菜餚中，讓湯汁變稠並帶光澤。粉和水的比例與下鍋時機請依菜譜。
storage: 仙知味太白粉標示放在陰涼乾燥處、避免陽光直射，開封後儘早用完，保存期限 2 年。香港消委會也建議太白粉這類粉狀調味料裝在密封容器裡，放在陰涼處防潮。其他產品請依包裝標示。
uses: 仙知味列出太白粉可用於中西菜餚的調羹勾芡和沾炸，也可做冰淇淋、布丁、軟糕的材料。本站的酸辣湯、絲瓜蛤蜊、麻婆豆腐和糖醋茄子都用太白粉勾芡或調醬汁。
