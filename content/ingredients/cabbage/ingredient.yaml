title: 高麗菜
summary: 高麗菜在臺灣全年都有生產，平地與高冷地的主要產期不同。這篇整理挑選、清洗、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: false
selection: 挑選整顆形狀圓整、葉片包合緊密的高麗菜；葉片應新鮮、沒有萎凋、腐爛或明顯損傷。
preparation: 先剝除外層約 2 至 3 片葉子，切下需要的份量，再將葉片分開，以流動清水洗淨。
storage: 用塑膠袋或紙包住高麗菜後冷藏保存；保存時間會受購買時的新鮮度及保存條件影響，宜留意葉片狀態並儘早使用。
uses: 高麗菜可清炒、汆燙或加入火鍋，也可用於沙拉、醃漬及製作高麗菜乾。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 平地
      months: 10 月至翌年 5 月
    - area: 高冷地
      months: 5 月至 11 月
  bestFlavor: 11 月至翌年 4 月
  scope: 以上是農業部資料所述的臺灣高麗菜主要產地月份與最佳賞味期；不同產地輪替使全年都有生產。實際產期與供應會隨產地、栽培及年度條件變動。
relatedRecipes:
