title: 南瓜
summary: 南瓜果實的形狀與顏色變化很大，常見的有中國南瓜（金瓜）與西洋南瓜。這篇整理挑選、處理、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: false
selection: 挑選外形端正、果蒂完整，沒有汙損或病蟲害斑的南瓜；顏色較深代表成熟、甜度高，拿起來要結實有沉重感。表皮乾燥帶瓜粉、指壓不留痕跡，瓜稜越深、瓜瓣越鼓越成熟；成熟南瓜有南瓜的清香，未熟的嫩瓜會有菜瓜味。
preparation: 南瓜外皮洗乾淨後可以連皮吃，也可以削皮再料理；種子和瓜肉上的綿狀纖維口感較差，習慣上會去除，煮濃湯時也可以一起打成泥。切塊後可直接料理，或蒸熟備用。
storage: 表皮乾燥堅實、還沒切開的整顆南瓜，放在通風陰涼處約可保存 2 個月，避開高溫潮濕。切開後用保鮮膜把切面密封包好，放冰箱蔬果室冷藏。要冷凍時，洗淨外皮後切塊裝密封袋；也可以先切塊蒸熟再裝袋冷凍，約可保存 4 週。
uses: 南瓜可煮濃湯、做南瓜米粉，或做成南瓜飯；中國南瓜適合金瓜米粉，扁圓鮮橘的東昇南瓜常用來做濃湯或南瓜泥。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 臺南市、嘉義縣、雲林縣、花蓮縣、高雄市（約占全臺 65% 栽培面積）
      months: 秋、冬作為主要生產季節
  scope: 本篇產期以農業部食農教育平臺產地與產期頁的文字為準：中國南瓜在秋、冬作的品質與產量較穩定；西洋南瓜在中南部適合秋、冬作，北部建議春作。同一頁的產季圖卡標示 3 月至 11 月為盛產期，農業兒童網則寫 3 月至 10 月盛產、花蓮、嘉義、屏東為重要產區，口徑不同，僅供參考。整顆南瓜常溫保存期，農業兒童網寫約 3 至 6 個月，本篇採食農平臺圖卡的約 2 個月。實際產期會隨品種、地區與年度變動。
