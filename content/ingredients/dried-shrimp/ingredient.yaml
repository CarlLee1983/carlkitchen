title: 蝦米
summary: 蝦米是乾貨，挑選時可檢查顏色、觸感與氣味；料理前依農業部建議清洗、浸泡並瀝乾。
category: seasoning
draft: false
selection: 挑選顏色不過於鮮艷、摸起來乾爽易脆，且沒有刺鼻味、臭味或其他異味的蝦米。
preparation: 料理前先用清水洗淨，再以溫水浸泡、瀝乾。農業部客家小炒食譜另提供泡軟後與蒜末爆香的料理例子。
storage: 農業部乾貨資料建議密封包裝後放冰箱冷凍；拆封與解凍後也要留意包裝指示與實際狀態。
uses: 蝦米可作料理配料；客家小炒食譜示範泡軟後與蒜末一起爆香，本站另有開陽白菜菜譜，以大白菜搭配蝦米。
notices:
  allergens:
    - 蝦米屬甲殼類；食藥署將甲殼類及其製品列為包裝食品應標示的過敏原。對甲殼類過敏者應核對包裝標示。
