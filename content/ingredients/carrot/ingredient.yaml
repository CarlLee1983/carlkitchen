title: 紅蘿蔔
summary: 紅蘿蔔又稱胡蘿蔔，屬於冬季作物，主要產在臺南、雲林與彰化。這篇整理挑選、清洗、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: false
selection: 挑表皮光滑、橫紋間隔平均、根鬚少的紅蘿蔔，蒂頭應是綠色、沒有發黃。
preparation: 紅蘿蔔越靠近表皮的部分味道越濃，把外皮刷洗乾淨後，可以不削皮直接料理。
storage: 紅蘿蔔怕濕氣，保存時要隔絕水氣。整根切掉葉子、洗淨擦乾後包一層報紙，裝進保鮮袋冷藏，約可放 1 至 2 週；切開的部分用保鮮膜包好，約 3 至 4 天內吃完。一次用不完時，可把切塊汆燙約 30 秒，瀝乾放涼、用紙巾壓乾水分後裝袋冷凍，約可放 2 至 4 個月。
uses: 紅蘿蔔可以打成蔬果汁，也能和奶油、鮮奶一起煮成濃湯；燉肉時可先整根煮熟再與肉同燉，當餡料則先切絲炒熟，再和肉拌煮。切下的葉子可加進沙拉或濃湯。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 臺南市、雲林縣、彰化縣
      months: 11 月至翌年 4 月
  scope: 以上是農業部食農教育平臺記載的主要產期；依農糧署民國 109 年統計，臺南、雲林、彰化合計約占全臺產量 99%，臺南將軍區的面積與產量居全臺第一。紅蘿蔔可冷藏調節供應，所以全年都買得到，但市場供應期間不等於國產產期。
