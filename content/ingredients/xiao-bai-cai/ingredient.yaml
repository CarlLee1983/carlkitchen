title: 小白菜
summary: 小白菜是葉片光滑、彼此分開的不結球白菜，生長期短，臺灣幾乎全年都有。這篇整理挑選、清洗、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: true
selection: 挑選全株葉片完整、堅挺不枯萎的小白菜；葉色翠綠鮮明，葉片與葉柄肥厚，沒有黃化、破損或腐爛。
preparation: 清洗時翻開葉片沖洗，特別注意葉柄基部和根部；洗好後依料理需要切段。小白菜水分多，煮久容易變老，適合短時間加熱。
storage: 小白菜碰水後容易軟爛，保存前不要先洗；若含水多，可先攤開吹乾。用塑膠袋包好、擠出多餘空氣後冷藏，農業部生產地圖記載包好冷藏約可維持 2 至 3 天，連根貯藏約可再多 2 天；葉片有點乾癟時，泡水可恢復翠綠。
uses: 小白菜適合快炒或川燙，讓葉子維持鮮嫩、葉柄保持爽脆，食農教育平臺建議可搭配蒜末、薑絲和米酒；常見做法有白灼小白菜，湯麵和餛飩湯也常加上一把小白菜。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 全臺各地；雲林縣（西螺、二崙）、桃園市、高雄市栽培面積最大
      months: 全年生產
  scope: 農業部食農教育平臺以「不結球白菜」整體記載全年皆可生產，品種有全年、夏季與冷涼季節之分，因此全年皆可生產，本篇產期欄採用這個說法。農業知識入口網生產地圖另寫冬季除北部產量略少外，整年都有生產。來源沒有給盛產月份。實際供應會隨產地、品種及年度條件變動。
