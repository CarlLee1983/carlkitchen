title: 醬油膏
summary: 醬油膏的配方會因產品而異。金蘭油膏與萬家香純釀造油膏是兩個不同的產品例子。
category: seasoning
draft: true
selection: 金蘭油膏的產品說明列有糯米；萬家香純釀造油膏的原料表則列出大豆片、小麥與黏稠劑。選購時請核對手上產品的原料標示。
preparation: 依實際菜譜與產品風味決定用量；不要把其中一款油膏的原料或保存方式套用到另一款。
storage: 萬家香純釀造油膏標示開瓶後冷藏；其他產品依各自包裝標示保存。
uses: 金蘭油膏列有小菜、燙青菜等沾醬用途；萬家香純釀造油膏列有沾、煮、炒、炸、滷等用法，均為各自產品建議。
notices:
  allergens:
    - 萬家香純釀造油膏的原料表列有大豆與小麥；不同油膏配方可能不同，過敏者請核對實際包裝標示。
