title: 青花菜
summary: 臺灣國產青花菜的主要產期為 10 月至翌年 5 月；夏季市場也可能有進口或冷凍品。這篇整理挑選、處理與保存方式。
category: vegetable
draft: false
selection: 挑選花蕾球翠綠、緊實，沒有黃化、鬆散或坑洞損傷的青花菜；花莖底部以實心者為佳。
preparation: 以流動清水清洗青花菜，再沿著花莖分支切成適合食用的大小；檢查花蕾縫隙，若有小蟲可挑除。
storage: 若不立即食用，先不要水洗，放入有孔的塑膠袋並冷藏；清洗後應及早料理。保存情形會受食材新鮮度、濕度及冰箱條件影響。
uses: 青花菜可汆燙或清炒，也可與其他食材同炒；份量與完整步驟請看相關菜譜。
season:
  production:
    - area: 臺灣國產；雲林為主要產地
      months: 10 月至翌年 5 月
  scope: 農業部食農教育平臺所述為國產青花菜產期；夏季市場可見進口品，也可能有先前採收的國產冷凍品，不能將購得時間當成當地採收期。實際產期依產地、栽培及年度條件變動。
