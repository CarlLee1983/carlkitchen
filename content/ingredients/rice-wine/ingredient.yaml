title: 米酒
summary: 料理米酒可用於燉、煮、炒等做法。本篇以臺灣菸酒的紅標純米料理米酒為產品例子，選購時仍須看實際瓶身標示。
category: seasoning
draft: false
selection: 臺灣菸酒嘉義酒廠的紅標純米料理米酒標示以米為原料、不添加食鹽；其他料理米酒的原料、鹽分與酒精濃度可能不同，選購時請核對瓶身標示。
preparation: 依菜譜份量加入料理；這款產品含酒精，使用前請核對瓶身標示。
storage: 嘉義酒廠產品頁未說明開瓶後的家庭保存方式；請依實際瓶身標示保存。
uses: 嘉義酒廠列出燉、煮、炒、燜、煲、燴等用法，並以提香作為這款產品的料理用途。
notices:
  alcohol: 臺灣菸酒嘉義酒廠這款紅標純米料理米酒標示酒精成分為 19.5%。
relatedRecipes:
