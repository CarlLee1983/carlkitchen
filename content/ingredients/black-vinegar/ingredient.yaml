title: 烏醋
summary: 烏醋是以釀造醋為底，再加糖、鹽和香辛料等調製的深色醋，各品牌配方不同。這篇以工研和萬家香的烏醋為例，整理標示、保存與用途。
category: seasoning
draft: true
selection: 各品牌配方差異大，選購時請看成分標示。工研烏醋的成分包括釀造醋、糖、鹽、洋蔥、柳橙汁、胡蘿蔔汁、番茄糊和大茴、小茴等香辛料，並含焦糖色素；萬家香特級烏醋則以穀物釀造醋加糖、甘蔗糖蜜、鹽及薑、荳蔻、丁香等香辛料製成。
preparation: 工研註明烏醋放久會自然沉澱，使用前搖勻即可；用量請依菜譜。
storage: 工研烏醋產品頁只列保存期限 3 年，沒有寫開封前後的保存方式；萬家香特級烏醋標示開封前放陰涼通風處、開封後冷藏。萬家香也標示保存期限 3 年。請依手上產品的包裝標示保存。
uses: 工研列出烏醋可沾、可煮，用於湯類、麵食、海鮮和肉類；萬家香建議用在羹湯和熱炒，例如醋溜小排。本站的台式炒米粉用到烏醋。
