title: 白蘿蔔
summary: 白蘿蔔在臺灣的產期是 10 月至翌年 3 月，各產地的品種與產季不同。這篇整理挑選、處理、保存與各部位的用法；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: true
selection: 挑表皮光滑細緻、顏色潔白，梗頭鮮綠不萎黃的白蘿蔔；拿起來要有重量感，用手按越硬越好。蘿蔔開花後根部中心會逐漸空心、纖維變乾，所以重量要和體積相稱。表皮有裂痕多半是水分充足又成熟所致，外觀較差但仍可食用。
preparation: 白蘿蔔各段的甜度和辣度不同，可依用途取用。上段水分多、甜度高、辣度低，適合切絲或磨成泥；中段甜度與辣度適中；下段和外皮甜度低、辣度較高。燉煮時可去皮切塊。
storage: 整條可放在陰涼通風處常溫保存。冷藏時先把葉子完全切除，帶著泥土用報紙包好再放進冰箱；一次吃不完，用保鮮膜把切口包好。來源沒有提供保存天數。
uses: 上段可生吃、涼拌或磨泥去腥，中段適合煮湯和炒，下段與外皮適合醃漬，葉子可做鹹菜或加入湯中增添風味。白蘿蔔也可以和雞肉燉湯、和虱目魚煮湯，或做成蘿蔔糕、櫻蝦蘿蔔羹。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 臺灣
      months: 10 月至翌年 3 月
  scope: 以上是農業部食農教育平臺產季圖卡標示的白蘿蔔產期。同頁另依產地列出各自的品種與產季：新北市淡水（梅花品種）11 月至翌年 3 月，只在冬季盛產；苗栗縣頭屋（大梅花品種）12 月至翌年 3 月；南投縣埔里（矸仔品種）冬夏都有，10 月至 11 月最盛產，是夏季白蘿蔔的重要產地；彰化縣二林、芳苑（矸仔品種）11 月至過年期間，冬夏都有種植；雲林縣臺西（矸仔品種）11 月至過年期間；臺南市永康、仁德（矸仔品種）11 月至翌年 3 月；高雄市大寮、美濃 10 月至 12 月，大寮以矸仔品種為主，美濃種白玉蘿蔔。同頁產量圖的前五名為雲林、彰化、嘉義、高雄、臺南，圖上沒有標示統計年度。實際產期會隨產地與年度變動。
