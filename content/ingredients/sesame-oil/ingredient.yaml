title: 香油
summary: 香油是焙炒程度較淺、香氣較清的芝麻油，和黑麻油分開介紹。元福麻油說明市售香油可能是芝麻油調和其他植物油，也有以白芝麻水洗煉製的小磨香油；這篇以元福小磨香油為例，整理原料、保存與用途。
category: seasoning
draft: true
selection: 農業部臺南區農業改良場將低溫焙炒壓榨的芝麻油稱為淡色胡麻油，有傳統香油的特色。元福小磨香油的產品頁寫明以白芝麻水洗煉製，各等級的差別在白芝麻原料等級；元福也提到，市售香油的成分可能標示為芝麻油加另一種植物油脂；選購時請核對實際包裝的成分標示。
preparation: 香油直接取用即可，元福把它歸為涼拌、沾醬和煮湯時提香用的油；加入時機與用量請依菜譜。
storage: 元福小磨香油的產品頁沒有寫保存方式。香港消委會對食用油的一般建議是放在陰涼乾燥處，可買小瓶裝並在約 2 個月內用完；反覆從冰箱拿進拿出，瓶內可能凝結水滴。實際仍以產品包裝標示為準。
uses: 元福列出小磨香油常用於涼拌、沾醬和煮湯提香，也可用來炒菜。本站的絲瓜蛤蜊、麻婆豆腐和涼拌小黃瓜等菜譜都用到香油。
notices:
  allergens:
    - 香油以芝麻製成，芝麻是食藥署規定須標示的過敏原之一；過敏者請核對實際包裝的過敏原標示。
