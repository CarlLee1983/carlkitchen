title: 鹽
summary: 鹽是最基本的鹹味調味料，市售包裝鹽分為加碘與未加碘兩類。這篇整理標示的看法、保存與用途；各道菜的用量請看相關菜譜。
category: seasoning
draft: false
selection: 依衛福部規定，加了碘的包裝食用鹽品名須寫「碘鹽」、「含碘鹽」或「加碘鹽」，並標示總碘含量；沒加碘的產品要標示「碘為必需營養素。本產品未加碘。」選購時可從品名和醒語分辨有沒有加碘。以台鹽的碘鹽為例，特級碘鹽比高級碘鹽多加了海水濃縮礦物質液，兩者都是可食用的細鹽。
preparation: 本篇來源沒有另外說明處理方式；何時下鹽、下多少請依菜譜。
storage: 香港消委會建議把鹽這類乾燥調味品裝在密封容器裡，放在陰涼處，避免受潮；若產品包裝另有保存說明，以包裝標示為準。
uses: 台鹽高級碘鹽的包裝標示用於烹調、醃漬及洗滌蔬果；本站菜譜中，鹽用來為熱炒和湯品調味，也用於醃小黃瓜讓它出水。
