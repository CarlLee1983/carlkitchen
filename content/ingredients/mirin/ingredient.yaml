title: 味醂
summary: 味醂是帶甜味的日式調味料。日本全國味淋協會把市售產品分為本味醂、味醂風調味料和發酵調味料（味醂類型）三類；這篇說明差別，並以臺灣常見產品為例。
category: seasoning
draft: true
selection: 日本全國味淋協會說明，本味醂以蒸過的糯米、米麴和燒酎或酒精為原料，糖化熟成 40 至 60 天，酒精約 14%；味醂風調味料的酒精不到 1%；發酵調味料（味醂類型）酒精約 10%，含鹽約 1.5%，使用時要調整鹹度。臺灣市售的「味醂」配方各不相同，例如萬家香味醂的成分有轉化液糖、水、酒精、食鹽、糯米，工研味醂與十全味醂調味料的成分表則沒有列酒精，不過工研產品頁形容它富含甘甜及酒味。選購時請看品名和成分表。
preparation: 本篇來源沒有另外說明處理方式；用量與加入時機請依菜譜。
storage: 萬家香味醂標示開封前放陰涼通風處、開封後冷藏；工研味醂註明不含防腐劑，開封後冷藏；十全味醂調味料也標示開封後冷藏。三款都標示保存期限 3 年。其他產品請依包裝標示。
uses: 萬家香建議在醃漬肉類或海鮮時加入幫助入味，也可調中式沾醬；工研提到味醂能去腥、讓照燒類料理帶光澤；十全列出照燒醬、壽喜燒醬汁、滷製和涼拌沾醬等用法。本站的日式炊飯、味噌烤鮭魚和洋蔥肉燥都用到味醂。
notices:
  alcohol: 依日本全國味淋協會，本味醂酒精約 14%，發酵調味料（味醂類型）約 10%，味醂風調味料不到 1%；臺灣市售產品是否含酒精要看各自的成分表，例如萬家香味醂列有酒精，工研味醂和十全味醂調味料的成分表沒有列酒精（工研產品頁另形容有酒味）。請以實際瓶身標示確認。
