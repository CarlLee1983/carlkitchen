title: 黑麻油
summary: 黑麻油是焙炒程度較深、顏色較濃的芝麻油，和香油分開介紹。這篇整理原料標示、保存與常見用途。
category: seasoning
draft: true
selection: 農業部臺南區農業改良場將高溫焙炒壓榨、色濃有光澤的芝麻油歸為深色胡麻油，也就是黑麻油。元福優級麻油和東和製油黑芝麻油的產品頁都寫明以黑芝麻為原料，東和標示為 100% 黑芝麻；其他產品請核對實際包裝的成分標示。
preparation: 本篇來源沒有另外說明處理方式；黑麻油的下鍋時機、火候與用量請依菜譜。
storage: 元福優級麻油的產品頁建議避開陽光直射和高溫潮濕，開封後把瓶蓋栓緊放在陰涼處，不需冷藏；東和黑芝麻油則標示放陰涼處。兩款都標示保存期限 2 年，其他產品請依包裝標示。
uses: 農業部臺南區農業改良場說明深色胡麻油適合煎、炒、煮和食品加工。元福列出的用法包括麻油雞、三杯雞、油飯和麻油麵線。
notices:
  allergens:
    - 東和製油黑芝麻油的產品頁標示含有芝麻；芝麻也是食藥署規定須標示的過敏原之一，過敏者請核對實際包裝標示。
