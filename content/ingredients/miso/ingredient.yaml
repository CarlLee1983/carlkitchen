title: 味噌
summary: 味噌是以黃豆、米和鹽發酵成的醬，可煮湯、調醬或醃肉。這篇以十全和工研的味噌為例，整理標示、處理、保存與用途。
category: seasoning
draft: true
selection: 各產品配方不同，選購時請看成分標示。十全原味味噌的成分為黃豆、米、食鹽和水；工研鄉味噌為蓬萊米、黃豆、精鹽和食用酒精；工研香醇味噌另加了魚油粉。
preparation: 十全的味噌烏龍麵食譜把味噌放進鍋中慢慢抹開到化開；用量與加入時機請依菜譜。
storage: 工研鄉味噌與香醇味噌都標示開封前放陰涼處、開封後冷藏，並說明常溫久放顏色會自然變深，冷藏可保持金黃色澤。工研兩款標示保存期限 1 年，十全原味味噌標示 12 個月。十全原味味噌產品頁沒有開封後的保存標示。其他產品請依包裝標示。
uses: 十全建議原味味噌可煮味噌湯、搭配味醂、糖和芝麻油醃豬肉或雞腿，也可加高湯和蔬菜燉煮成鍋物；工研列出沾、煮湯和調味等用法。本站的味噌烤鮭魚和味噌豆腐湯都用到味噌。
notices:
  alcohol: 工研鄉味噌與香醇味噌的成分表列有食用酒精；十全原味味噌的成分表沒有列。請以實際包裝標示確認。
  allergens:
    - 十全原味味噌與工研鄉味噌標示含大豆。
    - 工研香醇味噌標示含大豆及魚製品。過敏者請核對實際包裝的過敏原標示。
