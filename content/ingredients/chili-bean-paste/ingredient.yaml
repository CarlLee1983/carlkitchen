title: 辣豆瓣醬
summary: 辣豆瓣醬是以黃豆、辣椒等發酵或調製的辣味醬料，有些產品另含蠶豆。這篇以明德和十全的產品為例，整理標示、保存與用途。
category: seasoning
draft: false
selection: 各產品原料差異大，選購時請看成分與過敏原標示。明德辣豆瓣醬的成分有紅辣椒、黃豆、鹽、糖、蠶豆、香油和麵粉，並標示「本產品含有蠶豆，蠶豆症患者請勿食用」；十全富山麻油辣豆瓣的成分有黃豆、辣椒、麻油等，沒有蠶豆，含防腐劑。
preparation: 本篇來源沒有說明下鍋前的處理方式，例如是否先炒香；用法請依菜譜。
storage: 明德辣豆瓣醬標示未開封保存期限 3 年，開封後請冷藏；十全富山麻油辣豆瓣標示開封前放陰涼乾燥處、開封後冷藏，保存期限二年。香港消委會也建議辣椒醬類開封後冷藏。其他產品請依包裝標示。
uses: 明德建議辣豆瓣醬用於醬爆、紅燒和拌麵，例如紅燒牛肉麵、麻婆豆腐；十全富山麻油辣豆瓣主打火鍋沾醬。本站的麻婆豆腐用到辣豆瓣醬。
notices:
  allergens:
    - 明德辣豆瓣醬標示含大豆、芝麻、小麥。
    - 十全富山麻油辣豆瓣標示含黃豆、芝麻。過敏者請核對實際包裝的過敏原標示。
    - 明德辣豆瓣醬含蠶豆，產品頁標示蠶豆症患者請勿食用；這項提醒只適用於含蠶豆的產品，購買時請看成分表。
