title: 空心菜
summary: 臺灣空心菜全年有出產，4 月至 9 月較為盛產。這篇整理挑選、清洗與保存方式；實際料理的份量和步驟請看相關菜譜。
category: vegetable
draft: false
selection: 挑選葉片完整、翠綠，沒有黃斑或軟爛的空心菜；莖應翠綠、清脆而容易折斷，避開節位已長嫩芽或發根的莖。
preparation: 依這次要料理的份量清洗；先以流動清水沖洗根部，再讓葉片在清水中舒展，以小水流沖洗。切除根部後，將莖葉切成適合料理的段落。
storage: 若未立即食用，先挑去黃葉與爛葉，不必先水洗；用塑膠袋包裝，根部可包上濕紙巾。來源圖卡建議在約 10°C 冷藏，避免低於 5°C；家用冰箱各區溫度不同，請留意實際溫度與葉片狀態，並儘早使用。
uses: 空心菜可清炒、汆燙，也可入湯；不同料理的調味與步驟請參考菜譜。
season:
  production:
    - area: 臺灣各地
      months: 全年有出產；4 月至 9 月盛產
  bestFlavor: 4 月至 9 月
  scope: 農業部食農教育平臺分別記載全年出產、4 月至 9 月盛產，產期圖卡另標示 4 月至 9 月為最佳賞味期。臺灣各地栽培方式與品種不同，實際供應會隨產地及年度條件變動。
