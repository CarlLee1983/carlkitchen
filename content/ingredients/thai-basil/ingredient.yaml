title: 九層塔
summary: 九層塔是臺灣常用的羅勒，香氣比甜羅勒、打拋葉都濃。這篇整理挑選、處理、保存與用途。
category: aromatic
draft: true
selection: 挑選新鮮、葉面完整、葉子沒有折損或發黑、水分飽滿而不枯萎的九層塔。市面有白骨與紅骨兩種，風味相近。
preparation: 切九層塔時用利刀推切，避免來回亂剁，否則葉片容易變黑。農業部的青醬食譜先摘下葉片，以滾水汆燙約 30 秒再用冷開水冷卻，這是做醬時的一種處理，份量與步驟請依菜譜。
storage: 九層塔葉片變黑，是香氣成分接觸空氣後氧化褐變。九層塔葉片較不耐低溫，耐受程度依品種而異；農業試驗所針對國內常見的青梗品種，建議以 15℃ 以上的低溫包裝貯藏，較不易寒害，並把葉片擦乾、不留水分。其他品種的適合溫度，來源沒有另外說明。臺中區農業改良場的回覆則指出，九層塔在 12℃ 以下會發生冷害。若要冷凍，需先殺菁；凍傷後風味與口感變差，但仍可食用。
uses: 九層塔是鹹酥雞、三杯雞等臺灣料理常用的香草，可以新鮮入菜，也可以曬乾成乾燥香料，或做成青醬。
season:
  production:
    - area: 臺灣各地普遍栽培，主要產地為屏東、彰化、雲林
      months: 全年
  scope: 以上依臺中市果菜公司資料，九層塔全年皆可種植生產；來源沒有提供盛產月份，實際供應會隨產地與天候變動。
