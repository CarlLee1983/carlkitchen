title: 四季豆
summary: 四季豆是菜豆的嫩莢，莢長約 15 至 20 公分，和市場上俗稱「菜豆」的豇豆不同。這篇整理挑選、處理、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: false
selection: 挑選挺直不彎曲、長約 15 公分的豆莢，口感較軟嫩；表面光滑、色澤嫩綠，沒有皺縮、軟化、蟲痕、黃斑或腐爛，摸起來緊實有彈性、圓潤飽滿，聞起來有清香。豆莢上的小黑點多是豆花薊馬造成的斑點，外觀較差，但不影響鮮嫩豆莢的品質與風味。
preparation: 料理前先撕除豆莢兩側的筋絲：捏住一端輕輕掐斷，順勢往另一端拉，就能撕下。四季豆不可生吃或吃半生不熟的，烹調前先用滾水汆燙，或用熱油鍋炒到熟透。
storage: 四季豆攤平晾乾後，用塑膠袋或保鮮袋包好冷藏，約可保存 7 至 10 天；20°C 以下的常溫放在陰涼通風處，約可保存 2 至 5 天。要冷凍時，先洗淨、用鹽水汆燙，務必瀝乾水分再冷凍，以免豆莢黏在一起。
uses: 四季豆可汆燙後涼拌，也可乾煸或快炒；例如客家地瓜飯的做法，是把四季豆燙熟、切小段，和蔥一起下爆香過的蒜頭鍋中拌炒，再拌入煮好的飯。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 高屏平地（高雄市美濃區、屏東縣里港鄉、高樹鄉）
      months: 秋季至初春，以 10 月至翌年 2 月栽培較多
    - area: 中部平地（彰化縣、雲林縣、南投縣）
      months: 秋作 9 月至 10 月播種、春作 2 月至 3 月播種
    - area: 南投縣信義鄉、仁愛鄉海拔 600 至 900 公尺山區
      months: 6 月至 9 月為主要產期
  scope: 依農業部食農教育平臺的產地與產期頁，春、秋、冬由高雄、屏東、彰化、雲林、南投平地供應，夏季由南投山區供應，因此一年四季都有出產。中部平地只有播種月份，不是採收月份；其他月份為栽培期間。產期圖卡另寫「全年」，本篇以頁面文字為準。實際供應會隨產地與年度條件變動。
