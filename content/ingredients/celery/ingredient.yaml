title: 芹菜
summary: 這篇談臺灣本地芹菜（在來種），香氣比西洋芹濃，多用來炒煮或當調味菜；西洋芹葉柄較肥厚，以生吃為主，不在本篇範圍。
category: aromatic
draft: false
selection: 挑選枝梗挺直、色澤青翠、質地細嫩，葉子沒有枯萎、變黃或褐色斑點，也還沒抽苔的芹菜。芹菜管則挑花梗直立光滑、翠綠、沒有裂痕、花苞未開，也沒有水傷或腐爛的。
preparation: 芹菜可切成小段後與其他食材拌炒；摘葉、去除老筋等處理方式，核准來源沒有說明，切法請依菜譜。
storage: 核准來源沒有提供家庭保存方法與天數。食藥署整理的蔬果儲運資料把芹菜列為適合低溫貯藏的蔬菜，這是物流條件，不是家庭保存建議；買回後宜留意葉片是否枯黃、梗是否萎軟，儘早使用。
uses: 本地芹菜香氣濃，多用來炒煮或當調味菜。葉梗與莖端適合和牛肉、羊肉、豬肉或魷魚同炒，切小段也能與各種蔬菜拌炒；料理例子有涼拌芹菜管、速炒鴨腸與沙茶羊肉。
season:
  production:
    - area: 彰化、雲林、嘉義、高雄、屏東
      months: 10 月至翌年 4 月
  scope: 以上依農業知識入口網農漁生產地圖的芹菜產期與全國產地；同頁說明芹菜性喜冷涼，盛產期在春、秋、冬季，夏季要在中高海拔或降溫設施下才容易生長。臺中區農業改良場則指出本地芹全年都能栽培，其中芹菜管以 10 月至翌年 4 月為盛產期。實際產期會隨產地與年度變動。
