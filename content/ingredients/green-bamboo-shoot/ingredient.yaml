title: 綠竹筍
summary: 綠竹筍外型粗胖矮小、尖端彎曲像牛角，臺灣以夏季為產期。這篇只談綠竹筍，整理挑選、處理、保存與常見用途；其他竹筍不適用，實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: true
selection: 挑選切口處水嫩潔白、外型矮小並彎曲成牛角狀的綠竹筍；筍體短矮、籜葉排列緊密的較柔嫩，基部肥大厚實、略帶淡黃。避開頂端已經發綠的筍，這是出土後照到陽光的「出青」，會帶苦味。
preparation: 綠竹筍不能生吃，要煮到全熟；出青的竹筍用沸水煮 20 分鐘以上，可分解苦味成分。剝殼時沿筍殼縱向輕劃一刀，再從切口用手撥開；切塊可用滾刀法，邊滾動竹筍邊下刀。
storage: 沒有要馬上煮時，先削掉筍尖，帶殼放進冷水，可加入一匙鹽、白米和一根紅辣椒，大火煮滾後轉中小火煮約 20 分鐘至熟透。撈起剝殼、泡冰水，瀝乾後用塑膠袋緊密包好冷藏，或泡在冷水中放約 5°C 冷藏並每天換水。來源沒有給保存天數。
uses: 綠竹筍可涼拌，常見的是家庭做的涼拌沙拉筍，也可熱炒、煮湯或熬粥，例如綠竹筍炒蘆筍、綠竹筍香菇肉絲粥。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 北部：新北市（八里、五股、三峽等）、桃園市大溪區與復興區、臺北市文山區與士林區、新竹縣寶山鄉與竹東鎮
      months: 5 月至 10 月；6 月和 8 月為產筍高峰
    - area: 南部：臺南市（關廟、新化、龍崎、白河）、屏東縣屏東市至長治鄉一帶
      months: 5 月至 10 月；6 月和 8 月為產筍高峰
  scope: 依農業部食農教育平臺產地與產期頁，綠竹筍產期為每年 5 月至 10 月，6 月與 8 月是產筍高峰，新竹縣以北約占全臺綠竹面積七成。來源的月份未分南北產區，兩區沿用同一口徑。實際產期會隨地區與年度條件變動。
