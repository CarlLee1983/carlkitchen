title: 玉米
summary: 這篇的玉米指鮮食的食用玉米，國內栽培以甜玉米為大宗，另有白玉米、糯玉米與玉米筍等類型。這篇整理挑選、處理、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: true
selection: 挑選玉米鬚呈帶光澤淡黃色的玉米；鬚是綠色的表示還沒成熟、不夠甜，鬚乾燥枯黃又散開的表示採收後放了一段時間。外葉要鮮綠，有黑色斑點時掀開外葉看看有沒有蟲蛀；籽粒飽滿、排列整齊、顏色漂亮，輕壓感覺緊實、沒有軟塌，也沒有臭酸等異味。
preparation: 鮮玉米可以整支水煮，或洗淨後切塊入菜；需要玉米粒時，再把籽粒從穗軸剝下。
storage: 甜玉米採收後糖分會轉成澱粉，溫度越高流失越快，在 30°C 下放 24 小時約會失去六成糖分，買回來宜儘快烹煮或冷藏。常溫下放在通風陰涼處、避免堆疊，2 天內吃完；冷藏時用塑膠袋包好避免脫水，7 天內吃完。
uses: 玉米可整支水煮、煮成玉米濃湯，或切塊和雞肉一起做三杯料理。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 雲林縣（占全臺近六成產量）、臺南市、嘉義縣
      months: 全年生產；9 月至翌年 5 月盛產
  scope: 依農業部食農教育平臺產地與產期頁，食用玉米全年都有生產，秋作與裡作較適合栽培、面積較多，其次為春作，因此 9 月至翌年 5 月為盛產期；同頁產季圖卡只標「全年」，本篇以頁面文字為準。這些資料是食用玉米整體，不是甜玉米單獨的統計；臺南區農業改良場專訊另寫國內食用玉米以甜玉米為大宗。實際產期會隨品種、地區與年度變動。
