title: 蒜
summary: 蒜頭是大蒜的鱗莖，常用於料理調味；青蒜與蒜苔是不同的食用部位。這篇以完整蒜球與蒜瓣為主。
category: aromatic
draft: false
selection: 挑選完整、無蟲害、未發芽且按壓結實的蒜球；若摸起來鬆軟，依農業部挑選圖卡應避開。
preparation: 料理前剝去蒜瓣外膜，再按菜譜切片或切末；農業部料理例子有蒜末入鍋炒香與蒜片煸香。
storage: 完整未剝皮蒜球放乾燥、陰涼、通風處；農業部圖卡將已剝皮蒜瓣另列為裝入乾淨容器冷藏，兩者不可套用同一保存方式。
uses: 蒜頭常用於調味，例如切成蒜末入鍋炒香；青蒜與蒜苔則可作新鮮蔬菜入菜。
