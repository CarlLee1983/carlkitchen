title: 白醋
summary: 白醋是釀造醋，市售常以米或糯米釀成，也有產品稱為米醋。這篇以萬家香、工研和十全的產品為例，整理標示、保存與用途。
category: seasoning
draft: true
selection: 選購時可看成分和酸度。萬家香珍釀白醋的成分為水、酒精、糯米；工研白醋為水、米、食用酒精、果糖，酸度 4.5% 以上；十全米醋以糯米釀造，酸度也標示 4.5% 以上。十全的米醋指南建議成分越簡短越好，並確認酸度標示。各品牌配方不同，請核對實際包裝。
preparation: 本篇來源沒有另外說明處理方式。工研白醋註明放久會有蛋白質沉澱，與品質無關；十全也說明沉澱是釀造物的自然現象。用量請依菜譜。
storage: 開封後要不要冷藏，各產品標示不一。萬家香珍釀白醋標示開封後冷藏；十全米醋產品頁寫放在陰涼乾燥處常溫保存，但十全的米醋指南寫開封後冷藏；工研白醋產品頁沒有寫。香港消委會說明醋的酸性能抑制微生物，濃度高的醋放陰涼處不易變壞。請依手上產品的包裝標示保存。
uses: 十全列出米醋可用於涼拌、醃漬小黃瓜等糖醋漬物、熱炒或燉肉提味，以及調製火鍋或水餃沾醬。本站的酸辣湯、涼拌小黃瓜和糖醋茄子都用到白醋。
notices:
  alcohol: 萬家香珍釀白醋的原料表列有酒精，工研白醋列有食用酒精；請以實際瓶身標示確認。
