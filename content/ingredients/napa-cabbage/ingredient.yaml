title: 大白菜
summary: 大白菜即結球白菜，臺灣常見俗稱包白的漳浦白菜，以及體型較大的山東白菜，兩者盛產期不同。這篇整理挑選、處理、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: true
selection: 挑葉面完整、葉緣翠綠沒有枯萎，結球緊密不鬆散、外表乾淨的大白菜；聞起來沒有腐臭味，拿起來有份量，越沉越好。
preparation: 切法依用途而定，細絲稍微洗過或用鹽水泡一下再擠乾，可直接做沙拉；粗絲適合炒；醃泡菜時切片，讓外葉和內葉大小相近；煮湯或火鍋則切成大片。
storage: 整顆剝掉外側老葉、用紙巾擦乾，以保鮮膜包好或裝進塑膠袋冷藏，最長可放 1 個月；冬天天氣冷涼時，直立放在陰涼通風處，可常溫放約 1 週。剖半的大白菜用保鮮膜包好冷藏，約可放 1 週。葉片剝下汆燙、冰鎮後瀝乾裝盒，可冷藏約 5 天。貯藏不當時葉柄容易出現小黑點，這是十字花科葉菜常見的生理障礙，不影響食用安全。
uses: 大白菜可以和蝦米、香菇一起燜煮成開陽白菜，也能與豬五花肉片層層相疊煮成千層白菜鍋；切絲可做沙拉或炒，切片可醃泡菜。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 臺灣；漳浦白菜（包白）
      months: 4 月至 11 月盛產
    - area: 臺灣；山東白菜
      months: 11 月至翌年 3 月盛產
  scope: 以上是農業部食農教育平臺記載的兩種結球白菜盛產期，兩者輪替，全年都吃得到。依民國 110 至 112 年農業統計，主要產地依序是雲林縣（收穫量占全臺 4 成以上）、彰化縣、宜蘭縣；平臺沒有分品種列出產地。實際產期會隨產地與年度變動。
