title: 絲瓜
summary: 臺灣以圓筒絲瓜為主，5 月至 9 月是盛產期；臺南以北的產期集中在晚春及夏季，高屏地區則多種在秋冬到早春。這篇整理挑選、處理、保存與常見用途；實際下廚的份量和步驟請看相關菜譜。
category: vegetable
draft: true
selection: 挑選可記「綠、直、粗、重」四個字。顏色翠綠、摸起來緊實有彈性的是新鮮嫩果；外形完整勻稱、呈直筒狀，沒有黑色斑點；蒂頭較粗，或外皮粗糙顆粒完整明顯，沒有傷口和裂口；拿起來有沉重感，表示水分飽滿。
preparation: 絲瓜可先削去外皮再料理，可切塊，也可以取綠色瓜肉刨絲，或把中間的白色瓜囊切丁使用。
storage: 未切開的絲瓜用保鮮膜或白報紙包好冷藏，約可保鮮 3 至 5 天。要冷凍時，先去頭去尾、削皮切塊，裝進保鮮袋密封，放在冷凍庫約可保鮮 8 週。
uses: 刨絲的絲瓜可以和絞肉、九層塔一起拌入麵糊煎成煎餅，瓜囊可以和海鮮煮成濃湯，也可以和蛤蜊同煮。各種做法的份量與步驟請參考菜譜。
season:
  production:
    - area: 臺灣
      months: 5 月至 9 月盛產
  scope: 以上是農業部食農教育平臺產季圖卡標示的盛產期。各地產期受氣候影響差異大，臺南以北冬季溫度過低，產期較集中在晚春及夏季；高屏地區氣候溫暖、全年可種，但夏季高溫多雨又有颱風，農友多把栽培期移到秋冬與早春，讓全年都有絲瓜供應，農業知識入口網〈絲瓜主題館〉的說法相同。食農平臺依民國 106 至 110 年統計，收穫量前五名為臺南市、南投縣、屏東縣、高雄市、嘉義縣；主題館列的主要產地則是屏東縣、南投縣、高雄市、臺南市、雲林縣，兩者統計口徑不同，本篇採食農平臺的排名。
