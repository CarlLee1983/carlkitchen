title: 秋葵
summary: 秋葵在臺灣以夏季盛產，嘉義縣是主要產地。這篇整理挑選、處理與保存方式；目前尚無相應的已發布菜譜。
category: vegetable
draft: true
selection: 常見綠色秋葵可挑選長約 5 至 10 公分、表面有細毛且飽滿的果莢；萼片仍在者通常較鮮嫩。不同品種的顏色與外形可能不同。
preparation: 清洗秋葵後，可用少量鹽輕輕搓去表面絨毛，再切除蒂頭；可整支汆燙，也可切片後料理。
storage: 秋葵容易因擦傷或擠壓變黑，宜平放、避免擠壓並冷藏，留意果莢狀態、儘快食用。若要冷凍，先洗淨擦乾再處理；保存時間會因包裝及溫度而異。
uses: 秋葵可汆燙後涼拌，也可切片快炒；目前不提供尚未發布的菜譜連結。
season:
  production:
    - area: 臺灣；嘉義縣為主要產地
      months: 6 月至 8 月盛產
  scope: 農業部食農教育平臺產地頁記載 6 月至 8 月為盛產期，另一篇農業部挑選文章寫 5 月至 8 月，兩頁口徑不同；本篇產期欄採產地頁的 6 月至 8 月。盛產期不等於全部栽培或市場供應期間，實際月份會隨地區與年度變動。
