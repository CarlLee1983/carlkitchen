title: 蛋花湯
summary: 水滾後淋入蛋液，輕推成蛋花，鹽調味，幾分鐘就能上桌的清爽湯品。
servings: 2
category: 湯
draft: false
mealCandidate: true
tags: [快手]
aliases: [蛋花清湯]
timeMinutes: 10
ingredients:
  - { name: 雞蛋, amount: { value: 2, unit: 顆 } }
  - { name: 青蔥, amount: { value: 1, unit: 支 } }
  - { name: 水, amount: { value: 500, unit: ml } }
  - { name: 鹽, group: 調味 }
steps:
  - text: 水煮滾，加鹽調味；雞蛋打散，青蔥切成蔥花。
    image:
      src: ./step-1.webp
      alt: 砧板上切好的蔥花，旁邊是一碗打散的蛋液
  - text: 湯保持小滾，把蛋液沿鍋邊畫圈淋入，蛋花浮起後關火，撒上蔥花。
hero:
  src: ./hero.webp
  alt: 白瓷碗中盛著蛋花湯，旁邊放著一支湯匙
ingredientsPhoto:
  src: ./ingredients.webp
  alt: 兩顆雞蛋、一支青蔥、一碗水與一小碟鹽
