<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarlKitchen 活潑首頁方向原型</title>
  <!-- Throwaway visual exploration. D and E share the same search-first and recipe-only content contract. -->
  <style>
    :root { font-family:"PingFang TC","Noto Sans TC",ui-sans-serif,sans-serif; color:#171813; background:#fcfcf8; }
    * { box-sizing:border-box; }
    body { margin:0; padding-bottom:82px; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    img { display:block; width:100%; object-fit:cover; }
    .prototype-note { padding:8px 20px; background:#171813; color:white; font-size:12px; text-align:center; }
    .topline { max-width:1280px; margin:auto; padding:18px 26px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { font-size:21px; font-weight:900; letter-spacing:-.06em; }
    .topline nav { display:flex; align-items:center; gap:24px; font-size:14px; font-weight:750; }
    .topline nav a:last-child { border-bottom:2px solid currentColor; padding-bottom:3px; }
    .variant { display:none; }
    .variant.active { display:block; }
    .search { display:flex; gap:8px; width:100%; max-width:620px; background:white; border:2px solid #171813; padding:7px; box-shadow:7px 7px 0 #171813; }
    .search input { width:100%; min-width:0; border:0; background:transparent; outline:0; padding:11px 13px; font-size:16px; color:#171813; }
    .search input::placeholder { color:#54564d; opacity:1; }
    .search input:focus-visible { outline:2px solid #171813; outline-offset:-2px; }
    .search button { border:0; background:#171813; color:white; padding:11px 20px; font-weight:850; white-space:nowrap; }
    .search button:active, .recipe-link:active, .planner-link:active { transform:translateY(1px); }
    .photo-note { display:block; font-size:12px; font-weight:750; letter-spacing:.02em; margin-top:9px; }
    .recipe-link:focus-visible, .planner-link:focus-visible, .topline a:focus-visible { outline:3px solid currentColor; outline-offset:4px; }
    .prototype-switcher { position:fixed; z-index:20; left:50%; bottom:15px; transform:translateX(-50%); background:#171813; color:white; display:flex; align-items:center; gap:9px; padding:7px; border-radius:100px; box-shadow:0 10px 30px #0004; white-space:nowrap; }
    .prototype-switcher button { border:0; border-radius:100px; background:#ffffff26; color:white; min-height:36px; min-width:36px; font-size:16px; }
    .prototype-switcher button:hover,.prototype-switcher button:focus-visible { background:#ffffff48; }
    .prototype-switcher strong { font-size:13px; min-width:147px; text-align:center; }
    .prototype-switcher .shuffle { font-size:12px; font-weight:750; padding:0 12px; }
    .demo-message { display:none; position:fixed; z-index:21; left:50%; bottom:75px; transform:translateX(-50%); max-width:90vw; background:#171813; color:white; border-radius:10px; padding:11px 15px; font-size:13px; text-align:center; }

    /* D: energetic recipe scrapbook, with an off-centre photo and uneven page rhythm. */
    .d { background:#fcfcf8; }
    .d-hero { background:#f26848; min-height:555px; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:35px; padding:48px max(28px,calc((100vw - 1228px)/2)); overflow:hidden; }
    .d-hero-copy { align-self:center; padding:12px 0 28px; }
    .d-hero h1 { font-size:clamp(58px,7vw,112px); line-height:.98; letter-spacing:-.085em; margin:0 0 24px; font-weight:950; }
    .d-hero p { font-size:18px; line-height:1.5; margin:0 0 26px; max-width:22em; font-weight:600; }
    .d-hero figure { margin:0; align-self:center; transform:rotate(3deg); background:white; padding:12px 12px 16px; box-shadow:15px 15px 0 #171813; }
    .d-hero figure img { aspect-ratio:1.14; }
    .d-hero figure figcaption { display:flex; justify-content:space-between; gap:12px; padding:13px 3px 0; font-size:16px; font-weight:900; }
    .d-hero figure .photo-note { margin:0; align-self:center; }
    .d-content { max-width:1228px; margin:auto; padding:70px 26px 110px; }
    .d-section-title { display:flex; align-items:end; gap:25px; margin-bottom:30px; }
    .d-section-title h2 { font-size:clamp(34px,4.4vw,66px); letter-spacing:-.07em; line-height:1; margin:0; }
    .d-section-title p { max-width:220px; line-height:1.5; margin:0 0 5px; font-size:14px; }
    .d-recipes { display:grid; grid-template-columns:1.18fr .82fr; gap:8%; align-items:start; }
    .d-recipe:nth-child(2) { margin-top:80px; }
    .d-recipe figure { margin:0; }
    .d-recipe img { aspect-ratio:1.45; }
    .d-recipe:nth-child(2) img { aspect-ratio:1; }
    .d-recipe h3 { font-size:clamp(25px,3vw,42px); letter-spacing:-.06em; margin:10px 0 5px; }
    .d-recipe p { font-size:14px; line-height:1.5; margin:0; color:#53564c; }
    .d-recipe .kind { font-size:12px; font-weight:800; margin-top:17px; display:block; }
    .d-planner { margin-top:90px; border-top:3px solid #171813; border-bottom:3px solid #171813; padding:25px 0; display:flex; gap:22px; align-items:center; justify-content:space-between; }
    .d-planner h2 { font-size:clamp(26px,3vw,40px); margin:0; letter-spacing:-.06em; }
    .d-planner p { margin:6px 0 0; font-size:14px; }
    .d-planner a { font-weight:850; border-bottom:2px solid; white-space:nowrap; }

    /* E: graphic recipe index, using strong type and horizontal food rows. */
    .e { background:#f7f9ff; min-height:100vh; }
    .e-hero { max-width:1228px; margin:auto; padding:35px 26px 32px; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:40px; align-items:center; }
    .e-hero-copy { padding:18px 0 30px; }
    .e-kicker { font-size:13px; font-weight:900; color:#173dbb; margin:0 0 15px; }
    .e-hero h1 { font-size:clamp(53px,6.4vw,94px); letter-spacing:-.085em; line-height:1.03; margin:0 0 18px; font-weight:950; }
    .e-hero h1 span { color:#173dbb; }
    .e-hero p { font-size:17px; line-height:1.5; margin:0 0 25px; max-width:25em; }
    .e-hero figure { margin:0; padding:15px; background:#173dbb; transform:translateY(10px); }
    .e-hero figure img { aspect-ratio:1.25; }
    .e-hero figcaption { display:flex; align-items:center; justify-content:space-between; color:white; font-size:15px; font-weight:850; gap:10px; padding:13px 2px 0; }
    .e-hero .photo-note { margin:0; color:white; }
    .e-content { max-width:1228px; margin:auto; padding:48px 26px 100px; }
    .e-content h2 { font-size:clamp(35px,4.4vw,62px); line-height:1; letter-spacing:-.075em; margin:0 0 25px; }
    .e-recipe { display:grid; grid-template-columns:210px minmax(0,1fr) auto; gap:28px; align-items:center; padding:20px 0; border-top:2px solid #171813; }
    .e-recipe:last-child { border-bottom:2px solid #171813; }
    .e-recipe figure { margin:0; }
    .e-recipe img { aspect-ratio:1.45; }
    .e-recipe .kind { font-size:12px; font-weight:850; color:#173dbb; }
    .e-recipe h3 { font-size:clamp(25px,3vw,40px); letter-spacing:-.06em; margin:5px 0 6px; }
    .e-recipe p { font-size:14px; margin:0; color:#535869; }
    .e-recipe .arrow { color:#173dbb; font-size:38px; font-weight:700; }
    .e-planner { margin-top:58px; background:#173dbb; color:white; padding:30px 38px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .e-planner h2 { margin:0; font-size:clamp(26px,3vw,40px); letter-spacing:-.06em; }
    .e-planner p { margin:5px 0 0; font-size:14px; }
    .e-planner a { background:white; color:#173dbb; padding:13px 17px; font-weight:850; white-space:nowrap; }

    @media (max-width:900px) {
      .d-hero,.e-hero { grid-template-columns:1fr 1fr; gap:24px; }
      .d-hero h1,.e-hero h1 { font-size:clamp(48px,7vw,70px); }
    }
    @media (max-width:650px) {
      .prototype-note { text-align:left; padding:8px 15px; line-height:1.4; }
      .topline { padding:16px; }
      .brand { font-size:19px; }
      .topline nav { gap:12px; font-size:12px; }
      .topline nav a:first-child { display:none; }
      .search { box-shadow:5px 5px 0 #171813; }
      .search button { padding:11px 13px; }
      .d-hero { display:block; min-height:0; padding:25px 16px 35px; }
      .d-hero-copy { padding:0; }
      .d-hero h1 { font-size:clamp(49px,13vw,72px); margin-bottom:17px; }
      .d-hero p { font-size:15px; margin-bottom:22px; }
      .d-hero figure { display:none; }
      .d-content { padding:33px 16px 75px; }
      .d-section-title { display:block; margin-bottom:20px; }
      .d-section-title h2 { font-size:39px; }
      .d-section-title p { display:none; }
      .d-recipes { grid-template-columns:1fr; gap:32px; }
      .d-recipe:nth-child(2) { margin-top:0; }
      .d-recipe img,.d-recipe:nth-child(2) img { aspect-ratio:1.55; }
      .d-recipe h3 { font-size:29px; }
      .d-planner { display:block; margin-top:45px; }
      .d-planner a { display:inline-block; margin-top:19px; }
      .e-hero { display:block; padding:23px 16px 15px; }
      .e-hero-copy { padding:0; }
      .e-hero h1 { font-size:clamp(47px,12vw,66px); }
      .e-hero p { font-size:15px; }
      .e-hero figure { display:none; }
      .e-content { padding:22px 16px 70px; }
      .e-content h2 { font-size:39px; margin-bottom:16px; }
      .e-recipe { grid-template-columns:116px minmax(0,1fr); gap:12px; padding:15px 0; }
      .e-recipe h3 { font-size:22px; }
      .e-recipe p,.e-recipe .arrow { display:none; }
      .e-recipe img { aspect-ratio:1; }
      .e-planner { display:block; margin-top:38px; padding:24px; }
      .e-planner a { display:inline-block; margin-top:18px; }
      .prototype-switcher strong { min-width:95px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; animation:none !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <div class="prototype-note">活潑首頁方向原型 · 菜譜與圖片是示意資料，正式首頁只從已發布內容隨機挑選</div>
  <header class="topline"><div class="brand">CarlKitchen<span aria-hidden="true">.</span></div><nav aria-label="示意導覽"><a href="#" data-demo>所有菜譜</a><a href="#" data-demo>找菜譜</a><a href="#" data-demo>四菜一湯</a></nav></header>
  <main>
    <section class="variant d" data-variant="D" aria-label="D 食譜剪貼簿">
      <div class="d-hero"><div class="d-hero-copy"><h1>今天，<br>煮什麼？</h1><p>輸入菜名或材料，或往下翻翻這份料理收藏。</p><form class="search" data-demo-form><input aria-label="搜尋菜譜" placeholder="搜尋菜名、材料"><button type="submit">找菜譜</button></form></div><figure data-slot="hero"><a class="recipe-link" href="#" data-link data-demo><img data-image alt=""></a><figcaption><span data-title></span><span class="photo-note">AI 示意圖</span></figcaption></figure></div>
      <div class="d-content"><div class="d-section-title"><h2>翻開一頁菜譜</h2><p>這些料理每次打開首頁都會換一組。</p></div><div class="d-recipes">
        <article class="d-recipe" data-slot="card1"><a class="recipe-link" href="#" data-link data-demo><figure><img data-image alt=""><figcaption class="photo-note">AI 示意圖</figcaption></figure><span class="kind" data-kind></span><h3 data-title></h3><p data-summary></p></a></article>
        <article class="d-recipe" data-slot="card2"><a class="recipe-link" href="#" data-link data-demo><figure><img data-image alt=""><figcaption class="photo-note">AI 示意圖</figcaption></figure><span class="kind" data-kind></span><h3 data-title></h3><p data-summary></p></a></article>
      </div><div class="d-planner"><div><h2>想配好一桌？</h2><p>四菜一湯、五菜一湯，鎖住喜歡的菜再換其他道。</p></div><a class="planner-link" href="#" data-demo>試試配菜工具 ↗</a></div></div>
    </section>
    <section class="variant e" data-variant="E" aria-label="E 鮮明料理索引">
      <div class="e-hero"><div class="e-hero-copy"><p class="e-kicker">把喜歡的做法收在一起</p><h1>找一道菜，<br><span>今晚開煮。</span></h1><p>搜尋菜名與材料，接著打開完整材料和步驟。</p><form class="search" data-demo-form><input aria-label="搜尋菜譜" placeholder="想找哪道菜？"><button type="submit">搜尋</button></form></div><figure data-slot="hero"><a class="recipe-link" href="#" data-link data-demo><img data-image alt=""></a><figcaption><span data-title></span><span class="photo-note">AI 示意圖</span></figcaption></figure></div>
      <div class="e-content"><h2>從這裡挑一道</h2><div class="e-recipes">
        <article class="e-recipe" data-slot="card1"><a class="recipe-link" href="#" data-link data-demo><figure><img data-image alt=""><figcaption class="photo-note">AI 示意圖</figcaption></figure></a><a class="recipe-link" href="#" data-link data-demo><span class="kind" data-kind></span><h3 data-title></h3><p data-summary></p></a><a class="recipe-link arrow" href="#" data-link data-demo aria-hidden="true" tabindex="-1">↗</a></article>
        <article class="e-recipe" data-slot="card2"><a class="recipe-link" href="#" data-link data-demo><figure><img data-image alt=""><figcaption class="photo-note">AI 示意圖</figcaption></figure></a><a class="recipe-link" href="#" data-link data-demo><span class="kind" data-kind></span><h3 data-title></h3><p data-summary></p></a><a class="recipe-link arrow" href="#" data-link data-demo aria-hidden="true" tabindex="-1">↗</a></article>
      </div><div class="e-planner"><div><h2>讓菜色自己湊一桌</h2><p>抽一組，保留喜歡的，再換掉其他道。</p></div><a class="planner-link" href="#" data-demo>開始配菜 ↗</a></div></div>
    </section>
  </main>
  <div class="demo-message" role="status" aria-live="polite"></div>
  <div class="prototype-switcher" aria-label="原型版型切換"><button id="prev" type="button" aria-label="上一版">←</button><strong id="variant-label"></strong><button id="next" type="button" aria-label="下一版">→</button><button id="shuffle" class="shuffle" type="button">換一組菜</button></div>
  <script>
    const recipes = [
      { title:"番茄炒蛋", kind:"非湯料理", summary:"柔軟炒蛋和帶汁番茄，簡單上桌。", image:"homepage-assets/tomato-egg-prototype.jpg", alt:"盤中有番茄塊與炒蛋的料理示意照片" },
      { title:"番茄肉醬義大利麵", kind:"非湯料理", summary:"熟悉的番茄肉醬，適合平日。", image:"homepage-assets/pasta-prototype.jpg", alt:"白盤中的番茄肉醬義大利麵示意照片" },
      { title:"香菇雞湯", kind:"湯", summary:"有菇香與雞肉的清爽熱湯。", image:"homepage-assets/soup-prototype.jpg", alt:"陶碗中的香菇雞湯示意照片" }
    ];
    const variants=["D","E"], names={D:"D · 食譜剪貼簿",E:"E · 鮮明料理索引"};
    const params=new URLSearchParams(location.search);
    let current=variants.includes(params.get("variant")) ? params.get("variant") : "D";
    function show(key) {
      current=key;
      document.querySelectorAll(".variant").forEach(el=>{ el.classList.toggle("active",el.dataset.variant===key); el.hidden=el.dataset.variant!==key; });
      document.getElementById("variant-label").textContent=names[key];
      const url=new URL(location.href); url.searchParams.set("variant",key); history.replaceState(null,"",url);
      window.scrollTo(0,0);
    }
    function cycle(step) { show(variants[(variants.indexOf(current)+step+variants.length)%variants.length]); }
    let lastHero="";
    function shuffle() {
      const order=[...recipes];
      for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
      if(order[0].title===lastHero) [order[0],order[1]]=[order[1],order[0]];
      lastHero=order[0].title;
      document.querySelectorAll("[data-slot]").forEach(slot=>{
        const recipe=order[{hero:0,card1:1,card2:2}[slot.dataset.slot]];
        slot.querySelectorAll("[data-image]").forEach(el=>{ el.src=recipe.image; el.alt=recipe.alt; });
        slot.querySelectorAll("[data-title]").forEach(el=>el.textContent=recipe.title);
        slot.querySelectorAll("[data-kind]").forEach(el=>el.textContent=recipe.kind);
        slot.querySelectorAll("[data-summary]").forEach(el=>el.textContent=recipe.summary);
        slot.querySelectorAll("[data-link]").forEach(el=>el.setAttribute("aria-label",`查看${recipe.title}菜譜（原型示意）`));
      });
    }
    let toastTimer;
    function demo(event){ event.preventDefault(); const el=document.querySelector(".demo-message"); el.textContent="這是版型原型；搜尋和連結尚未接上正式網站。"; el.style.display="block"; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.display="none",3000); }
    document.querySelectorAll("[data-demo]").forEach(el=>el.addEventListener("click",demo));
    document.querySelectorAll("[data-demo-form]").forEach(el=>el.addEventListener("submit",demo));
    document.getElementById("prev").addEventListener("click",()=>cycle(-1));
    document.getElementById("next").addEventListener("click",()=>cycle(1));
    document.getElementById("shuffle").addEventListener("click",shuffle);
    document.addEventListener("keydown",event=>{ if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return; if(event.key==="ArrowLeft")cycle(-1); if(event.key==="ArrowRight")cycle(1); });
    shuffle(); show(current);
  </script>
</body>
</html>
