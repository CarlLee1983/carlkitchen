name: Verify
description: CI 與部署共用的必要檢查（需先 checkout）。順序固定，任一步驟失敗即停止。

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 (Node.js 24)
      with:
        version: 12.1.0
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 24.21.0
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Identify image cache toolchain
      id: image-cache-toolchain
      shell: bash
      run: echo "versions=node-$(node --version)-pnpm-$(pnpm --version)" >> "$GITHUB_OUTPUT"

    # 只保存圖片，不保存會受 RECIPES_DIR 影響的內容層快取；build --force 照常執行。
    # Astro 的圖片檔名包含來源內容與轉換參數，但不包含 sharp 編碼設定，故另以設定與依賴隔離。
    # 每個 commit 可保存新增圖片；還原前綴不可放寬工具鏈／設定邊界。
    - name: Restore and save Astro image cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0 (Node.js 24)
      with:
        path: node_modules/.astro/assets
        key: astro-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image-cache-toolchain.outputs.versions }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'astro.config.mjs') }}-${{ github.sha }}
        restore-keys: |
          astro-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image-cache-toolchain.outputs.versions }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'astro.config.mjs') }}-

    - name: Install Playwright Chromium
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    # Playwright 只附 WenQuanYi 與 IPA 字型，Chromium 用它們排直排時字高為 0，首頁直排標題會疊字。
    # 裝 Noto CJK，讓瀏覽器測試量到的版面與一般讀者裝置一致。
    - name: Install CJK fonts and WebP tools
      shell: bash
      run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk webp

    - name: Check formatting, types, and production build
      shell: bash
      run: pnpm check

    # 檢查 pnpm check 建出的真實內容；e2e 另外輸出到 dist-e2e／dist-meal／dist-show-more。
    # 候選池門檻（--launch）只在部署工作流程開啟。
    - name: Check content and build output
      shell: bash
      run: pnpm check:content

    - name: Run unit tests
      shell: bash
      run: pnpm test

    - name: Run browser tests
      shell: bash
      run: pnpm test:e2e

    # 只驗證設定與保留的正式 dist，不執行真實部署。
    - name: Validate Cloudflare deployment
      shell: bash
      run: pnpm exec wrangler deploy --dry-run
